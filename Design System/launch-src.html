<meta charset="utf-8">
<title>Horizons Launch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;600&display=swap">
<style>
{{FONT}}
/* Layout: full-screen 3D launch (three.js, perspective). Day sky melts into the painted night as the rocket climbs.
   Top: back, phase ribbon + caption, clock. Bottom left: altitude and speed. Bottom centre: the one action button.
   Optional telemetry window (T) on the right. The hangar cinematic and the transfer view reuse the same frame. */
:root{color-scheme:light;--cream:#FBFAF4;--ink:#1A1206;--muted:#6E6457;--amber:#F2A541;--amber-d:#C27F22;--ember:#C2643A;--ember-d:#8E4322;--teal:#2C5B65;
  --ok:#4CC38A;--warn:#F2B33D;--bad:#E5484D;--bad-d:#A3262A;--lip:#E4DED2;--win:#FFFDF8;--tile:#F6F1E6;
  --f-display:'Game Paused','Silkscreen',monospace;--f-num:'Silkscreen',monospace;--f-ui:'Geist',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--cream);color:var(--ink);font-family:var(--f-ui);overflow:hidden}
#app{position:fixed;inset:0;background:var(--cream);overflow:hidden}
.sky{position:absolute;inset:0;pointer-events:none}
#day{background:
  radial-gradient(7% 10% at 84% 14%, #FFFBEA 0%, rgba(255,240,200,.85) 40%, rgba(255,226,170,0) 100%),
  linear-gradient(180deg,#78B3DF 0%,#A6CFEA 34%,#D9E9EE 58%,#F6EBD6 78%,#FBFAF4 100%)}
#night{opacity:0;background:#0B1230 url({{SKY}}) center top/cover no-repeat}
#dusk{opacity:0;background:linear-gradient(180deg,rgba(11,18,48,0) 30%,rgba(214,122,170,.35) 62%,rgba(242,165,65,.4) 80%,rgba(251,250,244,.9) 100%)}
canvas#fx,canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas#fx{pointer-events:none}
.ui{position:absolute;z-index:3}
.t-btn{position:relative;border:3px solid var(--ink);border-radius:16px;padding:11px 22px 13px;font:400 19px var(--f-display);letter-spacing:.03em;cursor:pointer;color:var(--ink);
  background:var(--c,var(--win));box-shadow:inset 0 -5px 0 var(--cd,var(--lip)),inset 0 3px 0 rgba(255,255,255,.4),0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.t-btn:active,.t-btn.down{transform:translateY(4px);box-shadow:inset 0 -2px 0 var(--cd,var(--lip)),0 1px 0 var(--ink)}
.t-btn.primary{--c:var(--amber);--cd:var(--amber-d);text-shadow:0 2px 0 rgba(255,255,255,.4)}
.t-btn:disabled{opacity:.45;cursor:default}
.t-btn kbd{font:400 11px var(--f-num);border:2px solid var(--ink);border-radius:6px;padding:1px 6px;background:#fff;margin-left:10px;box-shadow:0 2px 0 var(--ink);vertical-align:2px}
.t-round{width:46px;height:46px;flex:none;border-radius:50%;border:3px solid var(--ink);background:var(--win);color:var(--ink);box-shadow:inset 0 -4px 0 var(--lip),0 4px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .08s,box-shadow .08s;font:400 13px var(--f-num)}
.t-round:active{transform:translateY(3px);box-shadow:inset 0 -2px 0 var(--lip),0 1px 0 var(--ink)}
.t-round.on{background:var(--amber);box-shadow:inset 0 -4px 0 var(--amber-d),0 4px 0 var(--ink)}
.t-round svg{width:20px;height:20px}
.t-ribbon{display:inline-block;background:var(--ember);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px 18px 8px;font:400 17px var(--f-display);white-space:nowrap;box-shadow:inset 0 -4px 0 var(--ember-d),0 4px 0 var(--ink);text-shadow:0 2px 0 rgba(26,18,6,.3)}
.t-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--win);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);font:400 12px var(--f-num);letter-spacing:.04em}
.t-win{background:var(--win);border:3px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink)}
.t-btn:focus-visible,.t-round:focus-visible{outline:3px solid var(--ember);outline-offset:3px}

.top{top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:flex-start;gap:10px;pointer-events:none}
.top>*{pointer-events:auto}
.phase{margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;max-width:min(560px,70vw)}
.cap{background:var(--win);border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);padding:7px 14px;font:600 13.5px/1.35 var(--f-ui);display:none}
.cap.s{display:block;animation:tpop .35s cubic-bezier(.34,1.56,.64,1) both}
@keyframes tpop{0%{transform:scale(.85) translateY(10px);opacity:0}}
.read{left:max(12px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.tile{min-width:118px;padding:8px 12px 9px;border:3px solid var(--ink);border-radius:15px;background:var(--win);box-shadow:inset 0 -4px 0 var(--lip),0 4px 0 var(--ink)}
.tile span{display:block;font:400 10px var(--f-num);color:var(--muted);letter-spacing:.06em}
.tile b{font:400 20px var(--f-display);letter-spacing:.02em}
.actbar{left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center}
#act{font-size:24px;padding:14px 30px 16px;min-width:230px}
#act.cue{animation:cue .5s ease-in-out infinite alternate}
@keyframes cue{to{transform:translateY(-4px) scale(1.04)}}
#thr{display:none}
.side{right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.toast{left:50%;top:34%;transform:translate(-50%,-50%);font:400 clamp(38px,7.5vw,82px) var(--f-display);color:var(--amber);-webkit-text-stroke:3px var(--ink);paint-order:stroke;text-shadow:0 6px 0 var(--ink);display:none;pointer-events:none;white-space:nowrap;text-align:center}
.toast.s{display:block;animation:toast 1.5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes toast{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}18%{transform:translate(-50%,-50%) scale(1);opacity:1}80%{opacity:1}100%{opacity:0}}
.toast small{display:block;font:600 15px var(--f-ui);color:var(--ink);-webkit-text-stroke:0;text-shadow:none;background:var(--win);border:2.5px solid var(--ink);border-radius:12px;padding:5px 12px;margin:10px auto 0;width:max-content;max-width:86vw;white-space:normal}
#tel{right:max(12px,env(safe-area-inset-right,0px));top:calc(76px + env(safe-area-inset-top,0px));width:250px;padding:26px 14px 12px;display:none}
#tel.s{display:block;animation:tpop .35s cubic-bezier(.34,1.56,.64,1) both}
#tel .t-ribbon{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:14px;padding:4px 14px 6px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:3px 2px;font:400 11px var(--f-num)}
.row span{color:var(--muted)}
.bar{height:9px;border:2px solid var(--ink);border-radius:6px;background:var(--tile);overflow:hidden;margin:1px 0 5px}
.bar i{display:block;height:100%;width:100%;background:var(--ok)}
#card{left:50%;top:50%;transform:translate(-50%,-50%);width:min(430px,calc(100% - 32px));padding:34px 20px 18px;display:none;text-align:center}
#card.s{display:block;animation:tpop .45s cubic-bezier(.34,1.56,.64,1) both}
#card .t-ribbon{position:absolute;top:-22px;left:50%;transform:translateX(-50%)}
#card p{margin:0 0 12px;font-size:14px;line-height:1.45}
#card .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#card .t-btn{font-size:16px;padding:9px 16px 11px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
.stats div{background:var(--tile);border:2.5px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:7px 8px;font:400 11px var(--f-num)}
.stats b{display:block;font:400 17px var(--f-display)}
#skip{display:none}
#load{left:50%;top:50%;transform:translate(-50%,-50%)}
.credit{left:max(12px,env(safe-area-inset-left,0px));top:calc(70px + env(safe-area-inset-top,0px));font:400 10px var(--f-num);color:var(--muted);max-width:240px;display:none}
@media (max-width:760px){.tile{min-width:92px}.tile b{font-size:16px}#act{min-width:170px;font-size:19px;padding:12px 18px 14px}.read{bottom:calc(84px + env(safe-area-inset-bottom,0px))}.side{bottom:calc(84px + env(safe-area-inset-bottom,0px))}#tel{width:210px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-cam" viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M16 11l5-3v9l-5-3z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></symbol>
<symbol id="i-tel" viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M21 19H3" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
</svg>

<div id="app">
  <div class="sky" id="day"></div><div class="sky" id="night"></div><div class="sky" id="dusk"></div>
  <canvas id="fx" aria-hidden="true"></canvas><canvas id="gl"></canvas>
  <div class="ui top">
    <button class="t-round" type="button" id="back" aria-label="Back to base"><svg><use href="#i-back"/></svg></button>
    <div class="phase"><span class="t-ribbon" id="phase">Launch pad</span><div class="cap" id="cap"></div></div>
    <span class="t-pill" id="clock">T-00:05</span>
  </div>
  <div class="ui read" id="read" style="display:none"><div class="tile"><span>ALTITUDE</span><b id="alt">0 km</b></div><div class="tile"><span>SPEED</span><b id="vel">0 m/s</b></div></div>
  <div class="ui actbar"><button class="t-btn" type="button" id="thr">Hold: throttle down<kbd>S</kbd></button><button class="t-btn primary" type="button" id="act" disabled>Stand by</button><button class="t-btn" type="button" id="skip">Skip<kbd>Esc</kbd></button></div>
  <div class="ui side"><button class="t-round" type="button" id="bcam" aria-label="Change camera (C)"><svg><use href="#i-cam"/></svg></button><button class="t-round" type="button" id="btel" aria-label="Telemetry (T)" aria-pressed="false"><svg><use href="#i-tel"/></svg></button></div>
  <div class="ui t-win" id="tel"><span class="t-ribbon">Telemetry</span>
    <div class="row"><span>ACCEL</span><b id="t-acc">0.0 g</b></div><div class="row"><span>DYN PRESSURE</span><b id="t-q">0 kPa</b></div>
    <div class="row"><span>PITCH / AOA</span><b id="t-pit">0 / 0</b></div><div class="row"><span>PERIGEE</span><b id="t-pe">-</b></div><div class="row"><span>APOGEE</span><b id="t-ap">-</b></div>
    <div class="row"><span>THROTTLE</span><b id="t-thr">100%</b></div><div class="bar"><i id="b-thr"></i></div>
    <div class="row"><span>STAGE 1 FUEL</span><b id="t-f1">100%</b></div><div class="bar"><i id="b-f1"></i></div>
    <div class="row"><span>STAGE 2 FUEL</span><b id="t-f2">100%</b></div><div class="bar"><i id="b-f2"></i></div>
    <div class="row"><span>STRUCT LOAD</span><b id="t-st">0%</b></div><div class="bar"><i id="b-st" style="background:var(--warn);width:0"></i></div>
    <div class="row"><span>AUTOPILOT</span><b id="t-ap2">ON</b></div>
    <div class="row" style="color:var(--muted)"><span>Arrows fly by hand. G autopilot.</span></div>
  </div>
  <div class="ui toast" id="toast"></div>
  <div class="ui t-win" id="card"><span class="t-ribbon" id="card-t">Orbit</span><div id="card-b"></div></div>
  <span class="ui t-pill" id="load"><i></i>Loading rocket…</span>
  <div class="ui credit">3D models courtesy of NASA.</div>
</div>
