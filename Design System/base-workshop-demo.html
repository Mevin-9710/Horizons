/* Layout: full-screen isometric base (three.js, orthographic) on the cream page with the starry corner.
   HUD resource bar on top, dock at the bottom, tutorial callout under the HUD, workshop windows dock right (bottom sheet on phones). Tactile + glass. */
:root{
  color-scheme: light;
  --cream:#FBFAF4; --ink:#1A1206; --muted:#6E6457; --line:rgba(26,18,6,.10);
  --amber:#F2A541; --amber-d:#C27F22; --ember:#C2643A; --ember-d:#8E4322; --teal:#2C5B65; --crimson:#A73B42;
  --ok:#4CC38A; --warn:#F2B33D; --bad:#E5484D; --bad-d:#A3262A; --lip:#E4DED2;
  --glass:rgba(255,255,255,.42);
  --f-display:'Game Paused','Silkscreen',monospace; --f-num:'Silkscreen',monospace; --f-ui:'Geist',system-ui,sans-serif; --f-mono:'Geist Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--cream);color:var(--ink);font-family:var(--f-ui);overflow:hidden}
#app{position:fixed;inset:0;background:var(--cream)}
.night{position:absolute;inset:0;pointer-events:none;background:radial-gradient(55% 70% at 100% 0%, #08070F 0%, #120C1E 26%, #2A1E3A 42%, rgba(194,100,58,.26) 56%, rgba(242,165,65,.09) 64%, rgba(251,250,244,0) 74%)}
canvas#sky,canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas#sky{pointer-events:none}
canvas#gl{touch-action:none}
.ui{position:absolute;z-index:2}

/* tactile kit */
.t-btn{position:relative;border:3px solid var(--ink);border-radius:16px;padding:11px 22px 13px;font:400 19px var(--f-display);letter-spacing:.03em;cursor:pointer;color:var(--ink);
  background:var(--c,var(--glass));backdrop-filter:blur(18px) saturate(1.4);box-shadow:inset 0 -5px 0 var(--cd,rgba(26,18,6,.08)),inset 0 3px 0 rgba(255,255,255,.4),0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.t-btn:active{transform:translateY(4px);box-shadow:inset 0 -2px 0 var(--cd,rgba(26,18,6,.08)),0 1px 0 var(--ink)}
.t-btn.primary{--c:var(--amber);--cd:var(--amber-d)}
.t-btn.ghost{font:700 14px var(--f-ui)}
.t-btn[disabled]{--c:#D9D3C7;--cd:#BDB5A6;color:#8A8174;cursor:not-allowed;transform:none}
.t-round{position:relative;width:44px;height:44px;flex:none;border-radius:50%;border:3px solid var(--ink);background:var(--c,var(--glass));backdrop-filter:blur(18px);color:var(--cc,var(--ink));box-shadow:inset 0 -4px 0 var(--cd,rgba(26,18,6,.08)),0 4px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.t-round:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.t-round svg{width:20px;height:20px}
.t-round.x{--c:var(--bad);--cd:var(--bad-d);--cc:#fff;width:38px;height:38px}
.t-win{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:3px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink)}
.t-ribbon{display:inline-block;background:var(--ember);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:5px 16px 7px;font:400 16px var(--f-display);white-space:nowrap;box-shadow:inset 0 -4px 0 var(--ember-d),0 4px 0 var(--ink);text-shadow:0 2px 0 rgba(26,18,6,.3)}
.t-btn:focus-visible,.t-round:focus-visible,.opt:focus-visible,.tab:focus-visible,.tile:focus-visible{outline:3px solid var(--ember);outline-offset:3px}
@keyframes tpop{0%{transform:scale(.85) translateY(16px);opacity:0}}
svg.i{width:18px;height:18px;flex:none}

/* HUD */
.hud{top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:flex-start}
.res{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.metric{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;border-radius:999px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);font:400 11.5px var(--f-num);transition:background .3s}
.metric .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ink);color:#fff;background:var(--teal)}
.metric .ic svg{width:14px;height:14px}
.metric .mb{width:46px;height:8px;border-radius:5px;border:2px solid var(--ink);background:rgba(255,255,255,.6);overflow:hidden}
.metric .mb i{display:block;height:100%;background:var(--ok);transition:width .5s cubic-bezier(.34,1.56,.64,1),background .3s}
.metric.warn .mb i{background:var(--warn)}
.metric.bad{background:rgba(229,72,77,.22)}
.metric.bad .mb i{background:var(--bad)}
.metric.bad .ic{background:var(--bad)}
.metric.bump{animation:bump .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{40%{transform:scale(1.12)}}
.mission{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.mission .t-ribbon{font-size:14px}
/* callout */
.callout{top:calc(78px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));max-width:300px;background:var(--ink);color:var(--cream);border-radius:14px;padding:11px 14px;font:600 13.5px var(--f-ui);line-height:1.35;box-shadow:0 4px 0 rgba(26,18,6,.3);animation:tpop .5s cubic-bezier(.34,1.56,.64,1) both;display:flex;gap:10px;align-items:flex-start}
.callout b{color:var(--amber);font:400 11px var(--f-num);white-space:nowrap;margin-top:2px}
.callout .skip{margin-left:auto;background:none;border:0;color:var(--cream);opacity:.6;font:600 11px var(--f-ui);cursor:pointer;padding:0}
/* dock */
.dock{left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:8px;border-radius:22px}
.tile{position:relative;width:70px;height:64px;border-radius:15px;border:3px solid var(--ink);background:var(--c,rgba(255,255,255,.5));box-shadow:inset 0 -4px 0 var(--cd,rgba(26,18,6,.08)),0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 10px var(--f-ui);cursor:pointer;color:var(--ink);padding:0}
.tile svg{width:22px;height:22px}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tile.on{--c:var(--amber);--cd:var(--amber-d)}
.tile.lock{--c:rgba(217,211,199,.7);color:var(--muted);cursor:not-allowed}
.tile .new{position:absolute;top:-10px;right:-8px;background:var(--ok);color:#fff;border:2px solid var(--ink);border-radius:6px;font:400 9px var(--f-num);padding:1px 5px;transform:rotate(8deg)}
/* world prompt */
.enter{z-index:3;transform:translate(-50%,-100%);display:none;animation:tpop .35s cubic-bezier(.34,1.56,.64,1) both;white-space:nowrap}
.enter kbd{font:400 11px var(--f-num);border:2px solid var(--ink);border-radius:6px;padding:1px 6px;margin-left:8px;background:#fff}
/* window */
.win{top:calc(78px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:min(400px,calc(100% - 24px));max-height:calc(100% - 180px);display:none;flex-direction:column;overflow:hidden;animation:tpop .5s cubic-bezier(.34,1.56,.64,1) both}
.win.open{display:flex}
.w-head{padding:16px 16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative}
.w-head h3{margin:0;font:400 26px var(--f-display)}
.w-head p{margin:0;font-size:13px;color:var(--muted)}
.w-head .t-round.x{position:absolute;top:10px;right:10px}
.tabs{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;border:2.5px solid var(--ink);border-radius:12px;padding:6px 11px 8px;font:700 12.5px var(--f-ui);background:rgba(255,255,255,.5);box-shadow:inset 0 -3px 0 rgba(26,18,6,.08),0 3px 0 var(--ink);cursor:pointer;color:var(--ink);position:relative}
.tab.on{background:var(--amber);box-shadow:inset 0 -3px 0 var(--amber-d),0 3px 0 var(--ink)}
.tab .need{position:absolute;top:-7px;right:-6px;width:14px;height:14px;border-radius:50%;background:var(--bad);border:2px solid var(--ink)}
.w-body{padding:4px 14px 14px;overflow:auto;display:flex;flex-direction:column;gap:10px;min-height:0}
.opt{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;text-align:left;width:100%;border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.4);box-shadow:0 4px 0 var(--ink);cursor:pointer;color:var(--ink);font:inherit;transition:transform .12s cubic-bezier(.34,1.56,.64,1)}
.opt:hover{transform:translateY(-2px)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt.on{background:rgba(242,165,65,.55)}
.opt .dot{grid-row:span 2;width:22px;height:22px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center}
.opt.on .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.opt .nm{font:700 14.5px var(--f-ui)}
.opt .fx{display:flex;flex-wrap:wrap;gap:5px}
.opt .fx span{font:400 10px var(--f-num);padding:2px 6px;border-radius:6px;border:1.5px solid var(--ink);background:rgba(255,255,255,.6)}
.opt .fx span.up{background:rgba(229,72,77,.18)}
.opt .fx span.good{background:rgba(76,195,138,.25)}
.w-foot{padding:12px 14px 16px;border-top:3px solid var(--ink);background:rgba(251,247,238,.35);display:flex;gap:10px}
.w-foot .t-btn{flex:1}
.check{display:flex;flex-direction:column;gap:7px;margin:0;padding:0;list-style:none}
.check li{display:flex;gap:10px;align-items:center;font:600 13.5px var(--f-ui);padding:8px 10px;border:2.5px solid var(--ink);border-radius:12px;background:rgba(255,255,255,.4)}
.check li i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:var(--ok);flex:none}
.check li.bad i{background:var(--bad)}
.check li small{margin-left:auto;font:400 10px var(--f-num);color:var(--muted)}
.hint{font:600 13px var(--f-ui);background:rgba(229,72,77,.16);border:2.5px solid var(--ink);border-radius:12px;padding:9px 11px}
/* joystick */
.joy{left:max(18px,env(safe-area-inset-left,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));width:116px;height:116px;border-radius:50%;border:3px solid var(--ink);background:var(--glass);backdrop-filter:blur(14px);box-shadow:0 5px 0 var(--ink);display:none;touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--amber);border:3px solid var(--ink);box-shadow:inset 0 -4px 0 var(--amber-d)}
.keys{right:max(14px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));font:400 10px var(--f-num);color:var(--muted);display:flex;gap:4px;align-items:center}
.keys kbd{border:2px solid var(--ink);border-radius:5px;padding:1px 5px;background:var(--glass);color:var(--ink)}
.toast{left:50%;top:40%;transform:translate(-50%,-50%);font:400 clamp(40px,8vw,84px) var(--f-display);color:var(--ember);-webkit-text-stroke:3px var(--ink);paint-order:stroke;text-shadow:0 6px 0 var(--ink);display:none;pointer-events:none;animation:tpop .6s cubic-bezier(.34,1.56,.64,1) both}
@media (max-width:760px){
  .metric .mb{display:none}.metric{font-size:10px;padding:3px 8px 3px 4px}.metric .ic{width:20px;height:20px}
  .mission{display:none}
  .callout{top:auto;bottom:calc(96px + env(safe-area-inset-bottom,0px));left:150px;right:12px;max-width:none;font-size:12.5px}
  .win{top:auto;left:10px;right:10px;width:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:64%}
  .tile{width:58px;height:56px;font-size:9px}
  .keys{display:none}
}
@media (pointer:coarse){.joy{display:block}.keys{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const P = {cream:'#FBFAF4', ink:'#1A1206', amber:'#F2A541', ember:'#C2643A', teal:'#2C5B65', crimson:'#A73B42', nebula:'#2A1E3A'};

/* ================= Game data (Wildfire watch, tutorial-style defaults) ================= */
const PARTS = {
  rocket:{label:'Rocket', where:'rocket', opts:[
    {id:'r1',name:'Spark (small)', mass:0, cost:15, time:1, cap:300},
    {id:'r2',name:'Atlas (medium)', mass:0, cost:40, time:2, cap:800},
    {id:'r3',name:'Titan (heavy)', mass:0, cost:90, time:3, cap:2000}]},
  orbit:{label:'Orbit', where:'rocket', opts:[
    {id:'o1',name:'Sun-sync 550 km', mass:0, cost:0, time:0, link:1, note:'Same light every pass'},
    {id:'o2',name:'Low 400 km', mass:0, cost:-3, time:0, link:.8, note:'Cheaper, fewer ground passes'}]},
  bus:{label:'Bus', where:'craft', opts:[
    {id:'b1',name:'Microsat bus', mass:90, cost:20, time:6, pw:60, store:40},
    {id:'b2',name:'Smallsat bus', mass:180, cost:35, time:8, pw:80, store:120}]},
  power:{label:'Power', where:'craft', opts:[
    {id:'p1',name:'Solar 250 W', mass:20, cost:6, time:2, gen:250},
    {id:'p2',name:'Solar 450 W + battery', mass:42, cost:14, time:3, gen:450}]},
  comms:{label:'Comms', where:'craft', opts:[
    {id:'c1',name:'S-band radio', mass:6, cost:3, time:2, down:20},
    {id:'c2',name:'X-band radio', mass:12, cost:9, time:3, down:60, pw:30},
    {id:'c3',name:'Laser link', mass:18, cost:24, time:5, down:200, pw:70}]},
  inst:{label:'Instrument', where:'craft', opts:[
    {id:'i1',name:'Visible camera', mass:18, cost:10, time:3, pw:30, data:12, sci:40},
    {id:'i2',name:'Thermal IR imager', mass:38, cost:32, time:5, pw:110, data:35, sci:90},
    {id:'i3',name:'Hyperspectral imager', mass:70, cost:58, time:8, pw:190, data:95, sci:100}]},
  engine:{label:'Engine', where:'craft', opts:[
    {id:'e1',name:'Cold gas', mass:10, cost:2, time:1},
    {id:'e2',name:'Hydrazine', mass:28, cost:7, time:2, pw:10},
    {id:'e3',name:'Electric', mass:22, cost:16, time:4, pw:160}]},
};
// tutorial: everything pre-picked except the instrument
const pick = {rocket:'r1', orbit:'o1', bus:'b1', power:'p1', comms:'c2', inst:null, engine:'e1'};
const LIMIT = {budget:180, time:12};
const opt = (cat)=> PARTS[cat].opts.find(o=>o.id===pick[cat]);
function totals(){
  let mass=0,cost=0,time=0,pw=0,gen=0,data=0,down=0,store=0,cap=300,link=1;
  for(const c in PARTS){const o=opt(c); if(!o) continue; mass+=o.mass||0; cost+=o.cost||0; time=Math.max(time,o.time||0); pw+=o.pw||0; gen+=o.gen||0; data+=o.data||0; down+=o.down||0; store+=o.store||0; if(o.cap) cap=o.cap; if(o.link) link=o.link;}
  down*=link;
  const M=[
    {k:'mass',  icon:'mass', label:'Mass',  val:`${mass} kg`, r:mass/cap, hint:`Too heavy for the ${opt('rocket').name.split(' ')[0]} rocket (${cap} kg). Pick a bigger rocket or lighter parts.`},
    {k:'budget',icon:'coin', label:'Budget',val:`$${cost}M`, r:cost/LIMIT.budget, hint:`Over the $${LIMIT.budget}M budget. Swap a part for a cheaper one.`},
    {k:'power', icon:'bolt', label:'Power', val:`${pw}/${gen} W`, r:gen?pw/gen:2, hint:`Parts draw more power than the panels make. Add bigger solar panels.`},
    {k:'data',  icon:'data', label:'Data',  val:`${data}/${store} Gb`, r:store?data/store:0, hint:`The instrument fills storage too fast. Use a bigger bus.`},
    {k:'comms', icon:'comms',label:'Comms', val:`${Math.round(down)} Gb/d`, r:data? data/Math.max(down,1):0, hint:`The radio can't send all the data home. Pick a faster radio.`},
    {k:'time',  icon:'time', label:'Time',  val:`${time} mo`, r:time/LIMIT.time, hint:`Building takes longer than the ${LIMIT.time}-month deadline.`},
  ];
  return {M, mass, cost, sci: opt('inst')?.sci||0};
}

/* ================= HUD ================= */
const ic=(n)=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const resEl=document.getElementById('res'); let lastVals={};
function renderHUD(){
  const {M}=totals();
  resEl.innerHTML = M.map(m=>{const st=m.r>1?'bad':m.r>.85?'warn':''; return `<div class="metric ${st} ${lastVals[m.k]&&lastVals[m.k]!==m.val?'bump':''}" title="${m.label}"><span class="ic">${ic(m.icon)}</span>${m.val}<span class="mb"><i style="width:${Math.min(m.r,1)*100}%"></i></span></div>`}).join('');
  M.forEach(m=>lastVals[m.k]=m.val);
}

/* ================= Tutorial callout ================= */
const calloutEl=document.getElementById('callout'); let step=0;
const STEPS=[
  ['Step 1/3','Walk to the glowing spacecraft workshop.'],
  ['Step 2/3','Pick an instrument. Heavier means less fuel. Keep bars green!'],
  ['Step 3/3','Walk to the launch pad and launch.'],
  ['Done','Now design your own. Try other parts and beat your score.'],
];
function setStep(n){ step=n; const s=STEPS[n]; calloutEl.style.animation='none'; void calloutEl.offsetWidth; calloutEl.style.animation='';
  calloutEl.innerHTML=`<b>${s[0]}</b><span>${s[1]}</span><button class="skip" type="button" id="skip">Skip</button>`;
  document.getElementById('skip').onclick=()=>{calloutEl.style.display='none'}; highlight(); }

/* ================= Dock ================= */
const dockEl=document.getElementById('dock'); let launched=false;
function renderDock(){
  const T=[['planet','Missions',''],['wrench','Rocket','rocket'],['sat','Spacecraft','craft'],['rocket','Launch pad','pad'],['console','Control',launched?'control':'lock']];
  dockEl.innerHTML=T.map(t=>`<button class="tile ${t[2]==='lock'?'lock':''} ${openZone&&openZone===t[2]?'on':''}" type="button" data-z="${t[2]}" ${t[2]==='lock'?'aria-disabled="true"':''}>${t[2]==='control'&&launched?'<span class="new">NEW</span>':''}${ic(t[2]==='lock'?'lock':t[0])}${t[1]}</button>`).join('');
}
dockEl.addEventListener('click',e=>{const b=e.target.closest('.tile'); if(!b) return; const z=b.dataset.z; if(!z||z==='lock') return; walkTo(z);});

/* ================= Three.js scene ================= */
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5)); renderer.setClearColor(0,0);
const scene=new THREE.Scene();
const cam=new THREE.OrthographicCamera(-1,1,1,-1,-200,400);
const ISO=new THREE.Vector3(1,0.82,1).normalize();
let zoom=1;

// Comet-style surface shader: banded palette colours + grain + soft light, in world space
const V=`varying vec3 vN; varying vec3 vW; void main(){ vN=normalize(mat3(modelMatrix)*normal); vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`;
const F=`uniform vec3 c0; uniform vec3 c1; uniform vec3 c2; uniform vec3 c3; uniform vec3 ax; uniform float fq; uniform float fade; uniform float glow;
varying vec3 vN; varying vec3 vW;
float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
void main(){
  float t=dot(vW,normalize(ax))*fq + .35*sin(vW.x*.7+sin(vW.z*.9))*cos(vW.z*.6);
  float b=fract(t);
  vec3 col = b<.35?c0 : b<.55?mix(c0,c1,smoothstep(.35,.42,b)) : b<.78?mix(c1,c2,smoothstep(.55,.63,b)) : mix(c2,c0,smoothstep(.78,1.,b));
  vec3 L=normalize(vec3(-.5,1.,.35)); float d=dot(normalize(vN),L);
  vec3 c = mix(c3, col, smoothstep(-.4,.9,d)*.85+.15);
  c += (h(gl_FragCoord.xy)-.5)*.10;
  c = mix(c, col*1.25, glow);
  // fade into the cream page below the deck
  float f = (1.0 - smoothstep(-9.0, -1.5, vW.y))*fade;
  c = mix(c, vec3(.984,.980,.957), f);
  gl_FragColor=vec4(c,1.);
}`;
const hex=(x)=>new THREE.Color(x);
const M_CACHE={};
function mat(name, cols, ax=[1,0,.3], fq=.35, fade=1, glow=0){
  const key=name; if(M_CACHE[key]) return M_CACHE[key];
  return M_CACHE[key]=new THREE.ShaderMaterial({vertexShader:V,fragmentShader:F,uniforms:{c0:{value:hex(cols[0])},c1:{value:hex(cols[1])},c2:{value:hex(cols[2])},c3:{value:hex(cols[3])},ax:{value:new THREE.Vector3(...ax)},fq:{value:fq},fade:{value:fade},glow:{value:glow}}});
}
const STONE = mat('stone',['#D7D0C0','#B9B0A0','#E8E2D4','#6E6457'],[1,0,.4],.28);
const DARK  = mat('dark', ['#3A2E3E','#2A1E3A','#4A3A44','#120C1E'],[0,1,.2],.5);
const TEAL  = mat('teal', ['#2C5B65','#1C3E46','#95B3B6','#0B1F24'],[.3,1,.2],.6,0);
const RUST  = mat('rust', ['#C2643A','#A73B42','#E07A44','#4A1A14'],[.2,1,.3],.6,0);
const CREAM = mat('cream',['#FBFAF4','#E8D9B8','#D7D0C0','#9B7751'],[.1,1,.1],.9,0);
const GLOWA = mat('glowa',['#F2A541','#F2C27A','#F2A541','#C2643A'],[0,1,0],1,0,.8);
const trimMat=new THREE.LineBasicMaterial({color:0xC2643A});

function box(w,h,d,m,x,y,z,trim=true){const g=new THREE.BoxGeometry(w,h,d);const me=new THREE.Mesh(g,m);me.position.set(x,y,z);scene.add(me);
  if(trim){const e=new THREE.LineSegments(new THREE.EdgesGeometry(g),trimMat);e.position.copy(me.position);scene.add(e);}return me;}
function cyl(rt,rb,h,m,x,y,z,seg=24){const me=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),m);me.position.set(x,y,z);scene.add(me);return me;}

// walkable decks: [x0,z0,x1,z1]
const DECKS=[[-5,-5,5,5],[-19,-4,-11,4],[-11,-1.2,-5,1.2],[11,-4,19,4],[5,-1.2,11,1.2],[-4,-21,4,-11],[-1.2,-11,1.2,-5],[-4,11,4,19],[-1.2,5,1.2,11]];
const DECK_H=1.2;
for(const [x0,z0,x1,z1] of DECKS){
  const w=x1-x0,d=z1-z0,cx=(x0+x1)/2,cz=(z0+z1)/2;
  box(w,DECK_H,d,STONE,cx,-DECK_H/2,cz);
  const bridge = Math.min(w,d)<3;
  if(!bridge){ // columns dropping into the cream
    for(const [px,pz] of [[x0+.8,z0+.8],[x1-.8,z0+.8],[x0+.8,z1-.8],[x1-.8,z1-.8]]) box(1.1,10,1.1,DARK,px,-DECK_H-5,pz,false);
  } else { // arched supports under bridges
    const len=Math.max(w,d), along=w>d;
    for(let i=0;i<=8;i++){const t=i/8, y=-DECK_H-1.6*Math.sin(Math.PI*t);const pos=along?[x0+t*w,y,cz]:[cx,y,z0+t*d];
      const s=new THREE.Mesh(new THREE.BoxGeometry(.25,.25,.25),DARK); s.position.set(...pos); scene.add(s);}
    const pts=[];for(let i=0;i<=24;i++){const t=i/24;const y=-DECK_H-1.6*Math.sin(Math.PI*t);pts.push(along?new THREE.Vector3(x0+t*w,y,z0):new THREE.Vector3(x0,y,z0+t*d));pts.push(along?new THREE.Vector3(x0+t*w,y,z1):new THREE.Vector3(x1,y,z0+t*d));}
    const l1=[],l2=[];pts.forEach((p,i)=>(i%2?l2:l1).push(p));
    for(const L of [l1,l2]) scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(L),trimMat));
  }
}
// floor light dots on the plaza
for(const [x,z] of [[-3.5,-3.5],[3.5,-3.5],[-3.5,3.5],[3.5,3.5],[0,-3.8],[0,3.8]]) cyl(.32,.32,.06,GLOWA,x,.03,z,16);

// ---------- Buildings ----------
const ZONES={};
function zone(id,name,door,face){ // glowing ring on the floor at the door
  const ring=new THREE.Mesh(new THREE.RingGeometry(1.0,1.25,40),new THREE.MeshBasicMaterial({color:0xF2A541,transparent:true,opacity:.0,side:THREE.DoubleSide,depthWrite:false}));
  ring.rotation.x=-Math.PI/2; ring.position.set(door[0],.05,door[1]); scene.add(ring);
  ZONES[id]={id,name,door:new THREE.Vector3(door[0],0,door[1]),ring,face};
}
// Rocket workshop (west): long hangar with rust roof band
box(6,3.2,5.4,CREAM,-15,1.6,0); box(6.3,.5,5.7,RUST,-15,3.45,0);
box(.15,2.2,2.6,DARK,-11.95,1.1,0,false); // door
for(let i=0;i<3;i++) box(.7,.7,.7,RUST,-17.6+i*.9,.35,3.2);
zone('rocket','Rocket workshop',[-10.4,0],'w');
// Spacecraft workshop (east): block + dome
box(5.4,2.8,5.4,CREAM,15,1.4,0); const dome=new THREE.Mesh(new THREE.SphereGeometry(2.2,32,16,0,Math.PI*2,0,Math.PI/2),TEAL); dome.position.set(15,2.8,0); scene.add(dome);
box(.15,2,2.4,DARK,12.25,1,0,false);
cyl(.45,.45,1.6,TEAL,17.6,.8,3.2); cyl(.5,.5,.2,DARK,17.6,1.7,3.2); // glowing capsule
zone('craft','Spacecraft workshop',[10.6,0],'e');
// Launch pad (north): round pad + gantry + rocket
cyl(3.2,3.4,.4,DARK,0,.2,-16,40); cyl(2.6,2.6,.06,GLOWA,0,.43,-16,40); cyl(2.3,2.3,.08,STONE,0,.47,-16,40);
box(.9,8,.9,DARK,2.4,4,-16); for(let i=1;i<4;i++) box(1.8,.18,.18,RUST,1.5,i*2,-16,false);
const rocket=new THREE.Group(); rocket.position.set(0,.5,-16); scene.add(rocket);
{const b=new THREE.Mesh(new THREE.CylinderGeometry(.75,.85,5,24),CREAM); b.position.y=2.5; rocket.add(b);
 const n=new THREE.Mesh(new THREE.ConeGeometry(.75,1.6,24),RUST); n.position.y=5.8; rocket.add(n);
 for(let a=0;a<3;a++){const f=new THREE.Mesh(new THREE.BoxGeometry(.12,1.2,.9),RUST); f.position.set(Math.cos(a*2.09)*.85,.6,Math.sin(a*2.09)*.85); f.rotation.y=-a*2.09; rocket.add(f);}
 const w=new THREE.Mesh(new THREE.SphereGeometry(.28,16,12),TEAL); w.position.set(0,3.6,.72); rocket.add(w);}
const flame=new THREE.Mesh(new THREE.ConeGeometry(.6,2.4,16),new THREE.MeshBasicMaterial({color:0xF2A541,transparent:true,opacity:0})); flame.rotation.x=Math.PI; flame.position.y=-1.1; rocket.add(flame);
zone('pad','Launch pad',[0,-9.4],'n');
// Mission control (south): tower with amber window dots
box(4.6,5.5,4.6,DARK,0,2.75,15); box(5,.5,5,RUST,0,5.75,15);
for(let i=0;i<3;i++){const dot=cyl(.28,.28,.1,GLOWA,-1.2+i*1.2,4.2,12.68,16); dot.rotation.x=Math.PI/2;}
box(.15,2,1.8,DARK,0,1,12.62,false).rotation.y=Math.PI/2;
const lockSprite=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.fillStyle='#FBFAF4';x.strokeStyle='#1A1206';x.lineWidth=8;x.beginPath();x.arc(64,64,52,0,7);x.fill();x.stroke();
  x.fillStyle='#1A1206';x.fillRect(40,60,48,36);x.lineWidth=9;x.beginPath();x.arc(64,58,16,Math.PI,0);x.stroke();const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));s.scale.set(1.8,1.8,1);s.position.set(0,7.6,15);scene.add(s);return s})();
zone('control','Mission control',[0,10],'s');
// props: crates, lamp posts
for(const [x,z] of [[-4,-2],[-3.2,-2.6],[4,2.6],[3.3,3.4],[-17,-3.2]]) box(.8,.8,.8,RUST,x,.4,z);
for(const [x,z] of [[-5,5],[5,-5],[-12,1.2],[12,-1.2]]){ cyl(.08,.08,2.4,DARK,x,1.2,z,8); cyl(.35,.35,.12,GLOWA,x,2.45,z,16); }

// ---------- Character (astronaut, Comet style) ----------
const hero=new THREE.Group(); scene.add(hero);
const SUIT=mat('suit',['#FBFAF4','#E8E2D4','#FBFAF4','#9C968C'],[0,1,0],.8,0);
const body=new THREE.Mesh(new THREE.CylinderGeometry(.42,.46,.9,20),SUIT); body.position.y=.95; hero.add(body);
const pack=new THREE.Mesh(new THREE.BoxGeometry(.6,.65,.3),RUST); pack.position.set(0,1.0,-.42); hero.add(pack);
const head=new THREE.Mesh(new THREE.SphereGeometry(.42,24,16),SUIT); head.position.y=1.72; hero.add(head);
const visor=new THREE.Mesh(new THREE.SphereGeometry(.3,20,12,0,Math.PI,0,Math.PI),TEAL); visor.position.set(0,1.74,.18); visor.rotation.y=0; hero.add(visor);
const legs=[-.18,.18].map(x=>{const l=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.55,10),SUIT); l.position.set(x,.3,0); hero.add(l); return l;});
const shadow=new THREE.Mesh(new THREE.CircleGeometry(.55,24),new THREE.MeshBasicMaterial({color:0x1A1206,transparent:true,opacity:.18,depthWrite:false})); shadow.rotation.x=-Math.PI/2; shadow.position.y=.02; hero.add(shadow);
hero.position.set(0,0,2);

/* ================= Movement ================= */
const keys={}; addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true; if(e.key.toLowerCase()==='e'&&near&&!openZone) openWin(near); if(e.key==='Escape') closeWin();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
let joyV={x:0,y:0}; const joy=document.getElementById('joy'), knob=joy.querySelector('i');
joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);moveJoy(e)}); joy.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')moveJoy(e)});
joy.addEventListener('pointerup',()=>{joyV={x:0,y:0};knob.style.transform=''});
function moveJoy(e){const r=joy.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}joyV={x,y};knob.style.transform=`translate(${x*34}px,${y*34}px)`}
let autoTarget=null, queue=[];
const deckOf=(x,z)=>DECKS.findIndex(([x0,z0,x1,z1])=>x>=x0&&x<=x1&&z>=z0&&z<=z1);
function route(p){ queue = deckOf(hero.position.x,hero.position.z)===deckOf(p.x,p.z) ? [p] : [new THREE.Vector3(hero.position.x>5||hero.position.x<-5?Math.sign(hero.position.x)*4:0,0,hero.position.z>5||hero.position.z<-5?Math.sign(hero.position.z)*4:0), new THREE.Vector3(0,0,0), new THREE.Vector3(Math.abs(p.x)>5?Math.sign(p.x)*4:0,0,Math.abs(p.z)>5?Math.sign(p.z)*4:0), p]; autoTarget=queue.shift(); }
function walkTo(z){ closeWin(); route(ZONES[z].door.clone()); }
canvas.addEventListener('click',e=>{ // tap to walk
  const r=canvas.getBoundingClientRect(); const ndc=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  const ray=new THREE.Raycaster(); ray.setFromCamera(ndc,cam); const p=new THREE.Vector3(); if(ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),p) && onDeck(p.x,p.z)) route(p);
});
// bridges are extended along their length so they overlap the decks they join
const WALK=DECKS.map(([x0,z0,x1,z1])=>{const w=x1-x0,d=z1-z0; if(Math.min(w,d)<3){ return w>d?[x0-1,z0,x1+1,z1]:[x0,z0-1,x1,z1+1]; } return [x0,z0,x1,z1];});
function onDeck(x,z){return WALK.some(([x0,z0,x1,z1])=>x>x0+.35&&x<x1-.35&&z>z0+.35&&z<z1-.35)}
// keep out of building footprints
const BLOCK=[[-18,-2.7,-12,2.7],[12.3,-2.7,17.7,2.7],[-2.3,12.7,2.3,17.3],[-3.4,-19.4,3.4,-12.6]];
const blocked=(x,z)=>BLOCK.some(([x0,z0,x1,z1])=>x>x0&&x<x1&&z>z0&&z<z1);

/* ================= Zones / windows ================= */
const enterEl=document.getElementById('enter'), winEl=document.getElementById('win');
let near=null, openZone=null, tab=null;
enterEl.onclick=()=>near&&openWin(near);
function highlight(){ for(const z in ZONES) ZONES[z].goal = (step===0&&z==='craft')||(step===2&&z==='pad'); }
function openWin(z){
  if(z==='control'&&!launched){ toastMsg('Locked until launch'); return; }
  openZone=z; autoTarget=null; enterEl.style.display='none';
  const cats=Object.keys(PARTS).filter(c=>PARTS[c].where===z);
  if(z==='craft'&&!tab) tab='inst'; if(z==='rocket') tab=tab&&cats.includes(tab)?tab:'rocket'; if(z==='craft'&&!cats.includes(tab)) tab='inst';
  renderWin(); renderDock(); if(z==='craft'&&step===0) setStep(1);
}
function closeWin(){ openZone=null; winEl.classList.remove('open'); renderDock(); }
function fx(o){const a=[]; if(o.mass) a.push(['+'+o.mass+' kg','up']); if(o.cost) a.push([(o.cost>0?'+$':'-$')+Math.abs(o.cost)+'M',o.cost>0?'up':'good']); if(o.pw) a.push(['+'+o.pw+' W use','up']); if(o.gen) a.push([o.gen+' W','good']); if(o.data) a.push([o.data+' Gb/d','']); if(o.down) a.push([o.down+' Gb/d link','good']); if(o.cap) a.push(['lifts '+o.cap+' kg','good']); if(o.store) a.push([o.store+' Gb store','good']); if(o.time) a.push([o.time+' mo','']); if(o.note) a.push([o.note,'']); return a.map(x=>`<span class="${x[1]}">${x[0]}</span>`).join('')}
function renderWin(){
  const z=openZone; if(!z){winEl.classList.remove('open');return;}
  const name=ZONES[z].name; let body='',foot='',tabs='';
  if(z==='rocket'||z==='craft'){
    const cats=Object.keys(PARTS).filter(c=>PARTS[c].where===z);
    tabs=`<div class="tabs">${cats.map(c=>`<button class="tab ${c===tab?'on':''}" type="button" data-tab="${c}">${PARTS[c].label}${!pick[c]?'<span class="need"></span>':''}</button>`).join('')}</div>`;
    body=PARTS[tab].opts.map(o=>`<button class="opt ${pick[tab]===o.id?'on':''}" type="button" data-opt="${o.id}"><span class="dot"></span><span class="nm">${o.name}</span><span class="fx">${fx(o)}</span></button>`).join('');
    foot=`<button class="t-btn ghost" type="button" data-close>Done</button>`;
  } else if(z==='pad'){
    const {M,sci}=totals(); const bad=M.filter(m=>m.r>1); const missing=Object.keys(PARTS).filter(c=>!pick[c]);
    body=`<ul class="check">${M.map(m=>`<li class="${m.r>1?'bad':''}"><i></i>${m.label}<small>${m.val}</small></li>`).join('')}</ul>`+
      (missing.length?`<div class="hint">Missing: ${missing.map(c=>PARTS[c].label).join(', ')}. Visit the spacecraft workshop.</div>`: bad.length?`<div class="hint">${bad[0].hint}</div>`:'');
    foot=`<button class="t-btn primary" type="button" id="launch" ${bad.length||missing.length||launched?'disabled':''}>${launched?'Launched':'Launch'}</button>`;
  } else if(z==='control'){
    body=`<div class="hint" style="background:rgba(76,195,138,.2)">Your spacecraft is on its way. The full mission control console comes next.</div>`;
    foot=`<button class="t-btn ghost" type="button" data-close>Close</button>`;
  }
  winEl.innerHTML=`<div class="w-head"><span class="t-ribbon">${name}</span><h3>${z==='pad'?'Pre-launch check':z==='control'?'Mission control':'Pick your parts'}</h3><p>${z==='craft'?'Every part changes the bars up top.':z==='rocket'?'The rocket sets your mass limit.':z==='pad'?'All bars must be green to launch.':''}</p>
    <button class="t-round x" type="button" data-close aria-label="Close">${ic('x')}</button></div>${tabs}<div class="w-body">${body}</div><div class="w-foot">${foot}</div>`;
  winEl.classList.add('open');
  const L=document.getElementById('launch'); if(L) L.onclick=doLaunch;
}
winEl.addEventListener('click',e=>{
  if(e.target.closest('[data-close]')) return closeWin();
  const t=e.target.closest('[data-tab]'); if(t){tab=t.dataset.tab; renderWin(); return;}
  const o=e.target.closest('[data-opt]'); if(o){pick[tab]=o.dataset.opt; renderHUD(); renderWin(); if(tab==='inst'&&step===1) setStep(2); }
});
function toastMsg(t){const el=document.getElementById('toast'); el.textContent=t; el.style.display='none'; void el.offsetWidth; el.style.display='block'; clearTimeout(toastMsg.t); toastMsg.t=setTimeout(()=>el.style.display='none',1600);}
let launchT=-1;
function doLaunch(){ launched=true; closeWin(); launchT=0; toastMsg('Liftoff!'); setStep(3); renderDock(); }

/* ================= Stars in the corner ================= */
const skyC=document.getElementById('sky'); let SK=null;
function initSky(){const r=skyC.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.5);skyC.width=r.width*d;skyC.height=r.height*d;const x=skyC.getContext('2d');x.setTransform(d,0,0,d,0,0);
  let s=5;const R=()=>(s=(s*16807)%2147483647)/2147483647;const st=[];for(let k=0;k<380;k++){const px=r.width*(1-Math.pow(R(),1.4)*.55),py=r.height*Math.pow(R(),1.5)*.7,dx=(r.width-px)/(r.width*.55),dy=py/(r.height*.7);if(dx*dx+dy*dy>.75)continue;st.push({x:px,y:py,s:R()<.06?1.8:R()*.9+.3,p:R()*6})}
  SK={x,w:r.width,h:r.height,st}}
function drawSky(t){const {x}=SK;x.clearRect(0,0,SK.w,SK.h);for(const s of SK.st){x.globalAlpha=reduce?.85:.4+.6*Math.abs(Math.sin(t/1300+s.p));x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.s,0,7);x.fill()}}

/* ================= Loop ================= */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);const view=w<760?17:15, a=w/h; cam.left=-view*a;cam.right=view*a;cam.top=view;cam.bottom=-view;cam.updateProjectionMatrix();initSky();}
addEventListener('resize',resize); resize();
const camFocus=new THREE.Vector3(0,0,2), tmp=new THREE.Vector3();
const FWD=new THREE.Vector3(-1,0,-1).normalize(), RIGHT=new THREE.Vector3(1,0,-1).normalize();
let last=performance.now(), walkPhase=0, running=true;
document.addEventListener('visibilitychange',()=>{running=!document.hidden; if(running){last=performance.now(); requestAnimationFrame(tick);}});
function tick(now){
  if(!running) return; const dt=Math.min((now-last)/1000,.05); last=now; const t=now/1000;
  // input
  let ix=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0)+joyV.x;
  let iy=(keys['w']||keys['arrowup']?1:0)-(keys['s']||keys['arrowdown']?1:0)-joyV.y;
  let dir=new THREE.Vector3().addScaledVector(RIGHT,ix).addScaledVector(FWD,iy);
  if(dir.lengthSq()>0.01){autoTarget=null;queue=[];} else if(autoTarget){dir.subVectors(autoTarget,hero.position).setY(0); if(dir.length()<.25){autoTarget=queue.shift()||null;dir.set(0,0,0);}}
  const moving=dir.lengthSq()>0.01 && !openZone;
  if(moving){dir.normalize(); const sp=6.5*dt; const nx=hero.position.x+dir.x*sp, nz=hero.position.z+dir.z*sp;
    if(onDeck(nx,nz)&&!blocked(nx,nz)){hero.position.x=nx;hero.position.z=nz} else if(onDeck(nx,hero.position.z)&&!blocked(nx,hero.position.z)) hero.position.x=nx; else if(onDeck(hero.position.x,nz)&&!blocked(hero.position.x,nz)) hero.position.z=nz; else {autoTarget=null;queue=[];}
    const ang=Math.atan2(dir.x,dir.z); let da=ang-hero.rotation.y; da=Math.atan2(Math.sin(da),Math.cos(da)); hero.rotation.y+=da*Math.min(1,dt*12);
    walkPhase+=dt*12;}
  const sw=moving&&!reduce?Math.sin(walkPhase):0; legs[0].position.z=sw*.16; legs[1].position.z=-sw*.16; body.position.y=.95+Math.abs(sw)*.06; head.position.y=1.72+Math.abs(sw)*.06; visor.position.y=1.74+Math.abs(sw)*.06;
  // zones
  near=null; for(const z in ZONES){const Z=ZONES[z]; const d=Z.door.distanceTo(tmp.set(hero.position.x,0,hero.position.z)); const close=d<2.2; if(close) near=z;
    const target=close?.95:Z.goal?(.45+.4*Math.sin(t*4)):0; Z.ring.material.opacity+=(target-Z.ring.material.opacity)*.15; Z.ring.scale.setScalar(1+(Z.goal&&!reduce?.08*Math.sin(t*4):0));}
  if(near&&!openZone){const p=ZONES[near].door.clone().setY(3.2).project(cam); enterEl.style.display='block'; enterEl.style.left=((p.x+1)/2*innerWidth)+'px'; enterEl.style.top=((1-p.y)/2*innerHeight)+'px';
    const label=near==='control'&&!launched?'Locked':'Enter '+ZONES[near].name; if(enterEl.dataset.l!==label){enterEl.dataset.l=label; enterEl.innerHTML=label+'<kbd>E</kbd>';}} else if(!openZone) enterEl.style.display='none';
  lockSprite.visible=!launched;
  // launch animation
  if(launchT>=0){launchT+=dt; const k=Math.max(0,launchT-.6); rocket.position.y=.5+k*k*6; flame.material.opacity=Math.min(1,launchT*2)*(.7+.3*Math.sin(t*40)); flame.scale.set(1,1+.2*Math.sin(t*30),1); if(rocket.position.y>80){launchT=-1;rocket.visible=false;}}
  // camera follow (iso)
  camFocus.lerp(tmp.set(hero.position.x,0,hero.position.z),1-Math.pow(.02,dt));
  cam.position.copy(camFocus).addScaledVector(ISO,60); cam.lookAt(camFocus);
  drawSky(now); renderer.render(scene,cam); requestAnimationFrame(tick);
}
renderHUD(); renderDock(); setStep(0);
requestAnimationFrame(tick);
</script>
