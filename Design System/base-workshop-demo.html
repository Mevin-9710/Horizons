/* Layout: full-screen isometric base (three.js, orthographic) on the cream page with the starry corner.
   HUD resource bar on top, dock at the bottom, tutorial callout under the HUD, workshop windows dock right (bottom sheet on phones). Tactile + glass. */
:root{
  color-scheme: light;
  --cream:#FBFAF4; --ink:#1A1206; --muted:#6E6457; --line:rgba(26,18,6,.10);
  --amber:#F2A541; --amber-d:#C27F22; --ember:#C2643A; --ember-d:#8E4322; --teal:#2C5B65; --crimson:#A73B42;
  --ok:#4CC38A; --warn:#F2B33D; --bad:#E5484D; --bad-d:#A3262A; --lip:#E4DED2;
  --glass:rgba(255,255,255,.42);
  --f-display:'Game Paused','Silkscreen',monospace; --f-num:'Silkscreen',monospace; --f-ui:'Geist',system-ui,sans-serif; --f-mono:'Geist Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--cream);color:var(--ink);font-family:var(--f-ui);overflow:hidden}
#app{position:fixed;inset:0;background:var(--cream)}
.night{position:absolute;inset:0;pointer-events:none;background:radial-gradient(55% 70% at 100% 0%, #08070F 0%, #120C1E 26%, #2A1E3A 42%, rgba(194,100,58,.26) 56%, rgba(242,165,65,.09) 64%, rgba(251,250,244,0) 74%)}
canvas#sky,canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas#sky{pointer-events:none}
canvas#gl{touch-action:none}
.ui{position:absolute;z-index:2}

/* tactile kit */
.t-btn{position:relative;border:3px solid var(--ink);border-radius:16px;padding:11px 22px 13px;font:400 19px var(--f-display);letter-spacing:.03em;cursor:pointer;color:var(--ink);
  background:var(--c,var(--glass));backdrop-filter:blur(18px) saturate(1.4);box-shadow:inset 0 -5px 0 var(--cd,rgba(26,18,6,.08)),inset 0 3px 0 rgba(255,255,255,.4),0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.t-btn:active{transform:translateY(4px);box-shadow:inset 0 -2px 0 var(--cd,rgba(26,18,6,.08)),0 1px 0 var(--ink)}
.t-btn.primary{--c:var(--amber);--cd:var(--amber-d)}
.t-btn.ghost{font:700 14px var(--f-ui)}
.t-btn[disabled]{--c:#D9D3C7;--cd:#BDB5A6;color:#8A8174;cursor:not-allowed;transform:none}
.t-round{position:relative;width:44px;height:44px;flex:none;border-radius:50%;border:3px solid var(--ink);background:var(--c,var(--glass));backdrop-filter:blur(18px);color:var(--cc,var(--ink));box-shadow:inset 0 -4px 0 var(--cd,rgba(26,18,6,.08)),0 4px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.t-round:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.t-round svg{width:20px;height:20px}
.t-round.x{--c:var(--bad);--cd:var(--bad-d);--cc:#fff;width:38px;height:38px}
.t-win{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:3px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink)}
.t-ribbon{display:inline-block;background:var(--ember);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:5px 16px 7px;font:400 16px var(--f-display);white-space:nowrap;box-shadow:inset 0 -4px 0 var(--ember-d),0 4px 0 var(--ink);text-shadow:0 2px 0 rgba(26,18,6,.3)}
.t-btn:focus-visible,.t-round:focus-visible,.opt:focus-visible,.tab:focus-visible,.tile:focus-visible{outline:3px solid var(--ember);outline-offset:3px}
@keyframes tpop{0%{transform:scale(.85) translateY(16px);opacity:0}}
svg.i{width:18px;height:18px;flex:none}

/* HUD */
.hud{top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:flex-start}
.res{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.metric{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;border-radius:999px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);font:400 11.5px var(--f-num);transition:background .3s}
.metric .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ink);color:#fff;background:var(--teal)}
.metric .ic svg{width:14px;height:14px}
.metric .mb{width:46px;height:8px;border-radius:5px;border:2px solid var(--ink);background:rgba(255,255,255,.6);overflow:hidden}
.metric .mb i{display:block;height:100%;background:var(--ok);transition:width .5s cubic-bezier(.34,1.56,.64,1),background .3s}
.metric.warn .mb i{background:var(--warn)}
.metric.bad{background:rgba(229,72,77,.22)}
.metric.bad .mb i{background:var(--bad)}
.metric.bad .ic{background:var(--bad)}
.metric.bump{animation:bump .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{40%{transform:scale(1.12)}}
.mission{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.mission .t-ribbon{font-size:14px}
/* callout */
.callout{top:calc(78px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));max-width:300px;background:var(--ink);color:var(--cream);border-radius:14px;padding:11px 14px;font:600 13.5px var(--f-ui);line-height:1.35;box-shadow:0 4px 0 rgba(26,18,6,.3);animation:tpop .5s cubic-bezier(.34,1.56,.64,1) both;display:flex;gap:10px;align-items:flex-start}
.callout b{color:var(--amber);font:400 11px var(--f-num);white-space:nowrap;margin-top:2px}
.callout .skip{margin-left:auto;background:none;border:0;color:var(--cream);opacity:.6;font:600 11px var(--f-ui);cursor:pointer;padding:0}
/* dock */
.dock{left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:8px;border-radius:22px}
.tile{position:relative;width:70px;height:64px;border-radius:15px;border:3px solid var(--ink);background:var(--c,rgba(255,255,255,.5));box-shadow:inset 0 -4px 0 var(--cd,rgba(26,18,6,.08)),0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 10px var(--f-ui);cursor:pointer;color:var(--ink);padding:0}
.tile svg{width:22px;height:22px}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tile.on{--c:var(--amber);--cd:var(--amber-d)}
.tile.lock{--c:rgba(217,211,199,.7);color:var(--muted);cursor:not-allowed}
.tile .new{position:absolute;top:-10px;right:-8px;background:var(--ok);color:#fff;border:2px solid var(--ink);border-radius:6px;font:400 9px var(--f-num);padding:1px 5px;transform:rotate(8deg)}
/* world prompt */
.enter{z-index:3;transform:translate(-50%,-100%);display:none;animation:tpop .35s cubic-bezier(.34,1.56,.64,1) both;white-space:nowrap}
.enter kbd{font:400 11px var(--f-num);border:2px solid var(--ink);border-radius:6px;padding:1px 6px;margin-left:8px;background:#fff}
/* window */
.win{top:calc(78px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:min(400px,calc(100% - 24px));max-height:calc(100% - 180px);display:none;flex-direction:column;overflow:hidden;animation:tpop .5s cubic-bezier(.34,1.56,.64,1) both}
.win.open{display:flex}
.w-head{padding:16px 16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative}
.w-head h3{margin:0;font:400 26px var(--f-display)}
.w-head p{margin:0;font-size:13px;color:var(--muted)}
.w-head .t-round.x{position:absolute;top:10px;right:10px}
.tabs{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;border:2.5px solid var(--ink);border-radius:12px;padding:6px 11px 8px;font:700 12.5px var(--f-ui);background:rgba(255,255,255,.5);box-shadow:inset 0 -3px 0 rgba(26,18,6,.08),0 3px 0 var(--ink);cursor:pointer;color:var(--ink);position:relative}
.tab.on{background:var(--amber);box-shadow:inset 0 -3px 0 var(--amber-d),0 3px 0 var(--ink)}
.tab .need{position:absolute;top:-7px;right:-6px;width:14px;height:14px;border-radius:50%;background:var(--bad);border:2px solid var(--ink)}
.w-body{padding:4px 14px 14px;overflow:auto;display:flex;flex-direction:column;gap:10px;min-height:0}
.opt{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;text-align:left;width:100%;border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.4);box-shadow:0 4px 0 var(--ink);cursor:pointer;color:var(--ink);font:inherit;transition:transform .12s cubic-bezier(.34,1.56,.64,1)}
.opt:hover{transform:translateY(-2px)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt.on{background:rgba(242,165,65,.55)}
.opt .dot{grid-row:span 2;width:22px;height:22px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center}
.opt.on .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.opt .nm{font:700 14.5px var(--f-ui)}
.opt .fx{display:flex;flex-wrap:wrap;gap:5px}
.opt .fx span{font:400 10px var(--f-num);padding:2px 6px;border-radius:6px;border:1.5px solid var(--ink);background:rgba(255,255,255,.6)}
.opt .fx span.up{background:rgba(229,72,77,.18)}
.opt .fx span.good{background:rgba(76,195,138,.25)}
.w-foot{padding:12px 14px 16px;border-top:3px solid var(--ink);background:rgba(251,247,238,.35);display:flex;gap:10px}
.w-foot .t-btn{flex:1}
.check{display:flex;flex-direction:column;gap:7px;margin:0;padding:0;list-style:none}
.check li{display:flex;gap:10px;align-items:center;font:600 13.5px var(--f-ui);padding:8px 10px;border:2.5px solid var(--ink);border-radius:12px;background:rgba(255,255,255,.4)}
.check li i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:var(--ok);flex:none}
.check li.bad i{background:var(--bad)}
.check li small{margin-left:auto;font:400 10px var(--f-num);color:var(--muted)}
.hint{font:600 13px var(--f-ui);background:rgba(229,72,77,.16);border:2.5px solid var(--ink);border-radius:12px;padding:9px 11px}
/* joystick */
.joy{left:max(18px,env(safe-area-inset-left,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));width:116px;height:116px;border-radius:50%;border:3px solid var(--ink);background:var(--glass);backdrop-filter:blur(14px);box-shadow:0 5px 0 var(--ink);display:none;touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--amber);border:3px solid var(--ink);box-shadow:inset 0 -4px 0 var(--amber-d)}
.keys{right:max(14px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));font:400 10px var(--f-num);color:var(--muted);display:flex;gap:4px;align-items:center}
.keys kbd{border:2px solid var(--ink);border-radius:5px;padding:1px 5px;background:var(--glass);color:var(--ink)}
.toast{left:50%;top:40%;transform:translate(-50%,-50%);font:400 clamp(40px,8vw,84px) var(--f-display);color:var(--ember);-webkit-text-stroke:3px var(--ink);paint-order:stroke;text-shadow:0 6px 0 var(--ink);display:none;pointer-events:none;animation:tpop .6s cubic-bezier(.34,1.56,.64,1) both}
@media (max-width:760px){
  .metric .mb{display:none}.metric{font-size:10px;padding:3px 8px 3px 4px}.metric .ic{width:20px;height:20px}
  .mission{display:none}
  .callout{top:auto;bottom:calc(96px + env(safe-area-inset-bottom,0px));left:150px;right:12px;max-width:none;font-size:12.5px}
  .win{top:auto;left:10px;right:10px;width:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:64%}
  .tile{width:58px;height:56px;font-size:9px}
  .keys{display:none}
}
@media (pointer:coarse){.joy{display:block}.keys{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* walk-in workshops */
.info{left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100% - 24px));padding:12px 14px;display:none;flex-direction:column;gap:8px;animation:tpop .35s cubic-bezier(.34,1.56,.64,1) both}
.info.show{display:flex}
.info .row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.info .cat{font:400 10px var(--f-num);color:var(--muted);letter-spacing:.06em}
.info h4{margin:0;font:400 22px var(--f-display)}
.info .src{font:600 11px var(--f-ui);color:var(--teal)}
.info .fx{display:flex;flex-wrap:wrap;gap:5px}
.info .fx span{font:400 10px var(--f-num);padding:2px 6px;border-radius:6px;border:1.5px solid var(--ink);background:rgba(255,255,255,.6)}
.info .fx span.up{background:rgba(229,72,77,.18)} .info .fx span.good{background:rgba(76,195,138,.25)}
.info .t-btn{padding:8px 16px 10px;font-size:16px;flex:none}
.wipe{position:fixed;inset:0;z-index:5;pointer-events:none;background:var(--cream);clip-path:circle(0% at 50% 50%);transition:clip-path .45s cubic-bezier(.65,0,.35,1)}
.wipe.on{clip-path:circle(150% at 50% 50%)}
.loading{left:50%;top:50%;transform:translate(-50%,-50%);z-index:6}
.credit{left:max(12px,env(safe-area-inset-left,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));font:500 10px var(--f-ui);color:var(--muted);max-width:280px;line-height:1.35}
.roomname{top:calc(70px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:none}
@media (max-width:760px){.credit{display:none}.info{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= Game data ================= */
// model: NASA GLB file (models/…); proc: procedural stand-in where NASA has no separate part model
const PARTS = {
  rocket:{label:'Rocket', where:'rocket', opts:[
    {id:'r1',name:'Jupiter-C', src:'NASA', model:'rocket-jupiter-c', h:6,  cost:15, time:1, cap:300},
    {id:'r2',name:'Atlas',     src:'NASA', model:'rocket-atlas',     h:8,  cost:40, time:2, cap:800},
    {id:'r3',name:'Saturn V',  src:'NASA', model:'rocket-saturn-v',  h:12, cost:90, time:3, cap:2000}]},
  orbit:{label:'Orbit', where:'rocket', opts:[
    {id:'o1',name:'Sun-sync 550 km', proc:'orbit', link:1, note:'Same light every pass'},
    {id:'o2',name:'Low 400 km', proc:'orbit', cost:-3, link:.8, note:'Cheaper, fewer ground passes'}]},
  bus:{label:'Bus', where:'craft', opts:[
    {id:'b1',name:'Microsat bus', src:'NASA Satellite Kit', model:'kit-body-2', mass:90,  cost:20, time:6, pw:60, store:40},
    {id:'b2',name:'Smallsat bus', src:'NASA Satellite Kit', model:'kit-body-3', mass:180, cost:35, time:8, pw:80, store:120},
    {id:'b3',name:'Large bus',    src:'NASA Satellite Kit', model:'kit-body-1', mass:320, cost:55, time:10, pw:110, store:300}]},
  power:{label:'Power', where:'craft', opts:[
    {id:'p1',name:'Solar 250 W',   src:'NASA Satellite Kit', model:'kit-wings-1', mass:20, cost:6,  time:2, gen:250},
    {id:'p2',name:'Solar 450 W',   src:'NASA Satellite Kit', model:'kit-wings-2', mass:42, cost:14, time:3, gen:450},
    {id:'p3',name:'Solar 800 W',   src:'NASA Satellite Kit', model:'kit-wings-3', mass:75, cost:26, time:4, gen:800}]},
  comms:{label:'Comms', where:'craft', opts:[
    {id:'c1',name:'S-band radio', src:'NASA Satellite Kit', model:'kit-radio-1', mass:6,  cost:3,  time:2, down:20},
    {id:'c2',name:'X-band radio', src:'NASA Satellite Kit', model:'kit-radio-2', mass:12, cost:9,  time:3, down:60, pw:30},
    {id:'c3',name:'Laser link',   src:'NASA Satellite Kit', model:'kit-radio-3', mass:18, cost:24, time:5, down:200, pw:70}]},
  inst:{label:'Instrument', where:'craft', opts:[
    {id:'i1',name:'Visible camera',       proc:'scope',  mass:18, cost:10, time:3, pw:30,  data:12, sci:40},
    {id:'i2',name:'Thermal IR imager',    src:'NASA', model:'infrared-camera', mass:38, cost:32, time:5, pw:110, data:35, sci:90},
    {id:'i3',name:'Hyperspectral imager', proc:'scope2', mass:70, cost:58, time:8, pw:190, data:95, sci:100}]},
  engine:{label:'Engine', where:'craft', opts:[
    {id:'e1',name:'Cold gas',  proc:'nozzle-s', mass:10, cost:2,  time:1},
    {id:'e2',name:'Hydrazine', proc:'nozzle-m', mass:28, cost:7,  time:2, pw:10},
    {id:'e3',name:'Electric',  proc:'ion',      mass:22, cost:16, time:4, pw:160}]},
};
const pick = {rocket:'r1', orbit:'o1', bus:'b1', power:'p1', comms:'c2', inst:null, engine:'e1'};
const LIMIT = {budget:180, time:12};
const optOf=(cat,id)=>PARTS[cat].opts.find(o=>o.id===id);
const opt=(cat)=>optOf(cat,pick[cat]);
function totals(){
  let mass=0,cost=0,time=0,pw=0,gen=0,data=0,down=0,store=0,cap=300,link=1;
  for(const c in PARTS){const o=opt(c); if(!o) continue; mass+=o.mass||0; cost+=o.cost||0; time=Math.max(time,o.time||0); pw+=o.pw||0; gen+=o.gen||0; data+=o.data||0; down+=o.down||0; store+=o.store||0; if(o.cap) cap=o.cap; if(o.link) link=o.link;}
  down*=link;
  return {M:[
    {k:'mass',icon:'mass',label:'Mass',val:`${mass} kg`,r:mass/cap,hint:`Too heavy for ${opt('rocket').name} (${cap} kg). Pick a bigger rocket or lighter parts.`},
    {k:'budget',icon:'coin',label:'Budget',val:`$${cost}M`,r:cost/LIMIT.budget,hint:`Over the $${LIMIT.budget}M budget. Swap a part for a cheaper one.`},
    {k:'power',icon:'bolt',label:'Power',val:`${pw}/${gen} W`,r:gen?pw/gen:2,hint:`Parts draw more power than the panels make. Fit bigger solar wings.`},
    {k:'data',icon:'data',label:'Data',val:`${data}/${store} Gb`,r:store?data/store:0,hint:`The instrument fills storage too fast. Use a bigger bus.`},
    {k:'comms',icon:'comms',label:'Comms',val:`${Math.round(down)} Gb/d`,r:data?data/Math.max(down,1):0,hint:`The radio can't send all the data home. Pick a faster radio.`},
    {k:'time',icon:'time',label:'Time',val:`${time} mo`,r:time/LIMIT.time,hint:`Building takes longer than the ${LIMIT.time}-month deadline.`}]};
}
function fx(o){const a=[]; if(o.mass) a.push(['+'+o.mass+' kg','up']); if(o.cost) a.push([(o.cost>0?'+$':'-$')+Math.abs(o.cost)+'M',o.cost>0?'up':'good']); if(o.pw) a.push(['+'+o.pw+' W use','up']); if(o.gen) a.push([o.gen+' W','good']); if(o.data) a.push([o.data+' Gb/d','']); if(o.down) a.push([o.down+' Gb/d link','good']); if(o.cap) a.push(['lifts '+o.cap+' kg','good']); if(o.store) a.push([o.store+' Gb store','good']); if(o.time) a.push([o.time+' mo','']); if(o.note) a.push([o.note,'']); return a.map(x=>`<span class="${x[1]}">${x[0]}</span>`).join('')}

/* ================= HUD / callout / dock ================= */
const ic=(n)=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const resEl=document.getElementById('res'); let lastVals={};
function renderHUD(){const {M}=totals(); resEl.innerHTML=M.map(m=>{const st=m.r>1?'bad':m.r>.85?'warn':''; return `<div class="metric ${st} ${lastVals[m.k]&&lastVals[m.k]!==m.val?'bump':''}" title="${m.label}"><span class="ic">${ic(m.icon)}</span>${m.val}<span class="mb"><i style="width:${Math.min(m.r,1)*100}%"></i></span></div>`}).join(''); M.forEach(m=>lastVals[m.k]=m.val);}
const calloutEl=document.getElementById('callout'); let step=0;
const STEPS=[['Step 1/3','Walk into the glowing spacecraft workshop.'],['Step 2/3','Find the Instrument row and pick one. Heavier means less fuel. Keep bars green!'],['Step 3/3','Head out to the launch pad and launch.'],['Done','Now design your own. Try other parts and beat your score.']];
function setStep(n){step=n;const s=STEPS[n];calloutEl.style.animation='none';void calloutEl.offsetWidth;calloutEl.style.animation='';calloutEl.innerHTML=`<b>${s[0]}</b><span>${s[1]}</span><button class="skip" type="button" id="skip">Skip</button>`;document.getElementById('skip').onclick=()=>{calloutEl.style.display='none'};}
const dockEl=document.getElementById('dock'); let launched=false;
function renderDock(){const T=[['planet','Missions',''],['wrench','Rocket','rocket'],['sat','Spacecraft','craft'],['rocket','Launch pad','pad'],['console','Control',launched?'control':'lock']];
  dockEl.innerHTML=T.map(t=>`<button class="tile ${t[2]==='lock'?'lock':''} ${(where===t[2]||openZone===t[2])?'on':''}" type="button" data-z="${t[2]}">${t[2]==='control'&&launched?'<span class="new">NEW</span>':''}${ic(t[2]==='lock'?'lock':t[0])}${t[1]}</button>`).join('');}
dockEl.addEventListener('click',e=>{const b=e.target.closest('.tile');if(!b)return;const z=b.dataset.z;if(!z||z==='lock')return;
  if(where!=='base'){ if(z===where) return; exitRoom(()=>walkTo(z)); } else walkTo(z);});

/* ================= Renderer, camera ================= */
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5)); renderer.setClearColor(0,0);
const scene=new THREE.Scene();
const cam=new THREE.OrthographicCamera(-1,1,1,-1,-300,500);
scene.add(new THREE.HemisphereLight(0xFBFAF4,0x6E6457,.9)); const sun=new THREE.DirectionalLight(0xffffff,.9); sun.position.set(-20,40,14); scene.add(sun);
const ISO=new THREE.Vector3(1,0.82,1).normalize();
let camZoom=1, camZoomGoal=1;

/* ================= Comet surface shader ================= */
const V=`varying vec3 vN; varying vec3 vW; void main(){ vN=normalize(mat3(modelMatrix)*normal); vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`;
const F=`uniform vec3 c0; uniform vec3 c1; uniform vec3 c2; uniform vec3 c3; uniform vec3 ax; uniform float fq; uniform float fade; uniform float glow;
varying vec3 vN; varying vec3 vW;
float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
void main(){
  float t=dot(vW,normalize(ax))*fq + .35*sin(vW.x*.7+sin(vW.z*.9))*cos(vW.z*.6);
  float b=fract(t);
  vec3 col = b<.35?c0 : b<.55?mix(c0,c1,smoothstep(.35,.42,b)) : b<.78?mix(c1,c2,smoothstep(.55,.63,b)) : mix(c2,c0,smoothstep(.78,1.,b));
  vec3 L=normalize(vec3(-.5,1.,.35)); float d=dot(normalize(vN),L);
  vec3 c = mix(c3, col, smoothstep(-.4,.9,d)*.85+.15);
  c += (h(gl_FragCoord.xy)-.5)*.10;
  c = mix(c, col*1.25, glow);
  float f = (1.0 - smoothstep(-9.0, -1.5, vW.y))*fade;
  c = mix(c, vec3(.984,.980,.957), f);
  gl_FragColor=vec4(c,1.);
}`;
const hex=(x)=>new THREE.Color(x); const MC={};
function mat(name,cols,ax=[1,0,.3],fq=.35,fade=1,glow=0){ if(MC[name]) return MC[name];
  return MC[name]=new THREE.ShaderMaterial({vertexShader:V,fragmentShader:F,side:THREE.DoubleSide,uniforms:{c0:{value:hex(cols[0])},c1:{value:hex(cols[1])},c2:{value:hex(cols[2])},c3:{value:hex(cols[3])},ax:{value:new THREE.Vector3(...ax)},fq:{value:fq},fade:{value:fade},glow:{value:glow}}});}
const STONE=mat('stone',['#D7D0C0','#B9B0A0','#E8E2D4','#6E6457'],[1,0,.4],.28);
const FLOOR=mat('floor',['#E8E2D4','#D7D0C0','#F3EEE4','#8A8174'],[1,0,1],.12,0);
const WALL =mat('wall', ['#F3EEE4','#E8D9B8','#D7D0C0','#9B7751'],[0,1,.2],.18,0);
const DARK =mat('dark', ['#3A2E3E','#2A1E3A','#4A3A44','#120C1E'],[0,1,.2],.5);

/* ================= NASA model loading ================= */
const loader=new THREE.GLTFLoader(); const MODELS={};
const MODEL_FILES=['kit-body-1','kit-body-2','kit-body-3','kit-wings-1','kit-wings-2','kit-wings-3','kit-radio-1','kit-radio-2','kit-radio-3','infrared-camera','landsat-8','rocket-jupiter-c','rocket-atlas','rocket-saturn-v'];
// Bake every mesh into one geometry (one draw call per model), drop NASA textures/logos, keep shape only.
// Original NASA colours, minus markings: each texture is replaced by its dominant colour (this removes all
// lettering such as "USA"/"UNITED STATES"); meshes are merged per material to keep draw calls low.
function dominant(img){ try{ const c=document.createElement('canvas'); c.width=c.height=24; const g=c.getContext('2d'); g.drawImage(img,0,0,24,24);
  const d=g.getImageData(0,0,24,24).data, n={}; let best=null,bc=0; for(let i=0;i<d.length;i+=4){ const k=(d[i]>>4)+','+(d[i+1]>>4)+','+(d[i+2]>>4); n[k]=(n[k]||0)+1; if(n[k]>bc){bc=n[k];best=[d[i],d[i+1],d[i+2]];} }
  return new THREE.Color(best[0]/255,best[1]/255,best[2]/255); }catch(e){ return new THREE.Color(1,1,1); } }
function bake(gltf){ gltf.scene.updateMatrixWorld(true); const all=[], byMat=new Map(); const v=new THREE.Vector3();
  gltf.scene.traverse(o=>{ if(!o.isMesh||!o.geometry) return; const g=o.geometry, P=g.getAttribute('position'), I=g.index; const arr=[];
    const n=I?I.count:P.count; for(let i=0;i<n;i++){ const k=I?I.getX(i):i; v.fromBufferAttribute(P,k).applyMatrix4(o.matrixWorld); arr.push(v.x,v.y,v.z); }
    all.push(...arr); const m=Array.isArray(o.material)?o.material[0]:o.material; if(!byMat.has(m)) byMat.set(m,[]); byMat.get(m).push(...arr); });
  const geo=a=>{const out=new THREE.BufferGeometry(); out.setAttribute('position',new THREE.Float32BufferAttribute(a,3)); out.computeVertexNormals(); return out;};
  const parts=[...byMat].map(([m,a])=>{ const col=(m&&m.color?m.color.clone():new THREE.Color(1,1,1)); if(m&&m.map&&m.map.image) col.multiply(dominant(m.map.image));
    return {geo:geo(a), mat:new THREE.MeshStandardMaterial({color:col, roughness:.55, metalness:Math.min(m&&m.metalness||0,.35), side:THREE.DoubleSide})}; });
  return {merged:geo(all), parts}; }
// Models ship as base64 text (models/<name>.txt) because the page host serves no .glb type; decode and parse in memory.
function b64ToBuf(s){ const bin=atob(s.trim()); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u.buffer; }
function loadAll(){ return Promise.all(MODEL_FILES.map(n=>fetch(`models/${n}.txt`).then(r=>{ if(!r.ok) throw 0; return r.text(); })
  .then(t=>new Promise(res=>loader.parse(b64ToBuf(t),'',g=>{MODELS[n]=bake(g);res();},()=>{console.warn('model failed',n);res();})))
  .catch(()=>console.warn('model failed',n)))); }
// Make an object from a model, scaled so its largest side (or height for rockets) = size, sitting on y=0.
// material = a palette material, or null for the original NASA colours.
function fromModel(name,material,size,{upright=false}={}){
  const M=MODELS[name]; const grp=new THREE.Group(); if(!M) return grp;
  const holder=new THREE.Group(); if(material) holder.add(new THREE.Mesh(M.merged,material)); else for(const p of M.parts) holder.add(new THREE.Mesh(p.geo,p.mat));
  M.merged.computeBoundingBox(); const s=new THREE.Vector3(); M.merged.boundingBox.getSize(s);
  if(upright){ if(s.z>s.y&&s.z>=s.x) holder.rotation.x=-Math.PI/2; else if(s.x>s.y&&s.x>s.z) holder.rotation.z=Math.PI/2; }
  const inner=new THREE.Group(); inner.add(holder); inner.updateMatrixWorld(true);
  const bb=new THREE.Box3().setFromObject(inner); bb.getSize(s); const k=size/(upright?s.y:Math.max(s.x,s.y,s.z));
  inner.scale.setScalar(k); inner.updateMatrixWorld(true); const bb2=new THREE.Box3().setFromObject(inner); const c=new THREE.Vector3(); bb2.getCenter(c);
  inner.position.set(-c.x,-bb2.min.y,-c.z); grp.add(inner); return grp; }
// Procedural stand-ins (NASA publishes no separate model for these parts)
function procPart(kind){ const g=new THREE.Group();
  const lathe=(pts,m)=>{const me=new THREE.Mesh(new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),32),m);g.add(me);return me;};
  if(kind==='scope'){ const t=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,1.1,24),CREAM);t.rotation.z=Math.PI/2;t.position.y=.6;g.add(t); const l=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.06,24),TEAL);l.rotation.z=Math.PI/2;l.position.set(.56,.6,0);g.add(l); const bse=new THREE.Mesh(new THREE.BoxGeometry(.8,.25,.6),RUST);bse.position.y=.12;g.add(bse);}
  if(kind==='scope2'){ const b=new THREE.Mesh(new THREE.BoxGeometry(1.1,.9,.9),CREAM);b.position.y=.55;g.add(b); for(let i=0;i<3;i++){const l=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,.3,18),TEAL);l.rotation.z=Math.PI/2;l.position.set(.68,.35+i*.22,0);g.add(l);} const f=new THREE.Mesh(new THREE.BoxGeometry(1.2,.12,1),RUST);f.position.y=.06;g.add(f);}
  if(kind==='nozzle-s'){ lathe([[0,0],[.18,0],[.12,.35],[.22,.7],[0,.7]],GOLD); }
  if(kind==='nozzle-m'){ lathe([[0,1.2],[.25,1.2],[.25,.9],[.12,.75],[.45,0],[.4,0],[.1,.7],[0,.7]],GOLD); const t=new THREE.Mesh(new THREE.SphereGeometry(.3,20,14),CREAM);t.position.y=1.45;g.add(t);}
  if(kind==='ion'){ const c=new THREE.Mesh(new THREE.CylinderGeometry(.5,.55,.6,32),DARK);c.position.y=.3;g.add(c); const grid=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.04,32),GLOWA);grid.position.y=.62;g.add(grid);}
  if(kind==='orbit'){ const e=new THREE.Mesh(new THREE.SphereGeometry(.45,24,16),TEAL);e.position.y=1;g.add(e); const o=new THREE.Mesh(new THREE.TorusGeometry(.85,.03,8,64),GLOWA);o.position.y=1;o.rotation.x=1.2;g.add(o);}
  return g; }
const PART_MAT={bus:CREAM,power:TEAL,comms:RUST,inst:CREAM,engine:GOLD,rocket:CREAM};
function partObject(cat,o,size){ return o.model? fromModel(o.model,null,size,{upright:cat==='rocket'}) : (()=>{const p=procPart(o.proc);p.scale.setScalar(size/1.4);return p;})(); }

  box(.15,2,2.4,DARK,12.25,1,0,false); cyl(.45,.45,1.6,TEAL,17.6,.8,3.2);

  cyl(3.2,3.4,.4,DARK,0,.2,-16,40); cyl(2.6,2.6,.06,GLOWA,0,.43,-16,40); cyl(2.3,2.3,.08,STONE,0,.47,-16,40);

function buildHall(A,x0,z0,x1,z1,title){
  const w=x1-x0,d=z1-z0; box(w,.6,d,FLOOR,(x0+x1)/2,-.3,(z0+z1)/2);
  for(let x=x0;x<=x1;x+=2){ const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,.01,z0),new THREE.Vector3(x,.01,z1)]),new THREE.LineBasicMaterial({color:0xD7D0C0})); root.add(l); }
  for(let z=z0;z<=z1;z+=2){ const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x0,.01,z),new THREE.Vector3(x1,.01,z)]),new THREE.LineBasicMaterial({color:0xD7D0C0})); root.add(l); }
  box(w,5,.4,WALL,(x0+x1)/2,2.5,z0-.2); box(.4,5,d,WALL,x0-.2,2.5,(z0+z1)/2);
  box(w,.35,.5,RUST,(x0+x1)/2,5.1,z0-.2); box(.5,.35,d,RUST,x0-.2,5.1,(z0+z1)/2);
  // round windows with stars on the back wall

}

const shadow=new THREE.Mesh(new THREE.CircleGeometry(.55,24),new THREE.MeshBasicMaterial({color:0x1A1206,transparent:true,opacity:.18,depthWrite:false})); shadow.rotation.x=-Math.PI/2; shadow.position.y=.02; hero.add(shadow);

/* ================= Movement & routing ================= */
const keys={}; addEventListener('keydown',e=>{const k=e.key.toLowerCase(); keys[k]=true; if(k==='e') interact(); if(e.key==='Escape'){ if(openZone) closeWin(); }});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
let joyV={x:0,y:0}; const joy=document.getElementById('joy'), knob=joy.querySelector('i');
joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);moveJoy(e)}); joy.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')moveJoy(e)});
joy.addEventListener('pointerup',()=>{joyV={x:0,y:0};knob.style.transform=''});
function moveJoy(e){const r=joy.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}joyV={x,y};knob.style.transform=`translate(${x*34}px,${y*34}px)`}
const A=()=>AREAS[where];
const onWalk=(x,z)=>A().walk.some(([x0,z0,x1,z1])=>x>x0+.35&&x<x1-.35&&z>z0+.35&&z<z1-.35);
const blocked=(x,z)=>A().block.some(([x0,z0,x1,z1])=>x>x0&&x<x1&&z>z0&&z<z1);
let autoTarget=null, queue=[];
const deckOf=(x,z)=>(A().decks||A().walk).findIndex(([x0,z0,x1,z1])=>x>=x0&&x<=x1&&z>=z0&&z<=z1);
function route(p){ const h=hero.position;
  if(where!=='base'||deckOf(h.x,h.z)===deckOf(p.x,p.z)) queue=[p];
  else queue=[new THREE.Vector3(Math.abs(h.x)>5?Math.sign(h.x)*4:0,0,Math.abs(h.z)>5?Math.sign(h.z)*4:0),new THREE.Vector3(0,0,0),new THREE.Vector3(Math.abs(p.x)>5?Math.sign(p.x)*4:0,0,Math.abs(p.z)>5?Math.sign(p.z)*4:0),p];
  autoTarget=queue.shift(); }
function walkTo(id){ closeWin(); const s=AREAS.base.spots.find(s=>s.id===id); if(s) route(s.pos.clone()); }
canvas.addEventListener('click',e=>{ if(transitioning) return; const r=canvas.getBoundingClientRect(); const ndc=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  const ray=new THREE.Raycaster(); ray.setFromCamera(ndc,cam); const p=new THREE.Vector3(); if(ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),p)){
    // tap a spot (door, pedestal) → walk to it; otherwise walk to the floor point
    const s=A().spots.find(s=>s.ring.position.distanceTo(new THREE.Vector3(p.x,.05,p.z))<1.6); if(s) route(s.pos.clone()); else if(onWalk(p.x,p.z)&&!blocked(p.x,p.z)) route(p); }});

/* ================= Interaction ================= */
const enterEl=document.getElementById('enter'), winEl=document.getElementById('win'), infoEl=document.getElementById('info');
let near=null, openZone=null;
enterEl.onclick=()=>interact();
function interact(){ if(!near||transitioning) return; if(near.kind==='part') choose(near); else if(near.act) near.act(); }
function choose(s){ pick[s.cat]=s.id; renderHUD(); refreshBuildBay(); if(s.cat==='rocket') refreshPadRocket(); showInfo(s,true); if(s.cat==='inst'&&step===1) setStep(2); }
function showInfo(s,force){ if(!s||s.kind!=='part'){ infoEl.classList.remove('show'); infoEl.dataset.id=''; return; }
  if(!force&&infoEl.dataset.id===s.id) return; infoEl.dataset.id=s.id; const on=pick[s.cat]===s.id;
  infoEl.innerHTML=`<div class="row"><div><div class="cat">${PARTS[s.cat].label.toUpperCase()}</div><h4>${s.o.name}</h4><div class="src">${s.o.model?'Model: '+s.o.src:'Model: Horizons stand-in'}</div></div>
    <button class="t-btn ${on?'':'primary'}" type="button" id="pickbtn">${on?'Picked ✓':'Pick'} <kbd style="font:400 10px var(--f-num);border:2px solid var(--ink);border-radius:5px;padding:0 4px;margin-left:4px;background:#fff">E</kbd></button></div><div class="fx">${fx(s.o)}</div>`;
  infoEl.classList.add('show'); document.getElementById('pickbtn').onclick=()=>choose(s); }

/* ================= Windows (pad / control) ================= */
function openWin(z){ if(z==='control'&&!launched){ toastMsg('Locked until launch'); return; } openZone=z; autoTarget=null; enterEl.style.display='none'; renderWin(); renderDock(); }
function closeWin(){ openZone=null; winEl.classList.remove('open'); renderDock(); }
function renderWin(){ const z=openZone; if(!z) return; let body='',foot='';
  if(z==='pad'){ const {M}=totals(); const bad=M.filter(m=>m.r>1); const missing=Object.keys(PARTS).filter(c=>!pick[c]);
    body=`<ul class="check">${M.map(m=>`<li class="${m.r>1?'bad':''}"><i></i>${m.label}<small>${m.val}</small></li>`).join('')}</ul>`+(missing.length?`<div class="hint">Missing: ${missing.map(c=>PARTS[c].label).join(', ')}. Visit the spacecraft workshop.</div>`:bad.length?`<div class="hint">${bad[0].hint}</div>`:'');
    foot=`<button class="t-btn primary" type="button" id="launch" ${bad.length||missing.length||launched?'disabled':''}>${launched?'Launched':'Launch on '+opt('rocket').name}</button>`; }
  else { body=`<div class="hint" style="background:rgba(76,195,138,.2)">Your spacecraft is on its way. The full mission control console comes next.</div>`; foot=`<button class="t-btn ghost" type="button" data-close>Close</button>`; }
  winEl.innerHTML=`<div class="w-head"><span class="t-ribbon">${z==='pad'?'Launch pad':'Mission control'}</span><h3>${z==='pad'?'Pre-launch check':'Mission control'}</h3><p>${z==='pad'?'All bars must be green to launch.':''}</p><button class="t-round x" type="button" data-close aria-label="Close">${ic('x')}</button></div><div class="w-body">${body}</div><div class="w-foot">${foot}</div>`;
  winEl.classList.add('open'); const L=document.getElementById('launch'); if(L) L.onclick=doLaunch; }
winEl.addEventListener('click',e=>{ if(e.target.closest('[data-close]')) closeWin(); });
function toastMsg(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='none';void el.offsetWidth;el.style.display='block';clearTimeout(toastMsg.t);toastMsg.t=setTimeout(()=>el.style.display='none',1600);}
let launchT=-1; function doLaunch(){ launched=true; closeWin(); launchT=0; toastMsg('Liftoff!'); setStep(3); renderDock(); }

/* ================= Room transitions: camera pushes into the door, cream wipe, swap ================= */
const wipe=document.getElementById('wipe'), roomName=document.getElementById('roomname');
let transitioning=false; const camFocus=new THREE.Vector3(0,0,2), focusGoal=new THREE.Vector3();
function swapTo(name,spawn){ for(const k in AREAS) AREAS[k].group.visible=(k===name); where=name; hero.position.copy(spawn); camFocus.copy(spawn); near=null; showInfo(null);
  roomName.style.display=name==='base'?'none':'block'; roomName.querySelector('.t-ribbon').textContent=name==='craft'?'Spacecraft workshop':name==='rocket'?'Rocket workshop':''; renderDock(); }
function transition(doorPos,then){ transitioning=true; autoTarget=null; queue=[]; closeWin(); enterEl.style.display='none';
  focusGoal.copy(doorPos); camZoomGoal=reduce?1:3.2;                     // 1) pan + zoom into the door
  setTimeout(()=>{ wipe.classList.add('on');                            // 2) cream iris closes
    setTimeout(()=>{ then(); camZoom=2.2; camZoomGoal=1;                // 3) swap scene, zoom back out
      wipe.classList.remove('on'); setTimeout(()=>{transitioning=false;},450); },470); }, reduce?0:550); }
function enterRoom(name){ const door=AREAS.base.spots.find(s=>s.id===name).pos; transition(door,()=>{ swapTo(name,AREAS[name].spawn.clone()); if(name==='craft'&&step===0) setStep(1); }); }
function exitRoom(after){ const from=where; transition(A().spots.find(s=>s.id==='exit').pos,()=>{ swapTo('base',AREAS.base.spawn[from].clone()); if(after) setTimeout(after,500); }); }

/* ================= Stars ================= */
const skyC=document.getElementById('sky'); let SK=null;
function initSky(){const r=skyC.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.5);skyC.width=r.width*d;skyC.height=r.height*d;const x=skyC.getContext('2d');x.setTransform(d,0,0,d,0,0);
  let s=5;const R=()=>(s=(s*16807)%2147483647)/2147483647;const st=[];for(let k=0;k<380;k++){const px=r.width*(1-Math.pow(R(),1.4)*.55),py=r.height*Math.pow(R(),1.5)*.7,dx=(r.width-px)/(r.width*.55),dy=py/(r.height*.7);if(dx*dx+dy*dy>.75)continue;st.push({x:px,y:py,s:R()<.06?1.8:R()*.9+.3,p:R()*6})}SK={x,w:r.width,h:r.height,st}}
function drawSky(t){const {x}=SK;x.clearRect(0,0,SK.w,SK.h);for(const s of SK.st){x.globalAlpha=reduce?.85:.4+.6*Math.abs(Math.sin(t/1300+s.p));x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.s,0,7);x.fill()}}

/* ================= Loop ================= */
let VIEW=15;
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);VIEW=w<760?17:15;initSky();}
addEventListener('resize',resize); resize();
const tmp=new THREE.Vector3(), FWD=new THREE.Vector3(-1,0,-1).normalize(), RIGHT=new THREE.Vector3(1,0,-1).normalize();
let last=performance.now(), walkPhase=0, running=true;
document.addEventListener('visibilitychange',()=>{running=!document.hidden; if(running){last=performance.now(); requestAnimationFrame(tick);}});
function tick(now){
  if(!running) return; const dt=Math.min((now-last)/1000,.05); last=now; const t=now/1000;
  // input
  let ix=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0)+joyV.x, iy=(keys['w']||keys['arrowup']?1:0)-(keys['s']||keys['arrowdown']?1:0)-joyV.y;
  let dir=new THREE.Vector3().addScaledVector(RIGHT,ix).addScaledVector(FWD,iy);
  if(dir.lengthSq()>0.01){autoTarget=null;queue=[];} else if(autoTarget){dir.subVectors(autoTarget,hero.position).setY(0); if(dir.length()<.25){autoTarget=queue.shift()||null;dir.set(0,0,0);}}
  const moving=dir.lengthSq()>0.01&&!openZone&&!transitioning;
  if(moving){dir.normalize(); const sp=7*dt; const h=hero.position, nx=h.x+dir.x*sp, nz=h.z+dir.z*sp;
    const ok=(x,z)=>onWalk(x,z)&&!blocked(x,z); let moved=false;
    for(const a of [0,.6,-.6,1.2,-1.2,1.57,-1.57]){ if(a&&!autoTarget) break; const c=Math.cos(a),s=Math.sin(a); const dx=dir.x*c-dir.z*s, dz=dir.x*s+dir.z*c; const tx=h.x+dx*sp, tz=h.z+dz*sp; if(ok(tx,tz)){h.x=tx;h.z=tz;moved=true;break;} }
    if(!moved){ if(ok(nx,h.z)) h.x=nx; else if(ok(h.x,nz)) h.z=nz; else {autoTarget=null;queue=[];} }
    const ang=Math.atan2(dir.x,dir.z); let da=ang-hero.rotation.y; da=Math.atan2(Math.sin(da),Math.cos(da)); hero.rotation.y+=da*Math.min(1,dt*12); walkPhase+=dt*12;}
  const sw=moving&&!reduce?Math.sin(walkPhase):0; legs[0].position.z=sw*.16; legs[1].position.z=-sw*.16; const bob=Math.abs(sw)*.06; body.position.y=.95+bob; head.position.y=1.72+bob; visor.position.y=1.74+bob;
  // spots
  near=null; let best=99; const hp=tmp.set(hero.position.x,0,hero.position.z);
  for(const s of A().spots){ const c=new THREE.Vector3(s.ring.position.x,0,s.ring.position.z); const d=Math.min(s.pos.distanceTo(hp), c.distanceTo(hp)-(s.kind==='part'?1.0:0)); if(d<2.2&&d<best){best=d;near=s;} }
  for(const s of A().spots){ const goal=(step===0&&s.id==='craft')||(step===1&&s.cat==='inst')||(step===2&&(s.id==='pad'||s.id==='exit'));
    const chosen=s.kind==='part'&&pick[s.cat]===s.id; const target=s===near?.95:chosen?.75:goal?(.45+.4*Math.sin(t*4)):0; s.ring.material.opacity+=(target-s.ring.material.opacity)*.15; }
  if(near&&!openZone&&!transitioning){ if(near.kind==='part'){ enterEl.style.display='none'; showInfo(near); }
    else { showInfo(null); const p=near.pos.clone().setY(3.2).project(cam); enterEl.style.display='block'; enterEl.style.left=((p.x+1)/2*innerWidth)+'px'; enterEl.style.top=((1-p.y)/2*innerHeight)+'px';
      const lb=near.id==='control'&&!launched?'Locked':near.label; if(enterEl.dataset.l!==lb){enterEl.dataset.l=lb; enterEl.innerHTML=lb+'<kbd>E</kbd>';} } }
  else { if(!openZone) enterEl.style.display='none'; if(!near) showInfo(null); }
  if(lockSprite) lockSprite.visible=!launched;
  for(const e of exhibits){ if(!e.rocket&&!reduce) e.obj.rotation.y+=dt*.5; }
  if(buildBay&&!reduce) buildBay.rotation.y+=dt*.4;
  // launch
  if(launchT>=0&&padRocket){launchT+=dt; const k=Math.max(0,launchT-.6); padRocket.position.y=.5+k*k*6; flame.material.opacity=Math.min(1,launchT*2)*(.7+.3*Math.sin(t*40)); if(padRocket.position.y>90){launchT=-1;padRocket.visible=false;}}
  // camera
  if(!transitioning) focusGoal.set(hero.position.x,0,hero.position.z);
  camFocus.lerp(focusGoal,1-Math.pow(transitioning?.002:.02,dt));
  camZoom+=(camZoomGoal-camZoom)*(1-Math.pow(.004,dt));
  const a=innerWidth/innerHeight, v=VIEW/camZoom; cam.left=-v*a;cam.right=v*a;cam.top=v;cam.bottom=-v;cam.updateProjectionMatrix();
  cam.position.copy(camFocus).addScaledVector(ISO,80); cam.lookAt(camFocus);
  drawSky(now); renderer.render(scene,cam); requestAnimationFrame(tick);
}

/* ================= Boot ================= */
renderHUD(); setStep(0);
loadAll().then(()=>{ buildBase(); buildCraftRoom(); buildRocketRoom(); root=scene;
  refreshPadRocket(); refreshBuildBay(); swapTo('base',AREAS.base.spawn.start.clone());
  document.getElementById('loading').style.display='none'; requestAnimationFrame(tick); });
</script>
