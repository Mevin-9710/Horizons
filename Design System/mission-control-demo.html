/* Layout: full-screen console on the cream page with the starry corner.
   Header (back, ribbon, status, clock, speed) → phase timeline → [orbit view | telemetry stack] → event log. Report window pops at the end. Tactile + glass. */
:root{
  color-scheme: light;
  --cream:#FBFAF4; --ink:#1A1206; --muted:#6E6457; --line:rgba(26,18,6,.12);
  --amber:#F2A541; --amber-d:#C27F22; --ember:#C2643A; --ember-d:#8E4322; --teal:#2C5B65; --crimson:#A73B42;
  --ok:#4CC38A; --warn:#F2B33D; --bad:#E5484D; --bad-d:#A3262A; --glass:rgba(255,255,255,.42);
  --f-display:'Game Paused','Silkscreen',monospace; --f-num:'Silkscreen',monospace; --f-ui:'Geist',system-ui,sans-serif; --f-mono:'Geist Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--cream);color:var(--ink);font-family:var(--f-ui)}
.night{position:fixed;inset:0;pointer-events:none;background:radial-gradient(55% 70% at 100% 0%, #08070F 0%, #120C1E 26%, #2A1E3A 42%, rgba(194,100,58,.26) 56%, rgba(242,165,65,.09) 64%, rgba(251,250,244,0) 74%)}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.app{position:relative;min-height:100%;padding:14px max(14px,env(safe-area-inset-right,0px)) 18px max(14px,env(safe-area-inset-left,0px));display:grid;gap:14px;grid-template-rows:auto auto 1fr auto;max-width:1400px;margin:0 auto}
/* tactile kit */
.t-win{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink)}
.t-btn{border:3px solid var(--ink);border-radius:14px;padding:9px 18px 11px;font:400 17px var(--f-display);cursor:pointer;color:var(--ink);background:var(--c,var(--glass));backdrop-filter:blur(18px);box-shadow:inset 0 -4px 0 var(--cd,rgba(26,18,6,.08)),0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.t-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.t-btn.primary{--c:var(--amber);--cd:var(--amber-d)}
.t-btn.ghost{font:700 13.5px var(--f-ui)}
.t-btn.on{--c:var(--ink);color:var(--cream);--cd:#000}
.t-round{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--glass);backdrop-filter:blur(18px);box-shadow:inset 0 -4px 0 rgba(26,18,6,.08),0 4px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--ink);flex:none}
.t-round svg{width:20px;height:20px}
.t-ribbon{display:inline-block;background:var(--ember);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:5px 16px 7px;font:400 17px var(--f-display);white-space:nowrap;box-shadow:inset 0 -4px 0 var(--ember-d),0 4px 0 var(--ink);text-shadow:0 2px 0 rgba(26,18,6,.3)}
.t-btn:focus-visible,.t-round:focus-visible{outline:3px solid var(--ember);outline-offset:3px}
.label{font:400 10px var(--f-num);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
@keyframes tpop{0%{transform:scale(.85) translateY(14px);opacity:0}}
/* header */
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header .grow{flex:1}
.status{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);background:var(--glass);font:400 12px var(--f-num)}
.status i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:var(--ok)}
.status.warn i{background:var(--warn)} .status.bad i{background:var(--bad)}
.clock{font:400 20px var(--f-num);font-variant-numeric:tabular-nums;padding:6px 12px;border-radius:12px;border:2.5px solid var(--ink);background:rgba(26,18,6,.9);color:var(--amber);box-shadow:0 3px 0 var(--ink)}
.speed{display:flex;gap:6px}
.speed .t-btn{padding:6px 10px 8px;font-size:13px}
/* timeline */
.timeline{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.phases{display:grid;grid-template-columns:1.1fr 1.2fr 1.1fr repeat(4,1fr);gap:6px}
.ph{position:relative;border:2.5px solid var(--ink);border-radius:12px;background:rgba(255,255,255,.45);padding:7px 9px 9px;min-width:0;overflow:hidden}
.ph b{display:block;font:700 12px var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.ph span{font:400 9.5px var(--f-num);color:var(--muted);position:relative}
.ph .fill{position:absolute;inset:0;width:0;background:rgba(242,165,65,.45);transition:width .2s linear}
.ph.done .fill{width:100%!important;background:rgba(76,195,138,.32)}
.ph.now{box-shadow:0 4px 0 var(--ink);transform:translateY(-2px)}
.ph .ev{position:absolute;top:4px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:1.5px solid var(--ink)}
/* main */
main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;min-height:0}
.orbit{position:relative;min-height:340px;overflow:hidden}
.orbit canvas{position:absolute;inset:0;width:100%;height:100%}
.orbit .cap{position:absolute;left:14px;top:12px;display:flex;flex-direction:column;gap:4px}
.orbit .cap h2{margin:0;font:400 22px var(--f-display)}
.orbit .sci{position:absolute;right:14px;bottom:12px;text-align:right}
.orbit .sci b{display:block;font:400 34px var(--f-num);font-variant-numeric:tabular-nums;line-height:1}
.tele{display:grid;grid-template-rows:repeat(3,1fr);gap:10px}
.chart{padding:10px 12px;display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;align-items:center;min-height:104px}
.chart .v b{display:block;font:400 26px var(--f-num);font-variant-numeric:tabular-nums;line-height:1.1}
.chart .v small{font:600 11.5px var(--f-ui);color:var(--muted)}
.chart .v .pill{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font:700 10.5px var(--f-ui);padding:2px 8px;border-radius:999px;border:2px solid var(--ink);background:rgba(76,195,138,.3)}
.chart .v .pill.warn{background:rgba(242,179,61,.4)} .chart .v .pill.bad{background:rgba(229,72,77,.3)}
.chart svg{width:100%;height:84px;display:block;overflow:visible}
.chart .plot{position:relative;min-width:0}
.tip{position:absolute;pointer-events:none;font:400 10.5px var(--f-num);background:var(--ink);color:var(--cream);padding:4px 7px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-120%);opacity:0;transition:opacity .1s}
/* log */
.log{padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-height:0}
.log .head{display:flex;justify-content:space-between;align-items:center}
.entries{display:flex;flex-direction:column;gap:8px;max-height:230px;overflow:auto}
.entry{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:center;border:2.5px solid var(--ink);border-radius:14px;background:rgba(255,255,255,.45);padding:8px 10px;animation:tpop .45s cubic-bezier(.34,1.56,.64,1) both}
.entry .t{font:400 11px var(--f-num);color:var(--muted);font-variant-numeric:tabular-nums}
.entry .ico{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;background:var(--c,#fff)}
.entry .ico svg{width:16px;height:16px}
.entry p{margin:0;font:600 13.5px var(--f-ui);line-height:1.35}
.entry p small{display:block;font:500 12px var(--f-ui);color:var(--muted)}
.entry .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.entry .acts .t-btn{padding:6px 10px 8px;font:700 12px var(--f-ui)}
.entry.need{background:rgba(242,165,65,.32)}
/* report */
.scrim{position:fixed;inset:0;background:rgba(26,18,6,.35);backdrop-filter:blur(3px);display:none;place-items:center;z-index:10;padding:16px}
.scrim.open{display:grid}
.report{width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;animation:tpop .6s cubic-bezier(.34,1.56,.64,1) both}
.report h3{margin:0;font:400 30px var(--f-display)}
.ringwrap{position:relative;width:170px;height:170px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap b{position:absolute;inset:0;display:grid;place-items:center;font:400 46px var(--f-num)}
.ringwrap small{position:absolute;left:0;right:0;bottom:38px;font:400 10px var(--f-num);color:var(--muted)}
.stars{display:flex;gap:6px}.stars svg{width:34px;height:34px}
.breakdown{width:100%;display:flex;flex-direction:column;gap:9px;text-align:left}
.brow{display:grid;grid-template-columns:110px 1fr 64px;gap:10px;align-items:center;font:700 13px var(--f-ui)}
.brow .bar{height:16px;border-radius:10px;border:2.5px solid var(--ink);background:rgba(255,255,255,.6);overflow:hidden}
.brow .bar i{display:block;height:100%;width:0;background:var(--teal);transition:width 1s cubic-bezier(.34,1.56,.64,1)}
.brow .n{font:400 12px var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.notes{width:100%;text-align:left;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font:500 13px var(--f-ui)}
.notes li::before{content:"◆ ";color:var(--ember)}
.report .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
@media (max-width:900px){main{grid-template-columns:1fr}.orbit{min-height:260px}.phases{grid-template-columns:repeat(4,1fr)}.ph b{font-size:11px}}
@media (max-width:520px){.chart{grid-template-columns:96px minmax(0,1fr)}.chart .v b{font-size:20px}.entry{grid-template-columns:auto 1fr}.entry .t{display:none}.entry .acts{grid-column:1/-1}.clock{font-size:16px}.brow{grid-template-columns:86px 1fr 54px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</div></div>

<script>
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* ---------- seeded sim (the real game uses the existing evaluator + seeded simulation) ---------- */
let seed=20261114; const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
const PH=[['Launch',6],['Cruise',8],['Orbit insertion',6],['Ops 1',10],['Ops 2',10],['Ops 3',10],['Ops 4',10]];
const TOTAL=PH.reduce((a,p)=>a+p[1],0);
// events: time (sim seconds), kind, choices
const EVENTS=[
  {t:12, k:'rock', title:'Micrometeoroid hit', body:'Solar wing lost 8% output.', fx:{gen:-8}, auto:true},
  {t:24, k:'aim',  title:'Pointing glitch', body:'Star tracker blinded. Reboot it now or keep imaging?', choice:[['Reboot (lose 1 min of data)',{sci:-3,res:+6}],['Keep imaging (risk blur)',{sci:+2,res:-6}]]},
  {t:38, k:'flare',title:'Solar flare warning', body:'A strong flare arrives in 2 min. Safe mode protects the electronics.', choice:[['Enter safe mode',{sci:-6,res:+10,power:+8}],['Ride it out',{sci:+4,res:-12,power:-14}]]},
  {t:50, k:'fire', title:'Large wildfire detected', body:'Downlink the alert now or wait for the next ground pass?', choice:[['Downlink now (uses power)',{sci:+10,power:-10,dec:+8}],['Wait for next pass',{sci:+3,dec:-4}]]},
];
const S={t:0, speed:1, power:100, data:0, prop:100, gen:100, sci:0, res:10, dec:10, pending:null, hist:{power:[],data:[],prop:[]}, done:false, fired:0};
/* ---------- timeline ---------- */
const phEl=document.getElementById('phases');
let acc=0; const PHS=PH.map(([n,d])=>{const o={n,d,start:acc}; acc+=d; return o;});
phEl.innerHTML=PHS.map((p,i)=>`<div class="ph" id="ph${i}"><div class="fill"></div><b>${p.n}</b><span>${p.d*10}d</span></div>`).join('');
EVENTS.forEach(e=>{const i=PHS.findIndex(p=>e.t>=p.start&&e.t<p.start+p.d); const d=document.createElement('i'); d.className='ev'; d.title=e.title; document.getElementById('ph'+i).appendChild(d);});
/* ---------- charts (single series each; one hue; status pill carries state with a label) ---------- */
const W=400,H=84;
function drawChart(k,max,warn,bad,invert){
  const svg=document.getElementById('c-'+k), h=S.hist[k]; const x=i=>i/(TOTAL*4)*W, y=v=>H-6-(v/max)*(H-12);
  const pts=h.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const th=invert?[[warn,'var(--warn)'],[bad,'var(--bad)']]:[[warn,'var(--warn)'],[bad,'var(--bad)']];
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('preserveAspectRatio','none');
  svg.innerHTML=`<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="rgba(26,18,6,.25)" stroke-width="1"/>`+
    th.map(([v,c])=>`<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="${c}" stroke-width="1.5" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>`).join('')+
    (h.length>1?`<polygon points="0,${y(0)} ${pts} ${x(h.length-1)},${y(0)}" fill="rgba(44,91,101,.12)"/><polyline points="${pts}" fill="none" stroke="#2C5B65" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`+
    `<circle cx="${x(h.length-1)}" cy="${y(h[h.length-1])}" r="4" fill="#2C5B65" stroke="#FBFAF4" stroke-width="2" vector-effect="non-scaling-stroke"/>`:'')+
    `<line class="xh" x1="0" x2="0" y1="0" y2="${H}" stroke="#1A1206" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0"/>`;
}
document.querySelectorAll('.chart').forEach(card=>{ const k=card.dataset.k, plot=card.querySelector('.plot'), tip=card.querySelector('.tip');
  plot.addEventListener('pointermove',e=>{ const h=S.hist[k]; if(h.length<2) return; const r=plot.getBoundingClientRect(); const f=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)); const i=Math.min(h.length-1,Math.round(f*TOTAL*4));
    if(i>=h.length) return; const xh=card.querySelector('.xh'); const px=i/(TOTAL*4)*W; xh.setAttribute('x1',px); xh.setAttribute('x2',px); xh.setAttribute('opacity',.5);
    tip.style.left=(i/(TOTAL*4)*r.width)+'px'; tip.style.top='20px'; tip.textContent=`T+${fmt(i/4)} · ${Math.round(h[i])}%`; tip.style.opacity=1; });
  plot.addEventListener('pointerleave',()=>{tip.style.opacity=0; const xh=card.querySelector('.xh'); if(xh) xh.setAttribute('opacity',0);}); });
function pill(k,v,warn,bad,low){ const el=document.getElementById('p-'+k); const st= low? (v<=bad?'bad':v<=warn?'warn':'') : (v>=bad?'bad':v>=warn?'warn':''); el.className='pill '+st; el.textContent= st==='bad'?'Critical':st==='warn'?'Watch':'OK'; return st; }
/* ---------- orbit view (canvas, Comet-style Earth) ---------- */
const orb=document.getElementById('orb'); let O;
function initOrb(){ const r=orb.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.5); orb.width=r.width*d; orb.height=r.height*d; const x=orb.getContext('2d'); x.setTransform(d,0,0,d,0,0);
  // pre-render grainy banded Earth
  const s=Math.min(r.width,r.height)*.34, e=document.createElement('canvas'); e.width=e.height=s*2; const g=e.getContext('2d');
  g.save(); g.beginPath(); g.arc(s,s,s,0,7); g.clip(); g.translate(s,s); g.rotate(-.5); const bands=['#0B1F24','#2C5B65','#95B3B6','#2C5B65','#1C3E46','#95B3B6','#0B1F24'];
  for(let i=0;i<bands.length;i++){ g.fillStyle=bands[i]; g.beginPath(); const y0=-s+i*(2*s/bands.length); g.moveTo(-s*1.2,y0); for(let xx=-s*1.2;xx<=s*1.2;xx+=6) g.lineTo(xx,y0+Math.sin(xx/s*3+i)*s*.08); g.lineTo(s*1.2,s*1.2); g.lineTo(-s*1.2,s*1.2); g.fill(); }
  g.restore(); const sh=g.createRadialGradient(s*.65,s*.6,s*.2,s,s,s); sh.addColorStop(0,'rgba(0,0,0,0)'); sh.addColorStop(1,'rgba(8,18,20,.75)'); g.fillStyle=sh; g.beginPath(); g.arc(s,s,s,0,7); g.fill();
  const id=g.getImageData(0,0,e.width,e.height); for(let i=0;i<id.data.length;i+=4){ if(id.data[i+3]){ const n=(Math.random()-.5)*28; id.data[i]+=n; id.data[i+1]+=n; id.data[i+2]+=n; } } g.putImageData(id,0,0);
  O={x,w:r.width,h:r.height,earth:e,s}; }
const trail=[];
function drawOrb(){ const {x,w,h,earth,s}=O; x.clearRect(0,0,w,h); const cx=w*.5, cy=h*.56;
  const ph=curPhase(); const a=S.t*.55;
  // orbit path
  const rx=s*1.75, ry=s*.62; x.save(); x.strokeStyle='rgba(26,18,6,.25)'; x.setLineDash([5,6]); x.lineWidth=1.5; x.beginPath(); x.ellipse(cx,cy,rx,ry,-.25,0,7); x.stroke(); x.restore();
  // position: launch/cruise spirals out, then orbit
  let px,py,k=1; if(ph<2){ k=Math.min(1,S.t/(PHS[2].start)); }
  const rr=.35+.65*k; px=cx+Math.cos(a)*rx*rr*Math.cos(-.25)-Math.sin(a)*ry*rr*Math.sin(-.25); py=cy+Math.cos(a)*rx*rr*Math.sin(-.25)+Math.sin(a)*ry*rr*Math.cos(-.25);
  const behind=Math.sin(a)<0;
  const sat=()=>{ trail.push([px,py]); if(trail.length>40) trail.shift(); x.strokeStyle='rgba(194,100,58,.5)'; x.lineWidth=2; x.beginPath(); trail.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])); x.stroke();
    x.fillStyle='#1A1206'; x.fillRect(px-11,py-2,22,4); x.fillStyle='#FBFAF4'; x.strokeStyle='#1A1206'; x.lineWidth=2.5; x.beginPath(); x.rect(px-5,py-5,10,10); x.fill(); x.stroke();
    if(S.pending){ x.strokeStyle='#E5484D'; x.lineWidth=2; x.beginPath(); x.arc(px,py,14+Math.sin(performance.now()/150)*3,0,7); x.stroke(); } };
  if(behind) sat(); x.drawImage(earth,cx-s,cy-s); if(!behind) sat();
  // fire markers spotted
  for(let i=0;i<Math.min(S.sci/6,14);i++){ const ang=i*2.4, rad=s*(.25+.6*((i*37)%10)/10); const fx=cx+Math.cos(ang)*rad*.9, fy=cy+Math.sin(ang)*rad*.7; x.fillStyle='#F2A541'; x.strokeStyle='#1A1206'; x.lineWidth=1.5; x.beginPath(); x.arc(fx,fy,3.5,0,7); x.fill(); x.stroke(); }
}
/* ---------- log ---------- */
const logEl=document.getElementById('log'); let nLog=0;
const ICO={rock:['rock','#D7D0C0'],aim:['aim','#95B3B6'],flare:['flare','#F2A541'],fire:['fire','#E07A44'],ok:['ok','#4CC38A']};
function addLog(k,title,body,choices){ nLog++; document.getElementById('logcount').textContent=nLog+' events';
  const d=document.createElement('div'); d.className='entry'+(choices?' need':''); const [ic,c]=ICO[k];
  d.innerHTML=`<span class="t">T+${fmt(S.t)}</span><span class="ico" style="--c:${c}"><svg><use href="#i-${ic}"/></svg></span><p>${title}<small>${body}</small></p><div class="acts">${choices?choices.map((c,i)=>`<button class="t-btn ${i?'ghost':'primary'}" type="button" data-i="${i}">${c[0]}</button>`).join(''):''}</div>`;
  logEl.prepend(d); return d; }
function fmt(t){ const m=Math.floor(t), s=Math.floor((t-m)*60); return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
/* ---------- loop ---------- */
const curPhase=()=>{ for(let i=PHS.length-1;i>=0;i--) if(S.t>=PHS[i].start) return i; return 0; };
let lastSample=-1, lastNow=performance.now();
function step(dt){
  if(S.done||S.pending) return; S.t=Math.min(TOTAL,S.t+dt*S.speed); const ph=curPhase(), ops=ph>=3;
  // telemetry model
  const sunlit=Math.sin(S.t*.55)>-.3;
  S.power=Math.max(0,Math.min(100,S.power+(sunlit?S.gen/100*2.2:-1.6)*dt*S.speed*(ops?1:.6)-(ops?1.1:.3)*dt*S.speed));
  S.data=Math.max(0,Math.min(100,S.data+(ops?2.4:0)*dt*S.speed-(Math.sin(S.t*.9)>.75?9:0)*dt*S.speed));
  S.prop=Math.max(0,S.prop-(ph===2?3.2:ph===0?0:.15)*dt*S.speed);
  if(ops) S.sci+=dt*S.speed*.42*(S.data<95?1:.3);
  // sample history at 4/s sim time
  const si=Math.floor(S.t*4); while(lastSample<si){ lastSample++; for(const k of ['power','data','prop']) S.hist[k].push(S[k]); }
  // events
  for(const e of EVENTS){ if(!e.f&&S.t>=e.t){ e.f=true; S.fired++;
    if(e.auto){ S.gen+=e.fx.gen; S.res-=2; addLog(e.k,e.title,e.body); }
    else { S.pending=e; const d=addLog(e.k,e.title,e.body,e.choice); d.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const c=e.choice[+b.dataset.i]; const f=c[1];
      S.sci=Math.max(0,S.sci+(f.sci||0)); S.res+=f.res||0; S.dec+=(f.dec||0)+((f.res||0)>0?2:0); S.power=Math.max(0,Math.min(100,S.power+(f.power||0)));
      d.classList.remove('need'); d.querySelector('.acts').innerHTML=`<span class="label">Chose: ${c[0]}</span>`; S.pending=null; }); } } }
  // phase changes
  if(ph!==step.ph){ if(step.ph!=null) addLog('ok',`${PHS[ph].n} started`,ph===2?'Burning to circularise the orbit.':ph===3?'Instruments on. Watching for fires.':'All systems go.'); step.ph=ph; }
  if(S.t>=TOTAL){ S.done=true; addLog('ok','Mission complete','Final data downlinked.'); setTimeout(report,700); }
}
function render(){
  const ph=curPhase(); document.getElementById('phaseName').textContent=S.done?'Complete':PHS[ph].n;
  PHS.forEach((p,i)=>{ const el=document.getElementById('ph'+i); el.classList.toggle('done',S.t>=p.start+p.d); el.classList.toggle('now',i===ph&&!S.done); el.querySelector('.fill').style.width=(i===ph?Math.min(1,(S.t-p.start)/p.d)*100:0)+'%'; });
  document.getElementById('clock').textContent='T+ '+fmt(S.t);
  document.getElementById('v-power').textContent=Math.round(S.power)+'%'; document.getElementById('v-data').textContent=Math.round(S.data)+'%'; document.getElementById('v-prop').textContent=Math.round(S.prop)+'%';
  document.getElementById('sci').textContent=Math.round(S.sci);
  const a=pill('power',S.power,40,20,true), b=pill('data',S.data,80,95,false), c=pill('prop',S.prop,30,15,true);
  drawChart('power',100,40,20,true); drawChart('data',100,80,95,false); drawChart('prop',100,30,15,true);
  const st=document.getElementById('status'); const worst=[a,b,c].includes('bad')?'bad':[a,b,c].includes('warn')||S.pending?'warn':'';
  st.className='status '+worst; st.querySelector('span').textContent=S.pending?'Decision needed':worst==='bad'?'Critical':worst==='warn'?'Watch':'Nominal';
  drawOrb();
}
function report(){
  const perf=Math.round(Math.min(40,S.sci/60*40)), eff=Math.round(Math.max(0,Math.min(20,S.prop/100*12+ (S.power>30?8:4)))), dec=Math.max(0,Math.min(20,Math.round(S.dec))), res=Math.max(0,Math.min(20,Math.round(S.res)));
  const total=perf+eff+dec+res; document.getElementById('scrim').classList.add('open');
  document.getElementById('rTitle').textContent= total>=80?'Outstanding mission':total>=60?'Mission success':'Mission complete';
  requestAnimationFrame(()=>{ document.getElementById('ring').style.strokeDashoffset=314-(314*total/100); });
  let n=0; const sc=document.getElementById('score'); const tick=()=>{ n=Math.min(total,n+Math.ceil(total/40)); sc.textContent=n; if(n<total) requestAnimationFrame(tick); }; reduce?sc.textContent=total:tick();
  const st=total>=80?3:total>=60?2:1; document.getElementById('stars').innerHTML=[1,2,3].map(i=>`<svg style="--sf:${i<=st?'#F2A541':'#E4DED2'}"><use href="#i-star"/></svg>`).join('');
  const rows=[['Performance',perf,40],['Efficiency',eff,20],['Decisions',dec,20],['Resilience',res,20]];
  document.getElementById('breakdown').innerHTML=rows.map(r=>`<div class="brow"><span>${r[0]}</span><div class="bar"><i data-w="${r[1]/r[2]*100}"></i></div><span class="n">${r[1]}/${r[2]}</span></div>`).join('');
  setTimeout(()=>document.querySelectorAll('.brow .bar i').forEach(i=>i.style.width=i.dataset.w+'%'),60);
  const notes=[`Spotted ${Math.round(S.sci)} fires from orbit.`, S.prop<30?'Orbit insertion used a lot of fuel. A lighter craft would save propellant.':'Fuel margin was healthy.', S.res<10?'Risky calls cost resilience. Safe mode protects the craft during flares.':'Good calls kept the spacecraft safe.'];
  document.getElementById('notes').innerHTML=notes.map(t=>`<li>${t}</li>`).join('');
}
document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{ S.speed=+b.dataset.sp; document.querySelectorAll('[data-sp]').forEach(x=>x.classList.toggle('on',x===b)); });
document.getElementById('again').onclick=()=>location.reload();
document.getElementById('redesign').onclick=()=>{ document.getElementById('redesign').textContent='Back to the workshop…'; };
/* ---------- sky ---------- */
const skyC=document.getElementById('sky'); let SK;
function initSky(){const r=skyC.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.5);skyC.width=r.width*d;skyC.height=r.height*d;const x=skyC.getContext('2d');x.setTransform(d,0,0,d,0,0);
  let s=9;const Rr=()=>(s=(s*16807)%2147483647)/2147483647;const st=[];for(let k=0;k<380;k++){const px=r.width*(1-Math.pow(Rr(),1.4)*.55),py=r.height*Math.pow(Rr(),1.5)*.7,dx=(r.width-px)/(r.width*.55),dy=py/(r.height*.7);if(dx*dx+dy*dy>.75)continue;st.push({x:px,y:py,s:Rr()<.06?1.8:Rr()*.9+.3,p:Rr()*6})}SK={x,w:r.width,h:r.height,st}}
function drawSky(t){const {x}=SK;x.clearRect(0,0,SK.w,SK.h);for(const s of SK.st){x.globalAlpha=reduce?.85:.4+.6*Math.abs(Math.sin(t/1300+s.p));x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.s,0,7);x.fill()}}
addEventListener('resize',initSky); initSky(); initOrb(); new ResizeObserver(()=>initOrb()).observe(orb.parentElement);
let running=true; document.addEventListener('visibilitychange',()=>{running=!document.hidden; lastNow=performance.now(); if(running) requestAnimationFrame(loop);});
function loop(now){ if(!running) return; const dt=Math.min((now-lastNow)/1000,.1); lastNow=now; step(dt); render(); drawSky(now); requestAnimationFrame(loop); }
// start a little into the flight so the first view shows live data
S.speed=8; for(let i=0;i<60;i++) step(.05); S.speed=1;
requestAnimationFrame(loop);
