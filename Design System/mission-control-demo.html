/* Layout: ONE focus at a time. Full-screen trajectory view; phase stepper on top; 3 gauges top-right;
   one caption bottom-left; play controls bottom-right. Decisions pause the flight as a centred card. Report at the end. */
:root{
  color-scheme: light;
  --cream:#FBFAF4; --ink:#1A1206; --muted:#6E6457;
  --amber:#F2A541; --amber-d:#C27F22; --ember:#C2643A; --ember-d:#8E4322; --teal:#2C5B65; --crimson:#A73B42;
  --ok:#4CC38A; --warn:#F2B33D; --bad:#E5484D; --glass:rgba(255,255,255,.42);
  --f-display:'Game Paused','Silkscreen',monospace; --f-num:'Silkscreen',monospace; --f-ui:'Geist',system-ui,sans-serif; --f-mono:'Geist Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--cream);color:var(--ink);font-family:var(--f-ui)}
.night{position:fixed;inset:0;pointer-events:none;background:radial-gradient(55% 70% at 100% 0%, #08070F 0%, #120C1E 26%, #2A1E3A 42%, rgba(194,100,58,.26) 56%, rgba(242,165,65,.09) 64%, rgba(251,250,244,0) 74%)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;z-index:2}
.t-win{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink)}
.t-btn{border:3px solid var(--ink);border-radius:14px;padding:9px 18px 11px;font:400 17px var(--f-display);cursor:pointer;color:var(--ink);background:var(--c,var(--glass));backdrop-filter:blur(18px);box-shadow:inset 0 -4px 0 var(--cd,rgba(26,18,6,.08)),0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.t-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.t-btn.primary{--c:var(--amber);--cd:var(--amber-d)}
.t-btn.ghost{font:700 14px var(--f-ui)}
.t-btn.on{--c:var(--ink);color:var(--cream);--cd:#000}
.t-round{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--glass);backdrop-filter:blur(18px);box-shadow:inset 0 -4px 0 rgba(26,18,6,.08),0 4px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--ink);flex:none}
.t-round svg{width:20px;height:20px}
.t-ribbon{display:inline-block;background:var(--ember);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:5px 16px 7px;font:400 17px var(--f-display);white-space:nowrap;box-shadow:inset 0 -4px 0 var(--ember-d),0 4px 0 var(--ink);text-shadow:0 2px 0 rgba(26,18,6,.3)}
.t-btn:focus-visible,.t-round:focus-visible{outline:3px solid var(--ember);outline-offset:3px}
.label{font:400 10px var(--f-num);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
@keyframes tpop{0%{transform:scale(.85) translateY(14px);opacity:0}}
/* top-left */
.tl{top:calc(14px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center}
/* stepper */
.stepper{top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:0;padding:8px 14px;border-radius:999px}
.st{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px}
.st i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--ink);background:#fff}
.st span{font:700 10.5px var(--f-ui);color:var(--muted);white-space:nowrap}
.st.done i{background:var(--ok)} .st.now i{background:var(--amber);box-shadow:0 0 0 4px rgba(242,165,65,.35)} .st.now span{color:var(--ink)}
.bar{width:22px;height:3px;background:var(--ink);opacity:.25;margin-bottom:16px}
/* gauges */
.gauges{top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;width:190px}
.g{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;padding:8px 10px;border-radius:14px}
.g b{font:700 12.5px var(--f-ui)} .g em{font:400 12px var(--f-num);font-style:normal;font-variant-numeric:tabular-nums}
.g .tr{grid-column:1/-1;height:10px;border-radius:6px;border:2px solid var(--ink);background:rgba(255,255,255,.6);overflow:hidden}
.g .tr i{display:block;height:100%;background:var(--ok);transition:width .3s}
.g.warn .tr i{background:var(--warn)} .g.bad .tr i{background:var(--bad)} .g.bad{background:rgba(229,72,77,.18)}
/* caption */
.cap{left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100% - 28px));padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.cap h2{margin:0;font:400 26px var(--f-display)}
.cap p{margin:0;font:500 14.5px var(--f-ui);line-height:1.45}
.cap .sci{display:flex;gap:8px;align-items:center;font:700 13px var(--f-ui);color:var(--teal)}
/* controls */
.ctl{right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center}
/* decision card */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(26,18,6,.28);backdrop-filter:blur(2px);display:none;place-items:center;padding:16px}
.scrim.open{display:grid}
.card{width:min(460px,100%);padding:20px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;animation:tpop .5s cubic-bezier(.34,1.56,.64,1) both;max-height:calc(100% - 10px);overflow:auto}
.card .ico{width:64px;height:64px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;background:var(--c);box-shadow:0 4px 0 var(--ink)}
.card .ico svg{width:32px;height:32px}
.card h3{margin:0;font:400 28px var(--f-display)}
.card p{margin:0;font:500 15px var(--f-ui);line-height:1.45}
.choices{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{display:flex;flex-direction:column;gap:6px;text-align:left;border:3px solid var(--ink);border-radius:16px;padding:12px;background:rgba(255,255,255,.55);box-shadow:0 5px 0 var(--ink);cursor:pointer;font:inherit;color:var(--ink);transition:transform .12s cubic-bezier(.34,1.56,.64,1)}
.choice:hover{transform:translateY(-3px)} .choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.choice b{font:400 17px var(--f-display)}
.choice span{font:500 12.5px var(--f-ui);color:var(--muted)}
.choice .fx{display:flex;flex-wrap:wrap;gap:4px}
.choice .fx em{font:400 10px var(--f-num);font-style:normal;padding:2px 6px;border-radius:6px;border:1.5px solid var(--ink);background:#fff}
.choice .fx em.g{background:rgba(76,195,138,.3)} .choice .fx em.r{background:rgba(229,72,77,.2)}
.toast{left:50%;top:22%;transform:translateX(-50%);padding:10px 16px;display:none;align-items:center;gap:10px;font:700 14px var(--f-ui);animation:tpop .4s cubic-bezier(.34,1.56,.64,1) both;white-space:nowrap}
.toast.show{display:flex}
/* log drawer */
.drawer{right:max(14px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100% - 28px));max-height:45%;overflow:auto;padding:12px;display:none;flex-direction:column;gap:6px}
.drawer.open{display:flex}
.drawer div{font:500 13px var(--f-ui);padding:6px 8px;border-radius:10px;border:2px solid var(--ink);background:rgba(255,255,255,.5)}
.drawer div small{font:400 10px var(--f-num);color:var(--muted);display:block}
/* report */
.report{width:min(540px,100%);padding:22px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;animation:tpop .6s cubic-bezier(.34,1.56,.64,1) both;max-height:calc(100% - 10px);overflow:auto}
.report h3{margin:0;font:400 30px var(--f-display)}
.ringwrap{position:relative;width:150px;height:150px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap b{position:absolute;inset:0;display:grid;place-items:center;font:400 42px var(--f-num)}
.ringwrap small{position:absolute;left:0;right:0;bottom:30px;font:400 9px var(--f-num);color:var(--muted)}
.stars{display:flex;gap:6px}.stars svg{width:30px;height:30px}
.why{width:100%;display:flex;flex-direction:column;gap:10px;text-align:left}
.why .r{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.why .r b{font:700 14px var(--f-ui)} .why .r em{font:400 12px var(--f-num);font-style:normal}
.why .r .tr{grid-column:1/-1;height:12px;border-radius:8px;border:2.5px solid var(--ink);background:rgba(255,255,255,.6);overflow:hidden}
.why .r .tr i{display:block;height:100%;width:0;background:var(--teal);transition:width 1s cubic-bezier(.34,1.56,.64,1)}
.why .r p{grid-column:1/-1;margin:0;font:500 13px var(--f-ui);color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
@media (max-width:820px){
  .stepper{top:calc(140px + env(safe-area-inset-top,0px));padding:6px 8px}.st{min-width:40px}.st span{display:none}.st.now span{display:block;position:absolute;top:24px;font-size:11px}.st{position:relative}.bar{width:10px;margin-bottom:0}
  .gauges{width:auto;left:max(14px,env(safe-area-inset-left,0px));top:calc(70px + env(safe-area-inset-top,0px));flex-direction:row}.g{flex:1;padding:6px 8px}.g b{font-size:11px}
  .cap{bottom:calc(76px + env(safe-area-inset-bottom,0px));width:auto;right:14px}.cap h2{font-size:21px}.cap p{font-size:13.5px}
  .ctl{left:14px;justify-content:flex-end}
  .choices{grid-template-columns:1fr}
}

<script>
const reduce=(matchMedia('(prefers-reduced-motion: reduce)').matches||!!(window.HZ&&HZ.settings&&HZ.settings.motion));
/* ===== Design coming from the workshops (demo values) ===== */
const DESIGN=Object.assign({mission:'Wildfire watch', inst:'Thermal IR imager', rocket:'Jupiter-C', orbit:'Sun-sync 550 km'}, (window.HZ&&HZ.design)||{});
const MKEY=(window.HZ&&HZ.mission)||'earth';
const MI=(typeof HZ_MISSIONS!=='undefined'&&HZ_MISSIONS[MKEY])||{name:'Wildfire watch',unit:'fires',verb:'spotted',planet:'earth',kind:'orbit',obj:''};
const UNIT=MI.unit, ATEARTH=MKEY==='earth', PNAME=MKEY==='moon'?'the Moon':(typeof HZ_PL!=='undefined'&&HZ_PL[MI.planet]?HZ_PL[MI.planet].n:'Earth');
DESIGN.mission=MI.name;
/* ===== Phases: one focus each, with a plain-language "what and why" ===== */
const PH=[
 {n:'Launch',          d:6,  t:`${DESIGN.rocket} lifts the spacecraft off Earth. The heavier the spacecraft, the more of the rocket's power it uses.`},
 {n:'Reach orbit',     d:5,  t:`The engine fires to settle into a ${DESIGN.orbit} orbit. This burn uses most of the fuel.`},
 {n:'Check-out',       d:4,  t:`Systems switch on one by one. Solar wings unfold and start charging the battery.`},
 {n:'Science 1',       d:8,  t:ATEARTH?`The ${DESIGN.inst} scans for heat. Each orbit passes over new forests.`:`The ${DESIGN.inst} starts work at ${PNAME}. ${MI.obj}`},
 {n:'Science 2',       d:8,  t:`Data piles up on board. It is sent home when the craft flies over a ground station.`},
 {n:'Science 3',       d:8,  t:`On the night side there is no sunlight, so the battery drains. Watch the power gauge.`},
 {n:'Science 4',       d:8,  t:ATEARTH?`Final stretch. Every fire spotted adds to your score.`:`Final stretch. Everything sent home adds to your score.`}];
let acc=0; PH.forEach(p=>{p.s=acc; acc+=p.d;}); const TOTAL=acc;
/* ===== Random events → decisions (the game part) ===== */
const EVENTS=[
 {t:14, kind:'rock', c:'#D7D0C0', title:'Micrometeoroid!', text:'A grain of dust hit a solar wing. It now makes 10% less power.', auto:true, fx:{gen:-10,res:-2}},
 {t:22, kind:'aim', c:'#95B3B6', title:'Pointing glitch', text:'The star tracker got blinded by sunlight. The camera may be pointing slightly off.',
   choices:[{b:'Reboot tracker',s:'Safe, but you miss one pass.',fx:{sci:-3,res:+6},tags:[[`−3 ${UNIT}`,'r'],['+ resilience','g']]},
            {b:'Keep imaging',s:'More pictures, some may be blurry.',fx:{sci:+2,res:-6},tags:[[`+2 ${UNIT}`,'g'],['− resilience','r']]}]},
 {t:33, kind:'flare', c:'#F2A541', title:'Solar flare!', text:'A burst of radiation from the Sun arrives in 2 minutes. It can damage electronics.',
   choices:[{b:'Safe mode',s:'Turn off the camera and wait it out.',fx:{sci:-5,res:+10,power:+8},tags:[[`−5 ${UNIT}`,'r'],['+ battery','g'],['+ resilience','g']]},
            {b:'Ride it out',s:'Keep working and hope for the best.',fx:{sci:+4,res:-12,power:-15},tags:[[`+4 ${UNIT}`,'g'],['− battery','r'],['risky','r']]}]},
 {t:44, kind:'fire', c:'#E07A44', title:ATEARTH?'Big wildfire found!':'Big discovery!', text:ATEARTH?'Firefighters need to know fast. Sending the alert now costs power.':'Scientists want this data fast. Sending it now costs power.',
   choices:[{b:ATEARTH?'Send alert now':'Send data now',s:ATEARTH?'Crews get the news in minutes.':'The team gets it within hours.',fx:{sci:+8,power:-12,dec:+8},tags:[[`+8 ${UNIT}`,'g'],['− battery','r'],['+ decisions','g']]},
            {b:'Wait for next pass',s:'Saves power, news arrives hours later.',fx:{sci:+2,dec:-4},tags:[[`+2 ${UNIT}`,'g'],['− decisions','r']]}]}];
const S={t:0,speed:1,paused:false,power:100,data:0,fuel:100,gen:100,sci:0,res:10,dec:10,done:false,log:[]};
/* ===== UI: stepper, gauges ===== */
const stepEl=document.getElementById('stepper');
stepEl.innerHTML=PH.map((p,i)=>`${i?'<span class="bar"></span>':''}<div class="st" id="st${i}"><i></i><span>${p.n}</span></div>`).join('');
const G=[['power','Battery',v=>v<20?'bad':v<40?'warn':''],['data','Storage',v=>v>95?'bad':v>80?'warn':''],['fuel','Fuel',v=>v<15?'bad':v<30?'warn':'']];
const gEl=document.getElementById('gauges'); gEl.innerHTML=G.map(g=>`<div class="t-win g" id="g-${g[0]}"><b>${g[1]}</b><em></em><div class="tr"><i></i></div></div>`).join('');
const phaseAt=t=>{for(let i=PH.length-1;i>=0;i--) if(t>=PH[i].s) return i; return 0;};
let shownPhase=-1;
function renderUI(){ const ph=phaseAt(S.t);
  PH.forEach((p,i)=>{const e=document.getElementById('st'+i); e.className='st'+(S.t>=p.s+p.d||S.done?' done':i===ph?' now':'');});
  if(ph!==shownPhase){ shownPhase=ph; document.getElementById('capLabel').textContent=`Phase ${ph+1} of ${PH.length}`; document.getElementById('capTitle').textContent=PH[ph].n; document.getElementById('capText').textContent=PH[ph].t; addLog(PH[ph].n+' started'); }
  for(const g of G){ const v=S[g[0]], st=g[2](v), el=document.getElementById('g-'+g[0]); el.className='t-win g '+st; el.querySelector('em').textContent=Math.round(v)+'%'+(st==='bad'?' !':''); el.querySelector('i').style.width=v+'%'; }
  document.getElementById('sci').innerHTML= ph>=3?`<svg style="width:16px;height:16px;color:#E07A44"><use href="#i-fire"/></svg>${Math.round(S.sci)} ${UNIT} ${MI.verb} so far`:'';
}
/* ===== Toast, log, modal ===== */
const toastEl=document.getElementById('toast');
function toast(html){ toastEl.innerHTML=html; toastEl.classList.remove('show'); void toastEl.offsetWidth; toastEl.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>toastEl.classList.remove('show'),2600); }
function addLog(t){ S.log.unshift([S.t,t]); document.getElementById('drawer').innerHTML='<span class="label">Event log</span>'+S.log.map(l=>`<div><small>T+${l[0].toFixed(0)}</small>${l[1]}</div>`).join(''); }
document.getElementById('logBtn').onclick=()=>document.getElementById('drawer').classList.toggle('open');
const scrim=document.getElementById('scrim'), modal=document.getElementById('modal');
function decide(e){ S.paused=true; scrim.classList.add('open');
  modal.className='t-win card'; modal.innerHTML=`<span class="label">Decision needed · flight paused</span><span class="ico" style="--c:${e.c}"><svg><use href="#i-${e.kind}"/></svg></span><h3>${e.title}</h3><p>${e.text}</p>
   <div class="choices">${e.choices.map((c,i)=>`<button class="choice" type="button" data-i="${i}"><b>${c.b}</b><span>${c.s}</span><div class="fx">${c.tags.map(t=>`<em class="${t[1]}">${t[0]}</em>`).join('')}</div></button>`).join('')}</div>`;
  modal.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{ const c=e.choices[+b.dataset.i]; apply(c.fx); e.picked=c.b; addLog(`${e.title} → ${c.b}`); scrim.classList.remove('open'); S.paused=false; toast(`<span class="label">Done</span>${c.b}`); }); }
function apply(f){ S.sci=Math.max(0,S.sci+(f.sci||0)); S.res+=f.res||0; S.dec+=(f.dec||0)+((f.res||0)>0?2:0); S.power=Math.max(0,Math.min(100,S.power+(f.power||0))); S.gen+=f.gen||0; }
/* ===== Controls ===== */
const playBtn=document.getElementById('play'), spBtn=document.getElementById('speed');
playBtn.onclick=()=>{ S.paused=!S.paused; playBtn.innerHTML=`<svg style="width:18px;height:18px"><use href="#i-${S.paused?'play':'pause'}"/></svg>`; playBtn.setAttribute('aria-label',S.paused?'Play':'Pause'); };
spBtn.onclick=()=>{ S.speed=S.speed===1?3:1; spBtn.textContent=S.speed+'×'; spBtn.classList.toggle('on',S.speed>1); };
/* ===== Simulation ===== */
function step(dt){ if(S.paused||S.done) return; S.t=Math.min(TOTAL,S.t+dt*S.speed); const ph=phaseAt(S.t), k=dt*S.speed, ops=ph>=3;
  const night=ops&&Math.sin(S.t*.8)<-.35;
  if(ph===1) S.fuel=Math.max(0,S.fuel-k*13); else if(ops) S.fuel=Math.max(0,S.fuel-k*.25);
  if(ph>=2) S.power=Math.max(0,Math.min(100,S.power+(night?-3.2:2.6*S.gen/100)*k-(ops?.6:0)*k));
  if(ops){ S.data=Math.min(100,S.data+3.2*k); if(Math.sin(S.t*.8+1.4)>.85) S.data=Math.max(0,S.data-30*k); if(!night&&S.power>5) S.sci+=k*.5; }
  for(const e of EVENTS){ if(!e.f&&S.t>=e.t){ e.f=true; if(e.auto){ apply(e.fx); addLog(e.title+' '+e.text); toast(`<svg style="width:20px;height:20px"><use href="#i-${e.kind}"/></svg>${e.title} ${e.text}`); } else decide(e); } }
  if(S.t>=TOTAL){ S.done=true; setTimeout(report,600); } }
/* ===== Report: score + WHY (the brief asks for feedback explaining results) ===== */
function report(){
  const perf=Math.round(Math.min(40,S.sci/30*40)), eff=Math.round(Math.max(0,Math.min(20,S.fuel/100*10+(S.power>30?10:5)))), dec=Math.max(0,Math.min(20,Math.round(S.dec))), res=Math.max(0,Math.min(20,Math.round(S.res)));
  const total=perf+eff+dec+res, st=total>=80?3:total>=60?2:1;
  const rows=[
    ['Performance',perf,40, ATEARTH?`${Math.round(S.sci)} fires spotted. The ${DESIGN.inst} sees heat through smoke, so it finds more fires than a normal camera.`:`${Math.round(S.sci)} ${UNIT} ${MI.verb} at ${PNAME}. A stronger instrument gets more science from every pass.`],
    ['Efficiency',eff,20, S.fuel<30?'Reaching orbit burned a lot of fuel. A lighter spacecraft would leave more in the tank.':`${Math.round(S.fuel)}% fuel left and the battery stayed healthy. Good sizing.`],
    ['Decisions',dec,20, EVENTS.filter(e=>e.picked).map(e=>`${e.title.replace('!','')}: ${e.picked}`).join(' · ')||'No decisions made.'],
    ['Resilience',res,20, res>=14?'Careful choices kept the spacecraft safe.':'Risky choices left the spacecraft exposed. Safe mode protects it during flares.']];
  modal.className='t-win report'; scrim.classList.add('open');
  modal.innerHTML=`<span class="t-ribbon">Mission report</span><h3>${total>=80?'Outstanding mission':total>=60?'Mission success':'Mission complete'}</h3>
   <div class="ringwrap"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="rgba(26,18,6,.12)" stroke-width="14"/><circle id="ring" cx="60" cy="60" r="50" fill="none" stroke="#2C5B65" stroke-width="14" stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="314" style="transition:stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1)"/></svg><b>${total}</b><small>out of 100</small></div>
   <div class="stars">${[1,2,3].map(i=>`<svg style="--sf:${i<=st?'#F2A541':'#E4DED2'}"><use href="#i-star"/></svg>`).join('')}</div>
   <div class="why">${rows.map(r=>`<div class="r"><b>${r[0]}</b><em>${r[1]}/${r[2]}</em><div class="tr"><i data-w="${r[1]/r[2]*100}"></i></div><p>${r[3]}</p></div>`).join('')}</div>
   <div class="row"><button class="t-btn ghost" type="button" onclick="location.reload()">Fly again</button><button class="t-btn primary" type="button">Redesign spacecraft</button></div>`;
  requestAnimationFrame(()=>{ document.getElementById('ring').style.strokeDashoffset=314-314*total/100; modal.querySelectorAll('.tr i').forEach(i=>i.style.width=i.dataset.w+'%'); });
}
/* ===== Trajectory view (canvas): launch arc → orbit insertion burn → science orbits ===== */
const cv=document.getElementById('cv'); let C;
function init(){ const w=innerWidth,h=innerHeight,d=Math.min(devicePixelRatio||1,1.5); cv.width=w*d; cv.height=h*d; const x=cv.getContext('2d'); x.setTransform(d,0,0,d,0,0);
  const R=Math.min(w,h)*(w<820?.26:.24), cx=w*.5, cy=h*(w<820?.47:.55);
  // grainy banded Earth (Comet style)
  const e=document.createElement('canvas'); e.width=e.height=R*2; const g=e.getContext('2d'); g.save(); g.beginPath(); g.arc(R,R,R,0,7); g.clip(); g.fillStyle='#0B1F24'; g.fillRect(0,0,R*2,R*2); g.translate(R,R); g.rotate(-.5);
  const PC=MKEY==='moon'?['#9C968C','#5E5A54','#F3EEE4','#2A2D33']:(typeof HZ_PL!=='undefined'&&HZ_PL[MI.planet]&&!ATEARTH?HZ_PL[MI.planet].cols:null);
  const bands=PC?[PC[3],PC[0],PC[2],PC[0],PC[1],PC[2],PC[3]]:['#0B1F24','#2C5B65','#95B3B6','#2C5B65','#1C3E46','#95B3B6','#0B1F24'];
  for(let i=0;i<bands.length;i++){ g.fillStyle=bands[i]; g.beginPath(); const y0=-R+i*(2*R/bands.length); g.moveTo(-R*1.3,y0); for(let xx=-R*1.3;xx<=R*1.3;xx+=6) g.lineTo(xx,y0+Math.sin(xx/R*3+i)*R*.08); g.lineTo(R*1.3,R*1.3); g.lineTo(-R*1.3,R*1.3); g.fill(); }
  g.restore(); const id=g.getImageData(0,0,e.width,e.height); for(let i=0;i<id.data.length;i+=4) if(id.data[i+3]){ const n=(Math.random()-.5)*26; id.data[i]+=n; id.data[i+1]+=n; id.data[i+2]+=n; } g.putImageData(id,0,0);
  let s=9; const Rr=()=>(s=(s*16807)%2147483647)/2147483647; const stars=[]; for(let k=0;k<380;k++){const px=w*(1-Math.pow(Rr(),1.4)*.55),py=h*Math.pow(Rr(),1.5)*.7,dx=(w-px)/(w*.55),dy=py/(h*.7); if(dx*dx+dy*dy>.75) continue; stars.push([px,py,Rr()<.06?1.8:Rr()*.9+.3,Rr()*6]);}
  const fires=Array.from({length:30},()=>{const a=Rr()*6.28, r=Math.sqrt(Rr())*R*.85; return [Math.cos(a)*r,Math.sin(a)*r*.9];});
  C={x,w,h,R,cx,cy,earth:e,stars,fires,trail:[]}; }
addEventListener('resize',init); init();
// Orbit geometry: a tilted circle seen from above-front. angle a → screen point; z>0 = near side (in front of Earth).
function orbitPt(a){ const {R,cx,cy}=C, rx=R*1.7, ry=R*.62; return [cx+Math.cos(a)*rx, cy+Math.sin(a)*ry, Math.sin(a)]; }
function shipPos(){ const {R,cx,cy}=C, t=S.t;
  if(t<PH[1].s){ const k=t/PH[1].s, e=k*k*(3-2*k); const sx=cx+R*.12, sy=cy-R*.99; const [ox,oy]=orbitPt(-Math.PI*.5-.9);
    const mx=cx+R*.2, my=cy-R*1.9; const u=1-e; return [u*u*sx+2*u*e*mx+e*e*ox, u*u*sy+2*u*e*my+e*e*oy, -1, 'rocket']; }
  const a=-Math.PI*.5-.9+(t-PH[1].s)*.9; const [px,py,z]=orbitPt(a); return [px,py,z, t<PH[2].s?'burn':'sat']; }
function orbitHalf(front){ const x=C.x; x.save(); x.strokeStyle=front?'rgba(26,18,6,.38)':'rgba(26,18,6,.22)'; x.setLineDash([6,7]); x.lineWidth=1.8; x.beginPath();
  for(let i=0;i<=64;i++){ const a=front?i/64*Math.PI:Math.PI+i/64*Math.PI; const [px,py]=orbitPt(a); i?x.lineTo(px,py):x.moveTo(px,py); } x.stroke(); x.restore(); }
function trailPart(front){ const x=C.x, T=C.trail; x.strokeStyle='rgba(194,100,58,.6)'; x.lineWidth=2.5; x.lineCap='round';
  for(let i=1;i<T.length;i++){ const p=T[i-1], q=T[i]; if((q[2]>=0)!==front) continue; x.globalAlpha=i/T.length; x.beginPath(); x.moveTo(p[0],p[1]); x.lineTo(q[0],q[1]); x.stroke(); } x.globalAlpha=1; }
let lastMode='';
function draw(now){ const {x,w,h,R,cx,cy,earth,stars,fires}=C; x.clearRect(0,0,w,h);
  for(const s of stars){ x.globalAlpha=reduce?.85:.4+.6*Math.abs(Math.sin(now/1300+s[3])); x.fillStyle='#fff'; x.beginPath(); x.arc(s[0],s[1],s[2],0,7); x.fill(); } x.globalAlpha=1;
  const ph=phaseAt(S.t); const [px,py,z,mode]=shipPos();
  if(mode!==lastMode&&lastMode==='rocket') C.trail=[]; lastMode=mode;            // no kink between launch arc and orbit
  C.trail.push([px,py,mode==='rocket'?-1:z]); if(C.trail.length>(mode==='rocket'?140:36)) C.trail.shift();
  const ship=()=>{ if(mode==='rocket'){ const T=C.trail, q=T[Math.max(0,T.length-4)]; const ang=Math.atan2(py-q[1],px-q[0]);
      x.save(); x.translate(px,py); x.rotate(ang); x.fillStyle='#F2A541'; x.beginPath(); x.moveTo(-10,0); x.lineTo(-24-Math.random()*8,-4); x.lineTo(-24-Math.random()*8,4); x.fill();
      x.fillStyle='#FBFAF4'; x.strokeStyle='#1A1206'; x.lineWidth=2.5; x.beginPath(); x.moveTo(14,0); x.lineTo(4,-5); x.lineTo(-10,-5); x.lineTo(-10,5); x.lineTo(4,5); x.closePath(); x.fill(); x.stroke(); x.restore(); return; }
    const sc=.8+.25*z; x.save(); x.translate(px,py); x.scale(sc,sc);
    if(mode==='burn'){ x.fillStyle='#F2A541'; x.beginPath(); x.arc(-14,2,5+Math.random()*3,0,7); x.fill(); }
    x.fillStyle='#2C5B65'; x.strokeStyle='#1A1206'; x.lineWidth=2; x.fillRect(-20,-3,12,6); x.strokeRect(-20,-3,12,6); x.fillRect(8,-3,12,6); x.strokeRect(8,-3,12,6);
    x.fillStyle='#FBFAF4'; x.lineWidth=2.5; x.beginPath(); x.rect(-7,-7,14,14); x.fill(); x.stroke(); x.restore(); };
  // far side: orbit + trail + ship behind Earth
  orbitHalf(false); trailPart(false); if(z<0) ship();
  x.save(); x.shadowColor='rgba(26,18,6,.25)'; x.shadowBlur=40; x.shadowOffsetY=20; x.drawImage(earth,cx-R,cy-R); x.restore();
  const sh=x.createLinearGradient(cx-R,cy,cx+R,cy); sh.addColorStop(.45,'rgba(8,7,15,0)'); sh.addColorStop(1,'rgba(8,7,15,.55)'); x.fillStyle=sh; x.beginPath(); x.arc(cx,cy,R,0,7); x.fill();
  const n=Math.min(fires.length,Math.round(S.sci)); for(let i=0;i<n;i++){ const [fx,fy]=fires[i]; x.fillStyle='#F2A541'; x.strokeStyle='#1A1206'; x.lineWidth=1.8; x.beginPath(); x.arc(cx+fx,cy+fy,4.5,0,7); x.fill(); x.stroke(); }
  if(ph===0){ x.fillStyle='#C2643A'; x.strokeStyle='#1A1206'; x.lineWidth=2; x.beginPath(); x.arc(cx+R*.12,cy-R*.99,6,0,7); x.fill(); x.stroke(); }
  // near side
  orbitHalf(true); trailPart(true); if(z>=0) ship();
  if(mode==='rocket') trailPart(false);
}
/* ===== Loop ===== */
let last=performance.now(), running=true;
document.addEventListener('visibilitychange',()=>{running=!document.hidden; last=performance.now(); if(running) requestAnimationFrame(loop);});
function loop(now){ if(!running) return; const dt=Math.min((now-last)/1000,.1); last=now; step(dt); renderUI(); draw(now); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
