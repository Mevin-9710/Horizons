kground:var(--cream);\n  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px;\n  display:grid;grid-template-rows:auto 1fr auto;box-sizing:border-box;min-height:max(640px,100%)}\n.night{position:absolute;inset:0;pointer-events:none;background:\n  radial-gradient(62% 80% at 100% 0%, #08070F 0%, #120C1E 26%, #2A1E3A 42%, rgba(194,100,58,.26) 56%, rgba(242,165,65,.09) 64%, rgba(251,250,244,0) 74%)}\ncanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}\n.layer{position:relative;z-index:2}\nheader{display:flex;justify-content:space-between;align-items:center;gap:12px}\n.logo{font-family:var(--f-display);font-size:22px;letter-spacing:.02em}\n.chip{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#F3EEE6;padding:6px 9px;border-radius:4px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px)}\nmain{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) minmax(0,1.1fr);align-items:center;gap:clamp(16px,3vw,40px);padding-block:24px}\n.cards{display:flex;flex-direction:column;gap:12px}\n.card{padding:10px 12px;border-radius:5px;background:rgba(255,255,255,.62);border:1px solid rgba(26,18,6,.10);backdrop-filter:blur(16px);display:flex;flex-direction:column;gap:12px;min-height:118px;box-sizing:border-box;cursor:pointer;transition:transform .25s cubic-bezier(.22,1,.36,1)}\n.card:hover{transform:translateY(-3px)}\n.card .n{font-family:'Silkscreen',monospace;font-size:12px}\n.card p{margin:0;font-size:13px;line-height:1.35}\n.card .tag{font-family:var(--f-mono);font-size:11px;color:var(--ember);align-self:flex-end;margin-top:auto}\n.ball{justify-self:center;width:min(340px,30vw);aspect-ratio:1;border-radius:50%;background:\n  radial-gradient(circle at 33% 26%, #fff 0 3%, rgba(255,255,255,.55) 7%, transparent 20%),\n  radial-gradient(circle at 70% 80%, rgba(242,165,65,.32) 0, transparent 4  2px 0 var(--ink)}\n.card .n{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--cream);display:grid;place-items:center;font-size:11px}\n.card p{font-weight:600}\n.card .tag{font:400 11px 'Silkscreen',monospace;background:var(--amber);border:2px solid var(--ink);border-radius:8px;padding:2px 8px;color:var(--ink)}\n.ctas{gap:14px}\n.btn{padding:14px 34px 16px;font-size:24px}\n.status{background:#fff}\n\n/* Glassmorphism fill for all tactile cards/windows (2026-11-14): keep outlines + lips, replace solid white */\n.t-win,.card,.spec,.tag,.t-pill,.dots button,.A .win,.A .resource,.A .dock,.A .tile:not(.on):not(.lock),.A .btn.ghost,.t-btn.ghost,.t-round:not(.x){\n  background:rgba(255,255,255,.42)!important;backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}\n.b-actions{background:rgba(251,247,238,.35)!important}\n.spec{background:rgba(255,255,255,.3)!important}\n\n/* OPAQUE UI (2026-11-14, replaces glassmorphism): solid cream-white fills, no backdrop blur */\n:root{--glass:#FFFDF8!important}\n*{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}\n.t-win,.card,.spec,.tag,.t-pill,.dots button,.A .win,.A .resource,.A .dock,.A .tile:not(.on):not(.lock),.A .btn.ghost,.t-btn.ghost:not(.on),.t-round:not(.x),.metric:not(.bad),.tile:not(.on):not(.lock),.tab:not(.on),.opt:not(.on),.check li,.info,.panel,.g:not(.bad),.choice,.drawer div,.status,.chip,.prompt,.brief,.win,.dock,.cap,.stepper,.report,.B .win,.C .win,.C .resource,.C .tile:not(.on):not(.lock),.C .round,.B .btn.ghost,.C .btn.ghost{background:#FFFDF8!important}\n.spec,.check li,.drawer div,.opt:not(.on){background:#F6F1E6!important}\n.b-actions,.w-foot{background:#F6F1E6!important}\n.metric.bad,.g.bad{background:#F8D6D3!important}\n.opt.on{background:#F7D29C!important}\n.scrim{background:rgba(26,18,6,.45)!important}\n<\/style>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n<symbol id=\"i-back\" viewBox=\"0 0 24 24\"><path d=\"M15 5 8 12l7 7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/symbol>\n<symbol id=\"i-x\" viewBox=\"0 0 24 24\"><path d=\"M6 6l12 12M18 6 6 18\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\"/><\/symbol>\n<symbol id=\"i-gear\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"3.2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"/><path d=\"M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><\/symbol>\n<symbol id=\"i-star\" viewBox=\"0 0 24 24\"><path d=\"M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z\" fill=\"var(--sf,#F2A541)\" stroke=\"#1A1206\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><\/symbol>\n<\/svg>\n<div class=\"screen\">\n  <div class=\"night\"><\/div>\n  <canvas id=\"sky\" aria-hidden=\"true\"><\/canvas>\n  <canvas id=\"ground\" aria-hidden=\"true\"><\/canvas>\n  <header class=\"layer\"><span class=\"logo\">Horizons<\/span><div class=\"right\"><span class=\"chip\">Plotting trajectory\u2026<\/span><button class=\"t-round\" type=\"button\" aria-label=\"Settings\"><svg><use href=\"#i-gear\"/><\/svg><\/button><\/div><\/header>\n  <main class=\"layer\">\n    <div class=\"cards\">\n      <div class=\"card\" tabindex=\"0\"><span class=\"t-new\">NEW<\/span><span class=\"n\">01<\/span><p>Watch wildfires on Earth from orbit.<\/p><span class=\"tag\">/earth<\/span><\/div>\n      <div class=\"card\" tabindex=\"0\"><span class=\"n\">02<\/span><p>Map water ice hiding at the lunar poles.<\/p><span class=\"tag\">/moon<\/span><\/div>\n      <div class=\"card\" tabindex=\"0\"><span class=\"n\">03<\/span><p>Sample the thin air of Mars.<\/p><span class=\"tag\">/mars<\/span><\/div>\n    <\/div>\n    <div class=\"ball\" aria-hidden=\"true\"><svg class=\"rocket\" viewBox=\"0 0 100 160\"><defs><linearGradient id=\"rg\" x1=\"0\" x2=\"1\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\".85\"/><stop offset=\".45\" stop-color=\"#fff\" stop-opacity=\".25\"/><stop offset=\"1\" stop-color=\"#9C968C\" stop-opacity=\".35\"/><\/linearGradient><linearGradient id=\"fl\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#F2A541\" stop-opacity=\".55\"/><stop offset=\"1\" stop-color=\"#F2A541\" stop-opacity=\"0\"/><\/linearGradient><\/defs><path d=\"M50 6 C66 24 70 50 70 84 L70 112 L30 112 L30 84 C30 50 34 24 50 6Z\" fill=\"url(#rg)\" stroke=\"#fff\" stroke-opacity=\".8\" stroke-width=\"1.4\"/><path d=\"M30 92 L16 120 L16 128 L30 118Z M70 92 L84 120 L84 128 L70 118Z\" fill=\"url(#rg)\" stroke=\"#fff\" stroke-opacity=\".7\" stroke-width=\"1.2\"/><circle cx=\"50\" cy=\"58\" r=\"9\" fill=\"rgba(42,30,58,.18)\" stroke=\"#fff\" stroke-opacity=\".9\" stroke-width=\"1.4\"/><circle cx=\"47\" cy=\"55\" r=\"2.5\" fill=\"#fff\" fill-opacity=\".9\"/><path d=\"M38 112 L62 112 L58 122 L42 122Z\" fill=\"rgba(255,255,255,.35)\" stroke=\"#fff\" stroke-opacity=\".6\"/><path d=\"M43 124 Q50 158 57 124Z\" fill=\"url(#fl)\"/><path d=\"M40 30 Q42 70 40 104\" stroke=\"#fff\" stroke-opacity=\".9\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/><\/svg><\/div>\n    <div class=\"copy\">\n      <h1>Horizons<span class=\"word\" id=\"word\"><span class=\"on\">Launches<\/span><span>Designs<\/span><span>Orbits<\/span><span>Explores<\/span><span>Observes<\/span><\/span><\/h1>\n      <p class=\"sub\">Design a spacecraft, launch it, and see if your trade-offs hold up. Solo or with up to 4 players.<\/p>\n      <div class=\"ctas\"><button class=\"t-btn primary btn\" type=\"button\">Play<\/button><button class=\"t-btn ghost\" type=\"button\">Tutorial \u00b7 30 s<\/button><\/div>\n    <\/div>\n  <\/main>\n  <footer class=\"layer\"><span class=\"t-pill\"><i><\/i>Loading solar system\u2026<\/span><span class=\"meta\">NASA Space Apps 2026<\/span><\/footer>\n<\/div>\n\n<script>\nconst reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;\n// rotating headline word\n(()=>{const w=[...document.querySelectorAll('#word span')];let i=0;if(reduce)return;\n setInterval(()=>{w[i].classList.replace('on','out');const o=w[i];setTimeout(()=>o.classList.remove('out'),700);i=(i+1)%w.length;w[i].classList.add('on')},2600)})();\n\nfunction fit(c){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.5);c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return {x,w:r.width,h:r.height}}\n// seeded random so the scene is stable\nfunction rng(s){return()=>(s=(s*16807)%2147483647)/2147483647}\n\n// stars: top-right only\nconst sky=document.getElementById('sky');let S,stars;\nfunction initSky(){S=fit(sky);const R=rng(7);stars=[];for(let k=0;k<420;k++){const x=S.w*(1-Math.pow(R(),1.4)*.6),y=S.h*Math.pow(R(),1.5)*.75;\n const dx=(S.w-x)/(S.w*.62),dy=y/(S.h*.8);if(dx*dx+dy*dy>.75)continue;stars.push({x,y,s:R()<.06?1.8:R()*.9+.3,p:R()*6,warm:R()<.12})}}\nfunction drawSky(t){const {x}=S;x.clearRect(0,0,S.w,S.h);for(const s of stars){x.globalAlpha=reduce?.85:.4+.6*Math.abs(Math.sin(t/1300+s.p));x.fillStyle=s.warm?'#F2C27A':'#fff';x.beginPath();x.arc(s.x,s.y,s.s,0,7);x.fill()}if(!reduce)requestAnimationFrame(drawSky)}\n\n// stones and flowers: lower left band, drawn once\nconst ground=document.getElementById('ground');\nfunction drawGround(){const G=fit(ground),x=G.x,R=rng(42);x.clearRect(0,0,G.w,G.h);\n const base=G.h-34, left=G.w*.06, right=G.w*.52, K=Math.max(1,Math.min(1.8,G.w/900));\n // soft ground haze\n const hz=x.createRadialGradient(G.w*.22,base,0,G.w*.22,base,G.w*.4);hz.addColorStop(0,'rgba(200,190,170,.35)');hz.addColorStop(1,'rgba(251,250,244,0)');x.fillStyle=hz;x.fillRect(0,0,G.w,G.h);\n // grass blades\n for(let k=0;k<420;k++){const gx=left+R()*(right-left),fall=1-(gx-left)/(right-left),h=(24+R()*70)*K*(.5+fall);const gy=base+20-R()*70*fall;\n  x.strokeStyle=['#2C5B65','#4D7A5C','#7C8A4A','#3E6B6E'][k%4];x.globalAlpha=.55*fall+.15;x.lineWidth=1.3;x.beginPath();x.moveTo(gx,gy);x.quadraticCurveTo(gx+(R()-.5)*14,gy-h*.6,gx+(R()-.5)*18,gy-h);x.stroke()}\n // stones\n const stones=[[.10,34,24],[.19,54,36],[.30,30,20],[.07,20,14],[.245,18,12],[.37,22,14],[.145,16,10],[.42,12,8]];\n for(const [fx,rw,rh] of stones){const sx=G.w*fx,sy=base-rh*.55-6,sc=K;\n  const g=x.createRadialGradient(sx-rw*.35*sc,sy-rh*.5*sc,2,sx,sy,rw*sc);g.addColorStop(0,'#D9D4CB');g.addColorStop(.6,'#9C968C');g.addColorStop(1,'#5E5A54');\n  x.globalAlpha=1;x.fillStyle='rgba(26,18,6,.18)';x.beginPath();x.ellipse(sx+4,sy+rh*.6*sc,rw*sc,rh*.3*sc,0,0,7);x.fill();\n  x.fillStyle=g;x.beginPath();x.ellipse(sx,sy,rw*sc,rh*sc,(R()-.5)*.3,0,7);x.fill()}\n // flowers\n for(let k=0;k<160;k++){const fx=left+Math.pow(R(),1.3)*(right-left),fall=1-(fx-left)/(right-left),fy=base+14-R()*110*fall,sz=(2.4+R()*3.4)*K*(.6+fall);\n  const kind=R();x.globalAlpha=.35+.65*fall;\n  if(kind<.6){x.fillStyle='#FFFDF6';for(let p=0;p<6;p++){const a=p/6*Math.PI*2;x.beginPath();x.ellipse(fx+Math.cos(a)*sz,fy+Math.sin(a)*sz,sz*.75,sz*.4,a,0,7);x.fill()}x.fillStyle='#F2A541';x.beginPath();x.arc(fx,fy,sz*.45,0,7);x.fill()}\n  else if(kind<.85){x.fillStyle='#E07A44';x.beginPath();x.arc(fx,fy,sz*.9,0,7);x.fill();x.fillStyle='#F2A541';x.beginPath();x.arc(fx-sz*.2,fy-sz*.2,sz*.45,0,7);x.fill()}\n  else{x.fillStyle='#4D8C8F';for(let p=0;p<4;p++){x.beginPath();x.arc(fx,fy-p*sz*.9,sz*.55,0,7);x.fill()}}}\n x.globalAlpha=1;\n // fade the far edge back into the cream\n const fade=x.createLinearGradient(right*.55,0,right*1.05,0);fade.addColorStop(0,'rgba(251,250,244,0)');fade.addColorStop(1,'rgba(251,250,244,1)');x.globalCompositeOperation='destination-out';x.fillStyle=fade;x.fillRect(right*.55,0,G.w,G.h);x.globalCompositeOperation='source-over'}\n\nfunction init(){initSky();drawGround();if(reduce)drawSky(0)}\ninit();if(!reduce)requestAnimationFrame(drawSky);\nlet rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(init,150)});\n<\/s a bottom sheet with a fixed action bar. */\n:root{\n  color-scheme: light;\n  --cream:#FBFAF4; --ink:#1A1206; --muted:#6E6457; --line:rgba(26,18,6,.10);\n  --amber:#F2A541; --ember:#C2643A; --teal:#2C5B65; --crimson:#A73B42;\n  --glass:rgba(255,255,255,.68); --glassline:rgba(26,18,6,.10);\n  --f-display:'Game Paused','Silkscreen',monospace; --f-ui:'Geist',system-ui,sans-serif; --f-mono:'Geist Mono',ui-monospace,monospace;\n}\nhtml,body{height:100%;margin:0}\nbody{background:var(--cream);color:var(--ink);font-family:var(--f-ui);overflow:hidden}\n#app{position:fixed;inset:0;background:var(--cream)}\n.night{position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 75% at 100% 0%, #08070F 0%, #120C1E 26%, #2A1E3A 42%, rgba(194,100,58,.26) 56%, rgba(242,165,65,.09) 64%, rgba(251,250,244,0) 74%)}\ncanvas#sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}\ncanvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}\n.ui{position:absolute;z-index:2}\n.top{top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}\n.top > *{pointer-events:auto}\n.logo{font-family:var(--f-display);font-size:22px}\n.step{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}\n.chip{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:7px 10px;border-radius:4px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(12px);color:#F3EEE6;cursor:pointer}\n.panel{background:var(--glass);border:1px solid var(--glassline);border-radius:12px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 24px 50px -28px rgba(26,18,6,.45)}\n.label{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}\n/* prompt */\n.prompt{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100% - 32px));padding:16px;display:flex;flex-direction:column;gap:10px;transition:opacity .35s,transform .35s;box-sizing:border-box}\n.prompt.hide{opacity:0;transform:translateY(16px);pointer-events:none}\n.prompt h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.05}\n.prompt p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.45}\n.dots{display:flex;gap:8px;flex-wrap:wrap}\n.dots button{font-family:var(--f-mono);font-size:12px;color:var(--ink);background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:999px;padding:7px 12px 7px 9px;cursor:pointer;display:flex;align-items:center;gap:7px}\n.dots button i{width:10px;height:10px;border-radius:50%;display:inline-block}\n.dots button:hover,.dots button:focus-visible{border-color:var(--ember);outline:none}\n.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ember);margin-right:8px;animation:pulse 1.8s infinite}\n@keyframes pulse{50%{opacity:.25}}\n/* hover tag */\n.tag{position:absolute;z-index:3;pointer-events:none;font-family:var(--f-mono);font-size:11px;padding:5px 8px;border-radius:4px;background:var(--glass);border:1px solid var(--glassline);backdrop-filter:blur(10px);transform:translate(14px,-50%);white-space:nowrap;opacity:0;transition:opacity .15s}\n.tag b{font-weight:600;color:var(--ember)}\n/* brief: scrolling body + fixed action bar */\n.brief{top:72px;right:max(16px,env(safe-area-inset-right,0px));width:min(360px,calc(100% - 32px));max-height:calc(100% - 96px - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box;transform:translateX(calc(100% + 40px));opacity:0;transition:transform .6s cubic-bezier(.22,1,.36,1),opacity .4s}\n.brief.open{transform:none;opacity:1}\n.b-body{padding: 000 km'],['Duration','24 months'],['Budget','$450M'],['Mass limit','900 kg']],\n    tasks:['Fly a mass spectrometer and magnetometer','Budget fuel for orbit insertion','Plan for 20-minute comms delay'] },\n};\n\n// ---------- Bodies (Comet palette, not realistic colours) ----------\nconst bodies = [];\nconst sunMat = planetMat(['#F2C27A','#F2A541','#E07A44','#C2643A'], [0.3,1,0.2], 3.0, 0.75);\nconst sun = new THREE.Mesh(new THREE.SphereGeometry(6,64,64), sunMat); scene.add(sun);\n// sun halo\nconst haloTex = (()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const g=x.createRadialGradient(128,128,0,128,128,128);\n  g.addColorStop(0,'rgba(242,165,65,.45)');g.addColorStop(.4,'rgba(242,165,65,.12)');g.addColorStop(1,'rgba(242,165,65,0)');x.fillStyle=g;x.fillRect(0,0,256,256);return new THREE.CanvasTexture(c)})();\nconst halo = new THREE.Sprite(new THREE.SpriteMaterial({map:haloTex, transparent:true, depthWrite:false}));\nhalo.scale.set(40,40,1); scene.add(halo);\n\nconst DEF = [\n  {id:'mercury', name:'Mercury', r:0.9,  a:11, e:.9, speed:1.6,  cols:['#2A2D33','#5E5A54','#9C968C','#111'], axis:[1,.3,0], f:2.5, orbit:'#9C968C'},\n  {id:'venus',   name:'Venus',   r:1.4,  a:16, e:.92,speed:1.15, cols:['#F0D6B8','#E9B98F','#C98A62','#3A1D10'], axis:[.2,1,.4], f:2.0, orbit:'#C98A62'},\n  {id:'earth',   name:'Earth',   r:1.7,  a:22, e:.9, speed:.9,   cols:['#0B1F24','#2C5B65','#95B3B6','#081214'], axis:[.6,1,.2], f:3.2, orbit:'#2C5B65', mission:true},\n  {id:'mars',    name:'Mars',    r:1.25, a:30, e:.88,speed:.68,  cols:['#792B37','#A73B42','#D08A6A','#2A0E14'], axis:[1,.5,.3], f:2.6, orbit:'#A73B42', mission:true},\n  {id:'jupiter', name:'Jupiter', r:3.6,  a:42, e:.9, speed:.38,  cols:['#6B5A3A','#C9A55C','#2E3B4A','#151008'], axis:[0,1,0], f:5.5, orbit:'#9B7751'},\n  {id:'saturn',  name:'Saturn',  r:3.0,  a:54, e:.9, speed:.27,  cols:['#D7D0C0','#9B7751','#E8D9B8','#312624'], axis:[0,1,.1], f:4.5, orbit:'#9B7751', ring:true},\n  {id:'neptune', name:'Neptune', r:2.1,  a:65, e:.9, speed:.18,  cols:['#0F1916','#43645B','#2BB3BF','#091717'], axis:[.4,1,0], f:3.0, orbit:'#43645B'},\n];\nconst hitTargets = [];\nfor (const d of DEF){\n  const group = new THREE.Group(); scene.add(group);\n  const mesh = new THREE.Mesh(new THREE.SphereGeometry(d.r,64,64), planetMat(d.cols, d.axis, d.f)); group.add(mesh);\n  mesh.rotation.z = 0.35;\n  if (d.ring){\n    const ring = new THREE.Mesh(new THREE.RingGeometry(d.r*1.4, d.r*2.3, 96),\n      new THREE.MeshBasicMaterial({color:0x9B7751, transparent:true, opacity:.45, side:THREE.DoubleSide, depthWrite:false}));\n    ring.rotation.x = Math.PI/2.4; group.add(ring);\n  }\n  // orbit line (ellipse)\n  const pts=[]; for(let i=0;i<=200;i++){const t=i/200*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(t)*d.a,0,Math.sin(t)*d.a*d.e));}\n  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),\n    new THREE.LineBasicMaterial({color:d.orbit, transparent:true, opacity:d.mission?.55:.28}));\n  scene.add(line);\n  // generous invisible hit sphere\n  const hit = new THREE.Mesh(new THREE.SphereGeometry(Math.max(d.r*1.8,2.4),12,12), new THREE.MeshBasicMaterial({visible:false}));\n  hit.userData.id = d.id; group.add(hit); hitTargets.push(hit);\n  // selection ring for mission planets\n  let marker=null;\n  if (d.mission){\n    marker = new THREE.Mesh(new THREE.RingGeometry(d.r*1.55, d.r*1.62, 64), new THREE.MeshBasicMaterial({color:0xC2643A, transparent:true, opacity:.7, side:THREE.DoubleSide, depthWrite:false}));\n    group.add(marker);\n  }\n  const b = {...d, group, mesh, line, marker, angle:Math.random()*Math.PI*2};\n  bodies.push(b);\n}\n// Moon orbiting Earth\nconst earth = bodies.find(b=>b.id==='earth');\nconst moonDef = {id:'moon', name:'Moon', r:.55, mission:true, cols:['#2A2D33','#8D9196','#E3E5E6','#14161C']};\nconst moonMesh = new THREE.Mesh(new THREE.SphereGeometry(moonDef.r,48,48), planetMat(moonDef.cols,[1,.2,.5],2.2));\nconst moonPivot = new THREE.Group(); earth.group.add(moonPivot); moonPivot.add(moonMesh); moonMesh.position.set(3.3,0,0);\nconst moonHit = new THREE.Mesh(new THREE.SphereGeometry(1.4,10,10), new THREE.MeshBasicMaterial({visible:false})); moonHit.userData.id='moon'; moonMesh.add(moonHit); hitTargets.push(moonHit);\nconst moonMarker = new THREE.Mesh(new THREE.RingGeometry(.9,.96,48), new THREE.MeshBasicMaterial({color:0xC2643A, transparent:true, opacity:.7, side:THREE.DoubleSide, depthWrite:false})); moonMesh.add(moonMarker);\nconst moonBody = {...moonDef, mesh:moonMesh, marker:moonMarker};\n\n\n// corner stars (2D, top-right only)\nconst skyC=document.getElementById('sky');let SK=null;\nfunction initSky(){const r=skyC.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.5);skyC.width=r.width*d;skyC.height=r.height*d;const x=skyC.getContext('2d');x.setTransform(d,0,0,d,0,0);\n  let s=7;const R=()=>(s=(s*16807)%2147483647)/2147483647;const st=[];\n  for(let k=0;k<420;k++){const px=r.width*(1-Math.pow(R(),1.4)*.6),py=r.height*Math.pow(R(),1.5)*.75,dx=(r.width-px)/(r.width*.6),dy=py/(r.height*.75);if(dx*dx+dy*dy>.75)continue;st.push({x:px,y:py,s:R()<.06?1.8:R()*.9+.3,p:R()*6,w:R()<.12})}\n  SK={x,w:r.width,h:r.height,st}}\nfunction drawSky(t){if(!SK)return;const {x}=SK;x.clearRect(0,0,SK.w,SK.h);for(const s of SK.st){x.globalAlpha=reduce?.85:.4+.6*Math.abs(Math.sin(t/1300+s.p));x.fillStyle=s.w?'#F2C27A':'#fff';x.beginPath();x.arc(s.x,s.y,s.s,0,7);x.fill()}}\n\n// ---------- Interaction ----------\nconst ray = new THREE.Raycaster(), mouse = new THREE.Vector2();\nconst tagEl = document.getElementById('tag'), briefEl = document.getElementById('brief'), promptEl = document.getElementById('prompt');\nlet hovered=null, selected=null, yaw=0, pitch=0, drag=null;\nconst camTarget = new THREE.Vector3(), lookAt = new THREE.Vector3(), lookGoal = new THREE.Vector3();\nconst allBodies = () => [...bodies, moonBody];\nconst byId = id => allBodies().find(b=>b.id===id);\nconst worldPos = b => b.mesh.getWorldPosition(new THREE.Vector3());\n\nfunction pick(e){\n  const r=canvas.getBoundingClientRect(); mouse.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);\n  ray.setFromCamera(mouse,camera); const h=ray.intersectObjects(hitTargets,false);\n  // prefer the moon when both hit\n  const m=h.find(x=>x.object.userData.id==='moon'); return (m||h[0])?.object.userData.id||null;\n}\ncanvas.addEventListener('pointermove',e=>{\n  if(drag){ yaw += (e.clientX-drag.x)*0.004; pitch = Math.max(-.5,Math.min(.6,pitch+(e.clientY-drag.y)*0.003)); drag={x:e.clientX,y:e.clientY,moved:true}; return; }\n  const id=pick(e); hovered=id; canvas.style.cursor=id?'pointer':'grab';\n  if(id){const b=byId(id); tagEl.innerHTML = b.mission? `<b>${b.name}<\/b> \u00b7 ${MISSIONS[id].name}` : `${b.name} \u00b7 no mission yet`;\n    tagEl.style.left=e.clientX+'px'; tagEl.style.top=e.clientY+'px'; tagEl.style.opacity=1;} else tagEl.style.opacity=0;\n});\ncanvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:false}; canvas.setPointerCapture(e.pointerId)});\ncanvas.addEventListener('pointerup',e=>{const wasDrag=drag&&drag.moved; drag=null; if(!wasDrag){const id=pick(e); if(id) select(id);}});\ncanvas.addEventListener('pointerleave',()=>{tagEl.style.opacity=0});\n\nfunction select(id){\n  selected=id; const b=byId(id); tagEl.style.opacity=0; promptEl.classList.add('hide');\n  if(b.mission){ const m=MISSIONS[id];\n    briefEl.innerHTML = `<button class=\"t-round x\" type=\"button\" id=\"close\" aria-label=\"Close\"><svg><use href=\"#i-x\"/><\/svg><\/button><div class=\"b-body\"><div class=\"b-head\"><span class=\"t-ribbon\">Mission brief<\/span><h3>${m.name}<\/h3><span class=\"label\">${m.planet}<\/span>\n      <div class=\"t-stars\" aria-label=\"Difficulty ${m.diff} of 3\">${[1,2,3].map(i=>`<svg style=\"--sf:${i<=m.diff?'#F2A541':'#E4DED2'}\"><use href=\"#i-star\"/><\/svg>`).join('')}<\/div><\/div>\n      <p class=\"obj\">${m.obj}<\/p>\n      <div class=\"specs\">${m.specs.map(s=>`<div class=\"spec\"><b>${s[0]}<\/b><span>${s[1]}<\/span><\/div>`).join('')}<\/div>\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><span class=\"label\">Your goals<\/span><ul class=\"list\">${m.tasks.map(t=>`<li>${t}<\/li>`).join('')}<\/ul><\/div><\/div>\n      <div class=\"b-actions\"><button class=\"t-btn ghost\" type=\"button\" id=\"back\">Back<\/button><button class=\"t-btn primary\" type=\"button\" id=\"start\">Start mission<\/button><\/div>`;\n  } else {\n    briefEl.innerHTML = `<button class=\"t-round x\" type=\"button\" id=\"close\" aria-label=\"Close\"><svg><use href=\"#i-x\"/><\/svg><\/button><div class=\"b-body\"><div class=\"b-head\"><span class=\"t-ribbon\">Planet<\/span><h3>${b.name}<\/h3><\/div>\n      <p class=\"locked\">No mission here yet. Try Earth, the Moon or Mars.<\/p><\/div>\n      <div class=\"b-actions\"><button class=\"t-btn ghost\" type=\"button\" id=\"back\" style=\"flex:1\">Back to system<\/button><\/div>`;\n  }\n  briefEl.classList.add('open');\n  document.getElementById('back').onclick = deselect; document.getElementById('close').onclick = deselect;\n  const s=document.getElementById('start'); if(s) s.onclick=()=>{ s.textContent='Loading base\u2026'; };\n}\nfunction deselect(){ selected=null; briefEl.classList.remove('open'); promptEl.classList.remove('hide'); }\ndocument.getElementById('home').onclick = deselect;\naddEventListener('keydown',e=>{ if(e.key==='Escape') deselect(); });\n\n// quick-pick chips\nconst quick=document.getElementById('quick');\n[['earth','#2C5B65'],['moon','#8D9196'],['mars','#A73B42']].forEach(([id,c])=>{\n  const btn=document.createElement('button'); btn.type='button'; btn.innerHTML=`<i style=\"background:${c}\"><\/i>${byId(id).name}`; btn.onclick=()=>select(id); quick.appendChild(btn);});\n\n// ---------- Loop ----------\nfunction resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov = w<760?55:42; camera.updateProjectionMatrix(); }\naddEventListener('resize',()=>{resize();initSky()}); resize(); initSky();\nlet last=performance.now(), running=true;\ndocument.addEventListener('visibilitychange',()=>{ running=!document.hidden; if(running){last=performance.now(); requestAnimationFrame(tick);} });\nconst tmp=new THREE.Vector3();\nfunction tick(now){\n  if(!running) return;\n  const dt=Math.min((now-last)/1000,.05); last=now; const t=now/1000;\n  const speed = reduce?0 : selected? .15 : 1;\n  for(const b of bodies){\n    b.angle += dt*b.speed*0.25*speed;\n    b.group.position.set(Math.cos(b.angle)*b.a, 0, Math.sin(b.angle)*b.a*b.e);\n    b.mesh.rotation.y += dt*.25*(reduce?0:1);\n    b.mesh.material.uniforms.time.value=t;\n    const hv = (hovered===b.id||selected===b.id)?1:0; b.mesh.material.uniforms.hover.value += (hv-b.mesh.material.uniforms.hover.value)*.12;\n    if(b.marker){ b.marker.lookAt(camera.position); b.marker.material.opacity = selected? 0 : .45+.35*Math.sin(t*2.4); b.marker.scale.setScalar(1+.06*Math.sin(t*2.4)); }\n  }\n  moonPivot.rotation.y += dt*.6*speed; moonMesh.material.uniforms.time.value=t;\n  const mh=(hovered==='moon'||selected==='moon')?1:0; moonMesh.material.uniforms.hover.value += (mh-moonMesh.material.uniforms.hover.value)*.12;\n  moonMarker.lookAt(camera.position); moonMarker.material.opacity = selected?0:.45+.35*Math.sin(t*2.4+1);\n  sun.rotation.y += dt*.05; sunMat.uniforms.time.value=t;\n\n  // camera: overview orbit, or pan to the selected body\n  if(selected){\n    const b=byId(selected), p=worldPos(b);\n    const away = tmp.copy(p).normalize(); if(away.lengthSq()<1e-6) away.set(0,0,1);\n    const dist = (b.r||1)*7 + 4;\n    // stand on the sunward side, slightly above, offset so the planet sits left of the brief\n    camTarget.copy(p).addScaledVector(away,-dist*.55).add(new THREE.Vector3(0,dist*.45,0)).addScaledVector(new THREE.Vector3(-away.z,0,away.x), dist*.75);\n    lookGoal.copy(p);\n    if(innerWidth>760){ const right=new THREE.Vector3().subVectors ter-C', src:'NASA', model:'rocket-jupiter-c', h:6,  cost:15, time:1, cap:300},\n    {id:'r2',name:'Atlas',     src:'NASA', model:'rocket-atlas',     h:8,  cost:40, time:2, cap:800},\n    {id:'r3',name:'Saturn V',  src:'NASA', model:'rocket-saturn-v',  h:12, cost:90, time:3, cap:2000}]},\n  orbit:{label:'Orbit', where:'rocket', opts:[\n    {id:'o1',name:'Sun-sync 550 km', proc:'orbit', link:1, note:'Same light every pass'},\n    {id:'o2',name:'Low 400 km', proc:'orbit', cost:-3, link:.8, note:'Cheaper, fewer ground passes'}]},\n  bus:{label:'Bus', where:'craft', opts:[\n    {id:'b1',name:'Microsat bus', src:'NASA Satellite Kit', model:'kit-body-2', mass:90,  cost:20, time:6, pw:60, store:40},\n    {id:'b2',name:'Smallsat bus', src:'NASA Satellite Kit', model:'kit-body-3', mass:180, cost:35, time:8, pw:80, store:120},\n    {id:'b3',name:'Large bus',    src:'NASA Satellite Kit', model:'kit-body-1', mass:320, cost:55, time:10, pw:110, store:300}]},\n  power:{label:'Power', where:'craft', opts:[\n    {id:'p1',name:'Solar 250 W',   src:'NASA Satellite Kit', model:'kit-wings-1', mass:20, cost:6,  time:2, gen:250},\n    {id:'p2',name:'Solar 450 W',   src:'NASA Satellite Kit', model:'kit-wings-2', mass:42, cost:14, time:3, gen:450},\n    {id:'p3',name:'Solar 800 W',   src:'NASA Satellite Kit', model:'kit-wings-3', mass:75, cost:26, time:4, gen:800}]},\n  comms:{label:'Comms', where:'craft', opts:[\n    {id:'c1',name:'S-band radio', src:'NASA Satellite Kit', model:'kit-radio-1', mass:6,  cost:3,  time:2, down:20},\n    {id:'c2',name:'X-band radio', src:'NASA Satellite Kit', model:'kit-radio-2', mass:12, cost:9,  time:3, down:60, pw:30},\n    {id:'c3',name:'Laser link',   src:'NASA Satellite Kit', model:'kit-radio-3', mass:18, cost:24, time:5, down:200, pw:70}]},\n  inst:{label:'Instrument', where:'craft', opts:[\n    {id:'i1',name:'Visible camera',       proc:'scope',  mass:18, cost:10, time:3, pw:30,  data:12, sci:40},\n    {id:'i2',name:'Thermal IR imager',    src:'NASA', model:'infrared-camera', mass:38, cost:32, time:5, pw:110, data:35, sci:90},\n    {id:'i3',name:'Hyperspectral imager', proc:'scope2', mass:70, cost:58, time:8, pw:190, data:95, sci:100}]},\n  engine:{label:'Engine', where:'craft', opts:[\n    {id:'e1',name:'Cold gas',  proc:'nozzle-s', mass:10, cost:2,  time:1},\n    {id:'e2',name:'Hydrazine', proc:'nozzle-m', mass:28, cost:7,  time:2, pw:10},\n    {id:'e3',name:'Electric',  proc:'ion',      mass:22, cost:16, time:4, pw:160}]},\n};\nconst pick = {rocket:'r1', orbit:'o1', bus:'b1', power:'p1', comms:'c2', inst:null, engine:'e1'};\nconst LIMIT = {budget:180, time:12};\nconst optOf=(cat,id)=>PARTS[cat].opts.find(o=>o.id===id);\nconst opt=(cat)=>optOf(cat,pick[cat]);\nfunction totals(){\n  let mass=0,cost=0,time=0,pw=0,gen=0,data=0,down=0,store=0,cap=300,link=1;\n  for(const c in PARTS){const o=opt(c); if(!o) continue; mass+=o.mass||0; cost+=o.cost||0; time=Math.max(time,o.time||0); pw+=o.pw||0; gen+=o.gen||0; data+=o.data||0; down+=o.down||0; store+=o.store||0; if(o.cap) cap=o.cap; if(o.link) link=o.link;}\n  down*=link;\n  return {M:[\n    {k:'mass',icon:'mass',label:'Mass',val:`${mass} kg`,r:mass/cap,hint:`Too heavy for ${opt('rocket').name} (${cap} kg). Pick a bigger rocket or lighter parts.`},\n    {k:'budget',icon:'coin',label:'Budget',val:`$${cost}M`,r:cost/LIMIT.budget,hint:`Over the $${LIMIT.budget}M budget. Swap a part for a cheaper one.`},\n    {k:'power',icon:'bolt',label:'Power',val:`${pw}/${gen} W`,r:gen?pw/gen:2,hint:`Parts draw more power than the panels make. Fit bigger solar wings.`},\n    {k:'data',icon:'data',label:'Data',val:`${data}/${store} Gb`,r:store?data/store:0,hint:`The instrument fills storage too fast. Use a bigger bus.`},\n    {k:'comms',icon:'comms',label:'Comms',val:`${Math.round(down)} Gb/d`,r:data?data/Math.max(down,1):0,hint:`The radio can't send all the data home. Pick a faster radio.`},\n    {k:'time',icon:'time',label:'Time',val:`${time} mo`,r:time/LIMIT.time,hint:`Building takes longer than the ${LIMIT.time}-month deadline.`}]};\n}\nfunction fx(o){const a=[]; if(o.mass) a.push(['+'+o.mass+' kg','up']); if(o.cost) a.push([(o.cost>0?'+$':'-$')+Math.abs(o.cost)+'M',o.cost>0?'up':'good']); if(o.pw) a.push(['+'+o.pw+' W use','up']); if(o.gen) a.push([o.gen+' W','good']); if(o.data) a.push([o.data+' Gb/d','']); if(o.down) a.push([o.down+' Gb/d link','good']); if(o.cap) a.push(['lifts '+o.cap+' kg','good']); if(o.store) a.push([o.store+' Gb store','good']); if(o.time) a.push([o.time+' mo','']); if(o.note) a.push([o.note,'']); return a.map(x=>`<span class=\"${x[1]}\">${x[0]}<\/span>`).join('')}\n\n/* ================= HUD / callout / dock ================= */\nconst ic=(n)=>`<svg class=\"i\"><use href=\"#i-${n}\"/><\/svg>`;\nconst resEl=document.getElementById('res'); let lastVals={};\nfunction renderHUD(){const {M}=totals(); resEl.innerHTML=M.map(m=>{const st=m.r>1?'bad':m.r>.85?'warn':''; return `<div class=\"metric ${st} ${lastVals[m.k]&&lastVals[m.k]!==m.val?'bump':''}\" title=\"${m.label}\"><span class=\"ic\">${ic(m.icon)}<\/span>${m.val}<span class=\"mb\"><i style=\"width:${Math.min(m.r,1)*100}%\"><\/i><\/span><\/div>`}).join(''); M.forEach(m=>lastVals[m.k]=m.val);}\nconst calloutEl=document.getElementById('callout'); let step=0;\nconst STEPS=[['Step 1/3','Walk into the glowing spacecraft workshop.'],['Step 2/3','Find the Instrument row and pick one. Heavier means less fuel. Keep bars green!'],['Step 3/3','Head out to the launch pad and launch.'],['Done','Now design your own. Try other parts and beat your score.']];\nfunction setStep(n){step=n;const s=STEPS[n];calloutEl.style.animation='none';void calloutEl.offsetWidth;calloutEl.style.animation='';calloutEl.innerHTML=`<b>${s[0]}<\/b><span>${s[1]}<\/span><button class=\"skip\" type=\"button\" id=\"skip\">Skip<\/button>`;document.getElementById('skip').onclick=()=>{calloutEl.style.display='none'};}\nconst dockEl=document.getElementById('dock'); let launched=false;\nfunction renderDock(){const T=[['planet','Missions',''],['wrench','Rocket','rocket'],['sat','Spacecraft','craft'],['rocket','Launch pad','pad'],['console','Control',launched?'control':'lock']];\n  dockEl.innerHTML=T.map(t=>`<button class=\"tile ${t[2]==='lock'?'lock':''} ${(where===t[2]||openZone===t[2])?'on':''}\" type=\"button\" data-z=\"${t[2]}\">${t[2]==='control'&&launched?'<span class=\"new\">NEW<\/span>':''}${ic(t[2]==='lock'?'lock':t[0])}${t[1]}<\/button>`).join('');}\ndockEl.addEventListener('click',e=>{const b=e.target.closest('.tile');if(!b)return;const z=b.dataset.z;if(!z||z==='lock')return;\n  if(where!=='base'){ if(z===where) return; exitRoom(()=>walkTo(z)); } else walkTo(z);});\n\n/* ================= Renderer, camera ================= */\nconst canvas=document.getElementById('gl');\nconst renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});\nrenderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5)); renderer.setClearColor(0,0);\nconst scene=new THREE.Scene();\nconst cam=new THREE.OrthographicCamera(-1,1,1,-1,-300,500);\nscene.add(new THREE.HemisphereLight(0xFBFAF4,0x6E6457,.9)); const sun=new THREE.DirectionalLight(0xffffff,.9); sun.position.set(-20,40,14); scene.add(sun);\nconst ISO=new THREE.Vector3(1,0.82,1).normalize();\nlet camZoom=1, camZoomGoal=1;\n\n/* ================= Comet surface shader ================= */\nconst V=`varying vec3 vN; varying vec3 vW; void main(){ vN=normalize(mat3(modelMatrix)*normal); vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`;\nconst F=`uniform vec3 c0; uniform vec3 c1; uniform vec3 c2; uniform vec3 c3; uniform vec3 ax; uniform float fq; uniform float fade; uniform float glow;\nvarying vec3 vN; varying vec3 vW;\nfloat h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}\nvoid main(){\n  float t=dot(vW,normalize(ax))*fq + .35*sin(vW.x*.7+sin(vW.z*.9))*cos(vW.z*.6);\n  float b=fract(t);\n  vec3 col = b<.35?c0 : b<.55?mix(c0,c1,smoothstep(.35,.42,b)) : b<.78?mix(c1,c2,smoothstep(.55,.63,b)) : mix(c2,c0,smoothstep(.78,1.,b));\n  vec3 L=normalize(vec3(-.5,1.,.35)); float d=dot(normalize(vN),L);\n  vec3 c = mix(c3, col, smoothstep(-.4,.9,d)*.85+.15);\n  c += (h(gl_FragCoord.xy)-.5)*.10;\n  c = mix(c, col*1.25, glow);\n  float f = (1.0 - smoothstep(-9.0, -1.5, vW.y))*fade;\n  c = mix(c, vec3(.984,.980,.957), f);\n  gl_FragColor=vec4(c,1.);\n}`;\nconst hex=(x)=>new THREE.Color(x); const MC={};\nfunction mat(name,cols,ax=[1,0,.3],fq=.35,fade=1,glow=0){ if(MC[name]) return MC[name];\n  return MC[name]=new THREE.ShaderMaterial({vertexShader:V,fragmentShader:F,side:THREE.DoubleSide,uniforms:{c0:{value:hex(cols[0])},c1:{value:hex(cols[1])},c2:{value:hex(cols[2])},c3:{value:hex(cols[3])},ax:{value:new THREE.Vector3(...ax)},fq:{value:fq},fade:{value:fade},glow:{value:glow}}});}\nconst STONE=mat('stone',['#D7D0C0','#B9B0A0','#E8E2D4','#6E6457'],[1,0,.4],.28);\nconst FLOOR=mat('floor',['#E8E2D4','#D7D0C0','#F3EEE4','#8A8174'],[1,0,1],.12,0);\nconst WALL =mat('wall', ['#F3EEE4','#E8D9B8','#D7D0C0','#9B7751'],[0,1,.2],.18,0);\nconst DARK =mat('dark', ['#3A2E3E','#2A1E3A','#4A3A44','#120C1E'],[0,1,.2],.5);\nconst TEAL =mat('teal', ['#2C5B65','#1C3E46','#95B3B6','#0B1F24'],[.3,1,.2],.9,0);\nconst RUST =mat('rust', ['#C2643A','#A73B42','#E07A44','#4A1A14'],[.2,1,.3],.9,0);\nconst CREAM=mat('cream',['#FBFAF4','#E8D9B8','#D7D0C0','#9B7751'],[.1,1,.1],.9,0);\nconst GOLD =mat('gold', ['#F2C27A','#C9A55C','#F2A541','#6B5A3A'],[.4,1,.2],1.4,0);\nconst GLOWA=mat('glowa',['#F2A541','#F2C27A','#F2A541','#C2643A'],[0,1,0],1,0,.8);\nconst trimMat=new THREE.LineBasicMaterial({color:0xC2643A});\n\n/* ================= Builders (add to the current root group) ================= */\nlet root=scene;\nfunction box(w,h,d,m,x,y,z,trim=true){const g=new THREE.BoxGeometry(w,h,d);const me=new THREE.Mesh(g,m);me.position.set(x,y,z);root.add(me);\n  if(trim){const e=new THREE.LineSegments(new THREE.EdgesGeometry(g),trimMat);e.position.copy(me.position);root.add(e);}return me;}\nfunction cyl(rt,rb,h,m,x,y,z,seg=24){const me=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),m);me.position.set(x,y,z);root.add(me);return me;}\nfunction ring(x,z,r1=1,r2=1.25){const m=new THREE.Mesh(new THREE.RingGeometry(r1,r2,40),new THREE.MeshBasicMaterial({color:0xF2A541,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.set(x,.05,z);root.add(m);return m;}\nfunction label(text,x,y,z,w=3.2){const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d');\n  g.fillStyle='#FBFAF4';g.strokeStyle='#1A1206';g.lineWidth=10;const r=34;g.beginPath();g.roundRect?g.roundRect(8,8,496,104,r):g.rect(8,8,496,104);g.fill();g.stroke();\n  g.fillStyle='#1A1206';g.font=\"400 54px 'Game Paused', Silkscreen, monospace\";g.textAlign='center';g.textBaseline='middle';g.fillText(text,256,66);\n  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));s.scale.set(w,w/4,1);s.position.set(x,y,z);s.renderOrder=5;root.add(s);return s;}\n\n/* ================= NASA model loading ================= */\nconst loader=new THREE.GLTFLoader(); const MODELS={};\nconst MODEL_FILES=['kit-body-1','kit-body-2','kit-body-3','kit-wings-1','kit-wings-2','kit-wings-3','kit-radio-1','kit-radio-2','kit-radio-3','infrared-camera','landsat-8','rocket-jupiter-c','rocket-atlas','rocket-saturn-v'];\n// Bake every mesh into one geometry (one draw call per model), drop NASA textures/logos, keep shape only.\n// Original NASA colours, minus markings: each texture is replaced by its dominant colour (this removes all\n// lettering such as \"USA\"/\"UNITED STATES\"); meshes are merged per material to keep draw calls low.\nfunction dominant(img){ try{ const c=document.createElement('canvas'); c.width=c.height=24; const g=c.getContext('2d'); g.drawImage(img,0,0,24,24);\n  const d=g.getImageData(0,0,24,24).data, n={}; let best=null,bc=0; for(let i=0;i<d.length;i+=4){ const k=(d[i]>>4)+','+(d[i+1]>>4)+','+(d[i+2]>>4); n[k]=(n[k]||0)+1; if(n[k]>bc){bc=n[k];best=[d[i],d[i+1],d[i+2]];} }\n  return new THREE.Color(best[0]/255,best[1]/255,best[2]/255); }catch(e){ return new THREE.Color(1,1,1); } }\nfunction bake(gltf){ gltf.scene.updateMatrixWorld(true); const all=[], byMat=new Map(); const v=new THREE.Vector3();\n  gltf.scene.traverse(o=>{ if(!o.isMesh||!o.geometry) return; const g=o.geometry, P=g.getAttribute('position'), I=g.index; const arr=[];\n    const n=I?I.count:P.count; for(let i=0;i<n;i++){ const k=I?I.getX(i):i; v.fromBufferAttribute(P,k).applyMatrix4(o.matrixWorld); arr.push(v.x,v.y,v.z); }\n    all.push(...arr); const m=Array.isArray(o.material)?o.material[0]:o.material; if(!byMat.has(m)) byMat.set(m,[]); byMat.get(m).push(...arr); });\n  const geo=a=>{const out=new THREE.BufferGeometry(); out.setAttribute('position',new THREE.Float32BufferAttribute(a,3)); out.computeVertexNormals(); return out;};\n  const parts=[...byMat].map(([m,a])=>{ const col=(m&&m.color?m.color.clone():new THREE.Color(1,1,1)); if(m&&m.map&&m.map.image) col.multiply(dominant(m.map.image));\n    return {geo:geo(a), mat:new THREE.MeshStandardMaterial({color:col, roughness:.55, metalness:Math.min(m&&m.metalness||0,.35), side:THREE.DoubleSide})}; });\n  return {merged:geo(all), parts}; }\n// Models ship as base64 text (models/<name>.txt) because the page host serves no .glb type; decode and parse in memory.\nfunction b64ToBuf(s){ const bin=atob(s.trim()); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u.buffer; }\nfunction loadAll(){ return Promise.all(MODEL_FILES.map(n=>fetch(`models/${n}.txt`).then(r=>{ if(!r.ok) throw 0; return r.text(); })\n  .then(t=>new Promise(res=>loader.parse(b64ToBuf(t),'',g=>{MODELS[n]=bake(g);res();},()=>{console.warn('model failed',n);res();})))\n  .catch(()=>console.warn('model failed',n)))); }\n// Make an object from a model, scaled so its largest side (or height for rockets) = size, sitting on y=0.\n// material = a palette material, or null for the original NASA colours.\nfunction fromModel(name,material,size,{upright=false}={}){\n  const M=MODELS[name]; const grp=new THREE.Group(); if(!M) return grp;\n  const holder=new THREE.Group(); if(material) holder.add(new THREE.Mesh(M.merged,material)); else for(const p of M.parts) holder.add(new THREE.Mesh(p.geo,p.mat));\n  M.merged.computeBoundingBox(); const s=new THREE.Vector3(); M.merged.boundingBox.getSize(s);\n  if(upright){ if(s.z>s.y&&s.z>=s.x) holder.rotation.x=-Math.PI/2; else if(s.x>s.y&&s.x>s.z) holder.rotation.z=Math.PI/2; }\n  const inner=new THREE.Group(); inner.add(holder); inner.updateMatrixWorld(true);\n  const bb=new THREE.Box3().setFromObject(inner); bb.getSize(s); const k=size/(upright?s.y:Math.max(s.x,s.y,s.z));\n  inner.scale.setScalar(k); inner.updateMatrixWorld(true); const bb2=new THREE.Box3().setFromObject(inner); const c=new THREE.Vector3(); bb2.getCenter(c);\n  inner.position.set(-c.x,-bb2.min.y,-c.z); grp.add(inner); return grp; }\n// Procedural stand-ins (NASA publishes no separate model for these parts)\nfunction procPart(kind){ const g=new THREE.Group();\n  const lathe=(pts,m)=>{const me=new THREE.Mesh(new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),32),m);g.add(me);return me;};\n  if(kind==='scope'){ const t=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,1.1,24),CREAM);t.rotation.z=Math.PI/2;t.position.y=.6;g.add(t); const l=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.06,24),TEAL);l.rotation.z=Math.PI/2;l.position.set(.56,.6,0);g.add(l); const bse=new THREE.Mesh(new THREE.BoxGeometry(.8,.25,.6),RUST);bse.position.y=.12;g.add(bse);}\n  if(kind==='scope2'){ const b=new THREE.Mesh(new THREE.BoxGeometry(1.1,.9,.9),CREAM);b.position.y=.55;g.add(b); for(let i=0;i<3;i++){const l=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,.3,18),TEAL);l.rotation.z=Math.PI/2;l.position.set(.68,.35+i*.22,0);g.add(l);} const f=new THREE.Mesh(new THREE.BoxGeometry(1.2,.12,1),RUST);f.position.y=.06;g.add(f);}\n  if(kind==='nozzle-s'){ lathe([[0,0],[.18,0],[.12,.35],[.22,.7],[0,.7]],GOLD); }\n  if(kind==='nozzle-m'){ lathe([[0,1.2],[.25,1.2],[.25,.9],[.12,.75],[.45,0],[.4,0],[.1,.7],[0,.7]],GOLD); const t=new THREE.Mesh(new THREE.SphereGeometry(.3,20,14),CREAM);t.position.y=1.45;g.add(t);}\n  if(kind==='ion'){ const c=new THREE.Mesh(new THREE.CylinderGeometry(.5,.55,.6,32),DARK);c.position.y=.3;g.add(c); const grid=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.04,32),GLOWA);grid.position.y=.62;g.add(grid);}\n  if(kind==='orbit'){ const e=new THREE.Mesh(new THREE.SphereGeometry(.45,24,16),TEAL);e.position.y=1;g.add(e); const o=new THREE.Mesh(new THREE.TorusGeometry(.85,.03,8,64),GLOWA);o.position.y=1;o.rotation.x=1.2;g.add(o);}\n  return g; }\nconst PART_MAT={bus:CREAM,power:TEAL,comms:RUST,inst:CREAM,engine:GOLD,rocket:CREAM};\nfunction partObject(cat,o,size){ return o.model? fromModel(o.model,null,size,{upright:cat==='rocket'}) : (()=>{const p=procPart(o.proc);p.scale.setScalar(size/1.4);return p;})(); }\n\n/* ================= Areas (base + two walk-in rooms) ================= */\nconst AREAS={}; let where='base';\nfunction area(name){ const g=new THREE.Group(); g.visible=false; scene.add(g); AREAS[name]={group:g,walk:[],block:[],spots:[]}; return AREAS[name]; }\nconst DECK_H=1.2;\n\n// ---------- BASE ----------\nfunction buildBase(){\n  const A=area('base'); root=A.group;\n  const DECKS=[[-5,-5,5,5],[-19,-4,-11,4],[-11,-1.2,-5,1.2],[11,-4,19,4],[5,-1.2,11,1.2],[-4,-21,4,-11],[-1.2,-11,1.2,-5],[-4,11,4,19],[-1.2,5,1.2,11]];\n  for(const [x0,z0,x1,z1] of DECKS){ const w=x1-x0,d=z1-z0,cx=(x0+x1)/2,cz=(z0+z1)/2; box(w,DECK_H,d,STONE,cx,-DECK_H/2,cz);\n    if(Math.min(w,d)>=3){ for(const [px,pz] of [[x0+.8,z0+.8],[x1-.8,z0+.8],[x0+.8,z1-.8],[x1-.8,z1-.8]]) box(1.1,10,1.1,DARK,px,-DECK_H-5,pz,false); }\n    else { const along=w>d; const l1=[],l2=[]; for(let i=0;i<=24;i++){const t=i/24,y=-DECK_H-1.6*Math.sin(Math.PI*t); l1.push(along?new THREE.Vector3(x0+t*w,y,z0):new THREE.Vector3(x0,y,z0+t*d)); l2.push(along?new THREE.Vector3(x0+t*w,y,z1):new THREE.Vector3(x1,y,z0+t*d));}\n      for(const L of [l1,l2]) root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(L),trimMat)); } }\n  A.walk=DECKS.map(([x0,z0,x1,z1])=>{const w=x1-x0,d=z1-z0; if(Math.min(w,d)<3) return w>d?[x0-1,z0,x1+1,z1]:[x0,z0-1,x1,z1+1]; return [x0,z0,x1,z1];});\n  A.decks=DECKS;\n  A.block=[[-18,-2.7,-12,2.7],[12.3,-2.7,17.7,2.7],[-2.3,12.7,2.3,17.3],[-3.4,-19.4,3.4,-12.6]];\n  for(const [x,z] of [[-3.5,-3.5],[3.5,-3.5],[-3.5,3.5],[3.5,3.5],[0,-3.8],[0,3.8]]) cyl(.32,.32,.06,GLOWA,x,.03,z,16);\n  // rocket workshop\n  box(6,3.2,5.4,CREAM,-15,1.6,0); box(6.3,.5,5.7,RUST,-15,3.45,0); box(.15,2.2,2.6,DARK,-11.95,1.1,0,false);\n  for(let i=0;i<3;i++) box(.7,.7,.7,RUST,-17.6+i*.9,.35,3.2);\n  // spacecraft workshop\n  box(5.4,2.8,5.4,CREAM,15,1.4,0); const dome=new THREE.Mesh(new THREE.SphereGeometry(2.2,32,16,0,Math.PI*2,0,Math.PI/2),TEAL); dome.position.set(15,2.8,0); root.add(dome);\n  box(.15,2,2.4,DARK,12.25,1,0,false); cyl(.45,.45,1.6,TEAL,17.6,.8,3.2);\n  // launch pad with NASA gantry; rocket gets swapped to the chosen NASA rocket\n  cyl(3.2,3.4,.4,DARK,0,.2,-16,40); cyl(2.6,2.6,.06,GLOWA,0,.43,-16,40); cyl(2.3,2.3,.08,STONE,0,.47,-16,40);\n  box(.9,8,.9,DARK,2.4,4,-16); for(let i=1;i<4;i++) box(1.8,.18,.18,RUST,1.5,i*2,-16,false); // service tower\n  padRocket=new THREE.Group(); padRocket.position.set(0,.5,-16); root.add(padRocket);\n  flame=new THREE.Mesh(new THREE.ConeGeometry(.6,2.4,16),new THREE.MeshBasicMaterial({color:0xF2A541,transparent:true,opacity:0})); flame.rotation.x=Math.PI; flame.position.y=-1.1; padRocket.add(flame);\n  // mission control tower\n  box(4.6,5.5,4.6,DARK,0,2.75,15); box(5,.5,5,RUST,0,5.75,15);\n  for(let i=0;i<3;i++){const d=cyl(.28,.28,.1,GLOWA,-1.2+i*1.2,4.2,12.68,16); d.rotation.x=Math.PI/2;}\n  lockSprite=label('LOCKED',0,7.4,15,3);\n  for(const [x,z] of [[-4,-2],[-3.2,-2.6],[4,2.6],[3.3,3.4],[-17,-3.2]]) box(.8,.8,.8,RUST,x,.4,z);\n  for(const [x,z] of [[-5,5],[5,-5],[-12,1.2],[12,-1.2]]){ cyl(.08,.08,2.4,DARK,x,1.2,z,8); cyl(.35,.35,.12,GLOWA,x,2.45,z,16); }\n  // door spots\n  A.spots=[\n    {id:'rocket', pos:new THREE.Vector3(-10.4,0,0), ring:ring(-10.4,0), label:'Enter Rocket workshop', act:()=>enterRoom('rocket')},\n    {id:'craft',  pos:new THREE.Vector3(10.6,0,0),  ring:ring(10.6,0),  label:'Enter Spacecraft workshop', act:()=>enterRoom('craft')},\n    {id:'pad',    pos:new THREE.Vector3(0,0,-9.4),  ring:ring(0,-9.4),  label:'Launch pad', act:()=>openWin('pad')},\n    {id:'control',pos:new THREE.Vector3(0,0,10),    ring:ring(0,10),    label:'Mission control', act:()=>openWin('control')}];\n  A.spawn={rocket:new THREE.Vector3(-9.6,0,0), craft:new THREE.Vector3(9.8,0,0), start:new THREE.Vector3(0,0,2)};\n}\nlet padRocket, flame, lockSprite;\nfunction refreshPadRocket(){ if(!padRocket) return; [...padRocket.children].forEach(c=>{if(c!==flame) padRocket.remove(c)}); const o=opt('rocket'); const r=fromModel(o.model,null,Math.min(o.h,9),{upright:true}); padRocket.add(r); }\n\n// ---------- ROOM helper: an isometric hall with two back walls ----------\nfunction buildHall(A,x0,z0,x1,z1,title){\n  const w=x1-x0,d=z1-z0; box(w,.6,d,FLOOR,(x0+x1)/2,-.3,(z0+z1)/2);\n  for(let x=x0;x<=x1;x+=2){ const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,.01,z0),new THREE.Vector3(x,.01,z1)]),new THREE.LineBasicMaterial({color:0xD7D0C0})); root.add(l); }\n  for(let z=z0;z<=z1;z+=2){ const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x0,.01,z),new THREE.Vector3(x1,.01,z)]),new THREE.LineBasicMaterial({color:0xD7D0C0})); root.add(l); }\n  box(w,5,.4,WALL,(x0+x1)/2,2.5,z0-.2); box(.4,5,d,WALL,x0-.2,2.5,(z0+z1)/2);\n  box(w,.35,.5,RUST,(x0+x1)/2,5.1,z0-.2); box(.5,.35,d,RUST,x0-.2,5.1,(z0+z1)/2);\n  // round windows with stars on the back wall\n  for(let x=x0+3;x<x1-1;x+=6){ const win=new THREE.Mesh(new THREE.CircleGeometry(.9,32),DARK); win.position.set(x,3.1,z0+.02); root.add(win); const rim=new THREE.Mesh(new THREE.RingGeometry(.9,1.08,32),GLOWA); rim.position.set(x,3.1,z0+.03); root.add(rim); }\n  A.walk=[[x0,z0,x1,z1]];\n  label(title,x0+5,6.2,z0+.2,6);\n}\nfunction pedestal(x,z,top){ cyl(.95,1.05,.5,DARK,x,.25,z,32); cyl(.82,.82,.05,top||STONE,x,.52,z,32); }\n\n// ---------- SPACECRAFT WORKSHOP ----------\nconst exhibits=[]; let buildBay;\nfunction buildCraftRoom(){\n  const A=area('craft'); root=A.group; buildHall(A,-16,-12,16,12,'Spacecraft workshop');\n  const rows=['bus','power','comms','inst','engine'];\n  rows.forEach((cat,ri)=>{ const z=-9+ri*4.2; label(PARTS[cat].label.toUpperCase(),-2.6,1.6,z,3.4);\n    PARTS[cat].opts.forEach((o,oi)=>{ const x=1.5+oi*4.6; pedestal(x,z); const obj=partObject(cat,o,1.7); obj.position.set(x,.56,z); root.add(obj); exhibits.push({obj,cat,id:o.id,spin:Math.random()*6});\n      A.spots.push({id:o.id,cat,o,pos:new THREE.Vector3(x+1.3,0,z+1.3),ring:ring(x,z,1.15,1.35),kind:'part'}); A.block.push([x-1.05,z-1.05,x+1.05,z+1.05]); }); });\n  // build bay: assembled craft from current picks\n  cyl(2.6,2.8,.4,DARK,-10,.2,-3,40); cyl(2.3,2.3,.05,GLOWA,-10,.43,-3,40); label('BUILD BAY',-10,5.4,-3,4.2);\n  buildBay=new THREE.Group(); buildBay.position.set(-10,.5,-3); root.add(buildBay); A.block.push([-12.8,-5.8,-7.2,-.2]);\n  // NASA Landsat 8 on display (hall of fame)\n  pedestal(-11,7); const ls=fromModel('landsat-8',CREAM,3.2); ls.position.set(-11,.56,7); root.add(ls); label('LANDSAT 8',-11,4.6,7,3.6); A.block.push([-12.1,5.9,-9.9,8.1]);\n  A.spots.push({id:'exit',pos:new THREE.Vector3(-2,0,10.6),ring:ring(-2,10.6),label:'Exit to base',act:()=>exitRoom()});\n  label('EXIT',-2,1.8,11.6,2.2);\n  A.spawn=new THREE.Vector3(-2,0,9.4);\n}\nfunction refreshBuildBay(){ if(!buildBay) return; buildBay.clear(); const s=new THREE.Group(); buildBay.add(s);\n  const bus=opt('bus'); if(bus){ const b=partObject('bus',bus,1.8); s.add(b); }\n  const pw=opt('power'); if(pw){ for(const side of [-1,1]){ const w=partObject('power',pw,1.6); w.position.set(side*1.6,.6,0); w.rotation.y=side>0?0:Math.PI; s.add(w);} }\n  const cm=opt('comms'); if(cm){ const c=partObject('comms',cm,1.0); c.position.set(0,1.75,0); s.add(c); }\n  const ins=opt('inst'); if(ins){ const i=partObject('inst',ins,.9); i.position.set(0,.2,1.05); s.add(i); }\n  const en=opt('engine'); if(en){ const e=partObject('engine',en,.7); e.position.set(0,-.05,-1.1); e.rotation.x=-Math.PI/2; s.add(e); }\n  s.position.y=.4; }\n\n// ---------- ROCKET WORKSHOP ----------\nfunction buildRocketRoom(){\n  const A=area('rocket'); root=A.group; buildHall(A,-14,-10,14,10,'Rocket workshop');\n  label('ROCKETS',-10,2,-6,3.4);\n  PARTS.rocket.opts.forEach((o,i)=>{ const x=-4+i*7, z=-5; cyl(2,2.1,.5,DARK,x,.25,z,32); cyl(1.8,1.8,.05,STONE,x,.52,z,32);\n    const r=fromModel(o.model,null,o.h,{upright:true}); r.position.set(x,.55,z); root.add(r); exhibits.push({obj:r,cat:'rocket',id:o.id,rocket:true});\n    label(o.name.toUpperCase(),x,o.h+1.8,z,3.6);\n    A.spots.push({id:o.id,cat:'rocket',o,pos:new THREE.Vector3(x,0,z+3),ring:ring(x,z,2.15,2.4),kind:'part'}); A.block.push([x-2.1,z-2.1,x+2.1,z+2.1]); });\n  label('ORBIT',-10,2,3.5,3);\n  PARTS.orbit.opts.forEach((o,i)=>{ const x=-3+i*7, z=3.5; cyl(.7,.9,1.1,DARK,x,.55,z,24); const p=procPart('orbit'); p.position.set(x,.9,z); root.add(p); exhibits.push({obj:p,cat:'orbit',id:o.id});\n    label(o.name.toUpperCase(),x,3.6,z,4.2); A.spots.push({id:o.id,cat:'orbit',o,pos:new THREE.Vector3(x+1.6,0,z+1.6),ring:ring(x,z,1.05,1.3),kind:'part'}); A.block.push([x-.95,z-.95,x+.95,z+.95]); });\n  A.spots.push({id:'exit',pos:new THREE.Vector3(10,0,8.6),ring:ring(10,8.6),label:'Exit to base',act:()=>exitRoom()});\n  label('EXIT',10,1.8,9.6,2.2);\n  A.spawn=new THREE.Vector3(10,0,7.4);\n}\n\n/* ================= Character ================= */\nconst SUIT=mat('suit',['#FBFAF4','#E8E2D4','#FBFAF4','#9C968C'],[0,1,0],.8,0);\nconst hero=new THREE.Group(); scene.add(hero);\nconst body=new THREE.Mesh(new THREE.CylinderGeometry(.42,.46,.9,20),SUIT); body.position.y=.95; hero.add(body);\nconst pack=new THREE.Mesh(new THREE.BoxGeometry(.6,.65,.3),RUST); pack.position.set(0,1.0,-.42); hero.add(pack);\nconst head=new THREE.Mesh(new THREE.SphereGeometry(.42,24,16),SUIT); head.position.y=1.72; hero.add(head);\nconst visor=new THREE.Mesh(new THREE.SphereGeometry(.3,20,12,0,Math.PI,0,Math.PI),TEAL); visor.position.set(0,1.74,.18); hero.add(visor);\nconst legs=[-.18,.18].map(x=>{const l=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.55,10),SUIT); l.position.set(x,.3,0); hero.add(l); return l;});\nconst shadow=new THREE.Mesh(new THREE.CircleGeometry(.55,24),new THREE.MeshBasicMaterial({color:0x1A1206,transparent:true,opacity:.18,depthWrite:false})); shadow.rotation.x=-Math.PI/2; shadow.position.y=.02; hero.add(shadow);\n\n/* ================= Movement & routing ================= */\nconst keys={}; addEventListener('keydown',e=>{const k=e.key.toLowerCase(); keys[k]=true; if(k==='e') interact(); if(e.key==='Escape'){ if(openZone) closeWin(); }});\naddEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});\nlet joyV={x:0,y:0}; const joy=document.getElementById('joy'), knob=joy.querySelector('i');\njoy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);moveJoy(e)}); joy.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')moveJoy(e)});\njoy.addEventListener('pointerup',()=>{joyV={x:0,y:0};knob.style.transform=''});\nfunction moveJoy(e){const r=joy.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}joyV={x,y};knob.style.transform=`translate(${x*34}px,${y*34}px)`}\nconst A=()=>AREAS[where];\nconst onWalk=(x,z)=>A().walk.some(([x0,z0,x1,z1])=>x>x0+.35&&x<x1-.35&&z>z0+.35&&z<z1-.35);\nconst blocked=(x,z)=>A().block.some(([x0,z0,x1,z1])=>x>x0&&x<x1&&z>z0&&z<z1);\nlet autoTarget=null, queue=[];\nconst deckOf=(x,z)=>(A().decks||A().walk).findIndex(([x0,z0,x1,z1])=>x>=x0&&x<=x1&&z>=z0&&z<=z1);\nfunction route(p){ const h=hero.position;\n  if(where!=='base'||deckOf(h.x,h.z)===deckOf(p.x,p.z)) queue=[p];\n  else queue=[new THREE.Vector3(Math.abs(h.x)>5?Math.sign(h.x)*4:0,0,Math.abs(h.z)>5?Math.sign(h.z)*4:0),new THREE.Vector3(0,0,0),new THREE.Vector3(Math.abs(p.x)>5?Math.sign(p.x)*4:0,0,Math.abs(p.z)>5?Math.sign(p.z)*4:0),p];\n  autoTarget=queue.shift(); }\nfunction walkTo(id){ closeWin(); const s=AREAS.base.spots.find(s=>s.id===id); if(s) route(s.pos.clone()); }\ncanvas.addEventListener('click',e=>{ if(transitioning) return; const r=canvas.getBoundingClientRect(); const ndc=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);\n  const ray=new THREE.Raycaster(); ray.setFromCamera(ndc,cam); const p=new THREE.Vector3(); if(ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),p)){\n    // tap a spot (door, pedestal) \u2192 walk to it; otherwise walk to the floor point\n    const s=A().spots.find(s=>s.ring.position.distanceTo(new THREE.Vector3(p.x,.05,p.z))<1.6); if(s) route(s.pos.clone()); else if(onWalk(p.x,p.z)&&!blocked(p.x,p.z)) route(p); }});\n\n/* ================= Interaction ================= */\nconst enterEl=document.getElementById('enter'), winEl=document.getElementById('win'), infoEl=document.getElementById('info');\nlet near=null, openZone=null;\nenterEl.onclick=()=>interact();\nfunction interact(){ if(!near||transitioning) return; if(near.kind==='part') choose(near); else if(near.act) near.act(); }\nfunction choose(s){ pick[s.cat]=s.id; renderHUD(); refreshBuildBay(); if(s.cat==='rocket') refreshPadRocket(); showInfo(s,true); if(s.cat==='inst'&&step===1) setStep(2); }\nfunction showInfo(s,force){ if(!s||s.kind!=='part'){ infoEl.classList.remove('show'); infoEl.dataset.id=''; return; }\n  if(!force&&infoEl.dataset.id===s.id) return; infoEl.dataset.id=s.id; const on=pick[s.cat]===s.id;\n  infoEl.innerHTML=`<div class=\"row\"><div><div class=\"cat\">${PARTS[s.cat].label.toUpperCase()}<\/div><h4>${s.o.name}<\/h4><div class=\"src\">${s.o.model?'Model: '+s.o.src:'Model: Horizons stand-in'}<\/div><\/div>\n    <button class=\"t-btn ${on?'':'primary'}\" type=\"button\" id=\"pickbtn\">${on?'Picked \u2713':'Pick'} <kbd style=\"font:400 10px var(--f-num);border:2px solid var(--ink);border-radius:5px;padding:0 4px;margin-left:4px;background:#fff\">E<\/kbd><\/button><\/div><div class=\"fx\">${fx(s.o)}<\/div>`;\n  infoEl.classList.add('show'); document.getElementById('pickbtn').onclick=()=>choose(s); }\n\n/* ================= Windows (pad / control) ================= */\nfunction openWin(z){ if(z==='control'&&!launched){ toastMsg('Locked until launch'); return; } openZone=z; autoTarget=null; enterEl.style.display='none'; renderWin(); renderDock(); }\nfunction closeWin(){ openZone=null; winEl.classList.remove('open'); renderDock(); }\nfunction renderWin(){ const z=openZone; if(!z) return; let body='',foot='';\n  if(z==='pad'){ const {M}=totals(); const bad=M.filter(m=>m.r>1); const missing=Object.keys(PARTS).filter(c=>!pick[c]);\n    body=`<ul class=\"check\">${M.map(m=>`<li class=\"${m.r>1?'bad':''}\"><i><\/i>${m.label}<small>${m.val}<\/small><\/li>`).join('')}<\/ul>`+(missing.length?`<div class=\"hint\">Missing: ${missing.map(c=>PARTS[c].label).join(', ')}. Visit the spacecraft workshop.<\/div>`:bad.length?`<div class=\"hint\">${bad[0].hint}<\/div>`:'');\n    foot=`<button class=\"t-btn primary\" type=\"button\" id=\"launch\" ${bad.length||missing.length||launched?'disabled':''}>${launched?'Launched':'Launch on '+opt('rocket').name}<\/button>`; }\n  else { body=`<div class=\"hint\" style=\"background:rgba(76,195,138,.2)\">Your spacecraft is on its way. The full mission control console comes next.<\/div>`; foot=`<button class=\"t-btn ghost\" type=\"button\" data-close>Close<\/button>`; }\n  winEl.innerHTML=`<div class=\"w-head\"><span class=\"t-ribbon\">${z==='pad'?'Launch pad':'Mission control'}<\/span><h3>${z==='pad'?'Pre-launch check':'Mission control'}<\/h3><p>${z==='pad'?'All bars must be green to launch.':''}<\/p><button class=\"t-round x\" type=\"button\" data-close aria-label=\"Close\">${ic('x')}<\/button><\/div><div class=\"w-body\">${body}<\/div><div class=\"w-foot\">${foot}<\/div>`;\n  winEl.classList.add('open'); const L=document.getElementById('launch'); if(L) L.onclick=doLaunch; }\nwinEl.addEventListener('click',e=>{ if(e.target.closest('[data-close]')) closeWin(); });\nfunction toastMsg(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='none';void el.offsetWidth;el.style.display='block';clearTimeout(toastMsg.t);toastMsg.t=setTimeout(()=>el.style.display='none',1600);}\nlet launchT=-1; function doLaunch(){ launched=true; closeWin(); launchT=0; toastMsg('Liftoff!'); setStep(3); renderDock(); }\n\n/* ================= Room transitions: camera pushes into the door, cream wipe, swap ================= */\nconst wipe=document.getElementById('wipe'), roomName=document.getElementById('roomname');\nlet transitioning=false; const camFocus=new THREE.Vector3(0,0,2), focusGoal=new THREE.Vector3();\nfunction swapTo(name,spawn){ for(const k in AREAS) AREAS[k].group.visible=(k===name); where=name; hero.position.copy(spawn); camFocus.copy(spawn); near=null; showInfo(null);\n  roomName.style.display=name==='base'?'none':'block'; roomName.querySelector('.t-ribbon').textContent=name==='craft'?'Spacecraft workshop':name==='rocket'?'Rocket workshop':''; renderDock(); }\nfunction transition(doorPos,then){ transitioning=true; autoTarget=null; queue=[]; closeWin(); enterEl.style.display='none';\n  focusGoal.copy(doorPos); camZoomGoal=reduce?1:3.2;                     // 1) pan + zoom into the door\n  setTimeout(()=>{ wipe.classList.add('on');                            // 2) cream iris closes\n    setTimeout(()=>{ then(); camZoom=2.2; camZoomGoal=1;                // 3) swap scene, zoom back out\n      wipe.classList.remove('on'); setTimeout(()=>{transitioning=false;},450); },470); }, reduce?0:550); }\nfunction enterRoom(name){ const door=AREAS.base.spots.find(s=>s.id===name).pos; transition(door,()=>{ swapTo(name,AREAS[name].spawn.clone()); if(name==='craft'&&step===0) setStep(1); }); }\nfunction exitRoom(after){ const from=where; transition(A().spots.find(s=>s.id==='exit').pos,()=>{ swapTo('base',AREAS.base.spawn[from].clone()); if(after) setTimeout(after,500); }); }\n\n/* ================= Stars ================= */\nconst skyC=document.getElementById('sky'); let SK=null;\nfunction initSky(){const r=skyC.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.5);skyC.width=r.width*d;skyC.height=r.height*d;const x=skyC.getContext('2d');x.setTransform(d,0,0,d,0,0);\n  let s=5;const R=()=>(s=(s*16807)%2147483647)/2147483647;const st=[];for(let k=0;k<380;k++){const px=r.width*(1-Math.pow(R(),1.4)*.55),py=r.height*Math.pow(R(),1.5)*.7,dx=(r.width-px)/(r.width*.55),dy=py/(r.height*.7);if(dx*dx+dy*dy>.75)continue;st.push({x:px,y:py,s:R()<.06?1.8:R()*.9+.3,p:R()*6})}SK={x,w:r.width,h:r.height,st}}\nfunction drawSky(t){const {x}=SK;x.clearRect(0,0,SK.w,SK.h);for(const s of SK.st){x.globalAlpha=reduce?.85:.4+.6*Math.abs(Math.sin(t/1300+s.p));x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.s,0,7);x.fill()}}\n\n/* ================= Loop ================= */\nlet VIEW=15;\nfunction resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);VIEW=w<760?17:15;initSky();}\naddEventListener('resize',resize); resize();\nconst tmp=new THREE.Vector3(), FWD=new THREE.Vector3(-1,0,-1).normalize(), RIGHT=new THREE.Vector3(1,0,-1).normalize();\nlet last=performance.now(), walkPhase=0, running=true;\ndocument.addEventListener('visibilitychange',()=>{running=!document.hidden; if(running){last=performance.now(); requestAnimationFrame(tick);}});\nfunction tick(now){\n  if(!running) return; const dt=Math.min((now-last)/1000,.05) .sin(t*4)):0; s.ring.material.opacity+=(target-s.ring.material.opacity)*.15; }\n  if(near&&!openZone&&!transitioning){ if(near.kind==='part'){ enterEl.style.display='none'; showInfo(near); }\n    else { showInfo(null); const p=near.pos.clone().setY(3.2).project(cam); enterEl.style.display='block'; enterEl.style.left=((p.x+1)/2*innerWidth)+'px'; enterEl.style.top=((1-p.y)/2*innerHeight)+'px';\n      const lb=near.id==='control'&&!launched?'Locked':near.label; if(enterEl.dataset.l!==lb){enterEl.dataset.l=lb; enterEl.innerHTML=lb+'<kbd>E<\/kbd>';} } }\n  else { if(!openZone) enterEl.style.display='none'; if(!near) showInfo(null); }\n  if(lockSprite) lockSprite.visible=!launched;\n  for(const e of exhibits){ if(!e.rocket&&!reduce) e.obj.rotation.y+=dt*.5; }\n  if(buildBay&&!reduce) buildBay.rotation.y+=dt*.4;\n  // launch\n  if(launchT>=0&&padRocket){launchT+=dt; const k=Math.max(0,launchT-.6); padRocket.position.y=.5+k*k*6; flame.material.opacity=Math.min(1,launchT*2)*(.7+.3*Math.sin(t*40)); if(padRocket.position.y>90){launchT=-1;padRocket.visible=false;}}\n  // camera\n  if(!transitioning) focusGoal.set(hero.position.x,0,hero.position.z);\n  camFocus.lerp(focusGoal,1-Math.pow(transitioning?.002:.02,dt));\n  camZoom+=(camZoomGoal-camZoom)*(1-Math.pow(.004,dt));\n  const a=innerWidth/innerHeight, v=VIEW/camZoom; cam.left=-v*a;cam.right=v*a;cam.top=v;cam.bottom=-v;cam.updateProjectionMatrix();\n  cam.position.copy(camFocus).addScaledVector(ISO,80); cam.lookAt(camFocus);\n  drawSky(now); renderer.render(scene,cam); requestAnimationFrame(tick);\n}\n\n/* ================= Boot ================= */\nrenderHUD(); setStep(0);\nloadAll().then(()=>{ buildBase(); buildCraftRoom(); buildRocketRoom(); root=scene;\n  refreshPadRocket(); refreshBuildBay(); swapTo('base',AREAS.base.spawn.start.clone());\n  document.getElementById('loading').style.display='none'; requestAnimationFrame(tick); });\n<\/script>\n<script>\n(function(){ const M=(window.HZ&&HZ.mission)||'earth'; const names={
