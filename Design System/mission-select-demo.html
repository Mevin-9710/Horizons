/* same painted night as the home screen, melting into the cream through a dusk glow */
.melt{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(min(1190px,81vw) min(580px,58%) at 100% 0%, rgba(120,90,200,0) 50%, rgba(214,122,170,.20) 62%, rgba(194,100,58,.15) 72%, rgba(242,165,65,.07) 80%, rgba(251,250,244,0) 90%)}
@media (max-width:900px){.night{width:100%;height:60%}}
canvas#sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.ui{position:absolute;z-index:2}
.top{top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.top > *{pointer-events:auto}
.logo{font-family:var(--f-display);font-size:22px}
.step{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.chip{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:7px 10px;border-radius:4px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(12px);color:#F3EEE6;cursor:pointer}
.panel{background:var(--glass);border:1px solid var(--glassline);border-radius:12px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 24px 50px -28px rgba(26,18,6,.45)}
.label{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
/* prompt */
.prompt{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100% - 32px));padding:16px;display:flex;flex-direction:column;gap:10px;transition:opacity .35s,transform .35s;box-sizing:border-box}
.prompt.hide{opacity:0;transform:translateY(16px);pointer-events:none}
.prompt h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.05}
.prompt p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.45}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dots button{font-family:var(--f-mono);font-size:12px;color:var(--ink);background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:999px;padding:7px 12px 7px 9px;cursor:pointer;display:flex;align-items:center;gap:7px}
.dots button i{width:10px;height:10px;border-radius:50%;display:inline-block}
.dots button:hover,.dots button:focus-visible{border-color:var(--ember);outline:none}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ember);margin-right:8px;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.25}}
/* hover tag */
.tag{position:absolute;z-index:3;pointer-events:none;font-family:var(--f-mono);font-size:11px;padding:5px 8px;border-radius:4px;background:var(--glass);border:1px solid var(--glassline);backdrop-filter:blur(10px);transform:translate(14px,-50%);white-space:nowrap;opacity:0;transition:opacity .15s}
.tag b{font-weight:600;color:var(--ember)}
/* brief: scrolling body + fixed action bar */
.brief{top:72px;right:max(16px,env(safe-area-inset-right,0px));width:min(360px,calc(100% - 32px));max-height:calc(100% - 96px - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box;transform:translateX(calc(100% + 40px));opacity:0;transition:transform .6s cubic-bezier(.22,1,.36,1),opacity .4s}
.brief.open{transform:none;opacity:1}
.b-body{padding:18px 18px 14px;display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:0}
.b-actions{padding:12px 18px 14px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:rgba(251,250,244,.75)}
.b-head{display:flex;flex-direction:column;gap:6px}
.b-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1}
.diff{display:flex;gap:4px;align-items:center}
.diff i{width:16px;height:6px;border-radius:2px;background:rgba(26,18,6,.12)}
.diff i.on{background:var(--ember)}
.obj{margin:0;font-size:14px;line-height:1.5}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.spec{padding:8px 10px;border-radius:6px;background:rgba(255,255,255,.6);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.spec b{font-family:var(--f-mono);font-size:9.5px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.spec span{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.list li{display:flex;gap:9px}
.list li::before{content:"";flex:none;width:6px;height:6px;margin-top:7px;background:var(--ember);transform:rotate(45deg)}
.btn{border:0;border-radius:999px;padding:12px 22px;background:var(--ink);color:var(--cream);font:400 18px var(--f-display);letter-spacing:.04em;cursor:pointer;flex:1}
.btn.ghost{flex:none;background:transparent;color:var(--ink);border:1px solid var(--line);font:500 14px var(--f-ui);letter-spacing:0;padding:12px 16px}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
.locked{font-size:14px;color:var(--muted);margin:0}
@media (max-width:760px){
  .step{display:none}
  .prompt{left:12px;right:12px;width:auto;padding:14px}
  .prompt p{display:none}
  .brief{top:auto;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:auto;max-height:56%;transform:translateY(calc(100% + 30px))}
  .brief.open{transform:none}
  .b-head h3{font-size:26px}
  .b-body{padding:16px 16px 12px;gap:12px}
  .b-actions{padding:10px 16px 12px}
  .obj{font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* ===== Game feel: TACTILE (chosen 2026-11-14). Chunky outlines, darker lip, squash on press. Palette/fonts unchanged. ===== */
:root{--amber-d:#C27F22;--ember-d:#8E4322;--bad:#E5484D;--bad-d:#A3262A;--lip:#E4DED2;--ok:#4CC38A}
.t-btn{position:relative;border:3px solid var(--ink);border-radius:16px;padding:11px 24px 13px;font:400 20px var(--f-display);letter-spacing:.03em;cursor:pointer;color:var(--ink);
  background:var(--c,#fff);box-shadow:inset 0 -5px 0 var(--cd,var(--lip)),inset 0 3px 0 rgba(255,255,255,.4),0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.t-btn:hover{filter:brightness(1.04)}
.t-btn:active{transform:translateY(4px);box-shadow:inset 0 -2px 0 var(--cd,var(--lip)),inset 0 3px 0 rgba(255,255,255,.4),0 1px 0 var(--ink)}
.t-btn.primary{--c:var(--amber);--cd:var(--amber-d);text-shadow:0 2px 0 rgba(255,255,255,.4)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const reduce = (matchMedia('(prefers-reduced-motion: reduce)').matches||!!(window.HZ&&HZ.settings&&HZ.settings.motion));
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1, 1.5));
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 2000);
const HOME_POS = new THREE.Vector3(0, 46, 78);
camera.position.copy(HOME_POS);

// ---------- Comet-style planet shader: angled colour bands + grain + soft terminator ----------
const vert = `
varying vec3 vN; varying vec3 vObj; varying vec3 vWorld;
void main(){ vObj = normalize(position); vN = normalize(mat3(modelMatrix)*normal);
  vec4 w = modelMatrix*vec4(position,1.0); vWorld = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`;
const frag = `
uniform vec3 c0; uniform vec3 c1; uniform vec3 c2; uniform vec3 c3;
uniform vec3 axis; uniform float freq; uniform float glow; uniform float time; uniform float hover;
varying vec3 vN; varying vec3 vObj; varying vec3 vWorld;
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
float n3(vec3 p){ return sin(p.x*1.7+sin(p.y*2.3))*cos(p.z*1.9+sin(p.x*1.1)); }
void main(){
  float t = dot(vObj, normalize(axis)) * freq + 0.35*n3(vObj*2.2);
  float b = fract(t*0.5+0.5);
  vec3 col = b < .30 ? c0 : b < .52 ? mix(c0,c1,smoothstep(.30,.36,b)) : b < .70 ? mix(c1,c2,smoothstep(.52,.60,b)) : mix(c2,c3,smoothstep(.70,1.0,b));
  vec3 L = normalize(-vWorld);               // sun at origin
  float d = dot(normalize(vN), L);
  float lit = smoothstep(-0.35, 0.65, d);    // soft terminator
  vec3 shade = mix(c3*0.25, col, lit);
  vec3 V = normalize(cameraPosition - vWorld);
  float rim = pow(1.0 - max(dot(normalize(vN), V),0.0), 3.0);
  shade += rim * (0.18 + 0.5*hover) * vec3(1.0,.85,.65);
  float g = hash(gl_FragCoord.xy + fract(time)*91.0) - 0.5;   // film grain
  shade += g * 0.11;
  shade = mix(shade, col*1.4, glow);         // sun ignores lighting
  gl_FragColor = vec4(shade, 1.0);
}`;
const hex = h => new THREE.Color(h);
function planetMat(cols, axis, freq, glow=0){
  return new THREE.ShaderMaterial({ vertexShader:vert, fragmentShader:frag, uniforms:{
    c0:{value:hex(cols[0])}, c1:{value:hex(cols[1])}, c2:{value:hex(cols[2])}, c3:{value:hex(cols[3])},
    axis:{value:new THREE.Vector3(...axis)}, freq:{value:freq}, glow:{value:glow}, time:{value:0}, hover:{value:0} }});
}

// ---------- Missions ----------
const MISSIONS = {
  earth:{ name:'Wildfire watch', planet:'Earth', diff:1, obj:'Spot new wildfires within hours, from orbit, so crews on the ground can act before they spread.',
    specs:[['Orbit','Sun-sync 550 km'],['Duration','12 months'],['Budget','$180M'],['Mass limit','350 kg']],
    tasks:['Pick a thermal infrared imager','Keep revisit time under 12 hours','Downlink alerts every pass'] },
  moon:{ name:'Lunar polar ice', planet:'Moon', diff:2, obj:'Map water ice hiding in craters at the lunar poles that never see sunlight.',
    specs:[['Orbit','Polar 100 km'],['Duration','18 months'],['Budget','$320M'],['Mass limit','600 kg']],
    tasks:['Carry a neutron spectrometer','Survive long eclipses on battery','Relay data through Earth stations'] },
  mars:{ name:'Mars atmosphere', planet:'Mars', diff:3, obj:'Measure how Mars is losing its air to space, and how fast.',
    specs:[['Orbit','Elliptical 150–6,000 km'],['Duration','24 months'],['Budget','$450M'],['Mass limit','900 kg']],
    tasks:['Fly a mass spectrometer and magnetometer','Budget fuel for orbit insertion','Plan for 20-minute comms delay'] },
  mercury:{ name:'Mercury mapper', planet:'Mercury', diff:3, obj:'Map all of Mercury and look for ice in polar craters that never see the Sun.',
    specs:[['Type','Orbiter'],['Transit','105 days'],['Delta-v','12.3 km/s'],['Mass limit','500 kg']],
    tasks:['Bring the biggest rocket: braking near the Sun is costly','Shade the craft from heat','Map the whole surface'] },
  venus:{ name:'Venus radar', planet:'Venus', diff:2, obj:'Map the surface of Venus with radar, straight through its thick clouds.',
    specs:[['Type','Orbiter'],['Transit','146 days'],['Delta-v','4.0 km/s'],['Mass limit','900 kg']],
    tasks:['Carry a radar, cameras cannot see the ground','Budget fuel for orbit insertion','Send the big radar data home'] },
  jupiter:{ name:'Inside Jupiter', planet:'Jupiter', diff:3, obj:'Measure the gravity and magnetic field of Jupiter to see what lies under the clouds.',
    specs:[['Type','Orbiter'],['Transit','2.7 years'],['Delta-v','7.1 km/s'],['Mass limit','1,600 kg']],
    tasks:['Fit big solar wings: sunlight is weak out here','Survive the radiation belts','Keep fuel for the insertion burn'] },
  saturn:{ name:'Rings and Titan', planet:'Saturn', diff:3, obj:'Study Saturn, its rings and its moon Titan from orbit.',
    specs:[['Type','Orbiter'],['Transit','6.0 years'],['Delta-v','8.1 km/s'],['Mass limit','2,500 kg']],
    tasks:['Choose a heavy-lift rocket','Plan for a 6-year cruise','Use a big dish for the long link home'] },
  uranus:{ name:'Ice giant flyby', planet:'Uranus', diff:2, obj:'Fly past Uranus, the ice giant that rolls on its side, and photograph its moons.',
    specs:[['Type','Flyby'],['Transit','16 years'],['Delta-v','8.0 km/s'],['Mass limit','800 kg']],
    tasks:['One pass only: no braking burn','Point the cameras before closest approach','Store images, send them later'] },
  neptune:{ name:'Edge of the planets', planet:'Neptune', diff:3, obj:'Fly past Neptune and its moon Triton at the edge of the planets.',
    specs:[['Type','Flyby'],['Transit','31 years'],['Delta-v','8.3 km/s'],['Mass limit','800 kg']],
    tasks:['One pass only: no braking burn','Survive decades of cruise','Send data across 4 light-hours'] },
  pluto:{ name:'Pluto flyby', planet:'Pluto', diff:3, obj:'Cross the whole solar system for one fast pass over the icy heart of Pluto.',
    specs:[['Type','Flyby'],['Transit','46 years (direct)'],['Delta-v','8.4 km/s'],['Mass limit','480 kg']],
    tasks:['Keep the spacecraft light and fast','One pass only: no braking burn','Use nuclear power, the Sun is too far'] },
};
// each mission follows a real NASA mission; its spacecraft model is on display in the spacecraft workshop
const NASA_OF={earth:'Landsat',moon:'Lunar Reconnaissance Orbiter',mars:'MAVEN',mercury:'MESSENGER',venus:'Magellan',jupiter:'Juno',saturn:'Cassini-Huygens',uranus:'Voyager 2',neptune:'Voyager 2',pluto:'New Horizons'};

// ---------- Bodies (Comet palette, not realistic colours) ----------
const bodies = [];
const sunMat = planetMat(['#F2C27A','#F2A541','#E07A44','#C2643A'], [0.3,1,0.2], 3.0, 0.75);
const sun = new THREE.Mesh(new THREE.SphereGeometry(6,64,64), sunMat); scene.add(sun);
// sun halo
const haloTex = (()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const g=x.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,'rgba(242,165,65,.45)');g.addColorStop(.4,'rgba(242,165,65,.12)');g.addColorStop(1,'rgba(242,165,65,0)');x.fillStyle=g;x.fillRect(0,0,256,256);return new THREE.CanvasTexture(c)})();
const halo = new THREE.Sprite(new THREE.SpriteMaterial({map:haloTex, transparent:true, depthWrite:false}));
halo.scale.set(40,40,1); scene.add(halo);

const DEF = [
  {id:'mercury', name:'Mercury', r:0.9,  a:11, e:.9, speed:1.6,  cols:['#2A2D33','#5E5A54','#9C968C','#111'], axis:[1,.3,0], f:2.5, orbit:'#9C968C', mission:true},
  {id:'venus',   name:'Venus',   r:1.4,  a:16, e:.92,speed:1.15, cols:['#F0D6B8','#E9B98F','#C98A62','#3A1D10'], axis:[.2,1,.4], f:2.0, orbit:'#C98A62', mission:true},
  {id:'earth',   name:'Earth',   r:1.7,  a:22, e:.9, speed:.9,   cols:['#0B1F24','#2C5B65','#95B3B6','#081214'], axis:[.6,1,.2], f:3.2, orbit:'#2C5B65', mission:true},
  {id:'mars',    name:'Mars',    r:1.25, a:30, e:.88,speed:.68,  cols:['#792B37','#A73B42','#D08A6A','#2A0E14'], axis:[1,.5,.3], f:2.6, orbit:'#A73B42', mission:true},
  {id:'jupiter', name:'Jupiter', r:3.6,  a:42, e:.9, speed:.38,  cols:['#6B5A3A','#C9A55C','#2E3B4A','#151008'], axis:[0,1,0], f:5.5, orbit:'#9B7751', mission:true},
  {id:'saturn',  name:'Saturn',  r:3.0,  a:54, e:.9, speed:.27,  cols:['#D7D0C0','#9B7751','#E8D9B8','#312624'], axis:[0,1,.1], f:4.5, orbit:'#9B7751', ring:true, mission:true},
  {id:'uranus',  name:'Uranus',  r:2.2,  a:64, e:.9, speed:.21,  cols:['#33606A','#6FA9B2','#C4E4E6','#0F2428'], axis:[1,.2,0], f:2.4, orbit:'#6FA9B2', mission:true},
  {id:'neptune', name:'Neptune', r:2.1,  a:74, e:.9, speed:.16,  cols:['#0F1916','#43645B','#2BB3BF','#091717'], axis:[.4,1,0], f:3.0, orbit:'#43645B', mission:true},
  {id:'pluto',   name:'Pluto',   r:.8,   a:83, e:.86,speed:.12,  cols:['#5E4E3C','#A8937A','#E6D6C0','#2A2018'], axis:[.6,1,.3], f:2.2, orbit:'#A8937A', mission:true},
];
const hitTargets = [];
for (const d of DEF){
  const group = new THREE.Group(); scene.add(group);
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(d.r,64,64), planetMat(d.cols, d.axis, d.f)); group.add(mesh);
  mesh.rotation.z = 0.35;
  if (d.ring){
    const ring = new THREE.Mesh(new THREE.RingGeometry(d.r*1.4, d.r*2.3, 96),
      new THREE.MeshBasicMaterial({color:0x9B7751, transparent:true, opacity:.45, side:THREE.DoubleSide, depthWrite:false}));
    ring.rotation.x = Math.PI/2.4; group.add(ring);
  }
  // orbit line (ellipse)
  const pts=[]; for(let i=0;i<=200;i++){const t=i/200*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(t)*d.a,0,Math.sin(t)*d.a*d.e));}
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:d.orbit, transparent:true, opacity:d.mission?.55:.28}));
  scene.add(line);
  // generous invisible hit sphere
  const hit = new THREE.Mesh(new THREE.SphereGeometry(Math.max(d.r*1.8,2.4),12,12), new THREE.MeshBasicMaterial({visible:false}));
  hit.userData.id = d.id; group.add(hit); hitTargets.push(hit);
  // selection ring for mission planets
  let marker=null;
  if (d.mission){
    marker = new THREE.Mesh(new THREE.RingGeometry(d.r*1.55, d.r*1.62, 64), new THREE.MeshBasicMaterial({color:0xC2643A, transparent:true, opacity:.7, side:THREE.DoubleSide, depthWrite:false}));
    group.add(marker);
  }
  const b = {...d, group, mesh, line, marker, angle:Math.random()*Math.PI*2};
  bodies.push(b);
}
// Moon orbiting Earth
const earth = bodies.find(b=>b.id==='earth');
const moonDef = {id:'moon', name:'Moon', r:.55, mission:true, cols:['#2A2D33','#8D9196','#E3E5E6','#14161C']};
const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(moonDef.r,48,48), planetMat(moonDef.cols,[1,.2,.5],2.2));
const moonPivot = new THREE.Group(); earth.group.add(moonPivot); moonPivot.add(moonMesh); moonMesh.position.set(3.3,0,0);
const moonHit = new THREE.Mesh(new THREE.SphereGeometry(1.4,10,10), new THREE.MeshBasicMaterial({visible:false})); moonHit.userData.id='moon'; moonMesh.add(moonHit); hitTargets.push(moonHit);
const moonMarker = new THREE.Mesh(new THREE.RingGeometry(.9,.96,48), new THREE.MeshBasicMaterial({color:0xC2643A, transparent:true, opacity:.7, side:THREE.DoubleSide, depthWrite:false})); moonMesh.add(moonMarker);
const moonBody = {...moonDef, mesh:moonMesh, marker:moonMarker};


// twinkling stars + shooting-star showers over the painted night (the canvas lives inside .night and shares its fade)
const skyC=document.getElementById('sky');let SK=null;const METEORS=[];let nextMeteor=0;
function initSky(){const r=skyC.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.5);skyC.width=r.width*d;skyC.height=r.height*d;const x=skyC.getContext('2d');x.setTransform(d,0,0,d,0,0);
  let s=7;const R=()=>(s=(s*16807)%2147483647)/2147483647;const st=[];
  for(let k=0;k<160;k++){st.push({x:r.width*(1-Math.pow(R(),1.15)*.95),y:r.height*Math.pow(R(),1.25)*.85,s:R()<.07?1.7:R()*.8+.3,p:R()*6,w:R()<.15,b:R()<.25})}
  SK={x,w:r.width,h:r.height,st}}
function spawnMeteor(t){const n=Math.random()<.25?3:1,ang=Math.PI/2+.38+Math.random()*.2;
  for(let i=0;i<n;i++){const sp=SK.h*(.9+Math.random()*.7);METEORS.push({x:SK.w*(.35+Math.random()*.7)+i*SK.w*.06,y:-30+SK.h*Math.random()*.3+i*24,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,len:110+Math.random()*190,born:t+i*160,life:800+Math.random()*700,w:1.1+Math.random()*1.5,pink:Math.random()<.45})}
  nextMeteor=t+700+Math.random()*2100}
function drawSky(t){if(!SK)return;const {x}=SK;x.clearRect(0,0,SK.w,SK.h);
  for(const s of SK.st){x.globalAlpha=reduce?.8:.35+.65*Math.abs(Math.sin(t/1300+s.p));x.fillStyle=s.w?'#F2C27A':s.b?'#BFD6FF':'#fff';x.beginPath();x.arc(s.x,s.y,s.s,0,7);x.fill()}
  x.globalAlpha=1; if(reduce) return; if(t>nextMeteor) spawnMeteor(t);
  for(let i=METEORS.length-1;i>=0;i--){const m=METEORS[i],a=(t-m.born)/m.life;if(a<0)continue;if(a>1){METEORS.splice(i,1);continue}
    const sec=a*m.life/1000,px=m.x+m.vx*sec,py=m.y+m.vy*sec,sp=Math.hypot(m.vx,m.vy),tx=px-m.vx/sp*m.len,ty=py-m.vy/sp*m.len,f=Math.sin(Math.PI*a);
    const g=x.createLinearGradient(px,py,tx,ty);g.addColorStop(0,`rgba(255,255,255,${f})`);g.addColorStop(.2,m.pink?`rgba(255,175,225,${.75*f})`:`rgba(160,205,255,${.75*f})`);g.addColorStop(1,'rgba(255,255,255,0)');
    x.strokeStyle=g;x.lineWidth=m.w;x.lineCap='round';x.beginPath();x.moveTo(px,py);x.lineTo(tx,ty);x.stroke();
    const h=x.createRadialGradient(px,py,0,px,py,m.w*7);h.addColorStop(0,`rgba(255,255,255,${f})`);h.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=h;x.beginPath();x.arc(px,py,m.w*7,0,7);x.fill()}}

// ---------- Interaction ----------
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
const tagEl = document.getElementById('tag'), briefEl = document.getElementById('brief'), promptEl = document.getElementById('prompt');
let hovered=null, selected=null, yaw=0, pitch=0, drag=null;
const camTarget = new THREE.Vector3(), lookAt = new THREE.Vector3(), lookGoal = new THREE.Vector3();
const allBodies = () => [...bodies, moonBody];
const byId = id => allBodies().find(b=>b.id===id);
const worldPos = b => b.mesh.getWorldPosition(new THREE.Vector3());

function pick(e){
  const r=canvas.getBoundingClientRect(); mouse.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera); const h=ray.intersectObjects(hitTargets,false);
  // prefer the moon when both hit
  const m=h.find(x=>x.object.userData.id==='moon'); return (m||h[0])?.object.userData.id||null;
}
canvas.addEventListener('pointermove',e=>{
  if(drag){ yaw += (e.clientX-drag.x)*0.004; pitch = Math.max(-.5,Math.min(.6,pitch+(e.clientY-drag.y)*0.003)); drag={x:e.clientX,y:e.clientY,moved:true}; return; }
  const id=pick(e); hovered=id; canvas.style.cursor=id?'pointer':'grab';
  if(id){const b=byId(id); tagEl.innerHTML = b.mission? `<b>${b.name}</b> · ${MISSIONS[id].name}` : `${b.name} · no mission yet`;
    tagEl.style.left=e.clientX+'px'; tagEl.style.top=e.clientY+'px'; tagEl.style.opacity=1;} else tagEl.style.opacity=0;
});
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:false}; canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointerup',e=>{const wasDrag=drag&&drag.moved; drag=null; if(!wasDrag){const id=pick(e); if(id) select(id);}});
canvas.addEventListener('pointerleave',()=>{tagEl.style.opacity=0});

function select(id){
  selected=id; const b=byId(id); tagEl.style.opacity=0; promptEl.classList.add('hide');
  if(b.mission){ const m=MISSIONS[id];
    briefEl.innerHTML = `<button class="t-round x" type="button" id="close" aria-label="Close"><svg><use href="#i-x"/></svg></button><div class="b-body"><div class="b-head"><span class="t-ribbon">Mission brief</span><h3>${m.name}</h3><span class="label">${m.planet} · follows NASA ${NASA_OF[id]||''}</span>
      <div class="t-stars" aria-label="Difficulty ${m.diff} of 3">${[1,2,3].map(i=>`<svg style="--sf:${i<=m.diff?'#F2A541':'#E4DED2'}"><use href="#i-star"/></svg>`).join('')}</div></div>
      <p class="obj">${m.obj}</p>
      <div class="specs">${m.specs.map(s=>`<div class="spec"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div>
      <div style="display:flex;flex-direction:column;gap:8px"><span class="label">Your goals</span><ul class="list">${m.tasks.map(t=>`<li>${t}</li>`).join('')}</ul></div></div>
      <div class="b-actions"><button class="t-btn ghost" type="button" id="back">Back</button><button class="t-btn primary" type="button" id="start">Start mission</button></div>`;
  } else {
    briefEl.innerHTML = `<button class="t-round x" type="button" id="close" aria-label="Close"><svg><use href="#i-x"/></svg></button><div class="b-body"><div class="b-head"><span class="t-ribbon">Planet</span><h3>${b.name}</h3></div>
      <p class="locked">No mission here yet. Try Earth, the Moon or Mars.</p></div>
      <div class="b-actions"><button class="t-btn ghost" type="button" id="back" style="flex:1">Back to system</button></div>`;
  }
  briefEl.classList.add('open');
  document.getElementById('back').onclick = deselect; document.getElementById('close').onclick = deselect;
  const s=document.getElementById('start'); if(s) s.onclick=()=>{ s.textContent='Loading base…'; };
}
function deselect(){ selected=null; briefEl.classList.remove('open'); promptEl.classList.remove('hide'); }
document.getElementById('home').onclick = deselect;
addEventListener('keydown',e=>{ if(e.key==='Escape') deselect(); });

// quick-pick chips
const quick=document.getElementById('quick');
[['earth','#2C5B65'],['moon','#8D9196'],['mars','#A73B42']].forEach(([id,c])=>{
  const btn=document.createElement('button'); btn.type='button'; btn.innerHTML=`<i style="background:${c}"></i>${byId(id).name}`; btn.onclick=()=>select(id); quick.appendChild(btn);});

// ---------- Loop ----------
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov = w<760?55:42; camera.updateProjectionMatrix(); }
addEventListener('resize',()=>{resize();initSky()}); resize(); initSky();
let last=performance.now(), running=true;
document.addEventListener('visibilitychange',()=>{ running=!document.hidden; if(running){last=performance.now(); requestAnimationFrame(tick);} });
const tmp=new THREE.Vector3();
function tick(now){
  if(!running) return;
  const dt=Math.min((now-last)/1000,.05); last=now; const t=now/1000;
  const speed = reduce?0 : selected? .15 : 1;
  for(const b of bodies){
    b.angle += dt*b.speed*0.25*speed;
    b.group.position.set(Math.cos(b.angle)*b.a, 0, Math.sin(b.angle)*b.a*b.e);
    b.mesh.rotation.y += dt*.25*(reduce?0:1);
    b.mesh.material.uniforms.time.value=t;
    const hv = (hovered===b.id||selected===b.id)?1:0; b.mesh.material.uniforms.hover.value += (hv-b.mesh.material.uniforms.hover.value)*.12;
    if(b.marker){ b.marker.lookAt(camera.position); b.marker.material.opacity = selected? 0 : .45+.35*Math.sin(t*2.4); b.marker.scale.setScalar(1+.06*Math.sin(t*2.4)); }
  }
  moonPivot.rotation.y += dt*.6*speed; moonMesh.material.uniforms.time.value=t;
  const mh=(hovered==='moon'||selected==='moon')?1:0; moonMesh.material.uniforms.hover.value += (mh-moonMesh.material.uniforms.hover.value)*.12;
  moonMarker.lookAt(camera.position); moonMarker.material.opacity = selected?0:.45+.35*Math.sin(t*2.4+1);
  sun.rotation.y += dt*.05; sunMat.uniforms.time.value=t;

  // camera: overview orbit, or pan to the selected body
  if(selected){
    const b=byId(selected), p=worldPos(b);
    const away = tmp.copy(p).normalize(); if(away.lengthSq()<1e-6) away.set(0,0,1);
    const dist = (b.r||1)*7 + 4;
    // stand on the sunward side, slightly above, offset so the planet sits left of the brief
    camTarget.copy(p).addScaledVector(away,-dist*.55).add(new THREE.Vector3(0,dist*.45,0)).addScaledVector(new THREE.Vector3(-away.z,0,away.x), dist*.75);
    lookGoal.copy(p);
    if(innerWidth>760){ const right=new THREE.Vector3().subVectors(p,camTarget).cross(camera.up).normalize(); lookGoal.addScaledVector(right,(b.r||1)*1.6); } else { lookGoal.y -= (b.r||1)*2.4; }
  } else {
    const r=HOME_POS.length(), base=Math.atan2(HOME_POS.y,HOME_POS.z);
    const ang = (reduce?0:t*0.02) + yaw, el = base + pitch;
    camTarget.set(Math.sin(ang)*Math.cos(el)*r, Math.sin(el)*r, Math.cos(ang)*Math.cos(el)*r);
    lookGoal.set(0,0,0);
  }
  const k = 1-Math.pow(.025, dt);     // smooth, frame-rate independent ease
  camera.position.lerp(camTarget,k); lookAt.lerp(lookGoal,k); camera.lookAt(lookAt);
  drawSky(now);
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
