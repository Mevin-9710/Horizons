turn, its rings and its moon Titan from orbit.',\n    specs:[['Type','Orbiter'],['Transit','6.0 years'],['Delta-v','8.1 km/s'],['Mass limit','2,500 kg']],\n    tasks:['Choose a heavy-lift rocket','Plan for a 6-year cruise','Use a big dish for the long link home'] },\n  uranus:{ name:'Ice giant flyby', planet:'Uranus', diff:2, obj:'Fly past Uranus, the ice giant that rolls on its side, and photograph its moons.',\n    specs:[['Type','Flyby'],['Transit','16 years'],['Delta-v','8.0 km/s'],['Mass limit','800 kg']],\n    tasks:['One pass only: no braking burn','Point the cameras before closest approach','Store images, send them later'] },\n  neptune:{ name:'Edge of the planets', planet:'Neptune', diff:3, obj:'Fly past Neptune and its moon Triton at the edge of the planets.',\n    specs:[['Type','Flyby'],['Transit','31 years'],['Delta-v','8.3 km/s'],['Mass limit','800 kg']],\n    tasks:['One pass only: no braking burn','Survive decades of cruise','Send data across 4 light-hours'] },\n  pluto:{ name:'Pluto flyby', planet:'Pluto', diff:3, obj:'Cross the whole solar system for one fast pass over the icy heart of Pluto.',\n    specs:[['Type','Flyby'],['Transit','46 years (direct)'],['Delta-v','8.4 km/s'],['Mass limit','480 kg']],\n    tasks:['Keep the spacecraft light and fast','One pass only: no braking burn','Use nuclear power, the Sun is too far'] },\n};\n// each mission follows a real NASA mission; its spacecraft model is on display in the spacecraft workshop\nconst NASA_OF={earth:'Landsat',moon:'Lunar Reconnaissance Orbiter',mars:'MAVEN',mercury:'MESSENGER',venus:'Magellan',jupiter:'Juno',saturn:'Cassini-Huygens',uranus:'Voyager 2',neptune:'Voyager 2',pluto:'New Horizons'};\n\n// ---------- Bodies (Comet palette, not realistic colours) ----------\nconst bodies = [];\nconst sunMat = planetMat(['#F2C27A','#F2A541','#E07A44','#C2643A'], [0.3,1,0.2], 3.0, 0.75);\nconst sun = new THREE.Mesh(new THREE.SphereGeometry(6,64,64), sunMat); scene.add(sun);\n// sun halo\nconst haloTex = (()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const g=x.createRadialGradient(128,128,0,128,128,128);\n  g.addColorStop(0,'rgba(242,165,65,.45)');g.addColorStop(.4,'rgba(242,165,65,.12)');g.addColorStop(1,'rgba(242,165,65,0)');x.fillStyle=g;x.fillRect(0,0,256,256);return new THREE.CanvasTexture(c)})();\nconst halo = new THREE.Sprite(new THREE.SpriteMaterial({map:haloTex, transparent:true, depthWrite:false}));\nhalo.scale.set(40,40,1); scene.add(halo);\n\nconst DEF = [\n  {id:'mercury', name:'Mercury', r:0.9,  a:11, e:.9, speed:1.6,  cols:['#2A2D33','#5E5A54','#9C968C','#111'], axis:[1,.3,0], f:2.5, orbit:'#9C968C', mission:true},\n  {id:'venus',   name:'Venus',   r:1.4,  a:16, e:.92,speed:1.15, cols:['#F0D6B8','#E9B98F','#C98A62','#3A1D10'], axis:[.2,1,.4], f:2.0, orbit:'#C98A62', mission:true},\n  {id:'earth',   name:'Earth',   r:1.7,  a:22, e:.9, speed:.9,   cols:['#0B1F24','#2C5B65','#95B3B6','#081214'], axis:[.6,1,.2], f:3.2, orbit:'#2C5B65', mission:true},\n  {id:'mars',    name:'Mars',    r:1.25, a:30, e:.88,speed:.68,  cols:['#792B37','#A73B42','#D08A6A','#2A0E14'], axis:[1,.5,.3], f:2.6, orbit:'#A73B42', mission:true},\n  {id:'jupiter', name:'Jupiter', r:3.6,  a:42, e:.9, speed:.38,  cols:['#6B5A3A','#C9A55C','#2E3B4A','#151008'], axis:[0,1,0], f:5.5, orbit:'#9B7751', mission:true},\n  {id:'saturn',  name:'Saturn',  r:3.0,  a:54, e:.9, speed:.27,  cols:['#D7D0C0','#9B7751','#E8D9B8','#312624'], axis:[0,1,.1], f:4.5, orbit:'#9B7751', ring:true, mission:true},\n  {id:'uranus',  name:'Uranus',  r:2.2,  a:64, e:.9, speed:.21,  cols:['#33606A','#6FA9B2','#C4E4E6','#0F2428'], axis:[1,.2,0], f:2.4, orbit:'#6FA9B2', mission:true},\n  {id:'neptune', name:'Neptune', r:2.1,  a:74, e:.9, speed:.16,  cols:['#0F1916','#43645B','#2BB3BF','#091717'], axis:[.4,1,0], f:3.0, orbit:'#43645B', mission:true},\n  {id:'pluto',   name:'Pluto',   r:.8,   a:83, e:.86,speed:.12,  cols:['#5E4E3C','#A8937A','#E6D6C0','#2A2018'], axis:[.6,1,.3], f:2.2, orbit:'#A8937A', mission:true},\n];\nconst hitTargets = [];\nfor (const d of DEF){\n  const group = new THREE.Group(); scene.add(group);\n  const mesh = new THREE.Mesh(new THREE.SphereGeometry(d.r,64,64), planetMat(d.cols, d.axis, d.f)); group.add(mesh);\n  mesh.rotation.z = 0.35;\n  if (d.ring){\n    const ring = new THREE.Mesh(new THREE.RingGeometry(d.r*1.4, d.r*2.3, 96),\n      new THREE.MeshBasicMaterial({color:0x9B7751, transparent:true, opacity:.45, side:THREE.DoubleSide, depthWrite:false}));\n    ring.rotation.x = Math.PI/2.4; group.add(ring);\n  }\n  // orbit line (ellipse)\n  const pts=[]; for(let i=0;i<=200;i++){const t=i/200*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(t)*d.a,0,Math.sin(t)*d.a*d.e));}\n  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),\n    new THREE.LineBasicMaterial({color:d.orbit, transparent:true, opacity:d.mission?.55:.28}));\n  scene.add(line);\n  // generous invisible hit sphere\n  const hit = new THREE.Mesh(new THREE.SphereGeometry(Math.max(d.r*1.8,2.4),12,12), new THREE.MeshBasicMaterial({visible:false}));\n  hit.userData.id = d.id; group.add(hit); hitTargets.push(hit);\n  // selection ring for mission planets\n  let marker=null;\n  if (d.mission){\n    marker = new THREE.Mesh(new THREE.RingGeometry(d.r*1.55, d.r*1.62, 64), new THREE.MeshBasicMaterial({color:0xC2643A, transparent:true, opacity:.7, side:THREE.DoubleSide, depthWrite:false}));\n    group.add(marker);\n  }\n  const b = {...d, group, mesh, line, marker, angle:Math.random()*Math.PI*2};\n  bodies.push(b);\n}\n// Moon orbiting Earth\nconst earth = bodies.find(b=>b.id==='earth');\nconst moonDef = {id:'moon', name:'Moon', r:.55, mission:true, cols:['#2A2D33','#8D9196','#E3E5E6','#14161C']};\nconst moonMesh = new THREE.Mesh(new THREE.SphereGeometry(moonDef.r,48,48), planetMat(moonDef.cols,[1,.2,.5],2.2));\nconst moonPivot = new THREE.Group(); earth.group.add(moonPivot); moonPivot.add(moonMesh); moonMesh.position.set(3.3,0,0);\nconst moonHit = new THREE.Mesh(new THREE.SphereGeometry(1.4,10,10), new THREE.MeshBasicMaterial({visible:false})); moonHit.userData.id='moon'; moonMesh.add(moonHit); hitTargets.push(moonHit);\nconst moonMarker = new THREE.Mesh(new THREE.RingGeometry(.9,.96,48), new THREE.MeshBasicMaterial({color:0xC2643A, transparent:true, opacity:.7, side:THREE.DoubleSide, depthWrite:false})); moonMesh.add(moonMarker);\nconst moonBody = {...moonDef, mesh:moonMesh, marker:moonMarker};\n\n\n// twinkling stars + shooting-star showers over the painted night (the canvas lives inside .night and shares its fade)\nconst skyC=document.getElementById('sky');let SK=null;const METEORS=[];let nextMeteor=0;\nfunction initSky(){const r=skyC.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.5);skyC.width=r.width*d;skyC.height=r.height*d;const x=skyC.getContext('2d');x.setTransform(d,0,0,d,0,0);\n  let s=7;const R=()=>(s=(s*16807)%2147483647)/2147483647;const st=[];\n  for(let k=0;k<160;k++){st.push({x:r.width*(1-Math.pow(R(),1.15)*.95),y:r.height*Math.pow(R(),1.25)*.85,s:R()<.07?1.7:R()*.8+.3,p:R()*6,w:R()<.15,b:R()<.25})}\n  SK={x,w:r.width,h:r.height,st}}\nfunction spawnMeteor(t){const n=Math.random()<.25?3:1,ang=Math.PI/2+.38+Math.random()*.2;\n  for(let i=0;i<n;i++){const sp=SK.h*(.9+Math.random()*.7);METEORS.push({x:SK.w*(.35+Math.random()*.7)+i*SK.w*.06,y:-30+SK.h*Math.random()*.3+i*24,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,len:110+Math.random()*190,born:t+i*160,life:800+Math.random()*700,w:1.1+Math.random()*1.5,pink:Math.random()<.45})}\n  nextMeteor=t+700+Math.random()*2100}\nfunction drawSky(t){if(!SK)return;const {x}=SK;x.clearRect(0,0,SK.w,SK.h);\n  for(const s of SK.st){x.globalAlpha=reduce?.8:.35+.65*Math.abs(Math.sin(t/1300+s.p));x.fillStyle=s.w?'#F2C27A':s.b?'#BFD6FF':'#fff';x.beginPath();x.arc(s.x,s.y,s.s,0,7);x.fill()}\n  x.globalAlpha=1; if(reduce) return; if(t>nextMeteor) spawnMeteor(t);\n  for(let i=METEORS.length-1;i>=0;i--){const m=METEORS[i],a=(t-m.born)/m.life;if(a<0)continue;if(a>1){METEORS.splice(i,1);continue}\n    const sec=a*m.life/1000,px=m.x+m.vx*sec,py=m.y+m.vy*sec,sp=Math.hypot(m.vx,m.vy),tx=px-m.vx/sp*m.len,ty=py-m.vy/sp*m.len,f=Math.sin(Math.PI*a);\n    const g=x.createLinearGradient(px,py,tx,ty);g.addColorStop(0,`rgba(255,255,255,${f})`);g.addColorStop(.2,m.pink?`rgba(255,175,225,${.75*f})`:`rgba(160,205,255,${.75*f})`);g.addColorStop(1,'rgba(255,255,255,0)');\n    x.strokeStyle=g;x.lineWidth=m.w;x.lineCap='round';x.beginPath();x.moveTo(px,py);x.lineTo(tx,ty);x.stroke();\n    const h=x.createRadialGradient(px,py,0,px,py,m.w*7);h.addColorStop(0,`rgba(255,255,255,${f})`);h.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=h;x.beginPath();x.arc(px,py,m.w*7,0,7);x.fill()}}\n\n// ---------- Interaction ----------\nconst ray = new THREE.Raycaster(), mouse = new THREE.Vector2();\nconst tagEl = document.getElementById('tag'), briefEl = document.getElementById('brief'), promptEl = document.getElementById('prompt');\nlet hovered=null, selected=null, yaw=0, pitch=0, drag=null;\nconst camTarget = new THREE.Vector3(), lookAt = new THREE.Vector3(), lookGoal = new THREE.Vector3();\nconst allBodies = () => [...bodies, moonBody];\nconst byId = id => allBodies().find(b=>b.id===id);\nconst worldPos = b => b.mesh.getWorldPosition(new THREE.Vector3());\n\nfunction pick(e){\n  const r=canvas.getBoundingClientRect(); mouse.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);\n  ray.setFromCamera(mouse,camera); const h=ray.intersectObjects(hitTargets,false);\n  // prefer the moon when both hit\n  const m=h.find(x=>x.object.userData.id==='moon'); return (m||h[0])?.object.userData.id||null;\n}\ncanvas.addEventListener('pointermove',e=>{\n  if(drag){ yaw += (e.clientX-drag.x)*0.004; pitch = Math.max(-.5,Math.min(.6,pitch+(e.clientY-drag.y)*0.003)); drag={x:e.clientX,y:e.clientY,moved:true}; return; }\n  const id=pick(e); hovered=id; canvas.style.cursor=id?'pointer':'grab';\n  if(id){const b=byId(id); tagEl.innerHTML = b.mission? `<b>${b.name}<\/b> \u00b7 ${MISSIONS[id].name}` : `${b.name} \u00b7 no mission yet`;\n    tagEl.style.left=e.clientX+'px'; tagEl.style.top=e.clientY+'px'; tagEl.style.opacity=1;} else tagEl.style.opacity=0;\n});\ncanvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:false}; canvas.setPointerCapture(e.pointerId)});\ncanvas.addEventListener('pointerup',e=>{const wasDrag=drag&&drag.moved; drag=null; if(!wasDrag){const id=pick(e); if(id) select(id);}});\ncanvas.addEventListener('pointerleave',()=>{tagEl.style.opacity=0});\n\nfunction select(id){\n  selected=id; const b=byId(id); tagEl.style.opacity=0; promptEl.classList.add('hide');\n  if(b.mission){ const m=MISSIONS[id];\n    briefEl.innerHTML = `<button class=\"t-round x\" type=\"button\" id=\"close\" aria-label=\"Close\"><svg><use href=\"#i-x\"/><\/svg><\/button><div class=\"b-body\"><div class=\"b-head\"><span class=\"t-ribbon\">Mission brief<\/span><h3>${m.name}<\/h3><span class=\"label\">${m.planet} \u00b7 follows NASA ${NASA_OF[id]||''}<\/span>\n      <div class=\"t-stars\" aria-label=\"Difficulty ${m.diff} of 3\">${[1,2,3].map(i=>`<svg style=\"--sf:${i<=m.diff?'#F2A541':'#E4DED2'}\"><use href=\"#i-star\"/><\/svg>`).join('')}<\/div><\/div>\n      <p class=\"obj\">${m.obj}<\/p>\n      <div class=\"specs\">${m.specs.map(s=>`<div class=\"spec\"><b>${s[0]}<\/b><span>${s[1]}<\/span><\/div>`).join('')}<\/div>\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><span class=\"label\">Your goals<\/span><ul class=\"list\">${m.tasks.map(t=>`<li>${t}<\/li>`).join('')}<\/ul><\/div><\/div>\n      <div class=\"b-actions\"><button class=\"t-btn ghost\" type=\"button\" id=\"back\">Back<\/button><button class=\"t-btn primary\" type=\"button\" id=\"start\">Start mission<\/button><\/div>`;\n  } else {\n    briefEl.innerHTML = `<button class=\"t-round x\" type=\"button\" id=\"close\" aria-label=\"Close\"><svg><use href=\"#i-x\"/><\/svg><\/button><div class=\"b-body\"><div class=\"b-head\"><span class=\"t-ribbon\">Planet<\/span><h3>${b.name}<\/h3><\/div>\n      <p class=\"locked\">No mission here yet. Try Earth, the Moon or Mars.<\/p><\/div>\n      <div class=\"b-actions\"><button class=\"t-btn ghost\" type=\"button\" id=\"back\" style=\"flex:1\">Back to system<\/button><\/div>`;\n  }\n  briefEl.classList.add('open');\n  document.getElementById('back').onclick = deselect; document.getElementById('close').onclick = deselect;\n  const s=document.getElementById('start'); if(s) s.onclick=()=>{ s.textContent='Loading base\u2026'; };\n}\nfunction deselect(){ selected=null; briefEl.classList.remove('open'); promptEl.classList.remove('hide'); }\ndocument.getElementById('home').onclick = deselect;\naddEventListener('keydown',e=>{ if(e.key==='Escape') deselect(); });\n\n// quick-pick chips\nconst quick=document.getElementById('quick');\n[['earth','#2C5B65'],['moon','#8D9196'],['mars','#A73B42']].forEach(([id,c])=>{\n  const btn=document.createElement('button'); btn.type='button'; btn.innerHTML=`<i style=\"background:${c}\"><\/i>${byId(id).name}`; btn.onclick=()=>select(id); quick.appendChild(btn);});\n\n// ---------- Loop ----------\nfunction resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov = w<760?55:42; camera.updateProjectionMatrix(); }\naddEventListener('resize',()=>{resize();initSky()}); resize(); initSky();\nlet last=performance.now(), running=true;\ndocument.addEventListener('visibilitychange',()=>{ running=!document.hidden; if(running){last=performance.now(); requestAnimationFrame(tick);} });\nconst tmp=new THREE.Vector3();\nfunction tick(now){\n  if(!running) return;\n  const dt=Math.min((now-last)/1000,.05); last=now; const t=now/1000;\n  const speed = reduce?0 : selected? .15 : 1;\n  for(const b of bodies){\n    b.angle += dt*b.speed*0.25*speed;\n    b.group.position.set(Math.cos(b.angle)*b.a, 0, Math.sin(b.angle)*b.a*b.e);\n    b.mesh.rotation.y += dt*.25*(reduce?0:1);\n    b.mesh.material.uniforms.time.value=t;\n    const hv = (hovered===b.id||selected===b.id)?1:0; b.mesh.material.uniforms.hover.value += (hv-b.mesh.material.uniforms.hover.value)*.12;\n    if(b.marker){ b.marker.lookAt(camera.position); b.marker.material.opacity = selected? 0 : .45+.35*Math.sin(t*2.4); b.marker.scale.setScalar(1+.06*Math.sin(t*2.4)); }\n  }\n  moonPivot.rotation.y += dt*.6*speed; moonMesh.material.uniforms.time.value=t;\n  const mh=(hovered==='moon'||selected==='moon')?1:0; moonMesh.material.uniforms.hover.value += (mh-moonMesh.material.uniforms.hover.value)*.12;\n  moonMarker.lookAt(camera.position); moonMarker.material.opacity = selected?0:.45+.35*Math.sin(t*2.4+1);\n  sun.rotation.y += dt*.05; sunMat.uniforms.time.value=t;\n\n  // camera: overview orbit, or pan to the selected body\n  if(selected){\n    const b=byId(selected), p=worldPos(b);\n    const away = tmp.copy(p).normalize(); if(away.lengthSq()<1e-6) away.set(0,0,1);\n    const dist = (b.r||1)*7 + 4;\n    // stand on the sunward side, slightly above, offset so the planet sits left of the brief\n    camTarget.copy(p).addScaledVector(away,-dist*.55).add(new THREE.Vector3(0,dist*.45,0)).addScaledVector(new THREE.Vector3(-away.z,0,away.x), dist*.75);\n    lookGoal.copy(p);\n    if(innerWidth>760){ const right=new THREE.Vector3().subVectors(p,camTarget).cross(camera.up).normalize(); lookGoal.addScaledVector(right,(b.r||1)*1.6); } else { lookGoal.y -= (b.r||1)*2.4; }\n  } else {\n    const r=HOME_POS.length(), base=Math.atan2(HOME_POS.y,HOME_POS.z);\n    const ang = (reduce?0:t*0.02) + yaw, el = base + pitch;\n    camTarget.set(Math.sin(ang)*Math.cos(el)*r, Math.sin(el)*r, Math.cos(ang)*Math.cos(el)*r);\n    lookGoal.set(0,0,0);\n  }\n  const k = 1-Math.pow(.025, dt);     // smooth, frame-rate independent ease\n  camera.position.lerp(camTarget,k); lookAt.lerp(lookGoal,k); camera.lookAt(lookAt);\n  drawSky(now);\n  renderer.render(scene,camera);\n  requestAnimationFrame(tick);\n}\nrequestAnimationFrame(tick);\n<\/script>\n\n<script>\n/* ===== Tutorial coach (shared by every screen) =====\n   COACH.run(name, steps): shows one step at a time in a Tactile card, points an arrow at the thing to use,\n   and waits until the player has done it (step.until) or presses Next (step.next).\n   step = {say, why?, target?: ()=>({x,y})|Element|null, until?: ()=>bool, next?: 'Next', enter?: fn, leave?: fn}\n   Skipping turns the tutorial off for the whole game (the shell keeps HZ.tutorial).\n   The two lead engineers coach the player: Mevin on the ground (mission choice, base, workshops), Pawan in flight (launch, mission control).\n   step.who ('mevin'|'pawan') overrides the speaker for one step. */\n(function(){\n  const css=`.coach{position:fixed;z-index:60;left:max(12px,env(safe-area-inset-left,0px));top:calc(78px + env(safe-area-inset-top,0px));width:min(350px,calc(100% - 24px));\n    background:#1A1206;color:#FBFAF4;border:3px solid #1A1206;border-radius:16px;box-shadow:0 5px 0 rgba(26,18,6,.35);padding:12px 14px 12px;font:600 14px/1.4 Geist,system-ui,sans-serif;display:none;animation:cpop .35s cubic-bezier(.34,1.56,.64,1) both}\n  .coach.s{display:block}\n  .coach .k{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;font:400 10px 'Silkscreen',monospace;letter-spacing:.08em;color:#F2A541}\n  .coach .who{display:flex;align-items:center;gap:10px;margin:2px 0 8px}\n  .coach .who svg{width:46px;height:46px;flex:none;border-radius:50%;border:3px solid #FBFAF4;background:#F3EEE4;box-shadow:0 3px 0 rgba(251,250,244,.25)}\n  .coach .who b{display:block;font:400 17px/1 'Game Paused','Silkscreen',monospace;color:#FBFAF4;letter-spacing:.02em}\n  .coach .who span{display:block;margin-top:3px;font:400 9px 'Silkscreen',monospace;letter-spacing:.08em;color:#F2A541}\n  .coach .k button{background:none;border:0;color:#B9B0A0;font:600 12px Geist,system-ui,sans-serif;cursor:pointer;padding:2px 4px}\n  .coach .why{display:block;margin-top:6px;font-weight:500;font-size:12.5px;color:#D7D0C0}\n  .coach .nx{margin-top:10px;display:flex;justify-content:flex-end}\n  .coach .nx button{border:3px solid #FBFAF4;border-radius:12px;background:#F2A541;color:#1A1206;font:400 15px 'Game Paused','Silkscreen',monospace;padding:5px 14px 7px;cursor:pointer;box-shadow:0 3px 0 #FBFAF4}\n  .coach .bar{height:5px;border-radius:3px;background:rgba(251,250,244,.18);margin-top:10px;overflow:hidden}.coach .bar i{display:block;height:100%;background:#F2A541;transition:width .4s}\n  .coach-arrow{position:fixed;z-index:59;width:44px;height:52px;pointer-events:none;display:none;transform:translate(-50%,-100%);filter:drop-shadow(0 3px 0 #1A1206)}\n  .coach-arrow.s{display:block;animation:cbob .8s ease-in-out infinite alternate}\n  @keyframes cbob{to{margin-top:-10px}} @keyframes cpop{0%{transform:scale(.88) translateY(10px);opacity:0}}\n  @media (max-width:760px){.coach{top:auto;bottom:calc(96px + env(safe-area-inset-bottom,0px));font-size:13px}}\n  @media (prefers-reduced-motion:reduce){.coach,.coach-arrow.s{animation:none}}`;\n  // Lead engineers, drawn in the game's flat, thick-outlined style.\n  const FACE=(skin,hairC,top,extra,jacket)=>`<svg viewBox=\"10 8 44 44\" aria-hidden=\"true\"><defs><clipPath id=\"cl\"><circle cx=\"32\" cy=\"32\" r=\"32\"/><\/clipPath><\/defs><g clip-path=\"url(#cl)\" stroke=\"#1A1206\" stroke-width=\"2\" stroke-linejoin=\"round\">\n    <path d=\"M6 66C8 50 19 45 32 45s24 5 26 21z\" fill=\"${jacket}\"/><path d=\"M25 45l7 9 7-9\" fill=\"#FBFAF4\"/><circle cx=\"45\" cy=\"55\" r=\"3\" fill=\"#F2A541\"/>\n    <rect x=\"27\" y=\"37\" width=\"10\" height=\"9\" rx=\"2\" fill=\"${skin}\"/><circle cx=\"20.5\" cy=\"29\" r=\"3\" fill=\"${skin}\"/><circle cx=\"43.5\" cy=\"29\" r=\"3\" fill=\"${skin}\"/>\n    <ellipse cx=\"32\" cy=\"28\" rx=\"11.5\" ry=\"13\" fill=\"${skin}\"/>${top.replace(/HAIR/g,hairC)}\n    <circle cx=\"27.5\" cy=\"29\" r=\"1.5\" fill=\"#1A1206\" stroke=\"none\"/><circle cx=\"36.5\" cy=\"29\" r=\"1.5\" fill=\"#1A1206\" stroke=\"none\"/><path d=\"M28 35q4 3.2 8 0\" fill=\"none\" stroke-width=\"1.8\" stroke-linecap=\"round\"/>${extra}<\/g><\/svg>`;\n  const LEADS={\n    mevin:{name:'Mevin',role:'Lead mission engineer',pitch:1.05,\n      svg:FACE('#B47A4E','#22160F','<path d=\"M20 27c-1-11 6-15 13-15 8 0 12 5 11 15-2-6-7-9-13-8-5 1-9 4-11 8z\" fill=\"HAIR\"/><path d=\"M30 13c-4 3-6 7-6 11\" fill=\"none\" stroke-width=\"1.5\"/>',\n        '<path d=\"M18.5 29c0-17 27-17 27 0\" fill=\"none\" stroke-width=\"3\"/><rect x=\"16\" y=\"25\" width=\"5\" height=\"9\" rx=\"2\" fill=\"#2C5B65\"/><rect x=\"43\" y=\"25\" width=\"5\" height=\"9\" rx=\"2\" fill=\"#2C5B65\"/><path d=\"M18.5 33q1 6 7 6\" fill=\"none\" stroke-width=\"2\"/><circle cx=\"26\" cy=\"39\" r=\"1.6\" fill=\"#1A1206\"/>','#F2A541')},\n    pawan:{name:'Pawan',role:'Lead flight engineer',pitch:.88,\n      svg:FACE('#9C6440','#15100C','<path d=\"M20.5 26c-1-10 5-14 11.5-14S45 16 43.5 26c-1.5-5-6-8-11.5-8s-10 3-11.5 8z\" fill=\"HAIR\"/><path d=\"M21.5 31c1 10 6 12 10.5 12s9.5-2 10.5-12c-2 5-6 7-10.5 7s-8.5-2-10.5-7z\" fill=\"HAIR\"/>',\n        '<circle cx=\"27.5\" cy=\"29\" r=\"4\" fill=\"none\" stroke-width=\"1.8\"/><circle cx=\"36.5\" cy=\"29\" r=\"4\" fill=\"none\" stroke-width=\"1.8\"/><path d=\"M31.5 29h1\" stroke-width=\"1.8\"/>','#2C5B65')}};\n  const SPEAKER={'Mission':'mevin','Base':'mevin','Launch':'pawan','Mission control':'pawan'};\n  const INTRO={'Mission':'Hi, I\\'m Mevin, one of your two lead engineers. ','Launch':'Pawan here, lead flight engineer. I\\'ll be with you from the pad to orbit. '};\n  window.HZ_LEADS=LEADS;\n  let el=null, ar=null, cur=null, idx=0, list=[], name='', timer=0, on=false;\n  function mount(){ if(el) return; const st=document.createElement('style'); st.textContent=css; document.head.appendChild(st);\n    el=document.createElement('div'); el.className='coach'; el.setAttribute('role','status'); el.setAttribute('aria-live','polite'); document.body.appendChild(el);\n    ar=document.createElement('div'); ar.className='coach-arrow'; ar.innerHTML='<svg viewBox=\"0 0 44 52\"><path d=\"M14 2h16v24h12L22 50 2 26h12z\" fill=\"#F2A541\" stroke=\"#1A1206\" stroke-width=\"3\" stroke-linejoin=\"round\"/><\/svg>'; document.body.appendChild(ar); }\n  function speak(t){ try{ const S=(window.HZ&&HZ.settings)||{}; if(S.sfx===false||!window.speechSynthesis) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=1.05; u.pitch=(LEADS[who()]||{}).pitch||1; speechSynthesis.speak(u); }catch(e){} }\n  let lastDyn='';\n  const who=()=>(cur&&cur.who)||SPEAKER[name]||'mevin';\n  function show(){ cur=list[idx]; if(!cur){ stop(false); return; } if(cur.enter) try{ cur.enter(); }catch(e){} lastDyn='';\n    if(typeof cur.dyn==='function'){ const d=cur.dyn()||['','']; cur.say=d[0]; cur.why=d[1]; lastDyn=d[0]; }\n    if(idx===0&&INTRO[name]&&!cur._intro){ cur._intro=1; cur.say=INTRO[name]+cur.say; } const L=LEADS[who()];\n    el.innerHTML=`<div class=\"k\"><span>Tutorial \u00b7 ${name} ${idx+1}/${list.length}<\/span><button type=\"button\" data-skip>Skip tutorial<\/button><\/div><div class=\"who\">${L.svg}<div><b>${L.name}<\/b><span>${L.role}<\/span><\/div><\/div><div data-say>${cur.say}<\/div><span class=\"why\" data-why ${cur.why?'':'hidden'}>${cur.why||''}<\/span>${cur.next?`<div class=\"nx\"><button type=\"button\" data-next>${cur.next}<\/button><\/div>`:''}<div class=\"bar\"><i style=\"width:${(idx)/list.length*100}%\"><\/i><\/div>`;\n    el.classList.remove('s'); void el.offsetWidth; el.classList.add('s'); speak(cur.say.replace(/<[^>]+>/g,''));\n    const nb=el.querySelector('[data-next]'); if(nb) nb.onclick=advance; el.querySelector('[data-skip]').onclick=()=>stop(true); }\n  function advance(){ if(cur&&cur.leave) try{ cur.leave(); }catch(e){} idx++; show(); }\n  function tick(){ if(!on||!cur) return; let p=null;\n    if(typeof cur.dyn==='function'){ const d=cur.dyn()||['','']; if(d[0]&&d[0]!==lastDyn){ lastDyn=d[0]; el.querySelector('[data-say]').innerHTML=d[0]; const w=el.querySelector('[data-why]'); w.innerHTML=d[1]||''; w.hidden=!d[1]; speak(d[0].replace(/<[^>]+>/g,'')); } } try{ p=cur.target&&cur.target(); }catch(e){ p=null; }\n    if(p&&p.getBoundingClientRect){ const r=p.getBoundingClientRect(); p=r.width?{x:r.left+r.width/2,y:r.top-4}:null; }\n    if(p&&isFinite(p.x)&&p.y>-40&&p.y<innerHeight+40){ ar.style.left=p.x+'px'; ar.style.top=Math.max(56,p.y)+'px'; ar.classList.add('s'); } else ar.classList.remove('s');\n    let done=false; try{ done=cur.until&&cur.until(); }catch(e){} if(done) advance(); }\n  function stop(skipped){ on=false; clearInterval(timer); if(el) el.classList.remove('s'); if(ar) ar.classList.remove('s'); try{ speechSynthesis.cancel(); }catch(e){}\n    if(skipped){ if(window.HZ) HZ.tutorial=false; try{ parent.postMessage({hzState:{tutorial:false}},'*'); }catch(e){} if(window.COACH.onSkip) window.COACH.onSkip(); } }\n  window.COACH={ active:()=>!!(window.HZ&&HZ.tutorial),\n    run(n,steps){ if(!this.active()) return; mount(); name=n; list=steps; idx=0; on=true; show(); clearInterval(timer); timer=setInterval(tick,150); },\n    stop, finish(){ stop(false); if(window.HZ) HZ.tutorial=false; try{ parent.postMessage({hzState:{tutorial:false}},'*'); }catch(e){} },\n    get step(){ return idx; }, onSkip:null };\n})();\n<\/script>\n<script>\n/* ===== Music by phase (shared by every screen) =====\n   One generative score for the whole game, played by the shell page so it carries on across screens and crossfades between phases.\n   Each screen sets its phase; the launch and mission control also follow their own moments (countdown, ascent, orbit, cruise, arrival, win, lose).\n   Follows the Music setting (localStorage 'hz-settings'). Starts on the first tap or key press (browsers block sound before that).\n   API: HZ_MUSIC.phase(name), HZ_MUSIC.sting('win'|'lose'), HZ_MUSIC.unlock() */\n(function(){\n  const host=(()=>{ try{ return parent&&parent.document?parent:window; }catch(e){ return window; } })();\n  if(!host.HZ_MUSIC){ const s=host.document.createElement('script'); s.textContent='('+engine.toString()+')()'; host.document.head.appendChild(s); }\n  const M=host.HZ_MUSIC; window.HZ_MUSIC=M; if(!M) return;\n  const unlock=()=>M.unlock(); addEventListener('pointerdown',unlock,true); addEventListener('keydown',unlock,true); addEventListener('touchstart',unlock,true);\n  const SCREEN={home:'home',select:'select',base:'build',launch:'pad',control:'control'};\n  let scr=''; try{ scr=(host.location.hash||'').slice(1); }catch(e){}\n  M.phase(SCREEN[scr]||(window.LX?'pad':'home'));\n\n  function engine(){\n    const W=window; let ac=null, out=null, bus={}, cur='', want='', on=true, next=0, step=0, timer=0;\n    const mtof=m=>440*Math.pow(2,(m-69)/12);\n    // bpm, chords (MIDI, one per bar), layers and their volumes. 16 steps per bar.\n    const P={\n      home:   {bpm:68, ch:[[48,55,64,71],[45,52,60,67],[41,48,57,64],[43,50,59,62]], pad:.05, arp:[0,null,null,7,null,null,4,null,null,null,12,null,null,9,null,null], arpV:.028, bell:true},\n      select: {bpm:80, ch:[[48,55,64,71],[45,52,60,67],[41,48,57,64],[43,50,59,62]], pad:.045, arp:[0,null,7,null,4,null,12,null,0,null,7,null,9,null,4,null], arpV:.03, bass:[0,null,null,null,null,null,null,null,0,null,null,null,null,null,null,null], bassV:.05},\n      build:  {bpm:100,ch:[[41,48,57,64],[43,50,59,62],[45,52,60,67],[43,50,55,62]], pad:.035, arp:[0,7,12,7,4,7,12,16,0,7,12,7,9,7,12,16], arpV:.026, bass:[0,null,null,0,null,null,7,null,0,null,null,0,null,null,5,null], bassV:.06, hat:[0,0,1,0,0,0,1,0,0,0,1,0,0,0,1,1]},\n      pad:    {bpm:76, ch:[[38,45,50,57],[38,45,50,58],[36,43,50,57],[38,45,50,55]], pad:.05, drone:38, arp:[0,null,null,null,null,null,null,null,7,null,null,null,null,null,null,null], arpV:.025},\n      count:  {bpm:120,ch:[[38,45,50,57],[38,45,51,57]], pad:.035, drone:38, tick:[1,0,0,0,1,0,0,0,1,0,0,0,1,0,0,0], bass:[0,null,null,null,0,null,null,null,0,null,null,null,0,null,null,null], bassV:.06, rise:true},\n      ascent: {bpm:132,ch:[[38,45,50,57],[34,41,46,53],[36,43,48,55],[41,48,53,60]], pad:.04, saw:true, bass:[0,0,12,0,0,0,12,0,0,0,12,0,0,7,12,0], bassV:.065, kick:[1,0,0,0,1,0,0,0,1,0,0,0,1,0,1,0], hat:[0,0,1,0,0,0,1,0,0,0,1,0,0,0,1,0], arp:[0,7,12,7,0,7,12,7,0,7,12,7,0,7,12,14], arpV:.02},\n      orbit:  {bpm:70, ch:[[40,47,56,63],[45,52,59,64],[42,49,56,61],[44,51,56,63]], pad:.055, arp:[12,null,null,7,null,null,4,null,null,null,11,null,null,7,null,null], arpV:.026, bell:true},\n      cruise: {bpm:60, ch:[[36,43,52,59],[34,41,50,57]], pad:.05, drone:24, bell:true, arp:[12,null,null,null,null,null,null,null,null,null,null,null,7,null,null,null], arpV:.022},\n      arrive: {bpm:92, ch:[[46,53,62,69],[43,50,58,65],[39,46,55,62],[41,48,57,65]], pad:.05, arp:[0,4,7,12,7,4,0,4,7,12,16,12,7,4,7,12], arpV:.024, bass:[0,null,null,null,0,null,null,null,0,null,null,null,0,null,7,null], bassV:.055},\n      control:{bpm:96, ch:[[45,52,57,64],[41,48,57,60],[43,50,55,62],[40,47,55,59]], pad:.035, arp:[0,null,12,null,7,null,12,null,0,null,12,null,7,null,14,null], arpV:.02, bass:[0,null,null,null,null,null,null,null,0,null,null,null,null,null,7,null], bassV:.05, hat:[0,0,1,0,0,0,1,0,0,0,1,0,0,0,1,0]},\n      win:    {bpm:84, ch:[[48,55,64,72],[53,60,69,72],[45,52,60,67],[43,50,59,67]], pad:.05, arp:[0,4,7,12,null,null,7,null,0,4,7,12,null,null,16,null], arpV:.026, bell:true},\n      lose:   {bpm:58, ch:[[45,52,57,60],[41,48,53,57],[38,45,50,53],[40,47,52,56]], pad:.045, drone:33},\n    };\n    function enabled(){ try{ const s=JSON.parse(localStorage.getItem('hz-settings')||'{}')||{}; return s.music!==false; }catch(e){ return true; } }\n    function init(){ if(ac) return; try{ ac=new (W.AudioContext||W.webkitAudioContext)(); }catch(e){ return; }\n      const comp=ac.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=3; out=ac.createGain(); out.gain.value=0; out.connect(comp); comp.connect(ac.destination);\n      const n=ac.createBuffer(1,ac.sampleRate,ac.sampleRate), d=n.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; W.__hzNoise=n;\n      next=ac.currentTime+.1; timer=setInterval(sched,60); }\n    function busFor(ph){ if(!bus[ph]){ const g=ac.createGain(); g.gain.value=0; const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=ph==='count'?600:2600; g.connect(f); f.connect(out); bus[ph]={g,f}; } return bus[ph]; }\n    function voice(dest,type,fq,t,dur,vol,a,r,cut){ const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.value=fq; o.detune.value=(Math.random()-.5)*8;\n      let node=o; if(cut){ const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut; o.connect(f); node=f; } node.connect(g); g.connect(dest);\n      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+a); g.gain.setValueAtTime(vol,t+Math.max(a,dur-r)); g.gain.linearRampToValueAtTime(0,t+dur); o.start(t); o.stop(t+dur+.05); }\n    function noise(dest,t,dur,vol,hp){ const s=ac.createBufferSource(); s.buffer=W.__hzNoise; const f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; const g=ac.createGain();\n      g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(f); f.connect(g); g.connect(dest); s.start(t); s.stop(t+dur+.02); }\n    function kick(dest,t){ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(42,t+.18); g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.0001,t+.3); o.connect(g); g.connect(dest); o.start(t); o.stop(t+.32); }\n    function sched(){ if(!ac||!cur) return; const p=P[cur], spb=60/p.bpm/4, B=busFor(cur).g;\n      while(next<ac.currentTime+.25){ const t=next, s=step%16, bar=Math.floor(step/16), ch=p.ch[bar%p.ch.length];\n        if(s===0){ const len=spb*16; for(const m of ch) voice(B,p.saw?'sawtooth':'triangle',mtof(m),t,len+.4,p.pad/(p.saw?1.6:1),len*.3,len*.35,p.saw?900:1600);\n          if(p.drone) voice(B,'sine',mtof(p.drone),t,len+.4,.06,len*.4,len*.4);\n          if(p.bell&&bar%2===0) voice(B,'sine',mtof(ch[3]+24),t+spb*8,2.6,.022,.01,2.4); }\n        if(p.arp&&p.arp[s]!=null) voice(B,'triangle',mtof(ch[0]+24+p.arp[s]),t,spb*2.2,p.arpV,.01,spb*1.8,3200);\n        if(p.bass&&p.bass[s]!=null) voice(B,'sine',mtof(ch[0]-12+p.bass[s]),t,spb*1.8,p.bassV,.01,spb,600);\n        if(p.hat&&p.hat[s]) noise(B,t,.05,.035,7000);\n        if(p.kick&&p.kick[s]) kick(B,t);\n        if(p.tick&&p.tick[s]){ voice(B,'sine',s===0?1320:880,t,.08,.05,.003,.06); }\n        next+=spb; step++; } }\n    function fadeTo(ph){ if(!ac||ph===cur) return; const t=ac.currentTime;\n      if(cur&&bus[cur]){ const g=bus[cur].g.gain; g.cancelScheduledValues(t); g.setValueAtTime(g.value,t); g.linearRampToValueAtTime(0,t+1.8); }\n      cur=ph; const b=busFor(ph); b.g.gain.cancelScheduledValues(t); b.g.gain.setValueAtTime(b.g.gain.value,t); b.g.gain.linearRampToValueAtTime(1,t+2.2);\n      if(P[ph].rise){ b.f.frequency.cancelScheduledValues(t); b.f.frequency.setValueAtTime(500,t); b.f.frequency.linearRampToValueAtTime(3200,t+6); }\n      step=Math.ceil(step/16)*16; }\n    function apply(){ if(!ac) return; const t=ac.currentTime, v=on&&!document.hidden?.9:0; out.gain.cancelScheduledValues(t); out.gain.setValueAtTime(out.gain.value,t); out.gain.linearRampToValueAtTime(v,t+.8); }\n    function sting(kind){ if(!ac||!on) return; const t=ac.currentTime+.05, d=ac.createGain(); d.gain.value=1; d.connect(out);\n      const notes=kind==='win'?[60,64,67,72,76,79,84]:[57,56,53,50,45];\n      notes.forEach((m,i)=>voice(d,'triangle',mtof(m),t+i*(kind==='win'?.09:.22),kind==='win'?1.4:1.1,.06,.01,.9,3000));\n      fadeTo(kind==='win'?'win':'lose'); }\n    setInterval(()=>{ const e=enabled(); if(e!==on){ on=e; apply(); } },800);\n    document.addEventListener('visibilitychange',apply);\n    W.HZ_MUSIC={\n      unlock(){ on=enabled(); if(!on&&!ac) return; init(); if(!ac) return; if(ac.state!=='running') ac.resume(); if(want) fadeTo(want); apply(); },\n      phase(ph){ if(!P[ph]) return; want=ph; if(ac&&ac.state==='running') fadeTo(ph); },\n      sting, get current(){ return cur; }, get running(){ return !!ac&&ac.state==='running'; } };\n  }\n})();\n<\/script>\n<script>\n/* Show what the mission gives you before it starts: budget, build time and the delta-v it needs. */\nfor(const k in MISSIONS){ const L=HZ_LIMITS[k], P=hzPlan(k), m=MISSIONS[k]; if(!L) continue;\n  m.specs=m.specs.filter(s=>!/Budget|Duration|Delta-v|Mass limit/.test(s[0]));\n  m.specs.unshift(['Budget','$'+L.budget+'M'],['Build time',L.time+' months']); if(P.total) m.specs.push(['Delta-v needed',P.total.toFixed(1)+' km/s']);\n  const best=HZ_FLIGHTS.best(k)[0]; m.specs.push(['Your best',best?best.score+' / 100':'not flown yet']); }\n<\/script>\n<script>\ndocument.addEventListener('click',e=>{ if(e.target.closest('#start')) hzGo('base',{mission:selected}); if(e.target.closest('#home')&&!selected) hzGo('home'); },true);\n<\/script><script>\n/* Tutorial, part 1: choose the mission */\nif(window.COACH&&COACH.active()){ const P=()=>{ const v=new THREE.Vector3(); earth.mesh.getWorldPosition(v); v.project(camera); return {x:(v.x+1)/2*innerWidth,y:(1-v.y)/2*innerHeight-26}; };\n  COACH.run('Mission',[\n    {say:'This is the solar system. Every glowing planet has a mission, based on a real NASA one.',why:'Your first mission watches for wildfires on Earth.',next:'Next'},\n    {say:'Click <b>Earth<\/b> to open its mission brief.',target:P,until:()=>selected==='earth'},\n    {say:'Read the brief: the objective, the goals and the limits. Then press <b>Start mission<\/b>.',why:'Every mission starts with a goal. You design the spacecraft to meet it.',target:()=>document.getElementById('start')}]); }\n<\/script>\n", "base": "<!doctype html>\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<script>\n/* Shared mission data and transfer maths (inlined into the launch screen and the hand-off glue by tools/build-game.py).\n   Planet constants and plan() come from The Horizon Explorers v4: Hohmann transfer with patched conics.\n   Each destination uses a real NASA mission whose spacecraft model is in NASA 3D Resources. */\nconst HZ_PL={\n  mercury:{n:'Mercury',a:.387,P:.241,R:2440,mu:22032,cols:['#B5B0A8','#8E8982','#D2CDC4','#4A4640']},\n  venus:  {n:'Venus',  a:.723,P:.615,R:6052,mu:324859,cols:['#E6C27A','#C9A55C','#F3DDA8','#7A5E2E']},\n  earth:  {n:'Earth',  a:1,   P:1,   R:6371,mu:398600,cols:['#2C5B65','#1C3E46','#95B3B6','#0B1F24']},\n  mars:   {n:'Mars',   a:1.524,P:1.881,R:3390,mu:42828,cols:['#C2643A','#A73B42','#E07A44','#4A1A14']},\n  jupiter:{n:'Jupiter',a:5.203,P:11.86,R:69911,mu:1.267e8,cols:['#C9A55C','#8A7A4A','#F2C27A','#4A3F22'],big:1},\n  saturn: {n:'Saturn', a:9.537,P:29.46,R:58232,mu:3.793e7,cols:['#E8D9B8','#C9B58A','#F3EEE4','#7A6A48'],big:1,ring:1},\n  uranus: {n:'Uranus', a:19.19,P:84,   R:25362,mu:5.794e6,cols:['#95C9CF','#6FA9B2','#C4E4E6','#33606A'],big:1},\n  neptune:{n:'Neptune',a:30.07,P:164.8,R:24622,mu:6.837e6,cols:['#2C4F8A','#1C3566','#6F8FCF','#0B1838'],big:1},\n  pluto:  {n:'Pluto',  a:39.48,P:248,  R:1188,mu:869.6,cols:['#CBB59A','#A8937A','#E6D6C0','#5E4E3C']}};\n// kind: 'orbit' (Earth orbit only), 'moon', 'orbiter' (transfer + insertion), 'flyby' (transfer, no insertion)\nconst HZ_MISSIONS={\n  earth:  {planet:'earth',  name:'Wildfire watch',  nasa:'Landsat',        kind:'orbit',  diff:1,unit:'fires',        verb:'spotted',  model:'landsat-8', obj:'Spot new wildfires within hours, from orbit, so crews on the ground can act before they spread.'},\n  moon:   {planet:'moon',   name:'Lunar polar ice', nasa:'LRO',            kind:'moon',   diff:2,unit:'ice maps',     verb:'made',     model:'lro',       obj:'Map water ice hiding in craters at the lunar poles that never see sunlight.'},\n  mars:   {planet:'mars',   name:'Mars atmosphere', nasa:'MAVEN',          kind:'orbiter',diff:3,unit:'air samples',  verb:'taken',    model:'maven',     obj:'Measure how Mars is losing its air to space, and how fast.'},\n  mercury:{planet:'mercury',name:'Mercury mapper',  nasa:'MESSENGER',      kind:'orbiter',diff:3,unit:'surface maps', verb:'made',     model:'messenger', obj:'Map all of Mercury and look for ice in polar craters that never see the Sun.'},\n  venus:  {planet:'venus',  name:'Venus radar',     nasa:'Magellan',       kind:'orbiter',diff:2,unit:'radar swaths', verb:'mapped',   model:'magellan',  obj:'Map the surface of Venus with radar, straight through its thick clouds.'},\n  jupiter:{planet:'jupiter',name:'Inside Jupiter',  nasa:'Juno',           kind:'orbiter',diff:3,unit:'gravity passes',verb:'flown',   model:'juno',      obj:'Measure the gravity and magnetic field of Jupiter to see what lies under the clouds.'},\n  saturn: {planet:'saturn', name:'Rings and Titan', nasa:'Cassini-Huygens',kind:'orbiter',diff:3,unit:'ring scans',   verb:'made',     model:'cassini',   obj:'Study Saturn, its rings and its moon Titan from orbit.'},\n  uranus: {planet:'uranus', name:'Ice giant flyby', nasa:'Voyager 2',      kind:'flyby',  diff:2,unit:'flyby images', verb:'taken',    model:'voyager',   obj:'Fly past Uranus, the ice giant that rolls on its side, and photograph its moons.'},\n  neptune:{planet:'neptune',name:'Edge of the planets',nasa:'Voyager 2',   kind:'flyby',  diff:3,unit:'flyby images', verb:'taken',    model:'voyager',   obj:'Fly past Neptune and its moon Triton at the edge of the planets.'},\n  pluto:  {planet:'pluto',  name:'Pluto flyby',     nasa:'New Horizons',   kind:'flyby',  diff:3,unit:'flyby images', verb:'taken',    model:'new-horizons',obj:'Cross the whole solar system for one fast pass over the icy heart of Pluto.'}};\n// Hohmann transfer from Earth to a planet (km/s, days). HTML4 plan().\nfunction hzPlan(key){ const M=HZ_MISSIONS[key]||HZ_MISSIONS.earth;\n  if(M.kind==='orbit') return {tpi:0,oi:0,T:0,total:0};\n  if(M.kind==='moon') return {tpi:3.13,oi:.82,T:3.5,total:3.95,a:58,e:(58-1)/(58+1),at:(1+58)/2,outer:true};\n  const p=HZ_PL[M.planet],a=p.a,at=(1+a)/2,T=.5*Math.pow(at,1.5)*365.25,vE=29.78,vd=vE*Math.sqrt(2-1/at),vi1=Math.abs(vd-vE),r=6571,mu=398600;\n  const tpi=Math.sqrt(vi1*vi1+2*mu/r)-Math.sqrt(mu/r),va=vE*Math.sqrt(2/a-1/at),vi2=Math.abs(va-vE/Math.sqrt(a)),rp=p.R*1.5,x=2*p.mu/rp;\n  const oi=M.kind==='flyby'?0:Math.sqrt(vi2*vi2+x)-Math.sqrt(x*50/51);\n  return {tpi,oi,T,total:tpi+oi,a,at,e:Math.abs(a-1)/(a+1),outer:a>1,vi2}; }\n// Delta-v the stack can give after reaching orbit: what is left in the upper stage plus the spacecraft engine.\nconst HZ_STAGE_DV={r1:3.2,r2:4.6,r3:9.5,r4:7.2,r5:12.5}, HZ_ENGINE_DV={e1:.4,e2:1.6,e3:3.6};\nfunction hzDvCap(pick){ return (HZ_STAGE_DV[pick&&pick.rocket]||3.2)+(HZ_ENGINE_DV[pick&&pick.engine]||.4); }\n\n/* ===== Spacecraft design: instruments and mission goals (phase 2) =====\n   Each mission has 3 goals; each goal is met by any one of its listed instruments. */\nconst HZ_INST=[\n  {id:'cam',    name:'Visible camera',       proc:'scope',  mass:18, cost:10, time:3, pw:30,  data:12, note:'Sharp pictures in daylight'},\n  {id:'ir',     name:'Thermal IR imager',    src:'NASA', model:'infrared-camera', mass:38, cost:32, time:5, pw:110, data:35, note:'Sees heat, day and night'},\n  {id:'hyper',  name:'Hyperspectral imager', proc:'scope2', mass:70, cost:58, time:8, pw:190, data:95, note:'Hundreds of colours: what things are made of'},\n  {id:'radar',  name:'Imaging radar',        proc:'radar',  mass:90, cost:45, time:7, pw:220, data:120, note:'Sees through clouds and haze'},\n  {id:'mag',    name:'Magnetometer',         proc:'boom',   mass:6,  cost:8,  time:2, pw:8,   data:2,  note:'Measures magnetic fields on a long boom'},\n  {id:'spec',   name:'Mass spectrometer',    proc:'spec',   mass:25, cost:30, time:5, pw:45,  data:10, note:'Sniffs gases and charged particles'},\n  {id:'neutron',name:'Neutron spectrometer', proc:'neutron',mass:15, cost:18, time:4, pw:20,  data:4,  note:'Finds hidden water ice'},\n  {id:'grav',   name:'Gravity science radio',proc:'gravr',  mass:8,  cost:12, time:3, pw:25,  data:3,  note:'Tracks tiny speed changes to map gravity'}];\nconst HZ_GOALS={\n  earth:  [['Spot fires day and night',['ir','hyper']],['Map burned land',['cam','hyper']],['See through the smoke',['ir','radar']]],\n  moon:   [['Find ice in dark craters',['neutron','radar']],['Map the polar terrain',['cam','radar']],['Measure surface temperature',['ir']]],\n  mars:   [['Sample the upper air',['spec']],['Measure the magnetic field',['mag']],['Image the glowing atmosphere',['hyper','cam']]],\n  mercury:[['Map the whole surface',['cam','hyper']],['Find ice at the poles',['neutron','radar']],['Measure the magnetic field',['mag']]],\n  venus:  [['Map the surface through the clouds',['radar']],['Map the gravity field',['grav']],['Study the cloud tops',['ir','hyper']]],\n  jupiter:[['Map the gravity field',['grav']],['Map the magnetic field',['mag']],['Look under the clouds',['ir']]],\n  saturn: [['Image the rings',['cam','hyper']],['See through the haze on Titan',['radar','ir']],['Sample the plasma',['spec','mag']]],\n  uranus: [['Photograph the planet and moons',['cam','hyper']],['Measure the magnetic field',['mag']],['Measure the heat inside',['ir']]],\n  neptune:[['Photograph Neptune and Triton',['cam','hyper']],['Measure the magnetic field',['mag']],['Measure the heat inside',['ir']]],\n  pluto:  [['Map the icy heart',['cam','hyper']],['Measure the thin air',['spec']],['Measure surface temperatures',['ir']]]};\nfunction hzGoalsMet(key,ids){ return (HZ_GOALS[key]||HZ_GOALS.earth).map(([t,need])=>({t,need,ok:need.some(n=>ids.includes(n))})); }\n// propulsion: engine efficiency x tank size gives the spacecraft's own delta-v\nconst HZ_ENGINE_K={e1:.35,e2:1,e3:1.9}, HZ_TANK_DV={t1:1,t2:2,t3:3.4};\nfunction hzDvCap(pick){ return (HZ_STAGE_DV[pick&&pick.rocket]||3.2)+(HZ_ENGINE_K[pick&&pick.engine]||.35)*(HZ_TANK_DV[pick&&pick.tank]||1); }\n\n/* ===== Orbits: each choice has real effects in mission control =====\n   ecl: share of each orbit spent in shadow (batteries), link: ground passes (downlink), sci: science per pass,\n   oiK: insertion delta-v factor at the destination. */\nconst HZ_ORBITS={\n  orbit:[ // Earth missions\n    {id:'o1',name:'Sun-sync 550 km', ecl:.35,link:1,  sci:1,   oiK:1,  note:'Passes over every place at the same local time: fair, repeatable pictures'},\n    {id:'o2',name:'Low 400 km',      ecl:.4, link:.8, sci:1.15,oiK:1,  cost:-3,note:'Closer means sharper pictures, but fewer ground passes and more shadow'},\n    {id:'o3',name:'Polar 800 km',    ecl:.32,link:1.3,sci:.9, oiK:1,  note:'Flies over the polar ground stations every orbit: lots of downlink'},\n    {id:'o4',name:'Dawn-dusk 700 km',ecl:.04,link:1,  sci:.85,oiK:1,  cost:4,note:'Rides the line between day and night: almost never in shadow'}],\n  around:[ // orbiters and the Moon\n    {id:'o1',name:'Low circular',    ecl:.4, link:.9, sci:1.2, oiK:1.15,note:'Close to the surface: best science, more shadow, costs more fuel to reach'},\n    {id:'o2',name:'High elliptical', ecl:.15,link:1.1,sci:.85, oiK:.85, note:'Swoops low then far out: little shadow, cheap to enter, less science'},\n    {id:'o3',name:'Polar',           ecl:.3, link:1,  sci:1.05,oiK:1,   note:'Passes over the poles: sees the whole surface over time'}],\n  flyby:[\n    {id:'o1',name:'Close pass',      ecl:0,  link:1,  sci:1.25,oiK:0,   note:'Skims close: sharper data, a riskier aim'},\n    {id:'o2',name:'Safe distance',   ecl:0,  link:1,  sci:.9,  oiK:0,   note:'Passes wider: safe, but less detail'}]};\nfunction hzOrbitsFor(key){ const M=HZ_MISSIONS[key]||HZ_MISSIONS.earth; return M.kind==='orbit'?HZ_ORBITS.orbit:M.kind==='flyby'?HZ_ORBITS.flyby:HZ_ORBITS.around; }\n\n/* ===== Balance (v2): the rocket's push depends on how heavy your spacecraft is, and every mission has its own limits =====\n   A light spacecraft can ride a small rocket a long way; a heavy one needs a big rocket. */\nconst HZ_ROCKET={r1:{cap:300,dv:6.4},r2:{cap:800,dv:7.2},r3:{cap:2000,dv:10.5},r4:{cap:2600,dv:8.4},r5:{cap:4000,dv:12.5}};\nfunction hzRocketDv(rk,mass){ const R=HZ_ROCKET[rk]||HZ_ROCKET.r1; return Math.max(0,R.dv*(1-.55*Math.min(1,(mass||0)/R.cap))); }\nhzDvCap=function(pick,mass){ return hzRocketDv(pick&&pick.rocket,mass)+(HZ_ENGINE_K[pick&&pick.engine]||.35)*(HZ_TANK_DV[pick&&pick.tank]||1); };\nconst HZ_LIMITS={earth:{budget:180,time:12},moon:{budget:320,time:18},mars:{budget:450,time:24},mercury:{budget:480,time:30},venus:{budget:360,time:24},\n  jupiter:{budget:560,time:36},saturn:{budget:620,time:40},uranus:{budget:520,time:36},neptune:{budget:540,time:36},pluto:{budget:500,time:36}};\n\n// sunlight at the destination, as a share of Earth's (solar wings make this much less; an RTG does not care)\nfunction hzSunK(key){ const M=HZ_MISSIONS[key]; if(!M||M.planet==='earth'||M.planet==='moon') return 1; const a=HZ_PL[M.planet]?HZ_PL[M.planet].a:1; return Math.min(2,Math.pow(a,-1.25)); }\n\n/* ===== Difficulty and sandbox (Settings) ===== */\nconst HZ_DIFF={cadet:{name:'Cadet',dv:1.2,budget:1.25,grace:1.6,score:.9},pilot:{name:'Pilot',dv:1,budget:1,grace:1,score:1},commander:{name:'Commander',dv:.88,budget:.85,grace:.6,score:1.15}};\nfunction hzDiff(){ const S=(window.HZ&&HZ.settings)||{}; return HZ_DIFF[S.diff]||HZ_DIFF.pilot; }\nfunction hzSandbox(){ return !!(window.HZ&&HZ.settings&&HZ.settings.sandbox); }\n{ const _cap=hzDvCap; hzDvCap=function(p,m){ return _cap(p,m)*hzDiff().dv; }; }\n\n/* ===== The real NASA mission behind each game mission (for \"a real mission like yours\" in the report) ===== */\nconst HZ_REAL={\n  earth:  {n:'Landsat 8',y:2013,rocket:'Atlas V',mass:2623,power:'solar',inst:['cam','ir'],txt:'An imaging camera (OLI) and a thermal infrared sensor (TIRS), in a sun-synchronous orbit at 705 km.'},\n  moon:   {n:'Lunar Reconnaissance Orbiter',y:2009,rocket:'Atlas V',mass:1916,power:'solar',inst:['cam','ir','neutron','radar'],txt:'Cameras, a thermal radiometer, a neutron detector and a small radar, in a low polar orbit.'},\n  mars:   {n:'MAVEN',y:2013,rocket:'Atlas V',mass:2454,power:'solar',inst:['spec','mag','hyper'],txt:'A mass spectrometer, a magnetometer and an ultraviolet imaging spectrograph, in an elliptical orbit.'},\n  mercury:{n:'MESSENGER',y:2004,rocket:'Delta II',mass:1107,power:'solar',inst:['cam','mag','neutron'],txt:'Cameras, a magnetometer and a neutron spectrometer. It used six planet flybys to slow down instead of a huge rocket.'},\n  venus:  {n:'Magellan',y:1989,rocket:'Space Shuttle Atlantis',mass:3449,power:'solar',inst:['radar','grav'],txt:'A radar that mapped 98% of Venus through the clouds, and radio tracking for gravity.'},\n  jupiter:{n:'Juno',y:2011,rocket:'Atlas V',mass:3625,power:'solar',inst:['grav','mag','ir'],txt:'Huge solar wings (the farthest solar-powered craft), a magnetometer, gravity science and a microwave radiometer.'},\n  saturn: {n:'Cassini-Huygens',y:1997,rocket:'Titan IV-B',mass:5712,power:'rtg',inst:['cam','radar','spec','mag'],txt:'Three RTGs, cameras, a radar that saw through Titan\\'s haze, and particle instruments.'},\n  uranus: {n:'Voyager 2',y:1977,rocket:'Titan IIIE',mass:722,power:'rtg',inst:['cam','mag','ir'],txt:'RTG power, cameras, a magnetometer and an infrared spectrometer: still the only visitor to Uranus.'},\n  neptune:{n:'Voyager 2',y:1977,rocket:'Titan IIIE',mass:722,power:'rtg',inst:['cam','mag','ir'],txt:'The same Voyager 2, twelve years after launch: still the only visitor to Neptune.'},\n  pluto:  {n:'New Horizons',y:2006,rocket:'Atlas V',mass:478,power:'rtg',inst:['cam','spec','ir'],txt:'A light, fast craft with an RTG, cameras and an ultraviolet spectrometer for Pluto\\'s thin air.'}};\n\n/* ===== Saved flights (this browser): compare with your last design, local leaderboard ===== */\nconst HZ_FLIGHTS={ all(){ try{ return JSON.parse(localStorage.getItem('hz-flights')||'[]'); }catch(e){ return []; } },\n  save(f){ try{ const a=this.all(); a.push(f); localStorage.setItem('hz-flights',JSON.stringify(a.slice(-200))); }catch(e){} },\n  of(m){ return this.all().filter(f=>f.mission===m); },\n  best(m){ return this.of(m).filter(f=>!f.sandbox).sort((a,b)=>b.score-a.score); } };\n<\/script>\n<meta charset=\"utf-8\">\n<title>Horizons Base<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;600&display=swap\">\n<style>\n@font-face{font-family:'Game Paused';src:url(data:font/otf;base64,T1RUTwALAIAAAwAwQ0ZGIG2IYoMAAAO8AAAcdURTSUcAAAABAAAlcAAAAAhHREVGABIAOAAAJVgAAAAWT1MvMmLPXRIAAAEgAAAAYGNtYXAEFAdZAAACYAAAAVxoZWFkJH1R8AAAALwAAAA2aGhlYQavArUAAAD0AAAAJGhtdHhw9wWUAAABgAAAAN5tYXhwADhQAAAAARgAAAAGbmFtZSUCvvEAACA0AAAFA3Bvc3T/nwAyAAAlOAAAACAAAQAAAAEAADBLP3hfDzz1AAMD6AAAAADg+emFAAAAAOEMJbEAHP8rA0QCrwAAAAMAAgAAAAAAAAABAAADBf8dAGQDYAAAAAADRAABAAAAAAAAAAAAAAAAAAAANwAAUAAAOAAAAAQCFwGQAAUAAAKKAlgAAABLAooCWAAAAV4AMgEsAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAFBZUlMAwAAAAHoDBf8dAGQC7gD6AAAAAQAAAAACDwLdAAAAIAADAfQAAAAAAAAA+gAAAP8AAAIqABwCKgAcAikAHAIpABwCKQAcAikAHAIqABwCKQAcAPMAHAIpABwCKQAcAikAHANgABwCKQAcAikAHAIpABwCKQAcAikAHAIpABwCZgAcAikAHAIpABwDYAAcAikAHAIpABwCKQAcAhYAHAIWABwCFgAcAhYAHAIWABwCFgAcAhYAHAIWABwA6wAcAScAHAIWABwA6wAcA0EAHAIWABwCFgAcAhYAHAJVABwCFgAcAhYAHAHDABwCFgAcAhYAHANBABwCPwAcAhYAHAAcAAAAAAADAAAAAwAAARwAAQAAAAAAHAADAAEAAAEcAAYBAAAAAAAAewABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABAAFAAYABwAIAAkACgALAAwADQAOAA8AEAARABIAEwAUABUAFgAXABgAGQAaABsAHAAdAAAAAAAAAAAAAAAAAB4AHwAgACEAIgAjACQAJQAmACcAKAApACoAKwAsAC0ALgAvADAAMQAyADMANAA1ADYANwAEAEAAAAAMAAgAAgAEAAAADQAgAFoAev//AAAAAAANACAAQQBh//8AAf/1/+P/w/+9AAEAAAAAAAAAAAAAAAABAAQCAAEBARdHYW1lUGF1c2VkREVNTy1SZWd1bGFyAAEBATD4HQD4HgH4HwwA+CAC+CED+BgE+xEMAxwAHBz/KxwDRBwCrwX3pA/3sRGvHBWSEgAHAQE  stroke-linejoin=\"round\"/><\/symbol>\n  <symbol id=\"i-sat\" viewBox=\"0 0 24 24\"><rect x=\"9\" y=\"9\" width=\"6\" height=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><path d=\"M2 7l5 5-5 5zM22 7l-5 5 5 5z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"/><\/symbol>\n  <symbol id=\"i-rocket\" viewBox=\"0 0 24 24\"><path d=\"M12 2c3 2 5 6 5 11l-2 4H9l-2-4c0-5 2-9 5-11z M9 17l-3 3 1-5M15 17l3 3-1-5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><circle cx=\"12\" cy=\"10\" r=\"1.8\" fill=\"currentColor\"/><\/symbol>\n  <symbol id=\"i-console\" viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><path d=\"M7 12l3-3 3 2 4-4M8 20h8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><\/symbol>\n  <symbol id=\"i-lock\" viewBox=\"0 0 24 24\"><rect x=\"5\" y=\"10\" width=\"14\" height=\"11\" rx=\"2\" fill=\"currentColor\"/><path d=\"M8 10V7a4 4 0 0 1 8 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"/><\/symbol>\n<\/svg>\n\n<div id=\"app\">\n  <div class=\"night\"><\/div><canvas id=\"sky\" aria-hidden=\"true\"><\/canvas><canvas id=\"gl\"><\/canvas>\n  <div class=\"ui hud\">\n    <button class=\"t-round\" type=\"button\" aria-label=\"Back to mission select\"><svg><use href=\"#i-back\"/><\/svg><\/button>\n    <div class=\"res\" id=\"res\"><\/div>\n    <div class=\"mission\"><span class=\"t-ribbon\">Wildfire watch<\/span><\/div>\n  <\/div>\n  <div class=\"ui callout\" id=\"callout\"><\/div>\n  <button class=\"ui t-btn primary enter\" type=\"button\" id=\"enter\"><\/button>\n  <div class=\"ui t-win win\" id=\"win\" role=\"dialog\" aria-live=\"polite\"><\/div>\n  <div class=\"ui t-win dock\" id=\"dock\"><\/div>\n  <div class=\"ui joy\" id=\"joy\"><i><\/i><\/div>\n  <div class=\"ui keys\"><kbd>W<\/kbd><kbd>A<\/kbd><kbd>S<\/kbd><kbd>D<\/kbd> walk \u00b7 <kbd>E<\/kbd> enter<\/div>\n  <div class=\"ui toast\" id=\"toast\">Liftoff!<\/div>\n  <div class=\"ui t-win info\" id=\"info\"><\/div>\n  <div class=\"ui roomname\" id=\"roomname\"><span class=\"t-ribbon\"><\/span><\/div>\n  <div class=\"ui t-pill loading\" id=\"loading\" style=\"display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.6);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);font:400 12px var(--f-num)\">Loading NASA models\u2026<\/div>\n  <div class=\"ui credit\">3D models courtesy of NASA (NASA-3D-Resources). Horizons is not affiliated with or endorsed by NASA.<\/div>\n  <div class=\"wipe\" id=\"wipe\"><\/div>\n<\/div>\n\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js\"><\/script>\n<script>\nconst reduce = (matchMedia('(prefers-reduced-motion: reduce)').matches||!!(window.HZ&&HZ.settings&&HZ.settings.motion));\n\n/* ================= Game data ================= */\n// model: NASA GLB file (models/\u2026); proc: procedural stand-in where NASA has no separate part model\nconst PARTS = {\n  rocket:{label:'Rocket', where:'rocket', opts:[\n    {id:'r1',name:'Jupiter-C',     src:'NASA', model:'rocket-jupiter-c', h:6,  cost:15,  time:1, cap:300},\n    {id:'r2',name:'Ares I',        src:'NASA', model:'rocket-ares-1',    h:9,  cost:40,  time:2, cap:800},\n    {id:'r3',name:'Saturn V',      src:'NASA', model:'rocket-saturn-v',  h:12, cost:90,  time:3, cap:2000},\n    {id:'r4',name:'Space Shuttle', src:'NASA', model:'rocket-shuttle',   h:9,  cost:110, time:4, cap:2600},\n    {id:'r5',name:'SLS',           src:'NASA', model:'rocket-sls',       h:12, cost:140, time:4, cap:4000}]},\n  orbit:{label:'Orbit', where:'rocket', opts:hzOrbitsFor((window.HZ&&HZ.mission)||'earth').map(o=>Object.assign({proc:'orbit'},o))},\n  bus:{label:'Structure', where:'craft', opts:[\n    {id:'b1',name:'Microsat frame', src:'NASA Satellite Kit', model:'kit-body-2', mass:90,  cost:20, time:6, pw:60, note:'Light, room for little'},\n    {id:'b2',name:'Smallsat frame', src:'NASA Satellite Kit', model:'kit-body-3', mass:180, cost:35, time:8, pw:80, note:'The all-rounder'},\n    {id:'b3',name:'Large frame',    src:'NASA Satellite Kit', model:'kit-body-1', mass:320, cost:55, time:10, pw:110, note:'Room for big instruments'}]},\n  power:{label:'Power', where:'craft', opts:[\n    {id:'p1',name:'Solar wings S', src:'NASA Satellite Kit', model:'kit-wings-1', mass:20, cost:6,  time:2, gen:400},\n    {id:'p2',name:'Solar wings M', src:'NASA Satellite Kit', model:'kit-wings-2', mass:42, cost:14, time:3, gen:900},\n    {id:'p3',name:'Solar wings L', src:'NASA Satellite Kit', model:'kit-wings-3', mass:95, cost:30, time:4, gen:2400, note:'Juno-size wings: enough even at Jupiter'},\n    {id:'p4',name:'Nuclear RTG',   proc:'rtg', mass:57, cost:70, time:6, gen:450, note:'Same power anywhere, even far from the Sun'}]},\n  batt:{label:'Battery', where:'craft', opts:[\n    {id:'bt1',name:'Battery S', proc:'batt1', mass:8,  cost:2,  time:1, wh:400,  note:'Short eclipses only'},\n    {id:'bt2',name:'Battery M', proc:'batt2', mass:18, cost:5,  time:2, wh:1000, note:'Rides through most eclipses'},\n    {id:'bt3',name:'Battery L', proc:'batt3', mass:40, cost:10, time:3, wh:2500, note:'Long nights and safe mode'}]},\n  comms:{label:'Comms', where:'craft', opts:[\n    {id:'c1',name:'Dish S', src:'NASA Satellite Kit', model:'kit-radio-1', mass:6,  cost:3,  time:2, down:20},\n    {id:'c2',name:'Dish M', src:'NASA Satellite Kit', model:'kit-radio-2', mass:12, cost:9,  time:3, down:60, pw:30},\n    {id:'c3',name:'Dish L', src:'NASA Satellite Kit', model:'kit-radio-3', mass:26, cost:16, time:4, down:140, pw:50},\n    {id:'c4',name:'Laser link', proc:'laser', mass:18, cost:30, time:5, down:400, pw:70, note:'Very fast, needs precise pointing'}]},\n  store:{label:'Data storage', where:'craft', opts:[\n    {id:'s1',name:'Storage 40 Gb',  proc:'store1', mass:2, cost:1, time:1, store:40},\n    {id:'s2',name:'Storage 120 Gb', proc:'store2', mass:4, cost:3, time:1, store:120},\n    {id:'s3',name:'Storage 300 Gb', proc:'store3', mass:8, cost:7, time:2, store:300}]},\n  inst:{label:'Instrument 1', where:'craft', opts:HZ_INST},\n  inst2:{label:'Instrument 2', where:'craft', opts:HZ_INST, optional:true, slot:true},\n  inst3:{label:'Instrument 3', where:'craft', opts:HZ_INST, optional:true, slot:true},\n  engine:{label:'Engine', where:'craft', opts:[\n    {id:'e1',name:'Cold gas',  proc:'nozzle-s', mass:10, cost:2,  time:1, note:'Simple and safe, little push'},\n    {id:'e2',name:'Hydrazine', proc:'nozzle-m', mass:28, cost:7,  time:2, pw:10, note:'The standard spacecraft engine'},\n    {id:'e3',name:'Electric',  proc:'ion',      mass:22, cost:16, time:4, pw:160, note:'Very efficient, needs lots of power'}]},\n  tank:{label:'Fuel tank', where:'craft', opts:[\n    {id:'t1',name:'Tank S', proc:'tank1', mass:20,  cost:2, time:1, note:'Enough for small moves'},\n    {id:'t2',name:'Tank M', proc:'tank2', mass:60,  cost:5, time:2, note:'Enough to brake at Mars or Venus'},\n    {id:'t3',name:'Tank L', proc:'tank3', mass:140, cost:9, time:3, note:'For the outer planets'}]},\n};\nconst pick = {rocket:'r1', orbit:'o1', bus:'b1', power:'p1', batt:'bt1', comms:'c2', store:'s1', inst:null, inst2:null, inst3:null, engine:'e1', tank:'t1'};\nconst INST_SLOTS=['inst','inst2','inst3'], CRAFT_CATS=['bus','power','batt','comms','store','inst','engine','tank'];\nconst mountedInst=()=>INST_SLOTS.map(c=>pick[c]).filter(Boolean);\nfunction isMounted(s){ return s.cat==='inst'?mountedInst().includes(s.id):pick[s.cat]===s.id; }\nconst SUNK=hzSunK((window.HZ&&HZ.mission)||'earth'), DESTN=((window.HZ&&HZ_MISSIONS[HZ.mission])?(HZ.mission==='moon'?'the Moon':HZ_PL[HZ_MISSIONS[HZ.mission].planet].n):'Earth');\nconst LIMIT = Object.assign({budget:180, time:12}, (window.HZ&&HZ_LIMITS[HZ.mission])||{}); LIMIT.budget=Math.round(LIMIT.budget*hzDiff().budget); if(hzSandbox()){ LIMIT.budget=99999; LIMIT.time=999; }\nconst optOf=(cat,id)=>PARTS[cat].opts.find(o=>o.id===id);\nconst opt=(cat)=>optOf(cat,pick[cat]);\nfunction totals(){\n  let mass=0,cost=0,time=0,pw=0,gen=0,data=0,down=0,store=0,cap=300,link=1;\n  for(const c in PARTS){const o=opt(c); if(!o) continue; mass+=o.mass||0; cost+=o.cost||0; time=Math.max(time,o.time||0); pw+=o.pw||0; gen+=(o.gen||0)*(c==='power'&&o.proc!=='rtg'?SUNK:1); data+=o.data||0; down+=o.down||0; store+=o.store||0; if(o.cap) cap=o.cap; if(o.link) link=o.link;}\n  down*=link;\n  return {M:[\n    {k:'mass',icon:'mass',label:'Mass',val:`${mass}/${cap} kg`,r:mass/cap,hint:`Too heavy for ${opt('rocket').name} (${cap} kg). Pick a bigger rocket or lighter parts.`},\n    {k:'budget',icon:'coin',label:'Budget',val:`$${cost}/${LIMIT.budget}M`,r:cost/LIMIT.budget,hint:`Over the $${LIMIT.budget}M budget. Swap a part for a cheaper one.`},\n    {k:'power',icon:'bolt',label:'Power',val:`${pw}/${Math.round(gen)} W`,r:gen?pw/gen:2,hint:SUNK<.9?`At ${DESTN} sunlight is ${Math.round(SUNK*100)}% of Earth's, so the wings make less. Fit bigger wings or the RTG.`:`Parts draw more power than the panels make. Fit bigger solar wings.`},\n    {k:'data',icon:'data',label:'Data',val:`${data}/${store} Gb`,r:store?data/store:0,hint:`The instruments fill storage too fast. Fit bigger data storage.`},\n    {k:'comms',icon:'comms',label:'Comms',val:`${data}/${Math.round(down)} Gb/d`,r:data?data/Math.max(down,1):0,hint:`The dish can't send all the data home. Fit a bigger dish or the laser.`},\n    {k:'time',icon:'time',label:'Time',val:`${time}/${LIMIT.time} mo`,r:time/LIMIT.time,hint:`Building takes longer than the ${LIMIT.time}-month deadline.`}]};\n}\nfunction fx(o){const a=[]; if(o.ecl!=null&&o.proc==='orbit'){ a.push([Math.round(o.ecl*100)+'% in shadow',o.ecl>.3?'up':'good']); a.push([(o.link>1?'more':o.link<1?'fewer':'normal')+' ground passes',o.link>=1?'good':'up']); a.push(['science x'+o.sci,o.sci>=1?'good':'up']); if(o.oiK&&o.oiK!==1) a.push(['insertion fuel x'+o.oiK,o.oiK<1?'good':'up']); } if(o.wh) a.push([o.wh+' Wh stored','good']); if(o.id&&HZ_TANK_DV[o.id]) a.push(['x'+HZ_TANK_DV[o.id]+' engine delta-v','good']); if(o.id&&HZ_ENGINE_K[o.id]) a.push([(HZ_ENGINE_K[o.id]*2).toFixed(1)+' km/s with tank M','good']); if(o.mass) a.push(['+'+o.mass+' kg','up']); if(o.cost) a.push([(o.cost>0?'+$':'-$')+Math.abs(o.cost)+'M',o.cost>0?'up':'good']); if(o.pw) a.push(['+'+o.pw+' W use','up']); if(o.gen) a.push([o.gen+' W','good']); if(o.data) a.push([o.data+' Gb/d','']); if(o.down) a.push([o.down+' Gb/d link','good']); if(o.cap) a.push(['lifts '+o.cap+' kg','good']); if(o.store) a.push([o.store+' Gb store','good']); if(o.time) a.push([o.time+' mo','']); if(o.note) a.push([o.note,'']); return a.map(x=>`<span class=\"${x[1]}\">${x[0]}<\/span>`).join('')}\n\n/* ================= HUD / callout / dock ================= */\nconst ic=(n)=>`<svg class=\"i\"><use href=\"#i-${n}\"/><\/svg>`;\nconst resEl=document.getElementById('res'); let lastVals={};\nfunction renderHUD(){const {M}=totals(); resEl.innerHTML=M.map(m=>{const st=m.r>1?'bad':m.r>.85?'warn':''; return `<div class=\"metric ${st} ${lastVals[m.k]&&lastVals[m.k]!==m.val?'bump':''}\" title=\"${m.label}\"><span class=\"ic\">${ic(m.icon)}<\/span>${m.val}<span class=\"mb\"><i style=\"width:${Math.min(m.r,1)*100}%\"><\/i><\/span><\/div>`}).join(''); M.forEach(m=>lastVals[m.k]=m.val);}\nconst calloutEl=document.getElementById('callout'); let step=0;\nconst STEPS=[['Step 1/3','Walk into the glowing spacecraft workshop.'],['Step 2/3','Pick an instrument from the Instruments station, carry it to the build stand and mount it. Check the goals board. Keep bars green!'],['Step 3/3','Head out to the launch pad and launch.'],['Done','Now design your own. Try other parts and beat your score.']];\nfunction setStep(n){step=n;const s=STEPS[n];calloutEl.style.animation='none';void calloutEl.offsetWidth;calloutEl.style.animation='';calloutEl.innerHTML=`<b>${s[0]}<\/b><span>${s[1]}<\/span><button class=\"skip\" type=\"button\" id=\"skip\">Skip<\/button>`;document.getElementById('skip').onclick=()=>{calloutEl.style.display='none'};}\nconst dockEl=document.getElementById('dock'); let launched=false;\nfunction renderDock(){const T=[['planet','Missions',''],['wrench','Rocket','rocket'],['sat','Spacecraft','craft'],['rocket','Launch pad','pad'],['console','Control',launched?'control':'lock']];\n  dockEl.innerHTML=T.map(t=>`<button class=\"tile ${t[2]==='lock'?'lock':''} ${(where===t[2]||openZone===t[2])?'on':''}\" type=\"button\" data-z=\"${t[2]}\">${t[2]==='control'&&launched?'<span class=\"new\">NEW<\/span>':''}${ic(t[2]==='lock'?'lock':t[0])}${t[1]}<\/button>`).join('');}\ndockEl.addEventListener('click',e=>{const b=e.target.closest('.tile');if(!b)return;const z=b.dataset.z;if(!z||z==='lock')return;\n  if(where!=='base'){ if(z===where) return; exitRoom(()=>walkTo(z)); } else walkTo(z);});\n\n/* ================= Renderer, camera ================= */\nconst canvas=document.getElementById('gl');\nconst renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});\nrenderer.setPixelRatio(Math.min(devicePixelRatio||1,(window.HZ&&HZ.settings&&HZ.settings.gfx==='low')?1:1.5)); renderer.setClearColor(0,0);\nconst scene=new THREE.Scene();\nconst cam=new THREE.OrthographicCamera(-1,1,1,-1,-300,500);\nscene.add(new THREE.HemisphereLight(0xFBFAF4,0x6E6457,.9)); const sun=new THREE.DirectionalLight(0xffffff,.9); sun.position.set(-20,40,14); scene.add(sun);\nconst ISO=new THREE.Vector3(1,0.82,1).normalize();\nlet camZoom=1, camZoomGoal=1;\n\n/* ================= Comet surface shader ================= */\nconst V=`varying vec3 vN; varying vec3 vW; void main(){ vN=normalize(mat3(modelMatrix)*normal); vec4 w=modelM orEach((k,i)=>pick[k]=left[i]||null); renderHUD(); refreshBuildBay(); drawGoals(); return; }\n    slot=INST_SLOTS.find(k=>!pick[k]); if(!slot){ toastMsg('All 3 instrument slots are full: remove one first'); return; } }\n  pick[slot]=id; justMounted=slot; if(carry&&carry.id===id){ carry=null; if(carryObj){ hero.remove(carryObj); carryObj=null; } }\n  renderHUD(); refreshBuildBay(); drawGoals(); if(c==='inst'&&step===1) setStep(2); }\nfunction startCarry(s){ carry=s; if(carryObj) hero.remove(carryObj); carryObj=partObject(s.cat,s.o,.9); carryObj.position.set(0,2.35,.15); hero.add(carryObj);\n  toastMsg('Carrying '+s.o.name); const st=A().spots.find(x=>x.id==='stand'); if(st) st.label='Mount '+s.o.name; showInfo(s,true); }\nfunction standAct(){ if(!carry){ openWin('stand'); return; }\n  const s=carry; let slot=s.cat;\n  if(s.cat==='inst'){ if(mountedInst().includes(s.o.id)){ toastMsg('Already mounted'); return; } slot=INST_SLOTS.find(c=>!pick[c]); if(!slot){ toastMsg('All 3 instrument slots are full'); openWin('stand'); return; } }\n  pick[slot]=s.o.id; justMounted=slot; carry=null; if(carryObj){ hero.remove(carryObj); carryObj=null; } A().spots.find(x=>x.id==='stand').label='Design spacecraft';\n  renderHUD(); refreshBuildBay(); drawGoals(); toastMsg(s.o.name+' mounted'); if(s.cat==='inst'&&step===1) setStep(2); }\nfunction refreshBuildBay(){ if(!buildBay) return; buildBay.clear(); const s=new THREE.Group(); buildBay.add(s); s.scale.setScalar(2.6);\n  const put=(cat,o,size,x,y,z,ry=0,rx=0)=>{ if(!o) return; const g=partObject(cat,o,size); g.userData.cat=cat+(o.proc==='rtg'?'-rtg':''); g.position.set(x,y,z); g.rotation.set(rx,ry,0); s.add(g);\n    if(justMounted===cat||(justMounted&&cat===justMounted.replace(/[0-9]/,''))&&false){} if(justMounted&&(justMounted===cat)){ g.userData.pop=0; pops.push(g); } return g; };\n  const bus=opt('bus'); put('bus',bus,1.8,0,0,0);\n  const pw=opt('power'); if(pw){ if(pw.proc==='rtg') put('power',pw,1.1,0,.3,-1.5,0,0); else for(const side of [-1,1]) put('power',pw,1.6,side*1.6,.6,0,side>0?0:Math.PI); }\n  put('comms',opt('comms'),1.0,0,1.75,0);\n  put('batt',opt('batt'),.55,-.62,1.62,.45); put('store',opt('store'),.5,.62,1.62,.45);\n  const tk=opt('tank'); put('tank',tk,.9,0,.25,-1.05,0,-Math.PI/2); put('engine',opt('engine'),.7,0,.25,tk?-1.75:-1.1,0,-Math.PI/2);\n  INST_SLOTS.forEach((c,i)=>{ const id=pick[c]; if(!id) return; const o=HZ_INST.find(x=>x.id===id); const g=partObject('inst',o,.7); g.userData.cat='inst'; g.position.set((i-1)*.62,.12,1.05); s.add(g); if(justMounted===c){ g.userData.pop=0; pops.push(g); } });\n  justMounted=null; snugCraft(s); }\n// Pull every part flush against the body so the stand shows one connected spacecraft (wings on its sides, dish and boxes on top,\n// instruments on the front, tank and engine on the back). Works from real bounding boxes, so any bus/part size fits.\nfunction snugCraft(s){ const sc=s.scale.x; s.scale.setScalar(1); const pos=s.position.clone(); s.position.set(0,0,0); const par=s.parent; if(par) par.remove(s); s.updateMatrixWorld(true);\n  const B=o=>{ o.updateMatrixWorld(true); return new THREE.Box3().setFromObject(o); }, by=c=>s.children.filter(g=>(g.userData.cat||'')===c);\n  const bus=by('bus')[0]; if(bus){ const bb=B(bus), cy=(bb.min.y+bb.max.y)/2, cz=(bb.min.z+bb.max.z)/2;\n    for(const w of by('power')){ const wb=B(w), side=w.position.x>=0?1:-1; w.position.x+=side>0?bb.max.x+.02-wb.min.x:bb.min.x-.02-wb.max.x; w.position.y+=cy-(wb.min.y+wb.max.y)/2; w.position.z+=cz-(wb.min.z+wb.max.z)/2; }\n    for(const r of by('power-rtg')){ const rb=B(r); r.position.x+=bb.max.x+.06-rb.min.x; r.position.y+=bb.min.y-rb.min.y; r.position.z+=cz-(rb.min.z+rb.max.z)/2; }\n    const top=[...by('comms'),...by('batt'),...by('store')]; for(const t of top){ const tb=B(t); t.position.y+=bb.max.y-tb.min.y-.01; }\n    for(const t of by('batt').concat(by('store'))){ const tb=B(t); t.position.z+=Math.min(0,bb.max.z-tb.max.z); t.position.x+=(t.position.x<0?bb.min.x-tb.min.x:bb.max.x-tb.max.x); }\n    const ins=by('inst'), sp=(bb.max.x-bb.min.x)*.38; ins.forEach((g,i)=>{ const ib=B(g); g.position.x+=(bb.min.x+bb.max.x)/2+(i-(ins.length-1)/2)*sp-(ib.min.x+ib.max.x)/2; }); for(const g of ins){ const ib=B(g); g.position.z+=bb.max.z-ib.min.z-.01; g.position.y+=bb.min.y+(bb.max.y-bb.min.y)*.15-ib.min.y; }\n    let back=bb.min.z; for(const t of by('tank')){ const tb=B(t); t.position.z+=back+.01-tb.max.z; t.position.y+=cy-(tb.min.y+tb.max.y)/2; t.position.x+=-(tb.min.x+tb.max.x)/2; back=B(t).min.z; }\n    for(const e of by('engine')){ const eb=B(e); e.position.z+=back+.01-eb.max.z; e.position.y+=cy-(eb.min.y+eb.max.y)/2; e.position.x+=-(eb.min.x+eb.max.x)/2; } }\n  if(par) par.add(s); s.position.copy(pos); s.scale.setScalar(sc); }\nconst pops=[]; (function popLoop(){ for(let i=pops.length-1;i>=0;i--){ const g=pops[i]; g.userData.pop+=.035; const t=Math.min(1,g.userData.pop), e=1+2.7*Math.pow(t-1,3)+1.7*Math.pow(t-1,2); g.scale.setScalar(Math.max(.01,e)); if(t>=1){ g.scale.setScalar(1); pops.splice(i,1);} } requestAnimationFrame(popLoop); })();\n\n// ---------- ROCKET WORKSHOP ----------\nfunction buildRocketRoom(){\n  const A=area('rocket'); root=A.group; buildHall(A,-18,-10,18,10,'Rocket workshop');\n  label('ROCKETS',-16.4,2,-1.6,3.4);\n  PARTS.rocket.opts.forEach((o,i)=>{ const x=-13+i*6.5, z=-5; cyl(2,2.1,.5,DARK,x,.25,z,32); cyl(1.8,1.8,.05,STONE,x,.52,z,32);\n    const r=fromModel(o.model,null,o.h,{upright:true}); r.position.set(x,.55,z); root.add(r); exhibits.push({obj:r,cat:'rocket',id:o.id,rocket:true});\n    label(o.name.toUpperCase(),x,o.h+1.8,z,3.6);\n    A.spots.push({id:o.id,cat:'rocket',o,pos:new THREE.Vector3(x,0,z+3),ring:ring(x,z,2.15,2.4),kind:'part'}); A.block.push([x-2.1,z-2.1,x+2.1,z+2.1]); });\n  label('ORBIT',-10,2,3.5,3);\n  PARTS.orbit.opts.forEach((o,i)=>{ const x=-6+i*5, z=3.5; cyl(.7,.9,1.1,DARK,x,.55,z,24); const p=procPart('orbit'); p.position.set(x,.9,z); root.add(p); exhibits.push({obj:p,cat:'orbit',id:o.id});\n    label(o.name.toUpperCase(),x,3.6,z,4.2); A.spots.push({id:o.id,cat:'orbit',o,pos:new THREE.Vector3(x+1.6,0,z+1.6),ring:ring(x,z,1.05,1.3),kind:'part'}); A.block.push([x-.95,z-.95,x+.95,z+.95]); });\n  // NASA capsules on display (hall of fame)\n  [['orion','ORION',-14,6,2.2],['capsule-mercury','MERCURY',-9.5,6,1.9],['apollo-lm','APOLLO LM',8.5,.8,2.2],['mro','MRO',12.8,1.6,2.6]].forEach(([m,n,x,z,sz])=>{ pedestal(x,z); const c=fromModel(m,null,sz); c.position.set(x,.56,z); root.add(c); exhibits.push({obj:c}); label(n,x,3.6,z,3); A.block.push([x-1.1,z-1.1,x+1.1,z+1.1]); });\n  A.spots.push({id:'exit',pos:new THREE.Vector3(14,0,8.6),ring:ring(14,8.6),label:'Exit to base',act:()=>exitRoom()});\n  label('EXIT',14,1.8,9.6,2.2);\n  A.spawn=new THREE.Vector3(14,0,7.4);\n}\n\n/* ================= Character ================= */\n// ground engineer: hard hat, hi-vis vest with a reflective band, work trousers\nconst VEST =mat('vest', ['#F2A541','#F7BE62','#E89A2F','#8E5A1A'],[0,1,0],.8,0);\nconst SKIN =mat('skin', ['#D7A47C','#C99269','#E2B48E','#7A4E33'],[0,1,0],.6,0);\nconst PANTS=mat('pants',['#3C5568','#33495B','#465F73','#1C2A36'],[0,1,0],.8,0);\nconst HAT  =mat('hat',  ['#FBFAF4','#F3EEE4','#FFFFFF','#B9B0A0'],[0,1,0],.6,0);\nconst hero=new THREE.Group(); scene.add(hero);\nconst body=new THREE.Mesh(new THREE.CylinderGeometry(.36,.42,.9,20),VEST); body.position.y=.95; hero.add(body);\nconst band=new THREE.Mesh(new THREE.CylinderGeometry(.385,.395,.09,20),CREAM); band.position.y=.05; body.add(band);\nconst collar=new THREE.Mesh(new THREE.CylinderGeometry(.2,.3,.12,16),TEAL); collar.position.y=.48; body.add(collar);\nconst head=new THREE.Mesh(new THREE.SphereGeometry(.3,24,16),SKIN); head.position.y=1.72; hero.add(head);\nconst visor=new THREE.Group(); visor.position.y=1.74; hero.add(visor);          // the hard hat (bobs with the head)\nconst hatDome=new THREE.Mesh(new THREE.SphereGeometry(.34,20,12,0,Math.PI*2,0,Math.PI/2),HAT); hatDome.position.y=.02; visor.ad
