(320px,76vw)}.night{width:100%;height:68%}}\n.rm .aura,.rm .caustic{animation:none!important}\n/* reduced motion: set by the OS or by Settings */\n.rm .ball,.rm .status i,.rm .t-pill i{animation:none!important}\n.rm h1 .word span{transition:none!important}\n<\/style>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n<symbol id=\"i-back\" viewBox=\"0 0 24 24\"><path d=\"M15 5 8 12l7 7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/symbol>\n<symbol id=\"i-x\" viewBox=\"0 0 24 24\"><path d=\"M6 6l12 12M18 6 6 18\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\"/><\/symbol>\n<symbol id=\"i-gear\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"3.2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"/><path d=\"M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><\/symbol>\n<symbol id=\"i-next\" viewBox=\"0 0 24 24\"><path d=\"M9 5l7 7-7 7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/symbol>\n<symbol id=\"i-info\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\"/><path d=\"M12 11v6\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"12\" cy=\"7.4\" r=\"1.7\" fill=\"currentColor\"/><\/symbol>\n<symbol id=\"i-star\" viewBox=\"0 0 24 24\"><path d=\"M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z\" fill=\"var(--sf,#F2A541)\" stroke=\"#1A1206\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><\/symbol>\n<\/svg>\n<div class=\"screen\">\n  <div class=\"melt\"><\/div>\n  <div class=\"night\" aria-hidden=\"true\"><canvas id=\"sky\"><\/canvas><\/div>\n  <header class=\"layer\"><span class=\"logo\">Horizons<\/span><div class=\"right\"><span class=\"chip\">Plotting trajectory\u2026<\/span><button class=\"t-round\" type=\"button\" id=\"open-credits\" aria-label=\"Credits\"><svg><use href=\"#i-info\"/><\/svg><\/button><button class=\"t-round\" type=\"button\" id=\"open-settings\" aria-label=\"Settings\"><svg><use href=\"#i-gear\"/><\/svg><\/button><\/div><\/header>\n  <main class=\"layer\">\n    <div class=\"cards\">\n      <div class=\"card\" tabindex=\"0\" role=\"button\" data-m=\"earth\"><span class=\"t-new\">NEW<\/span><span class=\"row\"><span class=\"n\">01<\/span><b>Wildfire watch<\/b><\/span><p>Watch wildfires on Earth from orbit.<\/p><span class=\"foot\"><span class=\"t-stars\" aria-label=\"Difficulty 1 of 3\"><svg><use href=\"#i-star\"/><\/svg><svg style=\"--sf:#E4DED2\"><use href=\"#i-star\"/><\/svg><svg style=\"--sf:#E4DED2\"><use href=\"#i-star\"/><\/svg><\/span><span class=\"tag\">/earth<\/span><\/span><\/div>\n      <div class=\"card\" tabindex=\"0\" role=\"button\" data-m=\"moon\"><span class=\"row\"><span class=\"n\">02<\/span><b>Lunar polar ice<\/b><\/span><p>Map water ice hiding at the lunar poles.<\/p><span class=\"foot\"><span class=\"t-stars\" aria-label=\"Difficulty 2 of 3\"><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg style=\"--sf:#E4DED2\"><use href=\"#i-star\"/><\/svg><\/span><span class=\"tag\">/moon<\/span><\/span><\/div>\n      <div class=\"card\" tabindex=\"0\" role=\"button\" data-m=\"mars\"><span class=\"row\"><span class=\"n\">03<\/span><b>Mars atmosphere<\/b><\/span><p>Sample the thin air of Mars.<\/p><span class=\"foot\"><span class=\"t-stars\" aria-label=\"Difficulty 3 of 3\"><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><\/span><span class=\"tag\">/mars<\/span><\/span><\/div>\n    <\/div>\n    <div class=\"hero\">\n    <i class=\"caustic\" aria-hidden=\"true\"><\/i>\n    <div class=\"ball\" id=\"ball\" aria-hidden=\"true\"><i class=\"aura\"><\/i><canvas id=\"rk\"><\/canvas><svg class=\"rocket\" viewBox=\"0 0 100 160\"><defs><linearGradient id=\"rg\" x1=\"0\" x2=\"1\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\".85\"/><stop offset=\".45\" stop-color=\"#fff\" stop-opacity=\".25\"/><stop offset=\"1\" stop-color=\"#9C968C\" stop-opacity=\".35\"/><\/linearGradient><linearGradient id=\"fl\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#F2A541\" stop-opacity=\".55\"/><stop offset=\"1\" stop-color=\"#F2A541\" stop-opacity=\"0\"/><\/linearGradient><\/defs><path d=\"M50 6 C66 24 70 50 70 84 L70 112 L30 112 L30 84 C30 50 34 24 50 6Z\" fill=\"url(#rg)\" stroke=\"#fff\" stroke-opacity=\".8\" stroke-width=\"1.4\"/><path d=\"M30 92 L16 120 L16 128 L30 118Z M70 92 L84 120 L84 128 L70 118Z\" fill=\"url(#rg)\" stroke=\"#fff\" stroke-opacity=\".7\" stroke-width=\"1.2\"/><circle cx=\"50\" cy=\"58\" r=\"9\" fill=\"rgba(42,30,58,.18)\" stroke=\"#fff\" stroke-opacity=\".9\" stroke-width=\"1.4\"/><circle cx=\"47\" cy=\"55\" r=\"2.5\" fill=\"#fff\" fill-opacity=\".9\"/><path d=\"M38 112 L62 112 L58 122 L42 122Z\" fill=\"rgba(255,255,255,.35)\" stroke=\"#fff\" stroke-opacity=\".6\"/><path d=\"M43 124 Q50 158 57 124Z\" fill=\"url(#fl)\"/><path d=\"M40 30 Q42 70 40 104\" stroke=\"#fff\" stroke-opacity=\".9\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/><\/svg><\/div>\n    <div class=\"rk-pick\" aria-label=\"Rocket on display\"><button class=\"t-round\" type=\"button\" id=\"rk-prev\" aria-label=\"Previous rocket\"><svg><use href=\"#i-back\"/><\/svg><\/button><span class=\"t-pill rk-name\" id=\"rk-name\" aria-live=\"polite\"><b>Saturn V<\/b><small>NASA<\/small><\/span><button class=\"t-round\" type=\"button\" id=\"rk-next\" aria-label=\"Next rocket\"><svg><use href=\"#i-next\"/><\/svg><\/button><\/div>\n    <\/div>\n    <div class=\"copy\">\n      <h1>Horizons<span class=\"word\" id=\"word\"><span class=\"on\">Launches<\/span><span>Designs<\/span><span>Orbits<\/span><span>Explores<\/span><span>Observes<\/span><\/span><\/h1>\n      <p class=\"sub\">Design a spacecraft, launch it, and see if your trade-offs hold up. Solo or with up to 4 players.<\/p>\n      <div class=\"ctas\"><button class=\"t-btn primary btn\" type=\"button\">Play<\/button><button class=\"t-btn ghost\" type=\"button\">Tutorial \u00b7 30 s<\/button><\/div>\n    <\/div>\n  <\/main>\n  <footer class=\"layer\"><span class=\"t-pill\" id=\"status\"><i><\/i>Loading NASA rocket\u2026<\/span><span class=\"hint\"><kbd>Enter<\/kbd> play \u00b7 <kbd>\u25c0<\/kbd><kbd>\u25b6<\/kbd> rocket \u00b7 <kbd>S<\/kbd> settings<\/span><span class=\"meta\">NASA Space Apps 2026 \u00b7 3D models courtesy of NASA<\/span><\/footer>\n<\/div>\n\n<div class=\"scrim\" id=\"scrim\" hidden><\/div>\n<div class=\"dlg\" id=\"settings\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"set-title\" hidden>\n <div class=\"t-win pop\">\n  <span class=\"t-ribbon\" id=\"set-title\">Settings<\/span>\n  <button class=\"t-round x\" type=\"button\" data-close aria-label=\"Close\"><svg><use href=\"#i-x\"/><\/svg><\/button>\n  <div class=\"d-body\">\n   <div class=\"set\"><div class=\"l\"><b>Sound effects<\/b><span>Clicks and blips on buttons.<\/span><\/div><button class=\"sw\" type=\"button\" role=\"switch\" data-k=\"sfx\" aria-label=\"Sound effects\"><\/button><\/div>\n   <div class=\"set\"><div class=\"l\"><b>Reduce motion<\/b><span>Stops floating, spinning and twinkling.<\/span><\/div><button class=\"sw\" type=\"button\" role=\"switch\" data-k=\"motion\" aria-label=\"Reduce motion\"><\/button><\/div>\n   <div class=\"set\"><div class=\"l\"><b>Tutorial hints<\/b><span>Step-by-step callouts in the base.<\/span><\/div><button class=\"sw\" type=\"button\" role=\"switch\" data-k=\"hints\" aria-label=\"Tutorial hints\"><\/button><\/div>\n   <div class=\"set\"><div class=\"l\"><b>Graphics<\/b><span>Low runs smoother on older phones.<\/span><\/div><div class=\"seg\" data-k=\"gfx\" role=\"radiogroup\" aria-label=\"Graphics\"><button type=\"button\" data-v=\"low\">Low<\/button><button type=\"button\" data-v=\"high\">High<\/button><\/div><\/div>\n  <\/div>\n  <div class=\"w-foot\"><button class=\"t-btn ghost\" type=\"button\" id=\"set-reset\">Reset<\/button><button class=\"t-btn primary\" type=\"button\" data-close>Done<\/button><\/div>\n <\/div>\n<\/div>\n<div class=\"dlg\" id=\"credits\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"cred-title\" hidden>\n <div class=\"t-win pop\">\n  <span class=\"t-ribbon\" id=\"cred-title\">Credits<\/span>\n  <button class=\"t-round x\" type=\"button\" data-close aria-label=\"Close\"><svg><use href=\"#i-x\"/><\/svg><\/button>\n  <div class=\"d-body\">\n   <p class=\"cred\"><b>Horizons<\/b> was made for the NASA Space Apps Challenge 2026, challenge \"Space Mission Design Game\".<\/p>\n   <ul class=\"cred-list\">\n    <li>Rockets <span>Jupiter-C, Ares I, Saturn V, Space Shuttle, SLS<\/span><\/li>\n    <li>Capsules <span>Orion, Mercury (Faith 7)<\/span><\/li>\n    <li>Spacecraft parts <span>NASA Satellite Kit<\/span><\/li>\n    <li>Instrument <span>NASA Infrared Camera<\/span><\/li>\n    <li>Display piece <span>NASA Landsat 8<\/span><\/li>\n   <\/ul>\n   <p class=\"cred\">3D models courtesy of NASA (NASA-3D-Resources). Horizons is not affiliated with or endorsed by NASA.<\/p>\n  <\/div>\n  <div class=\"w-foot\"><button class=\"t-btn primary\" type=\"button\" data-close>Close<\/button><\/div>\n <\/div>\n<\/div>\n\n<script>\nconst OS_REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;\n// Settings are kept per browser; the game state (window.HZ) wins when the shell passes them on.\nconst SET_DEF={sfx:true,motion:OS_REDUCE,hints:true,gfx:'high',rocket:2};\nconst SET=(()=>{let v={};try{v=JSON.parse(localStorage.getItem('hz-settings')||'{}')||{}}catch(e){}\n  return Object.assign({},SET_DEF,v,(window.HZ&&window.HZ.settings)||{})})();\nlet reduce=SET.motion;\ndocument.documentElement.classList.toggle('rm',reduce);\n// rotating headline word\n(()=>{const w=[...document.querySelectorAll('#word span')];let i=0;\n setInterval(()=>{if(reduce)return;w[i].classList.replace('on','out');const o=w[i];setTimeout(()=>o.classList.remove('out'),700);i=(i+1)%w.length;w[i].classList.add('on')},2600)})();\n\nfunction fit(c){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.5);c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return {x,w:r.width,h:r.height}}\n// seeded random so the scene is stable\nfunction rng(s){return()=>(s=(s*16807)%2147483647)/2147483647}\n\n// twinkling stars + shooting stars over the sky image (the canvas lives inside .night, so it shares its fade)\nconst sky=document.getElementById('sky');let S,stars;\nwindow.METEORS=[];let nextMeteor=0;\nfunction initSky(){S=fit(sky);const R=rng(7);stars=[];for(let k=0;k<160;k++){const x=S.w*(1-Math.pow(R(),1.15)*.95),y=S.h*Math.pow(R(),1.25)*.85;\n stars.push({x,y,s:R()<.07?1.7:R()*.8+.3,p:R()*6,warm:R()<.15,blue:R()<.25})}}\n// showers like the reference: steep diagonal streaks falling down-left, sometimes three at once\nfunction spawnMeteor(t){const n=Math.random()<.25?3:1,ang=Math.PI/2+.38+Math.random()*.2;\n for(let i=0;i<n;i++){const sp=S.h*(.9+Math.random()*.7);\n  METEORS.push({x:S.w*(.35+Math.random()*.7)+i*S.w*.06,y:-30+S.h*Math.random()*.3+i*24,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,len:110+Math.random()*190,born:t+i*160,life:800+Math.random()*700,w:1.1+Math.random()*1.5,pink:Math.random()<.45,a:0,px:0,py:0})}\n nextMeteor=t+700+Math.random()*2100}\nfunction drawSky(t){const {x}=S;x.clearRect(0,0,S.w,S.h);\n for(const s of stars){x.globalAlpha=reduce?.8:.35+.65*Math.abs(Math.sin(t/1300+s.p));x.fillStyle=s.warm?'#F2C27A':s.blue?'#BFD6FF':'#fff';x.beginPath();x.arc(s.x,s.y,s.s,0,7);x.fill()}\n x.globalAlpha=1;\n if(!reduce){if(t>nextMeteor)spawnMeteor(t);\n  for(let i=METEORS.length-1;i>=0;i--){const m=METEORS[i],a=(t-m.born)/m.life;if(a<0)continue;if(a>1){METEORS.splice(i,1);continue}\n   const sec=a*m.life/1000,px=m.x+m.vx*sec,py=m.y+m.vy*sec,sp=Math.hypot(m.vx,m.vy),tx=px-m.vx/sp*m.len,ty=py-m.vy/sp*m.len,f=Math.sin(Math.PI*a);\n   m.a=a;m.px=px;m.py=py;\n   const g=x.createLinearGradient(px,py,tx,ty);g.addColorStop(0,`rgba(255,255,255,${f})`);g.addColorStop(.2,m.pink?`rgba(255,175,225,${.75*f})`:`rgba(160,205,255,${.75*f})`);g.addColorStop(1,'rgba(255,255,255,0)');\n   x.strokeStyle=g;x.lineWidth=m.w;x.lineCap='round';x.beginPath();x.moveTo(px,py);x.lineTo(tx,ty);x.stroke();\n   const h=x.createRadialGradient(px,py,0,px,py,m.w*7);h.addColorStop(0,`rgba(255,255,255,${f})`);h.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=h;x.beginPath();x.arc(px,py,m.w*7,0,7);x.fill()}}\n if(!reduce)requestAnimationFrame(drawSky)}\n\nfunction init(){initSky();if(reduce)drawSky(0)}\ninit();if(!reduce)requestAnimationFrame(drawSky);\nlet rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(init,150)});\n<\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js\"><\/script>\n<script>\n/* ================= Home: NASA rocket in the glass ball, rocket switcher, Settings, Credits ================= */\n(()=>{\nconst $=id=>document.getElementById(id);\nconst go=(screen,data)=>{ blip(520); if(window.hzGo) hzGo(screen,Object.assign({settings:Object.assign({},SET)},data||{})); };\nconst save=()=>{ try{ localStorage.setItem('hz-settings',JSON.stringify(SET)); }catch(e){} };\n\n/* ---------- sound effects (tiny synth blips, no files) ---------- */\nlet AC=null;\nfunction blip(f=660,d=.07){ if(!SET.sfx) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;\n  o.type='square'; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*1.5,t+d); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);\n  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02); }catch(e){} }\ndocument.addEventListener('pointerdown',e=>{ if(e.target.closest('.t-btn,.t-round,.card,.sw,.seg button')) blip(); });\n\n/* ---------- NASA rockets ---------- */\nconst ROCKETS=[\n  {m:'rocket-jupiter-c',n:'Jupiter-C',y:1956},\n  {m:'rocket-ares-1',n:'Ares I',y:2009},\n  {m:'rocket-saturn-v',n:'Saturn V',y:1967},\n  {m:'rocket-shuttle',n:'Space Shuttle',y:1981},\n  {m:'rocket-sls',n:'SLS',y:2022}];\nlet idx=Math.min(Math.max(SET.rocket|0,0),ROCKETS.length-1);\nconst ball=$('ball'), cv=$('rk'), statusEl=$('status'), nameEl=$('rk-name');\nfunction setStatus(t){ statusEl.innerHTML='<i><\/i>'+t; }\nfunction setName(){ const r=ROCKETS[idx]; nameEl.innerHTML=`<b>${r.n}<\/b><small>NASA \u00b7 ${r.y}<\/small>`; }\nsetName();\n\n// Models ship as base64 GLB text (models/<name>.txt). The standalone demo keeps them in models-b64/.\nfunction b64ToBuf(s){ const bin=atob(s.trim()), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u.buffer; }\nfunction fetchModel(n){ return fetch(`models/${n}.txt`).then(r=>{ if(!r.ok) throw 0; return r.text(); })\n  .catch(()=>fetch(`models-b64/${n}.txt`).then(r=>{ if(!r.ok) throw 0; return r.text(); })); }\n\n// Same treatment as the base: original NASA colours, every texture flattened to its dominant colour (no markings).\nfunction dominant(img){ try{ const c=document.createElement('canvas'); c.width=c.height=24; const g=c.getContext('2d'); g.drawImage(img,0,0,24,24);\n  const d=g.getImageData(0,0,24,24).data, n={}; let best=null,bc=0; for(let i=0;i<d.length;i+=4){ const k=(d[i]>>4)+','+(d[i+1]>>4)+','+(d[i+2]>>4); n[k]=(n[k]||0)+1; if(n[k]>bc){bc=n[k];best=[d[i],d[i+1],d[i+2]];} }\n  return new THREE.Color(best[0]/255,best[1]/255,best[2]/255); }catch(e){ return new THREE.Color(1,1,1); } }\nfunction bake(gltf){ gltf.scene.updateMatrixWorld(true); const byMat=new Map(), v=new THREE.Vector3();\n  gltf.scene.traverse(o=>{ if(!o.isMesh||!o.geometry) return; const g=o.geometry,P=g.getAttribute('position'),I=g.index,arr=[];\n    const n=I?I.count:P.count; for(let i=0;i<n;i++){ v.fromBufferAttribute(P,I?I.getX(i):i).applyMatrix4(o.matrixWorld); arr.push(v.x,v.y,v.z); }\n    const m=Array.isArray(o.material)?o.material[0]:o.material; if(!byMat.has(m)) byMat.set(m,[]); { const t=byMat.get(m); for(let i=0;i<arr.length;i++) t.push(arr[i]); } });\n  const grp=new THREE.Group();\n  for(const [m,a] of byMat){ const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(a,3)); geo.computeVertexNormals();\n    const col=(m&&m.color?m.color.clone():new THREE.Color(1,1,1)); if(m&&m.map&&m.map.image) col.multiply(dominant(m.map.image));\n    grp.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:col,roughness:.55,metalness:Math.min(m&&m.metalness||0,.35),side:THREE.DoubleSide}))); }\n  // stand it up, centre it, fit it inside the ball\n  let bb=new THREE.Box3().setFromObject(grp), s=bb.getSize(new THREE.Vector3());\n  if(s.z>s.y&&s.z>=s.x) grp.rotation.x=-Math.PI/2; else if(s.x>s.y&&s.x>s.z) grp.rotation.z=Math.PI/2;\n  const inner=new THREE.Group(); inner.add(grp); inner.updateMatrixWorld(true);\n  bb=new THREE.Box3().setFromObject(inner); bb.getSize(s); const c=bb.getCenter(new THREE.Vector3());\n  const k=Math.min(3.5/s.y, 2.2/Math.max(s.x,s.z)); grp.position.sub(c); const out=new THREE.Group(); inner.scale.setScalar(k); out.add(inner); return out; }\n\n/* ---------- three.js view inside the ball: NASA rocket, glass shell, stardust ----------\n   The glass reflects a small \"environment\" painted live from the page: the night sky image (up and to the right),\n   the shooting stars as they fall, the ember headline and amber Play button (right) and the white cards (left). */\nlet R=null, scene, cam, tilt, spinner, dust, flash, cache={}, loadTok=0, anim=null, vel=0, dragging=false, lastX=0, running=false, ready=false;\nconst SR=2.32;                                   // glass radius (the canvas frames the ball exactly)\nconst U={env:{value:null},t:{value:2},pulse:{value:0},mouse:{value:new THREE.Vector2()},pr:{value:1},boost:{value:0}};\nconst mouseT=new THREE.Vector2();\nconst skyImg=new Image();\n(()=>{ const bg=getComputedStyle(document.querySelector('.night')).backgroundImage||''; const m=bg.match(/^url\\(\"?(.*?)\"?\\)$/); if(m) skyImg.src=m[1]; })();\n\nconst envCv=document.createElement('canvas'); envCv.width=512; envCv.height=256; const ex=envCv.getContext('2d');\nfunction blob(x,y,r,col){ const g=ex.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,col); g.addColorStop(1,'rgba(251,250,244,0)'); ex.fillStyle=g; ex.beginPath(); ex.arc(x,y,r,0,7); ex.fill(); }\nfunction rrect(x,y,w,h,r){ ex.beginPath(); ex.moveTo(x+r,y); ex.arcTo(x+w,y,x+w,y+h,r); ex.arcTo(x+w,y+h,x,y+h,r); ex.arcTo(x,y+h,x,y,r); ex.arcTo(x,y,x+w,y,r); ex.closePath(); }\n// the night sky, pre-faded once into an alpha-masked tile: strongest up and to the right, a thin band overhead\nlet _tile=null;\nfunction skyTile(){ if(_tile) return _tile; if(!(skyImg.complete&&skyImg.naturalWidth)) return null;\n  const c=document.createElement('canvas'); c.width=512; c.height=256; const x=c.getContext('2d'), iw=skyImg.naturalWidth, ih=skyImg.naturalHeight;\n  // piece: draw part of the sky into a box with a soft alpha mask (horizontal + vertical fades)\n  const piece=(sx,sy,sw,sh,dx,dy,dw,dh,flip,hf,vf)=>{ const m=document.createElement('canvas'); m.width=dw; m.height=dh; const q=m.getContext('2d');\n    if(flip){ q.translate(dw,0); q.scale(-1,1); } q.drawImage(skyImg,sx,sy,sw,sh,0,0,dw,dh); q.setTransform(1,0,0,1,0,0);\n    q.globalCompositeOperation='destination-in'; let g=q.createLinearGradient(0,0,dw,0); hf.forEach(([o,v])=>g.addColorStop(o,`rgba(0,0,0,${v})`)); q.fillStyle=g; q.fillRect(0,0,dw,dh);\n    g=q.createLinearGradient(0,0,0,dh); vf.forEach(([o,v])=>g.addColorStop(o,`rgba(0,0,0,${v})`)); q.fillStyle=g; q.fillRect(0,0,dw,dh);\n    x.drawImage(m,dx,dy); };\n  // a thin band straight overhead, mirrored halves so the wrap-around has no seam\n  piece(0,0,iw,ih*.25,0,0,256,40,false,[[0,1],[1,1]],[[0,1],[.5,.8],[1,0]]);\n  piece(0,0,iw,ih*.25,256,0,256,40,true,[[0,1],[1,1]],[[0,1],[.5,.8],[1,0]]);\n  // the main night: up and to the right of the ball only (never straight back at the viewer), gone before the wrap\n  piece(0,0,iw,ih*.7,300,0,212,138,false,[[0,0],[.3,1],[.8,1],[1,0]],[[0,1],[.6,.95],[1,0]]);\n  const g=x.createLinearGradient(0,96,0,150); g.addColorStop(0,'rgba(214,122,170,0)'); g.addColorStop(.5,'rgba(214,122,170,.3)'); g.addColorStop(1,'rgba(242,165,65,0)'); x.fillStyle=g; x.fillRect(300,96,212,54);\n  return _tile=c; }\n// equirect: x = longitude (centre = toward the viewer, right = screen right), y = latitude (top = up)\nfunction paintEnv(){\n  ex.globalAlpha=1; ex.fillStyle='#FBFAF4'; ex.fillRect(0,0,512,256);\n  let g=ex.createLinearGradient(0,150,0,256); g.addColorStop(0,'rgba(217,209,192,0)'); g.addColorStop(1,'#CFC5B1'); ex.fillStyle=g; ex.fillRect(0,150,512,106);\n  const tile=skyTile(); if(tile) ex.drawImage(tile,0,0);\n  // shooting stars, mapped from the page into the reflection\n  const sr=sky.getBoundingClientRect(), br=ball.getBoundingClientRect(), bx=br.left+br.width/2, by=br.top+br.height/2, W=innerWidth, H=innerHeight;\n  for(const m of (window.METEORS||[])){ if(!(m.a>0&&m.a<1)) continue;\n    const sx=sr.left+m.px, sy=sr.top+m.py, f=Math.sin(Math.PI*m.a);\n    const x=256+(sx-bx)/W*330, y=128+(sy-by)/H*230, sp=Math.hypot(m.vx,m.vy), dx=-m.vx/sp*26, dy=-m.vy/sp*26;\n    g=ex.createLinearGradient(x,y,x+dx,y+dy); g.addColorStop(0,`rgba(255,255,255,${f})`); g.addColorStop(1,'rgba(255,255,255,0)');\n    ex.strokeStyle=g; ex.lineWidth=2.2; ex.beginPath(); ex.moveTo(x,y); ex.lineTo(x+dx,y+dy); ex.stroke();\n    blob(x,y,10,`rgba(200,225,255,${.9*f})`);\n  }\n  if(U.env.value) U.env.value.needsUpdate=true;\n}\n\nconst VS=`varying vec3 vN; varying vec3 vV; varying vec3 vO;\nvoid main(){ vec4 mv=modelViewMatrix*vec4(position,1.); vN=normalize(normalMatrix*normal); vV=-mv.xyz; vO=normalize(position); gl_Position=projectionMatrix*mv; }`;\nconst ENV=`uniform sampler2D env; uniform float t; uniform float pulse; uniform vec2 mouse;\nvec3 envAt(vec3 d){ float lon=atan(d.x,d.z)+mouse.x*.45; float lat=asin(clamp(d.y,-1.,1.))+mouse.y*.25;\n  return texture2D(env,vec2(fract(lon/6.28318+.5),clamp(lat/3.14159+.5,.002,.998))).rgb; }\nvarying vec3 vN; varying vec3 vV; varying vec3 vO;`;\n// front surface: reflections, fresnel rim, thin-film iridescence, three coloured highlights, a light sweep\nconst FS_FRONT=ENV+`\nvoid main(){\n  vec3 N=normalize(vN), V=normalize(vV); float nv=max(dot(N,V),0.), fr=pow(1.-nv,2.4);\n  vec3 Rf=reflect(-V,N), refl=envAt(Rf); float l0=dot(refl,vec3(.3,.59,.11)); refl=max(mix(vec3(l0),refl,1.4),0.);\n  float th=nv*4.5+t*.3+vO.y*1.4+vO.x*.7; vec3 irid=.55+.45*cos(6.28318*(vec3(0.,.33,.67)+th));\n  vec3 L1=normalize(vec3(-.55,.62,.55)), L2=normalize(vec3(.78,.5,.38)), L3=normalize(vec3(.35,-.72,.6));\n  float d1=max(dot(Rf,L1),0.), s1=pow(d1,220.)*1.8+pow(d1,24.)*.22;\n  float s2=pow(max(dot(Rf,L2),0.),60.);\n  float s3=pow(max(dot(Rf,L3),0.),36.);\n  float b=fract((vO.x*.55+vO.y*.85)*.42-t*.085); float sweep=smoothstep(0.,.025,b)*smoothstep(.07,.025,b);\n  vec3 col=mix(refl*(.4+.6*fr),refl,1.-l0)+irid*fr*.5+vec3(1.)*s1+vec3(1.,.96,.9)*sweep*.55+irid*pulse*.8;\n  float lum=dot(refl,vec3(.3,.59,.11));\n  float a=clamp(.07+fr*.92+s1+sweep*.3+pulse*.4+(1.-lum)*(.35+.6*fr),0.,1.);\n  gl_FragColor=vec4(col,a);\n}`;\n// back (inside) surface: the page seen through the glass, upside down like a real crystal ball, plus a caustic glow\nconst FS_BACK=ENV+`\nvoid main(){\n  vec3 N=-normalize(vN), V=normalize(vV); float nv=abs(dot(N,V)), fr=pow(1.-nv,2.);\n  vec3 irid=.55+.45*cos(6.28318*(vec3(0.,.33,.67)+vO.y*1.2-t*.2));\n  float caustic=pow(max(-vO.y,0.),3.)*.55;\n  vec3 col=mix(vec3(.985,.975,.955),vec3(.9,.92,1.),smoothstep(-.2,1.,vO.y)*.35)+irid*.06+vec3(1.,.8,.6)*caustic+irid*pulse*.3;\n  gl_FragColor=vec4(col,clamp(.16+fr*.22+caustic*.4,0.,1.));\n}`;\n// stardust swirling inside the glass\nconst DUST_VS=`attribute vec4 seed; uniform float t; uniform float pr; uniform float boost; varying vec3 vC; varying float vA;\nvoid main(){ float r=length(position.xz), a=atan(position.z,position.x)+t*seed.y*(1.+boost*3.)+seed.x;\n  vec3 p=vec3(cos(a)*r, position.y+sin(t*.6+seed.x*3.)*.12, sin(a)*r);\n  vec4 mv=modelViewMatrix*vec4(p,1.); gl_Position=projectionMatrix*mv;\n  float tw=.55+.45*sin(t*2.6+seed.x*9.);\n  gl_PointSize=seed.z*pr*(1.+boost)*tw*(9./-mv.z)*10.;\n  float k=seed.w; vC= k<.2?vec3(.6,.8,1.): k<.4?vec3(.75,.6,1.): k<.6?vec3(1.,.6,.85): k<.8?vec3(1.,.75,.4): vec3(1.);\n  vA=tw*(.55+.45*boost); }`;\nconst DUST_FS=`varying vec3 vC; varying float vA; void main(){ vec2 c=gl_PointCoord-.5; float d=length(c); float a=smoothstep(.5,0.,d); a*=a; gl_FragColor=vec4(vC*a*vA*1.4,a*vA*.6); }`;\n\ntry{\n  R=new THREE.WebGLRenderer({canvas:cv,antialias:SET.gfx!=='low',alpha:true}); R.setClearColor(0,0);\n  scene=new THREE.Scene(); cam=new THREE.PerspectiveCamera(28,1,.1,100); cam.position.set(0,0,9.5);\n  // lights pulled from the sky and the page: cream fill, white key, blue sky, pink nebula rim, amber Play glow, meteor flash\n  scene.add(new THREE.HemisphereLight(0xFBFAF4,0x6E6457,.8));\n  const key=new THREE.DirectionalLight(0xffffff,.8); key.position.set(-3,5,4); scene.add(key);\n  const skyL=new THREE.DirectionalLight(0x8FB4FF,.55); skyL.position.set(5,4,1); scene.add(skyL);\n  const neb=new THREE.DirectionalLight(0xFF8AC0,.45); neb.position.set(-4,2,-4); scene.add(neb);\n  const amb=new THREE.DirectionalLight(0xF2A541,.4); amb.position.set(3,-3,3); scene.add(amb);\n  flash=new THREE.PointLight(0xCFE0FF,0,12); flash.position.set(2.6,2.6,2.4); scene.add(flash);\n  tilt=new THREE.Group(); tilt.rotation.z=-.31; scene.add(tilt);   // the same 18\u00b0 lean as the old drawn rocket\n  spinner=new THREE.Group(); tilt.add(spinner);\n\n  U.env.value=new THREE.CanvasTex rojectionMatrix*viewMatrix*w; }`;\nconst frag = `\nuniform vec3 c0; uniform vec3 c1; uniform vec3 c2; uniform vec3 c3;\nuniform vec3 axis; uniform float freq; uniform float glow; uniform float time; uniform float hover;\nvarying vec3 vN; varying vec3 vObj; varying vec3 vWorld;\nfloat hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }\nfloat n3(vec3 p){ return sin(p.x*1.7+sin(p.y*2.3))*cos(p.z*1.9+sin(p.x*1.1)); }\nvoid main(){\n  float t = dot(vObj, normalize(axis)) * freq + 0.35*n3(vObj*2.2);\n  float b = fract(t*0.5+0.5);\n  vec3 col = b < .30 ? c0 : b < .52 ? mix(c0,c1,smoothstep(.30,.36,b)) : b < .70 ? mix(c1,c2,smoothstep(.52,.60,b)) : mix(c2,c3,smoothstep(.70,1.0,b));\n  vec3 L = normalize(-vWorld);               // sun at origin\n  float d = dot(normalize(vN), L);\n  float lit = smoothstep(-0.35, 0.65, d);    // soft terminator\n  vec3 shade = mix(c3*0.25, col, lit);\n  vec3 V = normalize(cameraPosition - vWorld);\n  float rim = pow(1.0 - max(dot(normalize(vN), V),0.0), 3.0);\n  shade += rim * (0.18 + 0.5*hover) * vec3(1.0,.85,.65);\n  float g = hash(gl_FragCoord.xy + fract(time)*91.0) - 0.5;   // film grain\n  shade += g * 0.11;\n  shade = mix(shade, col*1.4, glow);         // sun ignores lighting\n  gl_FragColor = vec4(shade, 1.0);\n}`;\nconst hex = h => new THREE.Color(h);\nfunction planetMat(cols, axis, freq, glow=0){\n  return new THREE.ShaderMaterial({ vertexShader:vert, fragmentShader:frag, uniforms:{\n    c0:{value:hex(cols[0])}, c1:{value:hex(cols[1])}, c2:{value:hex(cols[2])}, c3:{value:hex(cols[3])},\n    axis:{value:new THREE.Vector3(...axis)}, freq:{value:freq}, glow:{value:glow}, time:{value:0}, hover:{value:0} }});\n}\n\n// ---------- Missions ----------\nconst MISSIONS = {\n  earth:{ name:'Wildfire watch', planet:'Earth', diff:1, obj:'Spot new wildfires within hours, from orbit, so crews on the ground can act before they spread.',\n    specs:[['Orbit','Sun-sync 550 km'],['Duration','12 months'],['Budget','$180M'],['Mass limit','350 kg']],\n    tasks:['Pick a thermal infrared imager','Keep revisit time under 12 hours','Downlink alerts every pass'] },\n  moon:{ name:'Lunar polar ice', planet:'Moon', diff:2, obj:'Map water ice hiding in craters at the lunar poles that never see sunlight.',\n    specs:[['Orbit','Polar 100 km'],['Duration','18 months'],['Budget','$320M'],['Mass limit','600 kg']],\n    tasks:['Carry a neutron spectrometer','Survive long eclipses on battery','Relay data through Earth stations'] },\n  mars:{ name:'Mars atmosphere', planet:'Mars', diff:3, obj:'Measure how Mars is losing its air to space, and how fast.',\n    specs:[['Orbit','Elliptical 150\u20136,000 km'],['Duration','24 months'],['Budget','$450M'],['Mass limit','900 kg']],\n    tasks:['Fly a mass spectrometer and magnetometer','Budget fuel for orbit insertion','Plan for 20-minute comms delay'] },\n};\n\n// ---------- Bodies (Comet palette, not realistic colours) ----------\nconst bodies = [];\nconst sunMat = planetMat(['#F2C27A','#F2A541','#E07A44','#C2643A'], [0.3,1,0.2], 3.0, 0.75);\nconst sun = new THREE.Mesh(new THREE.SphereGeometry(6,64,64), sunMat); scene.add(sun);\n// sun halo\nconst haloTex = (()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const g=x.createRadialGradient(128,128,0,128,128,128);\n  g.addColorStop(0,'rgba(242,165,65,.45)');g.addColorStop(.4,'rgba(242,165,65,.12)');g.addColorStop(1,'rgba(242,165,65,0)');x.fillStyle=g;x.fillRect(0,0,256,256);return new THREE.CanvasTexture(c)})();\nconst halo = new THREE.Sprite(new THREE.SpriteMaterial({map:haloTex, transparent:true, depthWrite:false}));\nhalo.scale.set(40,40,1); scene.add(halo);\n\nconst DEF = [\n  {id:'mercury', name:'Mercury', r:0.9,  a:11, e:.9, speed:1.6,  cols:['#2A2D33','#5E5A54','#9C968C','#111'], axis:[1,.3,0], f:2.5, orbit:'#9C968C'},\n  {id:'venus',   name:'Venus',   r:1.4,  a:16, e:.92,speed:1.15, cols:['#F0D6B8','#E9B98F','#C98A62','#3A1D10'], axis:[.2,1,.4], f:2.0, orbit:'#C9   if (d.mission){\n    marker = new THREE.Mesh(new THREE.RingGeometry(d.r*1.55, d.r*1.62, 64), new THREE.MeshBasicMaterial({color:0xC2643A, transparent:true, opacity:.7, side:THREE.DoubleSide, depthWrite:false}));\n    group.add(marker);\n  }\n  const b = {...d, group, mesh, line, marker, angle:Math.random()*Math.PI*2};\n  bodies.push(b);\n}\n// Moon orbiting Earth\nconst earth = bodies.find(b=>b.id==='earth');\nconst moonDef = {id:'moon', name:'Moon', r:.55, mission:true, cols:['#2A2D33','#8D9196','#E3E5E6','#14161C']};\nconst moonMesh = new THREE.Mesh(new THREE.SphereGeometry(moonDef.r,48,48), planetMat(moonDef.cols,[1,.2,.5],2.2));\nconst moonPivot = new THREE.Group(); earth.group.add(moonPivot); moonPivot.add(moonMesh); moonMesh.position.set(3.3,0,0);\nconst moonHit = new THREE.Mesh(new THREE.SphereGeometry(1.4,10,10), new THREE.MeshBasicMaterial({visible:false})); moonHit.userData.id='moon'; moonMesh.add(moonHit); hitTargets.push(moonHit);\nconst moonMarker = new THREE.Mesh(new THREE.RingGeometry(.9,.96,48), new THREE.MeshBasicMaterial({color:0xC2643A, transparent:true, opacity:.7, side:THREE.DoubleSide, depthWrite:false})); moonMesh.add(moonMarker);\nconst moonBody = {...moonDef, mesh:moonMesh, marker:moonMarker};\n\n\n// corner stars (2D, top-right only)\nconst skyC=document.getElementById('sky');let SK=null;\nfunction initSky(){const r=skyC.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.5);skyC.width=r.width*d;skyC.height=r.height*d;const x=skyC.getContext('2d');x.setTransform(d,0,0,d,0,0);\n  let s=7;const R=()=>(s=(s*16807)%2147483647)/2147483647;const st=[];\n  for(let k=0;k<420;k++){const px=r.width*(1-Math.pow(R(),1.4)*.6),py=r.height*Math.pow(R(),1.5)*.75,dx=(r.width-px)/(r.width*.6),dy=py/(r.height*.75);if(dx*dx+dy*dy>.75)continue;st.push({x:px,y:py,s:R()<.06?1.8:R()*.9+.3,p:R()*6,w:R()<.12})}\n  SK={x,w:r.width,h:r.height,st}}\nfunction drawSky(t){if(!SK)return;const {x}=SK;x.clearRect(0,0,SK.w,SK.h);for(const s of SK.st){x.globalAlpha=reduce?.85:.4+.6*Math.abs(Math.sin(t/1300+s.p));x.fillStyle=s.w?'#F2C27A':'#fff';x.beginPath();x.arc(s.x,s.y,s.s,0,7);x.fill()}}\n\n// ---------- Interaction ----------\nconst ray = new THREE.Raycaster(), mouse = new THREE.Vector2();\nconst tagEl = document.getElementById('tag'), briefEl = document.getElementById('brief'), promptEl = document.getElementById('prompt');\nlet hovered=null, selected=null, yaw=0, pitch=0, drag=null;\nconst camTarget = new THREE.Vector3(), lookAt = new THREE.Vector3(), lookGoal = new THREE.Vector3();\nconst allBodies = () => [...bodies, moonBody];\nconst byId = id => allBodies().find(b=>b.id===id);\nconst worldPos = b => b.mesh.getWorldPosition(new THREE.Vector3());\n\nfunction pick(e){\n  const r=canvas.getBoundingClientRect(); mouse.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);\n  ray.setFromCamera(mouse,camera); const h=ray.intersectObjects(hitTargets,false);\n  // prefer the moon when both hit\n  const m=h.find(x=>x.object.userData.id==='moon'); return (m||h[0])?.object.userData.id||null;\n}\ncanvas.addEventListener('pointermove',e=>{\n  if(drag){ yaw += (e.clientX-drag.x)*0.004; pitch = Math.max(-.5,Math.min(.6,pitch+(e.clientY-drag.y)*0.003)); drag={x:e.clientX,y:e.clientY,moved:true}; return; }\n  const id=pick(e); hovered=id; canvas.style.cursor=id?'pointer':'grab';\n  if(id){const b=byId(id); tagEl.innerHTML = b.mission? `<b>${b.name}<\/b> \u00b7 ${MISSIONS[id].name}` : `${b.name} \u00b7 no mission yet`;\n    tagEl.style.left=e.clientX+'px'; tagEl.style.top=e.clientY+'px'; tagEl.style.opacity=1;} else tagEl.style.opacity=0;\n});\ncanvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:false}; canvas.setPointerCapture(e.pointerId)});\ncanvas.addEventListener('pointerup',e=>{const wasDrag=drag&&drag.moved; drag=null; if(!wasDrag){const id=pick(e); if(id) select(id);}});\ncanvas.addEventListener('pointerleave',()=>{tagEl.style.opacity=0});\n\nfunction select(id){\n  selected=id; const b=byId(id); tagEl.style.opacity=0; promptEl.classList.add('hide');\n  if(b.mission){ const m=MISSIONS[id];\n    briefEl.innerHTML = `<button class=\"t-round x\" type=\"button\" id=\"close\" aria-label=\"Close\"><svg><use href=\"#i-x\"/><\/svg><\/button><div class=\"b-body\"><div class=\"b-head\"><span class=\"t-ribbon\">Mission brief<\/span><h3>${m.name}<\/h3><span class=\"label\">${m.planet}<\/span>\n      <div class=\"t-stars\" aria-label=\"Difficulty ${m.diff} of 3\">${[1,2,3].map(i=>`<svg style=\"--sf:${i<=m.diff?'#F2A541':'#E4DED2'}\"><use href=\"#i-star\"/><\/svg>`).join('')}<\/div><\/div>\n      <p class=\"obj\">${m.obj}<\/p>\n      <div class=\"specs\">${m.specs.map(s=>`<div class=\"spec\"><b>${s[0]}<\/b><span>${s[1]}<\/span><\/div>`).join('')}<\/div>\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><span class=\"label\">Your goals<\/span><ul class=\"list\">${m.tasks.map(t=>`<li>${t}<\/li>`).join('')}<\/ul><\/div><\/div>\n      <div class=\"b-actions\"><button class=\"t-btn ghost\" type=\"button\" id=\"back\">Back<\/button><button class=\"t-btn primary\" type=\"button\" id=\"start\">Start mission<\/button><\/div>`;\n  } else {\n    briefEl.innerHTML = `<button class=\"t-round x\" type=\"button\" id=\"close\" aria-label=\"Close\"><svg><use href=\"#i-x\"/><\/svg><\/button><div class=\"b-body\"><div class=\"b-head\"><span class=\"t-ribbon\">Planet<\/span><h3>${b.name}<\/h3><\/div>\n      <p class=\"locked\">No mission here yet. Try Earth, the Moon or Mars.<\/p><\/div>\n      <div class=\"b-actions\"><button class=\"t-btn ghost\" type=\"button\" id=\"back\" style=\"flex:1\">Back to system<\/button><\/div>`;\n  }\n  briefEl.classList.add('open');\n  document.getElementById('back').onclick = deselect; document.getElementById('close').onclick = deselect;\n  const s=document.getElementById('start'); if(s) s.onclick=()=>{ s.textContent='Loading base\u2026'; };\n}\nfunction deselect(){ selected=null; briefEl.classList.remove('open'); promptEl.classList.remove('hide'); }\ndocument.getElementById('home').onclick = deselect;\naddEventListener('keydown',e=>{ if(e.key==='Escape') deselect(); });\n\n// quick-pick chips\nconst quick=document.getElementById('quick');\n[['earth','#2C5B65'],['moon','#8D9196'],['mars','#A73B42']].forEach(([id,c])=>{\n  const btn=document.createElement('button'); btn.type='button'; btn.innerHTML=`<i style=\"background:${c}\"><\/i>${byId(id).name}`; btn.onclick=()=>select(id); quick.appendChild(btn);});\n\n// ---------- Loop ----------\nfunction resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov = w<760?55:42; camera.updateProjectionMatrix(); }\naddEventListener('resize',()=>{resize();initSky()}); resize(); initSky();\nlet last=performance.now(), running=true;\ndocument.addEventListener('visibilitychange',()=>{ running=!document.hidden; if(running){last=performance.now(); requestAnimationFrame(tick);} });\nconst tmp=new THREE.Vector3();\nfunction tick(now){\n  if(!running) return;\n  const dt=Math.min((now-last)/1000,.05); last=now; const t=now/1000;\n  const speed = reduce?0 : selected? .15 : 1;\n  for(const b of bodies){\n    b.angle += dt*b.speed*0.25*speed;\n    b.group.position.set(Math.cos(b.angle)*b.a, 0, Math.sin(b.angle)*b.a*b.e);\n    b.mesh.rotation.y += dt*.25*(reduce?0:1);\n    b.mesh.material.uniforms.time.value=t;\n    const hv = (hovered===b.id||selected===b.id)?1:0; b.mesh.material.uniforms.hover.value += (hv-b.mesh.material.uniforms.hover.value)*.12;\n    if(b.marker){ b.marker.lookAt(camera.position); b.marker.material.opacity = selected? 0 : .45+.35*Math.sin(t*2.4); b.marker.scale.setScalar(1+.06*Math.sin(t*2.4)); }\n  }\n  moonPivot.rotation.y += dt*.6*speed; moonMesh.material.uniforms.time.value=t;\n  const mh=(hovered==='moon'||selected==='moon')?1:0; moonMesh.material.uniforms.hover.value += (mh-moonMesh.material.uniforms.hover.value)*.12;\n  moonMarker.lookAt(camera.position); moonMarker.material.opacity = selected?0:.45+.35*Math.sin(t*2.4+1);\n  sun.rotation.y += dt*.05; sunMat.uniforms.time.value=t;\n\n  // camera: overview orbit, or pan to the selected body\n  if(selected){\n    const b=byId(selected), p=worldPos(b);\n    const away = tmp.copy(p).normalize(); if(away.lengthSq()<1e-6) away.set(0,0,1);\n    const dist = (b.r||1)*7 + 4;\n    // stand on the sunward side, slightly above, offset so the planet sits left of the brief\n    camTarget.copy(p).addScaledVector(away,-dist*.55).add(new THREE.Vector3(0,dist*.45,0)).addScaledVector(new THREE.Vector3(-away.z,0,away.x), dist*.75);\n    lookGoal.copy(p);\n    if(innerWidth>760){ const right=new THREE.Vector3().subVectors(p,camTarget).cross(camera.up).normalize(); lookGoal.addScaledVector(right,(b.r||1)*1.6); } else { lookGoal.y -= (b.r||1)*2.4; }\n  } else {\n    const r=HOME_POS.length(), base=Math.atan2(HOME_POS.y,HOME_POS.z);\n    const ang = (reduce?0:t*0.02) + yaw, el = base + pitch;\n    camTarget.set(Math.sin(ang)*Math.cos(el)*r, Math.sin(el)*r, Math.cos(ang)*Math.cos(el)*r);\n    lookGoal.set(0,0,0);\n  }\n  const k = 1-Math.pow(.025, dt);     // smooth, frame-rate independent ease\n  camera.position.lerp(camTarget,k); lookAt.lerp(lookGoal,k); camera.lookAt(lookAt);\n  drawSky(now);\n  renderer.render(scene,camera);\n  requestAnimationFrame(tick);\n}\nrequestAnimationFrame(tick);\n<\/script>\n<script>\ndocument.addEventListener('click',e=>{ if(e.target.closest('#start')) hzGo('base',{mission:selected}); if(e.target.closest('#home')&&!selected) hzGo('home'); },true);\n<\/script>", "base": "<!doctype html>\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<meta charset=\"utf-8\">\n<title>Horizons Base<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;600&display=swap\">\n<style>\n@font-face{font-family:'G  56%, rgba(242,165,65,.09) 64%, rgba(251,250,244,0) 74%)}\ncanvas#sky,canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block}\ncanvas#sky{pointer-events:none}\ncanvas#gl{touch-action:none}\n.ui{position:absolute;z-index:2}\n\n/* tactile kit */\n.t-btn{position:relative;border:3px solid var(--ink);border-radius:16px;padding:11px 22px 13px;font:400 19px var(--f-display);letter-spacing:.03em;cursor:pointer;color:var(--ink);\n  background:var(--c,var(--glass));backdrop-filter:blur(18px) saturate(1.4);box-shadow:inset 0 -5px 0 var(--cd,rgba(26,18,6,.08)),inset 0 3px 0 rgba(255,255,255,.4),0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}\n.t-btn:active{transform:translateY(4px);box-shadow:inset 0 -2px 0 var(--cd,rgba(26,18,6,.08)),0 1px 0 var(--ink)}\n.t-btn.primary{--c:var(--amber);--cd:var(--amber-d)}\n.t-btn.ghost{font:700 14px var(--f-ui)}\n.t-btn[disabled]{--c:#D9D3C7;--cd:#BDB5A6;color:#8A8174;cursor:not-allowed;transform:none}\n.t-round{position:relative;width:44px;height:44px;flex:none;border-radius:50%;border:3px solid var(--ink);background:var(--c,var(--glass));backdrop-filter:blur(18px);color:var(--cc,var(--ink));box-shadow:inset 0 -4px 0 var(--cd,rgba(26,18,6,.08)),0 4px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}\n.t-round:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}\n.t-round svg{width:20px;height:20px}\n.t-round.x{--c:var(--bad);--cd:var(--bad-d);--cc:#fff;width:38px;height:38px}\n.t-win{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:3px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink)}\n.t-ribbon{display:inline-block;background:var(--ember);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:5px 16px 7px;font:400 16px var(--f-display);white-space:nowrap;box-shadow:inset 0 -4px 0 var(--ember-d),0 4px 0 var(--ink);text-shadow:0 2px 0 rgba(26,18,6,.3)}\n.t-btn:focus-visible,.t-round:focus-visible,.opt:focus-visible,.tab:focus-visible,.tile:focus-visible{outline:3px solid var(--ember);outline-offset:3px}\n@keyframes tpop{0%{transform:scale(.85) translateY(16px);opacity:0}}\nsvg.i{width:18px;height:18px;flex:none}\n\n/* HUD */\n.hud{top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:flex-start}\n.res{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}\n.metric{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;border-radius:999px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);font:400 11.5px var(--f-num);transition:background .3s}\n.metric .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ink);color:#fff;background:var(--teal)}\n.metric .ic svg{width:14px;height:14px}\n.metric .mb{width:46px;height:8px;border-radius:5px;border:2px solid var(--ink);background:rgba(255,255,255,.6);overflow:hidden}\n.metric .mb i{display:block;height:100%;background:var(--ok);transition:width .5s cubic-bezier(.34,1.56,.64,1),background .3s}\n.metric.warn .mb i{background:var(--warn)}\n.metric.bad{background:rgba(229,72,77,.22)}\n.metric.bad .mb i{background:var(--bad)}\n.metric.bad .ic{background:var(--bad)}\n.metric.bump{animation:bump .35s cubic-bezier(.34,1.56,.64,1)}\n@keyframes bump{40%{transform:scale(1.12)}}\n.mission{display:flex;flex-direction:column;align-items:flex-end;gap:6px}\n.mission .t-ribbon{font-size:14px}\n/* callout */\n.callout{top:calc(78px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));max-width:300px;background:var(--ink);color:var(--cream);border-radius:14px;padding:11px 14px;font:600 13.5px var(--f-ui);line-height:1.35;box-shadow:0 4px 0 rgba(26,18,6,.3);animation:tpop .5s cubic-bezier(.34,1.56,.64,1) both;display:flex;gap:10px;align-items:flex-start}\n.callout b{color:var(--amber);font:400 11px var(--f-num);white-space:nowrap;margin-top:2px}\n.callout .skip{margin-left:auto;background:none;border:0;color:var(--cream);opacity:.6;font:600 11px var(--f-ui);cursor:pointer;padding:0}\n/* dock */\n.dock{left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:8px;border-radius:22px}\n.tile{position:relative;width:70px;height:64px;border-radius:15px;border:3px solid var(--ink);background:var(--c,rgba(255,255,255,.5));box-shadow:inset 0 -4px 0 var(--cd,rgba(26,18,6,.08)),0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 10px var(--f-ui);cursor:pointer;color:var(--ink);padding:0}\n.tile svg{width:22px;height:22px}\n.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}\n.tile.on{--c:var(--amber);--cd:var(--amber-d)}\n.tile.lock{--c:rgba(217,211,199,.7);color:var(--muted);cursor:not-allowed}\n.tile .new{position:absolute;top:-10px;right:-8px;background:var(--ok);color:#fff;border:2px solid var(--ink);border-radius:6px;font:400 9px var(--f-num);padding:1px 5px;transform:rotate(8deg)}\n/* world prompt */\n.enter{z-index:3;transform:translate(-50%,-100%);display:none;animation:tpop .35s cubic-bezier(.34,1.56,.64,1) both;white-space:nowrap}\n.enter kbd{font:400 11px var(--f-num);border:2px solid var(--ink);border-radius:6px;padding:1px 6px;margin-left:8px;background:#fff}\n/* window */\n.win{top:calc(78px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:min(400px,calc(100% - 24px));max-height:calc(100% - 180px);display:none;flex-direction:column;overflow:hidden;animation:tpop .5s cubic-bezier(.34,1.56,.64,1) both}\n.win.open{display:flex}\n.w-head{padding:16px 16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative}\n.w-head h3{margin:0;font:400 26px var(--f-display)}\n.w-head p{margin:0;font-size:13px;color:var(--muted)}\n.w-head .t-round.x{position:absolute;top:10px;right:10px}\n.tabs{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none}\n.tab{flex:none;border:2.5px solid var(--ink);border-radius:12px;padding:6px 11px 8px;font:700 12.5px var(--f-ui);background:rgba(255,255,255,.5);box-shadow:inset 0 -3px 0 rgba(26,18,6,.08),0 3px 0 var(--ink);cursor:pointer;color:var(--ink);position:relative}\n.tab.on{background:var(--amber);box-shadow:inset 0 -3px 0 var(--amber-d),0 3px 0 var(--ink)}\n.tab .need{position:absolute;top:-7px;right:-6px;width:14px;height:14px;border-radius:50%;background:var(--bad);border:2px solid var(--ink)}\n.w-body{padding:4px 14px 14px;overflow:auto;display:flex;flex-direction:column;gap:10px;min-height:0}\n.opt{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;text-align:left;width:100%;border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.4);box-shadow:0 4px 0 var(--ink);cursor:pointer;color:var(--ink);font:inherit;transition:transform .12s cubic-bezier(.34,1.56,.64,1)}\n.opt:hover{transform:translateY(-2px)}\n.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}\n.opt.on{background:rgba(242,165,65,.55)}\n.opt .dot{grid-row:span 2;width:22px;height:22px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center}\n.opt.on .dot::after{content:\"\";width:10px;height:10px;border-radius:50%;background:var(--ink)}\n.opt .nm{font:700 14.5px var(--f-ui)}\n.opt .fx{display:flex;flex-wrap:wrap;gap:5px}\n.opt .fx span{font:400 10px var(--f-num);padding:2px 6px;border-radius:6px;border:1.5px solid var(--ink);background:rgba(255,255,255,.6)}\n.opt .fx span.up{background:rgba(229,72,77,.18)}\n.opt .fx span.good{background:rgba(76,195,138,.25)}\n.w-foot{padding:12px 14px 16px;border-top:3px solid var(--ink);background:rgba(251,247,238,.35);display:flex;gap:10px}\n.w-foot .t-btn{flex:1}\n.check{display:flex;flex-direction:column;gap:7px;margin:0;padding:0;list-style:none}\n.check li{display:flex;gap:10px;align-items:center;font:600 13.5px var(--f-ui);padding:8px 10px;border:2.5px solid var(--ink);border-radius:12px;background:rgba(255,255,255,.4)}\n.check li i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:var(--ok);flex:none}\n.check li.bad i{background:var(--bad)}\n.check li small{margin-left:auto;font:400 10px var(--f-num);color:var(--muted)}\n.hint{font:600 13px var(--f-ui);background:rgba(229,72,77,.16);border:2.5px solid var(--ink);border-radius:12px;padding:9px 11px}\n/* joystick */\n.joy{left:max(18px,env(safe-area-inset-left,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));width:116px;height:116px;border-radius:50%;border:3px solid var(--ink);background:var(--glass);backdrop-filter:blur(14px);box-shadow:0 5px 0 var(--ink);display:none;touch-action:none}\n.joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--amber);border:3px solid var(--ink);box-shadow:inset 0 -4px 0 var(--amber-d)}\n.keys{right:max(14px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));font:400 10px var(--f-num);color:var(--muted);display:flex;gap:4px;align-items:center}\n.keys kbd{border:2px solid var(--ink);border-radius:5px;padding:1px 5px;background:var(--glass);color:var(--ink)}\n.toast{left:50%;top:40%;transform:translate(-50%,-50%);font:400 clamp(40px,8vw,84px) var(--f-display);color:var(--ember);-webkit-text-stroke:3px var(--ink);paint-order:stroke;text-shadow:0 6px 0 var(--ink);display:none;pointer-events:none;animation:tpop .6s cubic-bezier(.34,1.56,.64,1) both}\n@media (max-width:760px){\n  .metric .mb{display:none}.metric{font-size:10px;padding:3px 8px 3px 4px}.metric .ic{width:20px;height:20px}\n  .mission{display:none}\n  .callout{top:auto;bottom:calc(96px + env(safe-area-inset-bottom,0px));left:150px;right:12px;max-width:none;font-size:1 ): solid cream-white fills, no backdrop blur */\n:root{--glass:#FFFDF8!important}\n*{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}\n.t-win,.card,.spec,.tag,.t-pill,.dots button,.A .win,.A .resource,.A .dock,.A .tile:not(.on):not(.lock),.A .btn.ghost,.t-btn.ghost:not(.on),.t-round:not(.x),.metric:not(.bad),.tile:not(.on):not(.lock),.tab:not(.on),.opt:not(.on),.check li,.info,.panel,.g:not(.bad),.choice,.drawer div,.status,.chip,.prompt,.brief,.win,.dock,.cap,.stepper,.report,.B .win,.C .win,.C .resource,.C .tile:not(.on):not(.lock),.C .round,.B .btn.ghost,.C .btn.ghost{background:#FFFDF8!important}\n.spec,.check li,.drawer div,.opt:not(.on){background:#F6F1E6!important}\n.b-actions,.w-foot{background:#F6F1E6!important}\n.metric.bad,.g.bad{background:#F8D6D3!important}\n.opt.on{background:#F7D29C!important}\n.scrim{background:rgba(26,18,6,.45)!important}\n<\/style>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-mass\" viewBox=\"0 0 24 24\"><path d=\"M7 9h10l2 11H5z M9 9a3 3 0 1 1 6 0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linejoin=\"round\"/><\/symbol>\n  <symbol id=\"i-coin\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"/><path d=\"M12 7v10M9.5 9.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/symbol>\n  <symbol id=\"i-bolt\" viewBox=\"0 0 24 24\"><path d=\"M13 2 5 14h6l-1 8 8-12h-6z\" fill=\"currentColor\"/><\/symbol>\n  <symbol id=\"i-data\" viewBox=\"0 0 24 24\"><ellipse cx=\"12\" cy=\"6\" rx=\"7\" ry=\"3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><path d=\"M5 6v12c0 1.7 3 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3 3 7 3s7-1.3 7-3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><\/symbol>\n  <symbol id=\"i-comms\" viewBox=\"0 0 24 24\"><path d=\"M5 19a10 10 0 0 1 0-14M19 5a10 10 0 0 1 0 14M8.5 15.5a5 5 0 0 1
