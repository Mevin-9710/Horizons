t:68%}}\n.rm .aura,.rm .caustic{animation:none!important}\n/* reduced motion: set by the OS or by Settings */\n.rm .ball,.rm .status i,.rm .t-pill i{animation:none!important}\n.rm h1 .word span{transition:none!important}\n<\/style>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n<symbol id=\"i-back\" viewBox=\"0 0 24 24\"><path d=\"M15 5 8 12l7 7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/symbol>\n<symbol id=\"i-x\" viewBox=\"0 0 24 24\"><path d=\"M6 6l12 12M18 6 6 18\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\"/><\/symbol>\n<symbol id=\"i-gear\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"3.2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"/><path d=\"M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><\/symbol>\n<symbol id=\"i-next\" viewBox=\"0 0 24 24\"><path d=\"M9 5l7 7-7 7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/symbol>\n<symbol id=\"i-info\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\"/><path d=\"M12 11v6\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"12\" cy=\"7.4\" r=\"1.7\" fill=\"currentColor\"/><\/symbol>\n<symbol id=\"i-star\" viewBox=\"0 0 24 24\"><path d=\"M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z\" fill=\"var(--sf,#F2A541)\" stroke=\"#1A1206\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><\/symbol>\n<\/svg>\n<div class=\"screen\">\n  <div class=\"melt\"><\/div>\n  <div class=\"night\" aria-hidden=\"true\"><canvas id=\"sky\"><\/canvas><\/div>\n  <header class=\"layer\"><span class=\"logo\">Horizons<\/span><div class=\"right\"><span class=\"chip\">Plotting trajectory\u2026<\/span><button class=\"t-round\" type=\"button\" id=\"open-credits\" aria-label=\"Credits\"><svg><use href=\"#i-info\"/><\/svg><\/button><button class=\"t-round\" type=\"button\" id=\"open-settings\" aria-label=\"Settings\"><svg><use href=\"#i-gear\"/><\/svg><\/button><\/div><\/header>\n  <main class=\"layer\">\n    <div class=\"cards\">\n      <div class=\"card\" tabindex=\"0\" role=\"button\" data-m=\"earth\"><span class=\"t-new\">NEW<\/span><span class=\"row\"><span class=\"n\">01<\/span><b>Wildfire watch<\/b><\/span><p>Watch wildfires on Earth from orbit.<\/p><span class=\"foot\"><span class=\"t-stars\" aria-label=\"Difficulty 1 of 3\"><svg><use href=\"#i-star\"/><\/svg><svg style=\"--sf:#E4DED2\"><use href=\"#i-star\"/><\/svg><svg style=\"--sf:#E4DED2\"><use href=\"#i-star\"/><\/svg><\/span><span class=\"tag\">/earth<\/span><\/span><\/div>\n      <div class=\"card\" tabindex=\"0\" role=\"button\" data-m=\"moon\"><span class=\"row\"><span class=\"n\">02<\/span><b>Lunar polar ice<\/b><\/span><p>Map water ice hiding at the lunar poles.<\/p><span class=\"foot\"><span class=\"t-stars\" aria-label=\"Difficulty 2 of 3\"><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg style=\"--sf:#E4DED2\"><use href=\"#i-star\"/><\/svg><\/span><span class=\"tag\">/moon<\/span><\/span><\/div>\n      <div class=\"card\" tabindex=\"0\" role=\"button\" data-m=\"mars\"><span class=\"row\"><span class=\"n\">03<\/span><b>Mars atmosphere<\/b><\/span><p>Sample the thin air of Mars.<\/p><span class=\"foot\"><span class=\"t-stars\" aria-label=\"Difficulty 3 of 3\"><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><\/span><span class=\"tag\">/mars<\/span><\/span><\/div>\n    <\/div>\n    <div class=\"hero\">\n    <i class=\"caustic\" aria-hidden=\"true\"><\/i>\n    <div class=\"ball\" id=\"ball\" aria-hidden=\"true\"><i class=\"aura\"><\/i><canvas id=\"rk\"><\/canvas><svg class=\"rocket\" viewBox=\"0 0 100 160\"><defs><linearGradient id=\"rg\" x1=\"0\" x2=\"1\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\".85\"/><stop offset=\".45\" stop-color=\"#fff\" stop-opacity=\".25\"/><stop offset=\"1\" stop-color=\"#9C968C\" stop-opacity=\".35\"/><\/linearGradient><linearGradient id=\"fl\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#F2A541\" stop-opacity=\".55\"/><stop offset=\"1\" stop-color=\"#F2A541\" stop-opacity=\"0\"/><\/linearGradient><\/defs><path d=\"M50 6 C66 24 70 50 70 84 L70 112 L30 112 L30 84 C30 50 34 24 50 6Z\" fill=\"url(#rg)\" stroke=\"#fff\" stroke-opacity=\".8\" stroke-width=\"1.4\"/><path d=\"M30 92 L16 120 L16 128 L30 118Z M70 92 L84 120 L84 128 L70 118Z\" fill=\"url(#rg)\" stroke=\"#fff\" stroke-opacity=\".7\" stroke-width=\"1.2\"/><circle cx=\"50\" cy=\"58\" r=\"9\" fill=\"rgba(42,30,58,.18)\" stroke=\"#fff\" stroke-opacity=\".9\" stroke-width=\"1.4\"/><circle cx=\"47\" cy=\"55\" r=\"2.5\" fill=\"#fff\" fill-opacity=\".9\"/><path d=\"M38 112 L62 112 L58 122 L42 122Z\" fill=\"rgba(255,255,255,.35)\" stroke=\"#fff\" stroke-opacity=\".6\"/><path d=\"M43 124 Q50 158 57 124Z\" fill=\"url(#fl)\"/><path d=\"M40 30 Q42 70 40 104\" stroke=\"#fff\" stroke-opacity=\".9\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/><\/svg><\/div>\n    <div class=\"rk-pick\" aria-label=\"Rocket on display\"><button class=\"t-round\" type=\"button\" id=\"rk-prev\" aria-label=\"Previous rocket\"><svg><use href=\"#i-back\"/><\/svg><\/button><span class=\"t-pill rk-name\" id=\"rk-name\" aria-live=\"polite\"><b>Saturn V<\/b><small>NASA<\/small><\/span><button class=\"t-round\" type=\"button\" id=\"rk-next\" aria-label=\"Next rocket\"><svg><use href=\"#i-next\"/><\/svg><\/button><\/div>\n    <\/div>\n    <div class=\"copy\">\n      <h1>Horizons<span class=\"word\" id=\"word\"><span class=\"on\">Launches<\/span><span>Designs<\/span><span>Orbits<\/span><span>Explores<\/span><span>Observes<\/span><\/span><\/h1>\n      <p class=\"sub\">Design a spacecraft, launch it, and see if your trade-offs hold up. Solo or with up to 4 players.<\/p>\n      <div class=\"ctas\"><button class=\"t-btn primary btn\" type=\"button\">Play<\/button><button class=\"t-btn ghost\" type=\"button\">Tutorial \u00b7 30 s<\/button><\/div>\n    <\/div>\n  <\/main>\n  <footer class=\"layer\"><span class=\"t-pill\" id=\"status\"><i><\/i>Loading NASA rocket\u2026<\/span><span class=\"hint\"><kbd>Enter<\/kbd> play \u00b7 <kbd>\u25c0<\/kbd><kbd>\u25b6<\/kbd> rocket \u00b7 <kbd>S<\/kbd> settings<\/span><span class=\"meta\">NASA Space Apps 2026 \u00b7 3D models courtesy of NASA<\/span><\/footer>\n<\/div>\n\n<div class=\"scrim\" id=\"scrim\" hidden><\/div>\n<div class=\"dlg\" id=\"settings\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"set-title\" hidden>\n <div class=\"t-win pop\">\n  <span class=\"t-ribbon\" id=\"set-title\">Settings<\/span>\n  <button class=\"t-round x\" type=\"button\" data-close aria-label=\"Close\"><svg><use href=\"#i-x\"/><\/svg><\/button>\n  <div class=\"d-body\">\n   <div class=\"set\"><div class=\"l\"><b>Sound effects<\/b><span>Clicks, engine rumble and voice callouts.<\/span><\/div><button class=\"sw\" type=\"button\" role=\"switch\" data-k=\"sfx\" aria-label=\"Sound effects\"><\/button><\/div>\n   <div class=\"set\"><div class=\"l\"><b>Music<\/b><span>A score that changes with each phase of the mission.<\/span><\/div><button class=\"sw\" type=\"button\" role=\"switch\" data-k=\"music\" aria-label=\"Music\"><\/button><\/div>\n   <div class=\"set\"><div class=\"l\"><b>Reduce motion<\/b><span>Stops floating, spinning and twinkling.<\/span><\/div><button class=\"sw\" type=\"button\" role=\"switch\" data-k=\"motion\" aria-label=\"Reduce motion\"><\/button><\/div>\n   <div class=\"set\"><div class=\"l\"><b>Tutorial hints<\/b><span>Step-by-step callouts in the base.<\/span><\/div><button class=\"sw\" type=\"button\" role=\"switch\" data-k=\"hints\" aria-label=\"Tutorial hints\"><\/button><\/div>\n   <div class=\"set\"><div class=\"l\"><b>Difficulty<\/b><span>Cadet: more money and push. Commander: less, and a score bonus.<\/span><\/div><div class=\"seg\" data-k=\"diff\" role=\"radiogroup\" aria-label=\"Difficulty\"><button type=\"button\" data-v=\"cadet\">Cadet<\/button><button type=\"button\" data-v=\"pilot\">Pilot<\/button><button type=\"button\" data-v=\"commander\">Cmdr<\/button><\/div><\/div>\n   <div class=\"set\"><div class=\"l\"><b>Sandbox<\/b><span>No budget or time limits. Scores are not ranked.<\/span><\/div><button class=\"sw\" type=\"button\" role=\"switch\" data-k=\"sandbox\" aria-label=\"Sandbox\"><\/button><\/div>\n   <div class=\"set\"><div class=\"l\"><b>Graphics<\/b><span>Low runs smoother on older phones.<\/span><\/div><div class=\"seg\" data-k=\"gfx\" role=\"radiogroup\" aria-label=\"Graphics\"><button type=\"button\" data-v=\"low\">Low<\/button><button type=\"button\" data-v=\"high\">High<\/button><\/div><\/div>\n  <\/div>\n  <div class=\"w-foot\"><button class=\"t-btn ghost\" type=\"button\" id=\"set-reset\">Reset<\/button><button class=\"t-btn primary\" type=\"button\" data-close>Done<\/button><\/div>\n <\/div>\n<\/div>\n<div class=\"dlg\" id=\"credits\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"cred-title\" hidden>\n <div class=\"t-win pop\">\n  <span class=\"t-ribbon\" id=\"cred-title\">Credits<\/span>\n  <button class=\"t-round x\" type=\"button\" data-close aria-label=\"Close\"><svg><use href=\"#i-x\"/><\/svg><\/button>\n  <div class=\"d-body\">\n   <p class=\"cred\"><b>Horizons<\/b> was made for the NASA Space Apps Challenge 2026, challenge \"Space Mission Design Game\".<\/p>\n   <ul class=\"cred-list\">\n    <li>Rockets <span>Jupiter-C, Ares I, Saturn V, Space Shuttle, SLS<\/span><\/li>\n    <li>Capsules <span>Orion, Mercury (Faith 7)<\/span><\/li>\n    <li>Spacecraft parts <span>NASA Satellite Kit<\/span><\/li>\n    <li>Instrument <span>NASA Infrared Camera<\/span><\/li>\n    <li>Display piece <span>NASA Landsat 8<\/span><\/li>\n   <\/ul>\n   <p class=\"cred\">3D models courtesy of NASA (NASA-3D-Resources). Horizons is not affiliated with or endorsed by NASA.<\/p>\n  <\/div>\n  <div class=\"w-foot\"><button class=\"t-btn primary\" type=\"button\" data-close>Close<\/button><\/div>\n <\/div>\n<\/div>\n\n<script>\nconst OS_REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;\n// Settings are kept per browser; the game state (window.HZ) wins when the shell passes them on.\nconst SET_DEF={sfx:true,music:true,motion:OS_REDUCE,hints:true,gfx:'high',rocket:2,diff:'pilot',sandbox:false};\nconst SET=(()=>{let v={};try{v=JSON.parse(localStorage.getItem('hz-settings')||'{}')||{}}catch(e){}\n  return Object.assign({},SET_DEF,v,(window.HZ&&window.HZ.settings)||{})})();\nlet reduce=SET.motion;\ndocument.documentElement.classList.toggle('rm',reduce);\n// rotating headline word\n(()=>{const w=[...document.querySelectorAll('#word span')];let i=0;\n setInterval(()=>{if(reduce)return;w[i].classList.replace('on','out');const o=w[i];setTimeout(()=>o.classList.remove('out'),700);i=(i+1)%w.length;w[i].classList.add('on')},2600)})();\n\nfunction fit(c){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.5);c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return {x,w:r.width,h:r.height}}\n// seeded random so the scene is stable\nfunction rng(s){return()=>(s=(s*16807)%2147483647)/2147483647}\n\n// twinkling stars + shooting stars over the sky image (the canvas lives inside .night, so it shares its fade)\nconst sky=document.getElementById('sky');let S,stars;\nwindow.METEORS=[];let nextMeteor=0;\nfunction initSky(){S=fit(sky);const R=rng(7);stars=[];for(let k=0;k<160;k++){const x=S.w*(1-Math.pow(R(),1.15)*.95),y=S.h*Math.pow(R(),1.25)*.85;\n stars.push({x,y,s:R()<.07?1.7:R()*.8+.3,p:R()*6,warm:R()<.15,blue:R()<.25})}}\n// showers like the reference: steep diagonal streaks falling down-left, sometimes three at once\nfunction spawnMeteor(t){const n=Math.random()<.25?3:1,ang=Math.PI/2+.38+Math.random()*.2;\n for(let i=0;i<n;i++){const sp=S.h*(.9+Math.random()*.7);\n  METEORS.push({x:S.w*(.35+Math.random()*.7)+i*S.w*.06,y:-30+S.h*Math.random()*.3+i*24,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,len:110+Math.random()*190,born:t+i*160,life:800+Math.random()*700,w:1.1+Math.random()*1.5,pink:Math.random()<.45,a:0,px:0,py:0})}\n nextMeteor=t+700+Math.random()*2100}\nfunction drawSky(t){const {x}=S;x.clearRect(0,0,S.w,S.h);\n for(const s of stars){x.globalAlpha=reduce?.8:.35+.65*Math.abs(Math.sin(t/1300+s.p));x.fillStyle=s.warm?'#F2C27A':s.blue?'#BFD6FF':'#fff';x.beginPath();x.arc(s.x,s.y,s.s,0,7);x.fill()}\n x.globalAlpha=1;\n if(!reduce){if(t>nextMeteor)spawnMeteor(t);\n  for(let i=METEORS.length-1;i>=0;i--){const m=METEORS[i],a=(t-m.born)/m.life;if(a<0)continue;if(a>1){METEORS.splice(i,1);continue}\n   const sec=a*m.life/1000,px=m.x+m.vx*sec,py=m.y+m.vy*sec,sp=Math.hypot(m.vx,m.vy),tx=px-m.vx/sp*m.len,ty=py-m.vy/sp*m.len,f=Math.sin(Math.PI*a);\n   m.a=a;m.px=px;m.py=py;\n   const g=x.createLinearGradient(px,py,tx,ty);g.addColorStop(0,`rgba(255,255,255,${f})`);g.addColorStop(.2,m.pink?`rgba(255,175,225,${.75*f})`:`rgba(160,205,255,${.75*f})`);g.addColorStop(1,'rgba(255,255,255,0)');\n   x.strokeStyle=g;x.lineWidth=m.w;x.lineCap='round';x.beginPath();x.moveTo(px,py);x.lineTo(tx,ty);x.stroke();\n   const h=x.createRadialGradient(px,py,0,px,py,m.w*7);h.addColorStop(0,`rgba(255,255,255,${f})`);h.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=h;x.beginPath();x.arc(px,py,m.w*7,0,7);x.fill()}}\n if(!reduce)requestAnimationFrame(drawSky)}\n\nfunction init(){initSky();if(reduce)drawSky(0)}\ninit();if(!reduce)requestAnimationFrame(drawSky);\nlet rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(init,150)});\n<\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js\"><\/script>\n<script>\n/* ================= Home: NASA rocket in the glass ball, rocket switcher, Settings, Credits ================= */\n(()=>{\nconst $=id=>document.getElementById(id);\nconst go=(screen,data)=>{ blip(520); if(window.hzGo) hzGo(screen,Object.assign({settings:Object.assign({},SET)},data||{})); };\nconst save=()=>{ try{ localStorage.setItem('hz-settings',JSON.stringify(SET)); }catch(e){} };\n\n/* ---------- sound effects (tiny synth blips, no files) ---------- */\nlet AC=null;\nfunction blip(f=660,d=.07){ if(!SET.sfx) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;\n  o.type='square'; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*1.5,t+d); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);\n  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02); }catch(e){} }\ndocument.addEventListener('pointerdown',e=>{ if(e.target.closest('.t-btn,.t-round,.card,.sw,.seg button')) blip(); });\n\n/* ---------- NASA rockets ---------- */\nconst ROCKETS=[\n  {m:'rocket-jupiter-c',n:'Jupiter-C',y:1956},\n  {m:'rocket-ares-1',n:'Ares I',y:2009},\n  {m:'rocket-saturn-v',n:'Saturn V',y:1967},\n  {m:'rocket-shuttle',n:'Space Shuttle',y:1981},\n  {m:'rocket-sls',n:'SLS',y:2022}];\nlet idx=Math.min(Math.max(SET.rocket|0,0),ROCKETS.length-1);\nconst ball=$('ball'), cv=$('rk'), statusEl=$('status'), nameEl=$('rk-name');\nfunction setStatus(t){ statusEl.innerHTML='<i><\/i>'+t; }\nfunction setName(){ const r=ROCKETS[idx]; nameEl.innerHTML=`<b>${r.n}<\/b><small>NASA \u00b7 ${r.y}<\/small>`; }\nsetName();\n\n// Models ship as base64 GLB text (models/<name>.txt). The standalone demo keeps them in models-b64/.\nfunction b64ToBuf(s){ const bin=atob(s.trim()), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u.buffer; }\nfunction fetchModel(n){ return fetch(`models/${n}.txt`).then(r=>{ if(!r.ok) throw 0; return r.text(); })\n  .catch(()=>fetch(`models-b64/${n}.txt`).then(r=>{ if(!r.ok) throw 0; return r.text(); })); }\n\n// Same treatment as the base: original NASA colours, every texture flattened to its dominant colour (no markings).\nfunction dominant(img){ try{ const c=document.createElement('canvas'); c.width=c.height=24; const g=c.getContext('2d'); g.drawImage(img,0,0,24,24);\n  const d=g.getImageData(0,0,24,24).data, n={}; let best=null,bc=0; for(let i=0;i<d.length;i+=4){ const k=(d[i]>>4)+','+(d[i+1]>>4)+','+(d[i+2]>>4); n[k]=(n[k]||0)+1; if(n[k]>bc){bc=n[k];best=[d[i],d[i+1],d[i+2]];} }\n  return new THREE.Color(best[0]/255,best[1]/255,best[2]/255); }catch(e){ return new THREE.Color(1,1,1); } }\n// Some NASA rocket models stand on a display plinth (a flat dark slab under the engines). A rocket on our pads needs no plinth: drop it.\nfunction stripPlinth(sc){ sc.updateMatrixWorld(true); const A=new THREE.Box3().setFromObject(sc), H=A.max.y-A.min.y, W=Math.max(A.max.x-A.min.x,A.max.z-A.min.z); if(!(H>2*W)) return; const rm=[];\n  sc.traverse(o=>{ if(!o.isMesh) return; const b=new THREE.Box3().setFromObject(o); if(b.max.y-b.min.y<H*.05&&b.min.y-A.min.y<H*.01&&Math.max(b.max.x-b.min.x,b.max.z-b.min.z)>W*.8) rm.push(o); }); rm.forEach(o=>o.parent.remove(o)); }\nfunction bake(gltf){ if(typeof stripPlinth==='function') stripPlinth(gltf.scene); gltf.scene.updateMatrixWorld(true); const byMat=new Map(), v=new THREE.Vector3();\n  gltf.scene.traverse(o=>{ if(!o.isMesh||!o.geometry) return; const g=o.geometry,P=g.getAttribute('position'),I=g.index,arr=[];\n    const n=I?I.count:P.count; for(let i=0;i<n;i++){ v.fromBufferAttribute(P,I?I.getX(i):i).applyMatrix4(o.matrixWorld); arr.push(v.x,v.y,v.z); }\n    const m=Array.isArray(o.material)?o.material[0]:o.material; if(!byMat.has(m)) byMat.set(m,[]); { const t=byMat.get(m); for(let i=0;i<arr.length;i++) t.push(arr[i]); } });\n  const grp=new THREE.Group();\n  for(const [m,a] of byMat){ const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(a,3)); geo.computeVertexNormals();\n    const col=(m&&m.color?m.color.clone():new THREE.Color(1,1,1)); if(m&&m.map&&m.map.image) col.multiply(dominant(m.map.image));\n    grp.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:col,roughness:.55,metalness:Math.min(m&&m.metalness||0,.35),side:THREE.DoubleSide}))); }\n  // stand it up, centre it, fit it inside the ball\n  let bb=new THREE.Box3().setFromObject(grp), s=bb.getSize(new THREE.Vector3());\n  if(s.z>s.y&&s.z>=s.x) grp.rotation.x=-Math.PI/2; else if(s.x>s.y&&s.x>s.z) grp.rotation.z=Math.PI/2;\n  const inner=new THREE.Group(); inner.add(grp); inner.updateMatrixWorld(true);\n  bb=new THREE.Box3().setFromObject(inner); bb.getSize(s); const c=bb.getCenter(new THREE.Vector3());\n  const k=Math.min(3.5/s.y, 2.2/Math.max(s.x,s.z)); grp.position.sub(c); const out=new THREE.Group(); inner.scale.setScalar(k); out.add(inner); return out; }\n\n/* ---------- three.js view inside the ball: NASA rocket, glass shell, stardust ----------\n   The glass reflects a small \"environment\" painted live from the page: the night sky image (up and to the right),\n   the shooting stars as they fall, the ember headline and amber Play button (right) and the white cards (left). */\nlet R=null, scene, cam, tilt, spinner, dust, flash, cache={}, loadTok=0, anim=null, vel=0, dragging=false, lastX=0, running=false, ready=false;\nconst SR=2.32;                                   // glass radius (the canvas frames the ball exactly)\nconst U={env:{value:null},t:{value:2},pulse:{value:0},mouse:{value:new THREE.Vector2()},pr:{value:1},boost:{value:0}};\nconst mouseT=new THREE.Vector2();\nconst skyImg=new Image();\n(()=>{ const bg=getComputedStyle(document.querySelector('.night')).backgroundImage||''; const m=bg.match(/^url\\(\"?(.*?)\"?\\)$/); if(m) skyImg.src=m[1]; })();\n\nconst envCv=document.createElement('canvas'); envCv.width=512; envCv.height=256; const ex=envCv.getContext('2d');\nfunction blob(x,y,r,col){ const g=ex.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,col); g.addColorStop(1,'rgba(251,250,244,0)'); ex.fillStyle=g; ex.beginPath(); ex.arc(x,y,r,0,7); ex.fill(); }\nfunction rrect(x,y,w,h,r){ ex.beginPath(); ex.moveTo(x+r,y); ex.arcTo(x+w,y,x+w,y+h,r); ex.arcTo(x+w,y+h,x,y+h,r); ex.arcTo(x,y+h,x,y,r); ex.arcTo(x,y,x+w,y,r); ex.closePath(); }\n// the night sky, pre-faded once into an alpha-masked tile: strongest up and to the right, a thin band overhead\nlet _tile=null;\nfunction skyTile(){ if(_tile) return _tile; if(!(skyImg.complete&&skyImg.naturalWidth)) return null;\n  const c=document.createElement('canvas'); c.width=512; c.height=256; const x=c.getContext('2d'), iw=skyImg.naturalWidth, ih=skyImg.naturalHeight;\n  // piece: draw part of the sky into a box with a soft alpha mask (horizontal + vertical fades)\n  const piece=(sx,sy,sw,sh,dx,dy,dw,dh,flip,hf,vf)=>{ const m=document.createElement('canvas'); m.width=dw; m.height=dh; const q=m.getContext('2d');\n    if(flip){ q.translate(dw,0); q.scale(-1,1); } q.drawImage(skyImg,sx,sy,sw,sh,0,0,dw,dh); q.setTransform(1,0,0,1,0,0);\n    q.globalCompositeOperation='destination-in'; let g=q.createLinearGradient(0,0,dw,0); hf.forEach(([o,v])=>g.addColorStop(o,`rgba(0,0,0,${v})`)); q.fillStyle=g; q.fillRect(0,0,dw,dh);\n    g=q.createLinearGradient(0,0,0,dh); vf.forEach(([o,v])=>g.addColorStop(o,`rgba(0,0,0,${v})`)); q.fillStyle=g; q.fillRect(0,0,dw,dh);\n    x.drawImage(m,dx,dy); };\n  // a thin band straight overhead, mirrored halves so the wrap-around has no seam\n  piece(0,0,iw,ih*.25,0,0,256,40,false,[[0,1],[1,1]],[[0,1],[.5,.8],[1,0]]);\n  piece(0,0,iw,ih*.25,256,0,256,40,true,[[0,1],[1,1]],[[0,1],[.5,.8],[1,0]]);\n  // the main night: up and to the right of the ball only (never straight back at the viewer), gone before the wrap\n  piece(0,0,iw,ih*.7,300,0,212,138,false,[[0,0],[.3,1],[.8,1],[1,0]],[[0,1],[.6,.95],[1,0]]);\n  const g=x.createLinearGradient(0,96,0,150); g.addColorStop(0,'rgba(214,122,170,0)'); g.addColorStop(.5,'rgba(214,122,170,.3)'); g.addColorStop(1,'rgba(242,165,65,0)'); x.fillStyle=g; x.fillRect(300,96,212,54);\n  return _tile=c; }\n// equirect: x = longitude (centre = toward the viewer, right = screen right), y = latitude (top = up)\nfunction paintEnv(){\n  ex.globalAlpha=1; ex.fillStyle='#FBFAF4'; ex.fillRect(0,0,512,256);\n  let g=ex.createLinearGradient(0,150,0,256); g.addColorStop(0,'rgba(217,209,192,0)'); g.addColorStop(1,'#CFC5B1'); ex.fillStyle=g; ex.fillRect(0,150,512,106);\n  const tile=skyTile(); if(tile) ex.drawImage(tile,0,0);\n  // shooting stars, mapped from the page into the reflection\n  const sr=sky.getBoundingClientRect(), br=ball.getBoundingClientRect(), bx=br.left+br.width/2, by=br.top+br.height/2, W=innerWidth, H=innerHeight;\n  for(const m of (window.METEORS||[])){ if(!(m.a>0&&m.a<1)) continue;\n    const sx=sr.left+m.px, sy=sr.top+m.py, f=Math.sin(Math.PI*m.a);\n    const x=256+(sx-bx)/W*330, y=128+(sy-by)/H*230, sp=Math.hypot(m.vx,m.vy), dx=-m.vx/sp*26, dy=-m.vy/sp*26;\n    g=ex.createLinearGradient(x,y,x+dx,y+dy); g.addColorStop(0,`rgba(255,255,255,${f})`); g.addColorStop(1,'rgba(255,255,255,0)');\n    ex.strokeStyle=g; ex.lineWidth=2.2; ex.beginPath(); ex.moveTo(x,y); ex.lineTo(x+dx,y+dy); ex.stroke();\n    blob(x,y,10,`rgba(200,225,255,${.9*f})`);\n  }\n  if(U.env.value) U.env.value.needsUpdate=true;\n}\n\nconst VS=`varying vec3 vN; varying vec3 vV; varying vec3 vO;\nvoid main(){ vec4 mv=modelViewMatrix*vec4(position,1.); vN=normalize(normalMatrix*normal); vV=-mv.xyz; vO=normalize(position); gl_Position=projectionMatrix*mv; }`;\nconst ENV=`uniform sampler2D env; uniform float t; uniform float pulse; uniform vec2 mouse;\nvec3 envAt(vec3 d){ float lon=atan(d.x,d.z)+mouse.x*.45; float lat=asin(clamp(d.y,-1.,1.))+mouse.y*.25;\n  return texture2D(env,vec2(fract(lon/6.28318+.5),clamp(lat/3.14159+.5,.002,.998))).rgb; }\nvarying vec3 vN; varying vec3 vV; varying vec3 vO;`;\n// front surface: reflections, fresnel rim, thin-film iridescence, three coloured highlights, a light sweep\nconst FS_FRONT=ENV+`\nvoid main(){\n  vec3 N=normalize(vN), V=normalize(vV); float nv=max(dot(N,V),0.), fr=pow(1.-nv,2.4);\n  vec3 Rf=reflect(-V,N), refl=envAt(Rf); float l0=dot(refl,vec3(.3,.59,.11)); refl=max(mix(vec3(l0),refl,1.4),0.);\n  float th=nv*4.5+t*.3+vO.y*1.4+vO.x*.7; vec3 irid=mix(vec3(1.,.5,.18),vec3(1.,.82,.5),.5+.5*cos(6.28318*th));\n  vec3 L1=normalize(vec3(-.55,.62,.55)), L2=normalize(vec3(.78,.5,.38)), L3=normalize(vec3(.35,-.72,.6));\n  float d1=max(dot(Rf,L1),0.), s1=pow(d1,220.)*1.8+pow(d1,24.)*.22;\n  float s2=pow(max(dot(Rf,L2),0.),60.);\n  float s3=pow(max(dot(Rf,L3),0.),36.);\n  float b=fract((vO.x*.55+vO.y*.85)*.42-t*.085); float sweep=smoothstep(0.,.025,b)*smoothstep(.07,.025,b);\n  vec3 col=mix(refl*(.4+.6*fr),refl,1.-l0)+irid*fr*.5+vec3(1.)*s1+vec3(1.,.9,.75)*sweep*.55+vec3(1.,.55,.2)*pulse*.9;\n  float lum=dot(refl,vec3(.3,.59,.11));\n  float a=clamp(.07+fr*.92+s1+sweep*.3+pulse*.4+(1.-lum)*(.35+.6*fr),0.,1.);\n  gl_FragColor=vec4(col,a);\n}`;\n// back (inside) surface: the page seen through the glass, upside down like a real crystal ball, plus a caustic glow\nconst FS_BACK=ENV+`\nvoid main(){\n  vec3 N=-normalize(vN), V=normalize(vV); float nv=abs(dot(N,V)), fr=pow(1.-nv,2.);\n  vec3 irid=mix(vec3(1.,.5,.18),vec3(1.,.82,.5),.5+.5*cos(6.28318*(vO.y*1.2-t*.2)));\n  float caustic=pow(max(-vO.y,0.),3.)*.55;\n  vec3 col=mix(vec3(.985,.975,.955),vec3(.9,.92,1.),smoothstep(-.2,1.,vO.y)*.35)+irid*.06+vec3(1.,.8,.6)*caustic+vec3(1.,.55,.2)*pulse*.35;\n  gl_FragColor=vec4(col,clamp(.16+fr*.22+caustic*.4,0.,1.));\n}`;\n// stardust swirling inside the glass\nconst DUST_VS=`attribute vec4 seed; uniform float t; uniform float pr; uniform float boost; varying vec3 vC; varying float vA;\nvoid main(){ float r=length(position.xz), a=atan(position.z,position.x)+t*seed.y*(1.+boost*3.)+seed.x;\n  vec3 p=vec3(cos(a)*r, position.y+sin(t*.6+seed.x*3.)*.12, sin(a)*r);\n  vec4 mv=m === Music by phase (shared by every screen) =====\n   One generative score for the whole game, played by the shell page so it carries on across screens and crossfades between phases.\n   Each screen sets its phase; the launch and mission control also follow their own moments (countdown, ascent, orbit, cruise, arrival, win, lose).\n   Follows the Music setting (localStorage 'hz-settings'). Starts on the first tap or key press (browsers block sound before that).\n   API: HZ_MUSIC.phase(name), HZ_MUSIC.sting('win'|'lose'), HZ_MUSIC.unlock() */\n(function(){\n  const host=(()=>{ try{ return parent&&parent.document?parent:window; }catch(e){ return window; } })();\n  if(!host.HZ_MUSIC){ const s=host.document.createElement('script'); s.textContent='('+engine.toString()+')()'; host.document.head.appendChild(s); }\n  const M=host.HZ_MUSIC; window.HZ_MUSIC=M; if(!M) return;\n  const unlock=()=>M.unlock(); addEventListener('pointerdown',unlock,true); addEventListener('keydown',unlock,true); addEventListener('touchstart',unlock,true);\n  const SCREEN={home:'home',select:'select',base:'build',launch:'pad',control:'control'};\n  let scr=''; try{ scr=(host.location.hash||'').slice(1); }catch(e){}\n  M.phase(SCREEN[scr]||(window.LX?'pad':'home'));\n\n  function engine(){\n    const W=window; let ac=null, out=null, bus={}, cur='', want='', on=true, next=0, step=0, timer=0;\n    const mtof=m=>440*Math.pow(2,(m-69)/12);\n    // bpm, chords (MIDI, one per bar), layers and their volumes. 16 steps per bar.\n    const P={\n      home:   {bpm:68, ch:[[48,55,64,71],[45,52,60,67],[41,48,57,64],[43,50,59,62]], pad:.05, arp:[0,null,null,7,null,null,4,null,null,null,12,null,null,9,null,null], arpV:.028, bell:true},\n      select: {bpm:80, ch:[[48,55,64,71],[45,52,60,67],[41,48,57,64],[43,50,59,62]], pad:.045, arp:[0,null,7,null,4,null,12,null,0,null,7,null,9,null,4,null], arpV:.03, bass:[0,null,null,null,null,null,null,null,0,null,null,null,null,null,null,null], bassV:.05},\n      build:  {bpm: ll,0,4,7,12,null,null,16,null], arpV:.026, bell:true},\n      lose:   {bpm:58, ch:[[45,52,57,60],[41,48,53,57],[38,45,50,53],[40,47,52,56]], pad:.045, drone:33},\n    };\n    function enabled(){ try{ const s=JSON.parse(localStorage.getItem('hz-settings')||'{}')||{}; return s.music!==false; }catch(e){ return true; } }\n    function init(){ if(ac) return; try{ ac=new (W.AudioContext||W.webkitAudioContext)(); }catch(e){ return; }\n      const comp=ac.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=3; out=ac.createGain(); out.gain.value=0; out.connect(comp); comp.connect(ac.destination);\n      const n=ac.createBuffer(1,ac.sampleRate,ac.sampleRate), d=n.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; W.__hzNoise=n;\n      next=ac.currentTime+.1; timer=setInterval(sched,60); }\n    function busFor(ph){ if(!bus[ph]){ const g=ac.createGain(); g.gain.value=0; const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=ph==='count'?600:2600; g.connect(f); f.connect(out); bus[ph]={g,f}; } return bus[ph]; }\n    function voice(dest,type,fq,t,dur,vol,a,r,cut){ const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.value=fq; o.detune.value=(Math.random()-.5)*8;\n      let node=o; if(cut){ const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut; o.connect(f); node=f; } node.connect(g); g.connect(dest);\n      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+a); g.gain.setValueAtTime(vol,t+Math.max(a,dur-r)); g.gain.linearRampToValueAtTime(0,t+dur); o.start(t); o.stop(t+dur+.05); }\n    function noise(dest,t,dur,vol,hp){ const s=ac.createBufferSource(); s.buffer=W.__hzNoise; const f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; const g=ac.createGain();\n      g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(f); f.connect(g); g.connect(dest); s.start(t); s.stop(t+dur+.02); }\n    function kick(dest,t){ const o=ac.cr EE4','#7A6A48'],big:1,ring:1},\n  uranus: {n:'Uranus', a:19.19,P:84,   R:25362,mu:5.794e6,cols:['#95C9CF','#6FA9B2','#C4E4E6','#33606A'],big:1},\n  neptune:{n:'Neptune',a:30.07,P:164.8,R:24622,mu:6.837e6,cols:['#2C4F8A','#1C3566','#6F8FCF','#0B1838'],big:1},\n  pluto:  {n:'Pluto',  a:39.48,P:248,  R:1188,mu:869.6,cols:['#CBB59A','#A8937A','#E6D6C0','#5E4E3C']}};\n// kind: 'orbit' (Earth orbit only), 'moon', 'orbiter' (transfer + insertion), 'flyby' (transfer, no insertion)\nconst HZ_MISSIONS={\n  earth:  {planet:'earth',  name:'Wildfire watch',  nasa:'Landsat',        kind:'orbit',  diff:1,unit:'fires',        verb:'spotted',  model:'landsat-8', obj:'Spot new wildfires within hours, from orbit, so crews on the ground can act before they spread.'},\n  moon:   {planet:'moon',   name:'Lunar polar ice', nasa:'LRO',            kind:'moon',   diff:2,unit:'ice maps',     verb:'made',     model:'lro',       obj:'Map water ice hiding in craters at the lunar poles that never see sunlight.'},\n  mars:   {planet:'mars',   name:'Mars atmosphere', nasa:'MAVEN',          kind:'orbiter',diff:3,unit:'air samples',  verb:'taken',    model:'maven',     obj:'Measure how Mars is losing its air to space, and how fast.'},\n  mercury:{planet:'mercury',name:'Mercury mapper',  nasa:'MESSENGER',      kind:'orbiter',diff:3,unit:'surface maps', verb:'made',     model:'messenger', obj:'Map all of Mercury and look for ice in polar craters that never see the Sun.'},\n  venus:  {planet:'venus',  name:'Venus radar',     nasa:'Magellan',       kind:'orbiter',diff:2,unit:'radar swaths', verb:'mapped',   model:'magellan',  obj:'Map the surface of Venus with radar, straight through its thick clouds.'},\n  jupiter:{planet:'jupiter',name:'Inside Jupiter',  nasa:'Juno',           kind:'orbiter',diff:3,unit:'gravity passes',verb:'flown',   model:'juno',      obj:'Measure the gravity and magnetic field of Jupiter to see what lies under the clouds.'},\n  saturn: {planet:'saturn', name:'Rings and Titan', nasa:'Cassini-Huygens',kind:'orbiter',diff:3,unit:'ring scans',   verb:'made',     model:'cassini',   obj:'Study Saturn, its rings and its moon Titan from orbit.'},\n  uranus: {planet:'uranus', name:'Ice giant flyby', nasa:'Voyager 2',      kind:'flyby',  diff:2,unit:'flyby images', verb:'taken',    model:'voyager',   obj:'Fly past Uranus, the ice giant that rolls on its side, and photograph its moons.'},\n  neptune:{planet:'neptune',name:'Edge of the planets',nasa:'Voyager 2',   kind:'flyby',  diff:3,unit:'flyby images', verb:'taken',    model:'voyager',   obj:'Fly past Neptune and its moon Triton at the edge of the planets.'},\n  pluto:  {planet:'pluto',  name:'Pluto flyby',     nasa:'New Horizons',   kind:'flyby',  diff:3,unit:'flyby images', verb:'taken',    model:'new-horizons',obj:'Cross the whole solar system for one fast pass over the icy heart of Pluto.'}};\n// Hohmann transfer from Earth to a planet (km/s, days). HTML4 plan().\nfunction hzPlan(key){ const M=HZ_MISSIONS[key]||HZ_MISSIONS.earth;\n  if(M.kind==='orbit') return {tpi:0,oi:0,T:0,total:0};\n  if(M.kind==='moon') return {tpi:3.13,oi:.82,T:3.5,total:3.95,a:58,e:(58-1)/(58+1),at:(1+58)/2,outer:true};\n  const p=HZ_PL[M.planet],a=p.a,at=(1+a)/2,T=.5*Math.pow(at,1.5)*365.25,vE=29.78,vd=vE*Math.sqrt(2-1/at),vi1=Math.abs(vd-vE),r=6571,mu=398600;\n  const tpi=Math.sqrt(vi1*vi1+2*mu/r)-Math.sqrt(mu/r),va=vE*Math.sqrt(2/a-1/at),vi2=Math.abs(va-vE/Math.sqrt(a)),rp=p.R*1.5,x=2*p.mu/rp;\n  const oi=M.kind==='flyby'?0:Math.sqrt(vi2*vi2+x)-Math.sqrt(x*50/51);\n  return {tpi,oi,T,total:tpi+oi,a,at,e:Math.abs(a-1)/(a+1),outer:a>1,vi2}; }\n// Delta-v the stack can give after reaching orbit: what is left in the upper stage plus the spacecraft engine.\nconst HZ_STAGE_DV={r1:3.2,r2:4.6,r3:9.5,r4:7.2,r5:12.5}, HZ_ENGINE_DV={e1:.4,e2:1.6,e3:3.6};\nfunction hzDvCap(pick){ return (HZ_STAGE_DV[pick&&pick.rocket]||3.2)+(HZ_ENGINE_DV[pick&&pick.engine]||.4); }\n\n/* ===== Spacecraft design: instruments and mission goals (phase 2) =====\n   Each mission has 3 goals; each goal is met by any one of its listed instruments. */\nconst HZ_INST=[\n  {id:'cam',    name:'Visible camera',       proc:'scope',  mass:18, cost:10, time:3, pw:30,  data:12, note:'Sharp pictures in daylight'},\n  {id:'ir',     name:'Thermal IR imager',    src:'NASA', model:'infrared-camera', mass:38, cost:32, time:5, pw:110, data:35, note:'Sees heat, day and night'},\n  {id:'hyper',  name:'Hyperspectral imager', proc:'scope2', mass:70, cost:58, time:8, pw:190, data:95, note:'Hundreds of colours: what things are made of'},\n  {id:'radar',  name:'Imaging radar',        proc:'radar',  mass:90, cost:45, time:7, pw:220, data:120, note:'Sees through clouds and haze'},\n  {id:'mag',    name:'Magnetometer',         proc:'boom',   mass:6,  cost:8,  time:2, pw:8,   data:2,  note:'Measures magnetic fields on a long boom'},\n  {id:'spec',   name:'Mass spectrometer',    proc:'spec',   mass:25, cost:30, time:5, pw:45,  data:10, note:'Sniffs gases and charged particles'},\n  {id:'neutron',name:'Neutron spectrometer', proc:'neutron',mass:15, cost:18, time:4, pw:20,  data:4,  note:'Finds hidden water ice'},\n  {id:'grav',   name:'Gravity science radio',proc:'gravr',  mass:8,  cost:12, time:3, pw:25,  data:3,  note:'Tracks tiny speed changes to map gravity'}];\nconst HZ_GOALS={\n  earth:  [['Spot fires day and night',['ir','hyper']],['Map burned land',['cam','hyper']],['See through the smoke',['ir','radar']]],\n  moon:   [['Find ice in dark craters',['neutron','radar']],['Map the polar terrain',['cam','radar']],['Measure surface temperature',['ir']]],\n  mars:   [['Sample the upper air',['spec']],['Measure the magnetic field',['mag']],['Image the glowing atmosphere',['hyper','cam']]],\n  mercury:[['Map the whole surface',['cam','hyper']],['Find ice at the poles',['neutron','radar']],['Measure the magnetic field',['mag']]],\n  venus:  [['Map the surface through the clouds',['radar']],['Map the gravity field',['grav']],['Study the cloud tops',['ir','hyper']]],\n  jupiter:[['Map the gravity field',['grav']],['Map the magnetic field',['mag']],['Look under the clouds',['ir']]],\n  saturn: [['Image the rings',['cam','hyper']],['See through the haze on Titan',['radar','ir']],['Sample the plasma',['spec','mag']]],\n  uranus: [['Photograph the planet and moons',['cam','hyper']],['Measure the magnetic field',['mag']],['Measure the heat inside',['ir']]],\n  neptune:[['Photograph Neptune and Triton',['cam','hyper']],['Measure the magnetic field',['mag']],['Measure the heat inside',['ir']]],\n  pluto:  [['Map the icy heart',['cam','hyper']],['Measure the thin air',['spec']],['Measure surface temperatures',['ir']]]};\nfunction hzGoalsMet(key,ids){ return (HZ_GOALS[key]||HZ_GOALS.earth).map(([t,need])=>({t,need,ok:need.some(n=>ids.includes(n))})); }\n// propulsion: engine efficiency x tank size gives the spacecraft's own delta-v\nconst HZ_ENGINE_K={e1:.35,e2:1,e3:1.9}, HZ_TANK_DV={t1:1,t2:2,t3:3.4};\nfunction hzDvCap(pick){ return (HZ_STAGE_DV[pick&&pick.rocket]||3.2)+(HZ_ENGINE_K[pick&&pick.engine]||.35)*(HZ_TANK_DV[pick&&pick.tank]||1); }\n\n/* ===== Orbits: each choice has real effects in mission control =====\n   ecl: share of each orbit spent in shadow (batteries), link: ground passes (downlink), sci: science per pass,\n   oiK: insertion delta-v factor at the destination. */\nconst HZ_ORBITS={\n  orbit:[ // Earth missions\n    {id:'o1',name:'Sun-sync 550 km', ecl:.35,link:1,  sci:1,   oiK:1,  note:'Passes over every place at the same local time: fair, repeatable pictures'},\n    {id:'o2',name:'Low 400 km',      ecl:.4, link:.8, sci:1.15,oiK:1,  cost:-3,note:'Closer means sharper pictures, but fewer ground passes and more shadow'},\n    {id:'o3',name:'Polar 800 km',    ecl:.32,link:1.3,sci:.9, oiK:1,  note:'Flies over the polar ground stations every orbit: lots of downlink'},\n    {id:'o4',name:'Dawn-dusk 700 km',ecl:.04,link:1,  sci:.85,oiK:1,  cost:4,note:'Rides the line between day and night: almost never in shadow'}],\n  around:[ // orbiters and the Moon\n    {id:'o1',name:'Low circular',    ecl:.4, link:.9, sci:1.2, oiK:1.15,note:'Close to the surface: best science, more shadow, costs more fuel to reach'},\n    {id:'o2',name:'High elliptical', ecl:.15,link:1.1,sci:.85, oiK:.85, note:'Swoops low then far out: little shadow, cheap to enter, less science'},\n    {id:'o3',name:'Polar',           ecl:.3, link:1,  sci:1.05,oiK:1,   note:'Passes over the poles: sees the whole surface over time'}],\n  flyby:[\n    {id:'o1',name:'Close pass',      ecl:0,  link:1,  sci:1.25,oiK:0,   note:'Skims close: sharper data, a riskier aim'},\n    {id:'o2',name:'Safe distance',   ecl:0,  link:1,  sci:.9,  oiK:0,   note:'Passes wider: safe, but less detail'}]};\nfunction hzOrbitsFor(key){ const M=HZ_MISSIONS[key]||HZ_MISSIONS.earth; return M.kind==='orbit'?HZ_ORBITS.orbit:M.kind==='flyby'?HZ_ORBITS.flyby:HZ_ORBITS.around; }\n\n/* ===== Balance (v2): the rocket's push depends on how heavy your spacecraft is, and every mission has its own limits =====\n   A light spacecraft can ride a small rocket a long way; a heavy one needs a big rocket. */\nconst HZ_ROCKET={r1:{cap:300,dv:6.4},r2:{cap:800,dv:7.2},r3:{cap:2000,dv:10.5},r4:{cap:2600,dv:8.4},r5:{cap:4000,dv:12.5}};\nfunction hzRocketDv(rk,mass){ const R=HZ_ROCKET[rk]||HZ_ROCKET.r1; return Math.max(0,R.dv*(1-.55*Math.min(1,(mass||0)/R.cap))); }\nhzDvCap=function(pick,mass){ return hzRocketDv(pick&&pick.rocket,mass)+(HZ_ENGINE_K[pick&&pick.engine]||.35)*(HZ_TANK_DV[pick&&pick.tank]||1); };\nconst HZ_LIMITS={earth:{budget:180,time:12},moon:{budget:320,time:18},mars:{budget:450,time:24},mercury:{budget:480,time:30},venus:{budget:360,time:24},\n  jupiter:{budget:560,time:36},saturn:{budget:620,time:40},uranus:{budget:520,time:36},neptune:{budget:540,time:36},pluto:{budget:500,time:36}};\n\n// sunlight at the destination, as a share of Earth's (solar wings make this much less; an RTG does not care)\nfunction hzSunK(key){ const M=HZ_MISSIONS[key]; if(!M||M.planet==='earth'||M.planet==='moon') return 1; const a=HZ_PL[M.planet]?HZ_PL[M.planet].a:1; return Math.min(2,Math.pow(a,-1.25)); }\n\n/* ===== Difficulty and sandbox (Settings) ===== */\nconst HZ_DIFF={cadet:{name:'Cadet',dv:1.2,budget:1.25,grace:1.6,score:.9},pilot:{name:'Pilot',dv:1,budget:1,grace:1,score:1},commander:{name:'Commander',dv:.88,budget:.85,grace:.6,score:1.15}};\nfunction hzDiff(){ const S=(window.HZ&&HZ.settings)||{}; return HZ_DIFF[S.diff]||HZ_DIFF.pilot; }\nfunction hzSandbox(){ return !!(window.HZ&&HZ.settings&&HZ.settings.sandbox); }\n{ const _cap=hzDvCap; hzDvCap=function(p,m){ return _cap(p,m)*hzDiff().dv; }; }\n\n/* ===== The real NASA mission behind each game mission (for \"a real mission like yours\" in the report) ===== */\nconst HZ_REAL={\n  earth:  {n:'Landsat 8',y:2013,rocket:'Atlas V',mass:2623,power:'solar',inst:['cam','ir'],txt:'An imaging camera (OLI) and a thermal infrared sensor (TIRS), in a sun-synchronous orbit at 705 km.'},\n  moon:   {n:'Lunar Reconnaissance Orbiter',y:2009,rocket:'Atlas V',mass:1916,power:'solar',inst:['cam','ir','neutron','radar'],txt:'Cameras, a thermal radiometer, a neutron detector and a small radar, in a low polar orbit.'},\n  mars:   {n:'MAVEN',y:2013,rocket:'Atlas V',mass:2454,power:'solar',inst:['spec','mag','hyper'],txt:'A mass spectrometer, a magnetometer and an ultraviolet imaging spectrograph, in an elliptical orbit.'},\n  mercury:{n:'MESSENGER',y:2004,rocket:'Delta II',mass:1107,power:'solar',inst:['cam','mag','neutron'],txt:'Cameras, a magnetometer and a neutron spectrometer. It used six planet flybys to slow down instead of a huge rocket.'},\n  venus:  {n:'Magellan',y:1989,rocket:'Space Shuttle Atlantis',mass:3449,power:'solar',inst:['radar','grav'],txt:'A radar that mapped 98% of Venus through the clouds, and radio tracking for gravity.'},\n  jupiter:{n:'Juno',y:2011,rocket:'Atlas V',mass:3625,power:'solar',inst:['grav','mag','ir'],txt:'Huge solar wings (the farthest solar-powered craft), a magnetometer, gravity science and a microwave radiometer.'},\n  saturn: {n:'Cassini-Huygens',y:1997,rocket:'Titan IV-B',mass:5712,power:'rtg',inst:['cam','radar','spec','mag'],txt:'Three RTGs, cameras, a radar that saw through Titan\\'s haze, and particle instruments.'},\n  uranus: {n:'Voyager 2',y:1977,rocket:'Titan IIIE',mass:722,power:'rtg',inst:['cam','mag','ir'],txt:'RTG power, cameras, a magnetometer and an infrared spectrometer: still the only visitor to Uranus.'},\n  neptune:{n:'Voyager 2',y:1977,rocket:'Titan IIIE',mass:722,power:'rtg',inst:['cam','mag','ir'],txt:'The same Voyager 2, twelve years after launch: still the only visitor to Neptune.'},\n  pluto:  {n:'New Horizons',y:2006,rocket:'Atlas V',mass:478,power:'rtg',inst:['cam','spec','ir'],txt:'A light, fast craft with an RTG, cameras and an ultraviolet spectrometer for Pluto\\'s thin air.'}};\n\n/* ===== Saved flights (this browser): compare with your last design, local leaderboard ===== */\nconst HZ_FLIGHTS={ all(){ try{ return JSON.parse(localStorage.getItem('hz-flights')||'[]'); }catch(e){ return []; } },\n  save(f){ try{ const a=this.all(); a.push(f); localStorage.setItem('hz-flights',JSON.stringify(a.slice(-200))); }catch(e){} },\n  of(m){ return this.all().filter(f=>f.mission===m); },\n  best(m){ return this.of(m).filter(f=>!f.sandbox).sort((a,b)=>b.score-a.score); } };\n<\/script>\n<title>Horizons Mission Select<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;600&display=swap\">\n<style>\n@font-face{font-family:'Game Paused';src:url(data:font/otf;base64,T1RUTwALAIAAAwAwQ0ZGIG2IYoMAAAO8AAAcdURTSUcAAAABAAAlcAAAAAhHREVGABIAOAAAJVgAAAAWT1MvMmLPXRIAAAEgAAAAYGNtYXAEFAdZAAACYAAAAVxoZWFkJH1R8AAAALwAAAA2aGhlYQavArUAAAD0AAAAJGhtdHhw9wWUAAABgAAAAN5tYXhwADhQAAAAARgAAAAGbmFtZSUCvvEAACA0AAAFA3Bvc3T/nwAyAAAlOAAAACAAAQAAAAEAADBL ec3 c1; uniform vec3 c2; uniform vec3 c3;\nuniform vec3 axis; uniform float freq; uniform float glow; uniform float time; uniform float hover;\nvarying vec3 vN; varying vec3 vObj; varying vec3 vWorld;\nfloat hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }\nfloat n3(vec3 p){ return sin(p.x*1.7+sin(p.y*2.3))*cos(p.z*1.9+sin(p.x*1.1)); }\nvoid main(){\n  float t = dot(vObj, normalize(axis)) * freq + 0.35*n3(vObj*2.2);\n  float b = fract(t*0.5+0.5);\n  vec3 col = b < .30 ? c0 : b < .52 ? mix(c0,c1,smoothstep(.30,.36,b)) : b < .70 ? mix(c1,c2,smoothstep(.52,.60,b)) : mix(c2,c3,smoothstep(.70,1.0,b));\n  vec3 L = normalize(-vWorld);               // sun at origin\n  float d = dot(normalize(vN), L);\n  float lit = smoothstep(-0.35, 0.65, d);    // soft terminator\n  vec3 shade = mix(c3*0.25, col, lit);\n  vec3 V = normalize(cameraPosition - vWorld);\n  float rim = pow(1.0 - max(dot(normalize(vN), V),0.0), 3.0);\n  shade += rim * (0.18 + 0.5*hover) * vec3(1.0,.85,.65);\n  float g = hash(gl_FragCoord.xy + fract(time)*91.0) - 0.5;   // film grain\n  shade += g * 0.11;\n  shade = mix(shade, col*1.4, glow);         // sun ignores lighting\n  gl_FragColor = vec4(shade, 1.0);\n}`;\nconst hex = h => new THREE.Color(h);\nfunction planetMat(cols, axis, freq, glow=0){\n  return new THREE.ShaderMaterial({ vertexShader:vert, fragmentShader:frag, uniforms:{\n    c0:{value:hex(cols[0])}, c1:{value:hex(cols[1])}, c2:{value:hex(cols[2])}, c3:{value:hex(cols[3])},\n    axis:{value:new THREE.Vector3(...axis)}, freq:{value:freq}, glow:{value:glow}, time:{value:0}, hover:{value:0} }});\n}\n\n// ---------- Missions ----------\nconst MISSIONS = {\n  earth:{ name:'Wildfire watch', planet:'Earth', diff:1, obj:'Spot new wildfires within hours, from orbit, so crews on the ground can act before they spread.',\n    specs:[['Orbit','Sun-sync 550 km'],['Duration','12 months'],['Budget','$180M'],['Mass limit','350 kg']],\n    tasks:['Pick a thermal infrared imager','Keep revis
