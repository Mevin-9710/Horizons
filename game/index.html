w .08s}\n.t-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}\n.t-btn.primary{--c:var(--amber);--cd:var(--amber-d)}\n.t-btn.ghost{font:700 14px var(--f-ui)}\n.t-btn.on{--c:var(--ink);color:var(--cream);--cd:#000}\n.t-round{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--glass);backdrop-filter:blur(18px);box-shadow:inset 0 -4px 0 rgba(26,18,6,.08),0 4px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--ink);flex:none}\n.t-round svg{width:20px;height:20px}\n.t-ribbon{display:inline-block;background:var(--ember);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:5px 16px 7px;font:400 17px var(--f-display);white-space:nowrap;box-shadow:inset 0 -4px 0 var(--ember-d),0 4px 0 var(--ink);text-shadow:0 2px 0 rgba(26,18,6,.3)}\n.t-btn:focus-visible,.t-round:focus-visible{outline:3px solid var(--ember);outline-offset:3px}\n.label{font:400 10px var(--f-num);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}\n@keyframes tpop{0%{transform:scale(.85) translateY(14px);opacity:0}}\n/* top-left */\n.tl{top:calc(14px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center}\n/* stepper */\n.stepper{top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:0;padding:8px 14px;border-radius:999px}\n.st{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px}\n.st i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--ink);background:#fff}\n.st span{font:700 10.5px var(--f-ui);color:var(--muted);white-space:nowrap}\n.st.done i{background:var(--ok)} .st.now i{background:var(--amber);box-shadow:0 0 0 4px rgba(242,165,65,.35)} .st.now span{color:var(--ink)}\n.bar{width:22px;height:3px;background:var(--ink);opacity:.25;margin-bottom:16px}\n/* gauges */\n.gauges{top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;width:190px}\n.g{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;padding:8px 10px;border-radius:14px}\n.g b{font:700 12.5px var(--f-ui)} .g em{font:400 12px var(--f-num);font-style:normal;font-variant-numeric:tabular-nums}\n.g .tr{grid-column:1/-1;height:10px;border-radius:6px;border:2px solid var(--ink);background:rgba(255,255,255,.6);overflow:hidden}\n.g .tr i{display:block;height:100%;background:var(--ok);transition:width .3s}\n.g.warn .tr i{background:var(--warn)} .g.bad .tr i{background:var(--bad)} .g.bad{background:rgba(229,72,77,.18)}\n/* caption */\n.cap{left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100% - 28px));padding:14px 16px;display:flex;flex-direction:column;gap:6px}\n.cap h2{margin:0;font:400 26px var(--f-display)}\n.cap p{margin:0;font:500 14.5px var(--f-ui);line-height:1.45}\n.cap .sci{display:flex;gap:8px;align-items:center;font:700 13px var(--f-ui);color:var(--teal)}\n/* controls */\n.ctl{right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center}\n/* decision card */\n.scrim{position:fixed;inset:0;z-index:10;background:rgba(26,18,6,.28);backdrop-filter:blur(2px);display:none;place-items:center;padding:16px}\n.scrim.open{display:grid}\n.card{width:min(460px,100%);padding:20px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;animation:tpop .5s cubic-bezier(.34,1.56,.64,1) both;max-height:calc(100% - 10px);overflow:auto}\n.card .ico{width:64px;height:64px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;background:var(--c);box-shadow:0 4px 0 var(--ink)}\n.card .ico svg{width:32px;height:32px}\n.card h3{margin:0;font:400 28px var(--f-display)}\n.card p{margin:0;font:500 15px var(--f-ui);line-height:1.45}\n.choices{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.choice{display:flex;flex-direction:column;gap:6px;text-align:left;border:3px solid var(--ink);border-radius:16px;padding:12px;background:rgba(255,255,255,.55);box-shadow:0 5px 0 var(--ink);cursor:pointer;font:inherit;color:var(--ink);transition:transform .12s cubic-bezier(.34,1.56,.64,1)}\n.choice:hover{transform:translateY(-3px)} .choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}\n.choice b{font:400 17px var(--f-display)}\n.choice span{font:500 12.5px var(--f-ui);color:var(--muted)}\n.choice .fx{display:flex;flex-wrap:wrap;gap:4px}\n.choice .fx em{font:400 10px var(--f-num);font-style:normal;padding:2px 6px;border-radius:6px;border:1.5px solid var(--ink);background:#fff}\n.choice .fx em.g{background:rgba(76,195,138,.3)} .choice .fx em.r{background:rgba(229,72,77,.2)}\n.toast{left:50%;top:22%;transform:translateX(-50%);padding:10px 16px;display:none;align-items:center;gap:10px;font:700 14px var(--f-ui);animation:tpop .4s cubic-bezier(.34,1.56,.64,1) both;white-space:nowrap}\n.toast.show{display:flex}\n/* log drawer */\n.drawer{right:max(14px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100% - 28px));max-height:45%;overflow:auto;padding:12px;display:none;flex-direction:column;gap:6px}\n.drawer.open{display:flex}\n.drawer div{font:500 13px var(--f-ui);padding:6px 8px;border-radius:10px;border:2px solid var(--ink);background:rgba(255,255,255,.5)}\n.drawer div small{font:400 10px var(--f-num);color:var(--muted);display:block}\n/* report */\n.report{width:min(540px,100%);padding:22px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;animation:tpop .6s cubic-bezier(.34,1.56,.64,1) both;max-height:calc(100% - 10px);overflow:auto}\n.report h3{margin:0;font:400 30px var(--f-display)}\n.ringwrap{position:relative;width:150px;height:150px}\n.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}\n.ringwrap b{position:absolute;inset:0;display:grid;place-items:center;font:400 42px var(--f-num)}\n.ringwrap small{position:absolute;left:0;right:0;bottom:30px;font:400 9px var(--f-num);color:var(--muted)}\n.stars{display:flex;gap:6px}.stars svg{width:30px;height:30px}\n.why{width:100%;display:flex;flex-direction:column;gap:10px;text-align:left}\n.why .r{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}\n.why .r b{font:700 14px var(--f-ui)} .why .r em{font:400 12px var(--f-num);font-style:normal}\n.why .r .tr{grid-column:1/-1;height:12px;border-radius:8px;border:2.5px solid var(--ink);background:rgba(255,255,255,.6);overflow:hidden}\n.why .r .tr i{display:block;height:100%;width:0;background:var(--teal);transition:width 1s cubic-bezier(.34,1.56,.64,1)}\n.why .r p{grid-column:1/-1;margin:0;font:500 13px var(--f-ui);color:var(--muted)}\n.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}\n@media (max-width:820px){\n  .stepper{top:calc(140px + env(safe-area-inset-top,0px));padding:6px 8px}.st{min-width:40px}.st span{display:none}.st.now span{display:block;position:absolute;top:24px;font-size:11px}.st{position:relative}.bar{width:10px;margin-bottom:0}\n  .gauges{width:auto;left:max(14px,env(safe-area-inset-left,0px));top:calc(70px + env(safe-area-inset-top,0px));flex-direction:row}.g{flex:1;padding:6px 8px}.g b{font-size:11px}\n  .cap{bottom:calc(76px + env(safe-area-inset-bottom,0px));width:auto;right:14px}.cap h2{font-size:21px}.cap p{font-size:13.5px}\n  .ctl{left:14px;justify-content:flex-end}\n  .choices{grid-template-columns:1fr}\n}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n\n/* OPAQUE UI (2026-11-14, replaces glassmorphism): solid cream-white fills, no backdrop blur */\n:root{--glass:#FFFDF8!important}\n*{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}\n.t-win,.card,.spec,.tag,.t-pill,.dots button,.A .win,.A .resource,.A .dock,.A .tile:not(.on):not(.lock),.A .btn.ghost,.t-btn.ghost:not(.on),.t-round:not(.x),.metric:not(.bad),.tile:not(.on):not(.lock),.tab:not(.on),.opt:not(.on),.check li,.info,.panel,.g:not(.bad),.choice,.drawer div,.status,.chip,.prompt,.brief,.win,.dock,.cap,.stepper,.report,.B .win,.C .win,.C .resource,.C .tile:not(.on):not(.lock),.C .round,.B .btn.ghost,.C .btn.ghost{background:#FFFDF8!important}\n.spec,.check li,.drawer div,.opt:not(.on){background:#F6F1E6!important}\n.b-actions,.w-foot{background:#F6F1E6!important}\n.metric.bad,.g.bad{background:#F8D6D3!important}\n.opt.on{background:#F7D29C!important}\n.scrim{background:rgba(26,18,6,.45)!important}\n<\/style>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-back\" viewBox=\"0 0 24 24\"><path d=\"M15 5 8 12l7 7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/symbol>\n  <symbol id=\"i-flare\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"4.5\" fill=\"currentColor\"/><path d=\"M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><\/symbol>\n  <symbol id=\"i-rock\" viewBox=\"0 0 24 24\"><path d=\"M5 14l3-7 7-2 4 6-2 7-8 1z\" fill=\"currentColor\"/><path d=\"M2 4l4 3M3 9l3 1\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/><\/symbol>\n  <symbol id=\"i-aim\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"/><path d=\"M12 2v5M12 17v5M2 12h5M17 12h5\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><\/symbol>\n  <symbol id=\"i-fire\" viewBox=\"0 0 24 24\"><path d=\"M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-3-1-6 1-9z\" fill=\"currentColor\"/><\/symbol>\n  <symbol id=\"i-play\" viewBox=\"0 0 24 24\"><path d=\"M7 4l13 8-13 8z\" fill=\"currentColor\"/><\/symbol>\n  <symbol id=\"i-pause\" viewBox=\"0 0 24 24\"><path d=\"M6 4h4v16H6zM14 4h4v16h-4z\" fill=\"currentColor\"/><\/symbol>\n  <symbol id=\"i-list\" viewBox=\"0 0 24 24\"><path d=\"M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\"/><\/symbol>\n  <symbol id=\"i-star\" viewBox=\"0 0 24 24\"><path d=\"M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z\" fill=\"var(--sf,#F2A541)\" stroke=\"#1A1206\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><\/symbol>\n<\/svg>\n\n<div class=\"night\"><\/div><canvas id=\"cv\" aria-label=\"Mission trajectory view\"><\/canvas>\n\n<div class=\"ui tl\"><button class=\"t-round\" type=\"button\" aria-label=\"Back to base\"><svg><use href=\"#i-back\"/><\/svg><\/button><span class=\"t-ribbon\">Mission control<\/span><\/div>\n<div class=\"ui t-win stepper\" id=\"stepper\" aria-label=\"Mission phases\"><\/div>\n<div class=\"ui gauges\" id=\"gauges\"><\/div>\n<div class=\"ui t-win cap\" aria-live=\"polite\"><span class=\"label\" id=\"capLabel\">Phase 1 of 7<\/span><h2 id=\"capTitle\">Launch<\/h2><p id=\"capText\"><\/p><div class=\"sci\" id=\"sci\"><\/div><\/div>\n<div class=\"ui ctl\">\n  <button class=\"t-round\" type=\"button\" id=\"logBtn\" aria-label=\"Show event log\"><svg><use href=\"#i-list\"/><\/svg><\/button>\n  <button class=\"t-btn ghost\" type=\"button\" id=\"speed\">1\u00d7<\/button>\n  <button class=\"t-btn primary\" type=\"button\" id=\"play\" aria-label=\"Pause\"><svg style=\"width:18px;height:18px\"><use href=\"#i-pause\"/><\/svg><\/button>\n<\/div>\n<div class=\"ui t-win drawer\" id=\"drawer\"><\/div>\n<div class=\"ui t-win toast\" id=\"toast\"><\/div>\n<div class=\"scrim\" id=\"scrim\"><div id=\"modal\"><\/div><\/div>\n\n<script>\nconst reduce=(matchMedia('(prefers-reduced-motion: reduce)').matches||!!(window.HZ&&HZ.settings&&HZ.settings.motion));\n/* ===== Design coming from the workshops (demo values) ===== */\nconst DESIGN=Object.assign({mission:'Wildfire watch', inst:'Thermal IR imager', rocket:'Jupiter-C', orbit:'Sun-sync 550 km'}, (window.HZ&&HZ.design)||{});\nconst MKEY=(window.HZ&&HZ.mission)||'earth';\nconst MI=(typeof HZ_MISSIONS!=='undefined'&&HZ_MISSIONS[MKEY])||{name:'Wildfire watch',unit:'fires',verb:'spotted',planet:'earth',kind:'orbit',obj:''};\nconst UNIT=MI.unit, ATEARTH=MKEY==='earth', PNAME=MKEY==='moon'?'the Moon':(typeof HZ_PL!=='undefined'&&HZ_PL[MI.planet]?HZ_PL[MI.planet].n:'Earth');\nDESIGN.mission=MI.name;\n/* ===== Phases: one focus each, with a plain-language \"what and why\" ===== */\nconst PH=[\n {n:'Launch',          d:6,  t:`${DESIGN.rocket} lifts the spacecraft off Earth. The heavier the spacecraft, the more of the rocket's power it uses.`},\n {n:'Reach orbit',     d:5,  t:`The engine fires to settle into a ${DESIGN.orbit} orbit. This burn uses most of the fuel.`},\n {n:'Check-out',       d:4,  t:`Systems switch on one by one. Solar wings unfold and start charging the battery.`},\n {n:'Science 1',       d:8,  t:ATEARTH?`The ${DESIGN.inst} scans for heat. Each orbit passes over new forests.`:`The ${DESIGN.inst} starts work at ${PNAME}. ${MI.obj}`},\n {n:'Science 2',       d:8,  t:`Data piles up on board. It is sent home when the craft flies over a ground station.`},\n {n:'Science 3',       d:8,  t:`On the night side there is no sunlight, so the battery drains. Watch the power gauge.`},\n {n:'Science 4',       d:8,  t:ATEARTH?`Final stretch. Every fire spotted adds to your score.`:`Final stretch. Everything sent home adds to your score.`}];\nlet acc=0; PH.forEach(p=>{p.s=acc; acc+=p.d;}); const TOTAL=acc;\n/* ===== Random events \u2192 decisions (the game part) ===== */\nconst EVENTS=[\n {t:14, kind:'rock', c:'#D7D0C0', title:'Micrometeoroid!', text:'A grain of dust hit a solar wing. It now makes 10% less power.', auto:true, fx:{gen:-10,res:-2}},\n {t:22, kind:'aim', c:'#95B3B6', title:'Pointing glitch', text:'The star tracker got blinded by sunlight. The camera may be pointing slightly off.',\n   choices:[{b:'Reboot tracker',s:'Safe, but you miss one pass.',fx:{sci:-3,res:+6},tags:[[`\u22123 ${UNIT}`,'r'],['+ resilience','g']]},\n            {b:'Keep imaging',s:'More pictures, some may be blurry.',fx:{sci:+2,res:-6},tags:[[`+2 ${UNIT}`,'g'],['\u2212 resilience','r']]}]},\n {t:33, kind:'flare', c:'#F2A541', title:'Solar flare!', text:'A burst of radiation from the Sun arrives in 2 minutes. It can damage electronics.',\n   choices:[{b:'Safe mode',s:'Turn off the camera and wait it out.',fx:{sci:-5,res:+10,power:+8},tags:[[`\u22125 ${UNIT}`,'r'],['+ battery','g'],['+ resilience','g']]},\n            {b:'Ride it out',s:'Keep working and hope for the best.',fx:{sci:+4,res:-12,power:-15},tags:[[`+4 ${UNIT}`,'g'],['\u2212 battery','r'],['risky','r']]}]},\n {t:44, kind:'fire', c:'#E07A44', title:ATEARTH?'Big wildfire found!':'Big discovery!', text:ATEARTH?'Firefighters need to know fast. Sending the alert now costs power.':'Scientists want this data fast. Sending it now costs power.',\n   choices:[{b:ATEARTH?'Send alert now':'Send data now',s:ATEARTH?'Crews get the news in minutes.':'The team gets it within hours.',fx:{sci:+8,power:-12,dec:+8},tags:[[`+8 ${UNIT}`,'g'],['\u2212 battery','r'],['+ decisions','g']]},\n            {b:'Wait for next pass',s:'Saves power, news arrives hours later.',fx:{sci:+2,dec:-4},tags:[[`+2 ${UNIT}`,'g'],['\u2212 decisions','r']]}]}];\nconst S={t:0,speed:1,paused:false,power:100,data:0,fuel:100,gen:100,sci:0,res:10,dec:10,done:false,log:[]};\n/* ===== UI: stepper, gauges ===== */\nconst stepEl=document.getElementById('stepper');\nstepEl.innerHTML=PH.map((p,i)=>`${i?'<span class=\"bar\"><\/span>':''}<div class=\"st\" id=\"st${i}\"><i><\/i><span>${p.n}<\/span><\/div>`).join('');\nconst G=[['power','Battery',v=>v<20?'bad':v<40?'warn':''],['data','Storage',v=>v>95?'bad':v>80?'warn':''],['fuel','Fuel',v=>v<15?'bad':v<30?'warn':'']];\nconst gEl=document.getElementById('gauges'); gEl.innerHTML=G.map(g=>`<div class=\"t-win g\" id=\"g-${g[0]}\"><b>${g[1]}<\/b><em><\/em><div class=\"tr\"><i><\/i><\/div><\/div>`).join('');\nconst phaseAt=t=>{for(let i=PH.length-1;i>=0;i--) if(t>=PH[i].s) return i; return 0;};\nlet shownPhase=-1;\nfunction renderUI(){ const ph=phaseAt(S.t);\n  PH.forEach((p,i)=>{const e=document.getElementById('st'+i); e.className='st'+(S.t>=p.s+p.d||S.done?' done':i===ph?' now':'');});\n  if(ph!==shownPhase){ shownPhase=ph; document.getElementById('capLabel').textContent=`Phase ${ph+1} of ${PH.length}`; document.getElementById('capTitle').textContent=PH[ph].n; document.getElementById('capText').textContent=PH[ph].t; addLog(PH[ph].n+' started'); }\n  for(const g of G){ const v=S[g[0]], st=g[2](v), el=document.getElementById('g-'+g[0]); el.className='t-win g '+st; el.querySelector('em').textContent=Math.round(v)+'%'+(st==='bad'?' !':''); el.querySelector('i').style.width=v+'%'; }\n  document.getElementById('sci').innerHTML= ph>=3?`<svg style=\"width:16px;height:16px;color:#E07A44\"><use href=\"#i-fire\"/><\/svg>${Math.round(S.sci)} ${UNIT} ${MI.verb} so far`:'';\n}\n/* ===== Toast, log, modal ===== */\nconst toastEl=document.getElementById('toast');\nfunction toast(html){ toastEl.innerHTML=html; toastEl.classList.remove('show'); void toastEl.offsetWidth; toastEl.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>toastEl.classList.remove('show'),2600); }\nfunction addLog(t){ S.log.unshift([S.t,t]); document.getElementById('drawer').innerHTML='<span class=\"label\">Event log<\/span>'+S.log.map(l=>`<div><small>T+${l[0].toFixed(0)}<\/small>${l[1]}<\/div>`).join(''); }\ndocument.getElementById('logBtn').onclick=()=>document.getElementById('drawer').classList.toggle('open');\nconst scrim=document.getElementById('scrim'), modal=document.getElementById('modal');\nfunction decide(e){ S.paused=true; scrim.classList.add('open');\n  modal.className='t-win card'; modal.innerHTML=`<span class=\"label\">Decision needed \u00b7 flight paused<\/span><span class=\"ico\" style=\"--c:${e.c}\"><svg><use href=\"#i-${e.kind}\"/><\/svg><\/span><h3>${e.title}<\/h3><p>${e.text}<\/p>\n   <div class=\"choices\">${e.choices.map((c,i)=>`<button class=\"choice\" type=\"button\" data-i=\"${i}\"><b>${c.b}<\/b><span>${c.s}<\/span><div class=\"fx\">${c.tags.map(t=>`<em class=\"${t[1]}\">${t[0]}<\/em>`).join('')}<\/div><\/button>`).join('')}<\/div>`;\n  modal.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{ const c=e.choices[+b.dataset.i]; apply(c.fx); e.picked=c.b; addLog(`${e.title} \u2192 ${c.b}`); scrim.classList.remove('open'); S.paused=false; toast(`<span class=\"label\">Done<\/span>${c.b}`); }); }\nfunction apply(f){ S.sci=Math.max(0,S.sci+(f.sci||0)); S.res+=f.res||0; S.dec+=(f.dec||0)+((f.res||0)>0?2:0); S.power=Math.max(0,Math.min(100,S.power+(f.power||0))); S.gen+=f.gen||0; }\n/* ===== Controls ===== */\nconst playBtn=document.getElementById('play'), spBtn=document.getElementById('speed');\nplayBtn.onclick=()=>{ S.paused=!S.paused; playBtn.innerHTML=`<svg style=\"width:18px;height:18px\"><use href=\"#i-${S.paused?'play':'pause'}\"/><\/svg>`; playBtn.setAttribute('aria-label',S.paused?'Play':'Pause'); };\nspBtn.onclick=()=>{ S.speed=S.speed===1?3:1; spBtn.textContent=S.speed+'\u00d7'; spBtn.classList.toggle('on',S.speed>1); };\n/* ===== Simulation ===== */\nfunction step(dt){ if(S.paused||S.done) return; S.t=Math.min(TOTAL,S.t+dt*S.speed); const ph=phaseAt(S.t), k=dt*S.speed, ops=ph>=3;\n  const night=ops&&Math.sin(S.t*.8)<-.35;\n  if(ph===1) S.fuel=Math.max(0,S.fuel-k*13); else if(ops) S.fuel=Math.max(0,S.fuel-k*.25);\n  if(ph>=2) S.power=Math.max(0,Math.min(100,S.power+(night?-3.2:2.6*S.gen/100)*k-(ops?.6:0)*k));\n  if(ops){ S.data=Math.min(100,S.data+3.2*k); if(Math.sin(S.t*.8+1.4)>.85) S.data=Math.max(0,S.data-30*k); if(!night&&S.power>5) S.sci+=k*.5; }\n  for(const e of EVENTS){ if(!e.f&&S.t>=e.t){ e.f=true; if(e.auto){ apply(e.fx); addLog(e.title+' '+e.text); toast(`<svg style=\"width:20px;height:20px\"><use href=\"#i-${e.kind}\"/><\/svg>${e.title} ${e.text}`); } else decide(e); } }\n  if(S.t>=TOTAL){ S.done=true; setTimeout(report,600); } }\n/* ===== Report: score + WHY (the brief asks for feedback explaining results) ===== */\nfunction report(){\n  const perf=Math.round(Math.min(40,S.sci/30*40)), eff=Math.round(Math.max(0,Math.min(20,S.fuel/100*10+(S.power>30?10:5)))), dec=Math.max(0,Math.min(20,Math.round(S.dec))), res=Math.max(0,Math.min(20,Math.round(S.res)));\n  const total=perf+eff+dec+res, st=total>=80?3:total>=60?2:1;\n  const rows=[\n    ['Performance',perf,40, ATEARTH?`${Math.round(S.sci)} fires spotted. The ${DESIGN.inst} sees heat through smoke, so it finds more fires than a normal camera.`:`${Math.round(S.sci)} ${UNIT} ${MI.verb} at ${PNAME}. A stronger instrument gets more science from every pass.`],\n    ['Efficiency',eff,20, S.fuel<30?'Reaching orbit burned a lot of fuel. A lighter spacecraft would leave more in the tank.':`${Math.round(S.fuel)}% fuel left and the battery stayed healthy. Good sizing.`],\n    ['Decisions',dec,20, EVENTS.filter(e=>e.picked).map(e=>`${e.title.replace('!','')}: ${e.picked}`).join(' \u00b7 ')||'No decisions made.'],\n    ['Resilience',res,20, res>=14?'Careful choices kept the spacecraft safe.':'Risky choices left the spacecraft exposed. Safe mode protects it during flares.']];\n  modal.className='t-win report'; scrim.classList.add('open');\n  modal.innerHTML=`<span class=\"t-ribbon\">Mission report<\/span><h3>${total>=80?'Outstanding mission':total>=60?'Mission success':'Mission complete'}<\/h3>\n   <div class=\"ringwrap\"><svg viewBox=\"0 0 120 120\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"none\" stroke=\"rgba(26,18,6,.12)\" stroke-width=\"14\"/><circle id=\"ring\" cx=\"60\" cy=\"60\" r=\"50\" fill=\"none\" stroke=\"#2C5B65\" stroke-width=\"14\" stroke-linecap=\"round\" stroke-dasharray=\"314\" stroke-dashoffset=\"314\" style=\"transition:stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1)\"/><\/svg><b>${total}<\/b><small>out of 100<\/small><\/div>\n   <div class=\"stars\">${[1,2,3].map(i=>`<svg style=\"--sf:${i<=st?'#F2A541':'#E4DED2'}\"><use href=\"#i-star\"/><\/svg>`).join('')}<\/div>\n   <div class=\"why\">${rows.map(r=>`<div class=\"r\"><b>${r[0]}<\/b><em>${r[1]}/${r[2]}<\/em><div class=\"tr\"><i data-w=\"${r[1]/r[2]*100}\"><\/i><\/div><p>${r[3]}<\/p><\/div>`).join('')}<\/div>\n   <div class=\"row\"><button class=\"t-btn ghost\" type=\"button\" onclick=\"location.reload()\">Fly again<\/button><button class=\"t-btn primary\" type=\"button\">Redesign spacecraft<\/button><\/div>`;\n  requestAnimationFrame(()=>{ document.getElementById('ring').style.strokeDashoffset=314-314*total/100; modal.querySelectorAll('.tr i').forEach(i=>i.style.width=i.dataset.w+'%'); });\n}\n/* ===== Trajectory view (canvas): launch arc \u2192 orbit insertion burn \u2192 science orbits ===== */\nconst cv=document.getElementById('cv'); let C;\nfunction init(){ const w=innerWidth,h=innerHeight,d=Math.min(devicePixelRatio||1,1.5); cv.width=w*d; cv.height=h*d; const x=cv.getContext('2d'); x.setTransform(d,0,0,d,0,0);\n  const R=Math.min(w,h)*(w<820?.26:.24), cx=w*.5, cy=h*(w<820?.47:.55);\n  // grainy banded Earth (Comet style)\n  const e=document.createElement('canvas'); e.width=e.height=R*2; const g=e.getContext('2d'); g.save(); g.beginPath(); g.arc(R,R,R,0,7); g.clip(); g.fillStyle='#0B1F24'; g.fillRect(0,0,R*2,R*2); g.translate(R,R); g.rotate(-.5);\n  const PC=MKEY==='moon'?['#9C968C','#5E5A54','#F3EEE4','#2A2D33']:(typeof HZ_PL!=='undefined'&&HZ_PL[MI.planet]&&!ATEARTH?HZ_PL[MI.planet].cols:null);\n  const bands=PC?[PC[3],PC[0],PC[2],PC[0],PC[1],PC[2],PC[3]]:['#0B1F24','#2C5B65','#95B3B6','#2C5B65','#1C3E46','#95B3B6','#0B1F24'];\n  for(let i=0;i<bands.length;i++){ g.fillStyle=bands[i]; g.beginPath(); const y0=-R+i*(2*R/bands.length); g.moveTo(-R*1.3,y0); for(let xx=-R*1.3;xx<=R*1.3;xx+=6) g.lineTo(xx,y0+Math.sin(xx/R*3+i)*R*.08); g.lineTo(R*1.3,R*1.3); g.lineTo(-R*1.3,R*1.3); g.fill(); }\n  g.restore(); const id=g.getImageData(0,0,e.width,e.height); for(let i=0;i<id.data.length;i+=4) if(id.data[i+3]){ const n=(Math.random()-.5)*26; id.data[i]+=n; id.data[i+1]+=n; id.data[i+2]+=n; } g.putImageData(id,0,0);\n  let s=9; const Rr=()=>(s=(s*16807)%2147483647)/2147483647; const stars=[]; for(let k=0;k<380;k++){const px=w*(1-Math.pow(Rr(),1.4)*.55),py=h*Math.pow(Rr(),1.5)*.7,dx=(w-px)/(w*.55),dy=py/(h*.7); if(dx*dx+dy*dy>.75) continue; stars.push([px,py,Rr()<.06?1.8:Rr()*.9+.3,Rr()*6]);}\n  const fires=Array.from({length:30},()=>{const a=Rr()*6.28, r=Math.sqrt(Rr())*R*.85; return [Math.cos(a)*r,Math.sin(a)*r*.9];});\n  C={x,w,h,R,cx,cy,earth:e,stars,fires,trail:[]}; }\naddEventListener('resize',init); init();\n// Orbit geometry: a tilted circle seen from above-front. angle a \u2192 screen point; z>0 = near side (in front of Earth).\nfunction orbitPt(a){ const {R,cx,cy}=C, rx=R*1.7, ry=R*.62; return [cx+Math.cos(a)*rx, cy+Math.sin(a)*ry, Math.sin(a)]; }\nfunction shipPos(){ const {R,cx,cy}=C, t=S.t;\n  if(t<PH[1].s){ const k=t/PH[1].s, e=k*k*(3-2*k); const sx=cx+R*.12, sy=cy-R*.99; const [ox,oy]=orbitPt(-Math.PI*.5-.9);\n    const mx=cx+R*.2, my=cy-R*1.9; const u=1-e; return [u*u*sx+2*u*e*mx+e*e*ox, u*u*sy+2*u*e*my+e*e*oy, -1, 'rocket']; }\n  const a=-Math.PI*.5-.9+(t-PH[1].s)*.9; const [px,py,z]=orbitPt(a); return [px,py,z, t<PH[2].s?'burn':'sat']; }\nfunction orbitHalf(front){ const x=C.x; x.save(); x.strokeStyle=front?'rgba(26,18,6,.38)':'rgba(26,18,6,.22)'; x.setLineDash([6,7]); x.lineWidth=1.8; x.beginPath();\n  for(let i=0;i<=64;i++){ const a=front?i/64*Math.PI:Math.PI+i/64*Math.PI; const [px,py]=orbitPt(a); i?x.lineTo(px,py):x.moveTo(px,py); } x.stroke(); x.restore(); }\nfunction trailPart(front){ const x=C.x, T=C.trail; x.strokeStyle='rgba(194,100,58,.6)'; x.lineWidth=2.5; x.lineCap='round';\n  for(let i=1;i<T.length;i++){ const p=T[i-1], q=T[i]; if((q[2]>=0)!==front) continue; x.globalAlpha=i/T.length; x.beginPath(); x.moveTo(p[0],p[1]); x.lineTo(q[0],q[1]); x.stroke(); } x.globalAlpha=1; }\nlet lastMode='';\nfunction draw(now){ const {x,w,h,R,cx,cy,earth,stars,fires}=C; x.clearRect(0,0,w,h);\n  for(const s of stars){ x.globalAlpha=reduce?.85:.4+.6*Math.abs(Math.sin(now/1300+s[3])); x.fillStyle='#fff'; x.beginPath(); x.arc(s[0],s[1],s[2],0,7); x.fill(); } x.globalAlpha=1;\n  const ph=phaseAt(S.t); const [px,py,z,mode]=shipPos();\n  if(mode!==lastMode&&lastMode==='rocket') C.trail=[]; lastMode=mode;            // no kink between launch arc and orbit\n  C.trail.push([px,py,mode==='rocket'?-1:z]); if(C.trail.length>(mode==='rocket'?140:36)) C.trail.shift();\n  const ship=()=>{ if(mode==='rocket'){ const T=C.trail, q=T[Math.max(0,T.length-4)]; const ang=Math.atan2(py-q[1],px-q[0]);\n      x.save(); x.translate(px,py); x.rotate(ang); x.fillStyle='#F2A541'; x.beginPath(); x.moveTo(-10,0); x.lineTo(-24-Math.random()*8,-4); x.lineTo(-24-Math.random()*8,4); x.fill();\n      x.fillStyle='#FBFAF4'; x.strokeStyle='#1A1206'; x.lineWidth=2.5; x.beginPath(); x.moveTo(14,0); x.lineTo(4,-5); x.lineTo(-10,-5); x.lineTo(-10,5); x.lineTo(4,5); x.closePath(); x.fill(); x.stroke(); x.restore(); return; }\n    const sc=.8+.25*z; x.save(); x.translate(px,py); x.scale(sc,sc);\n    if(mode==='burn'){ x.fillStyle='#F2A541'; x.beginPath(); x.arc(-14,2,5+Math.random()*3,0,7); x.fill(); }\n    if(window.CRAFT_IMG&&CRAFT_IMG.naturalWidth){ x.drawImage(CRAFT_IMG,-26,-26,52,52); x.restore(); return; }\n    x.fillStyle='#2C5B65'; x.strokeStyle='#1A1206'; x.lineWidth=2; x.fillRect(-20,-3,12,6); x.strokeRect(-20,-3,12,6); x.fillRect(8,-3,12,6); x.strokeRect(8,-3,12,6);\n    x.fillStyle='#FBFAF4'; x.lineWidth=2.5; x.beginPath(); x.rect(-7,-7,14,14); x.fill(); x.stroke(); x.restore(); };\n  // far side: orbit + trail + ship behind Earth\n  orbitHalf(false); trailPart(false); if(z<0) ship();\n  x.save(); x.shadowColor='rgba(26,18,6,.25)'; x.shadowBlur=40; x.shadowOffsetY=20; x.drawImage(earth,cx-R,cy-R); x.restore();\n  const sh=x.createLinearGradient(cx-R,cy,cx+R,cy); sh.addColorStop(.45,'rgba(8,7,15,0)'); sh.addColorStop(1,'rgba(8,7,15,.55)'); x.fillStyle=sh; x.beginPath(); x.arc(cx,cy,R,0,7); x.fill();\n  const n=Math.min(fires.length,Math.round(S.sci)); for(let i=0;i<n;i++){ const [fx,fy]=fires[i]; x.fillStyle='#F2A541'; x.strokeStyle='#1A1206'; x.lineWidth=1.8; x.beginPath(); x.arc(cx+fx,cy+fy,4.5,0,7); x.fill(); x.stroke(); }\n  if(ph===0){ x.fillStyle='#C2643A'; x.strokeStyle='#1A1206'; x.lineWidth=2; x.beginPath(); x.arc(cx+R*.12,cy-R*.99,6,0,7); x.fill(); x.stroke(); }\n  // near side\n  orbitHalf(true); trailPart(true); if(z>=0) ship();\n  if(mode==='rocket') trailPart(false);\n}\n/* ===== Loop ===== */\nlet last=performance.now(), running=true;\ndocument.addEventListener('visibilitychange',()=>{running=!document.hidden; last=performance.now(); if(running) requestAnimationFrame(loop);});\nfunction loop(now){ if(!running) return; const dt=Math.min((now-last)/1000,.1); last=now; step(dt); renderUI(); draw(now); requestAnimationFrame(loop); }\nrequestAnimationFrame(loop);\n<\/script>\n\n<script>\n/* ===== Tutorial coach (shared by every screen) =====\n   COACH.run(name, steps): shows one step at a time in a Tactile card, points an arrow at the thing to use,\n   and waits until the player has done it (step.until) or presses Next (step.next).\n   step = {say, why?, target?: ()=>({x,y})|Element|null, until?: ()=>bool, next?: 'Next', enter?: fn, leave?: fn}\n   Skipping turns the tutorial off for the whole game (the shell keeps HZ.tutorial).\n   The two lead engineers coach the player: Mevin on the ground (mission choice, base, workshops), Pawan in flight (launch, mission control).\n   step.who ('mevin'|'pawan') overrides the speaker for one step. */\n(function(){\n  const css=`.coach{position:fixed;z-index:60;left:max(12px,env(safe-area-inset-left,0px));top:calc(78px + env(safe-area-inset-top,0px));width:min(350px,calc(100% - 24px));\n    background:#1A1206;color:#FBFAF4;border:3px solid #1A1206;border-radius:16px;box-shadow:0 5px 0 rgba(26,18,6,.35);padding:12px 14px 12px;font:600 14px/1.4 Geist,system-ui,sans-serif;display:none;animation:cpop .35s cubic-bezier(.34,1.56,.64,1) both}\n  .coach.s{display:block}\n  .coach .k{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;font:400 10px 'Silkscreen',monospace;letter-spacing:.08em;color:#F2A541}\n  .coach .who{display:flex;align-items:center;gap:10px;margin:2px 0 8px}\n  .coach .who svg{width:46px;height:46px;flex:none;border-radius:50%;border:3px solid #FBFAF4;background:#F3EEE4;box-shadow:0 3px 0 rgba(251,250,244,.25)}\n  .coach .who b{display:block;font:400 17px/1 'Game Paused','Silkscreen',monospace;color:#FBFAF4;letter-spacing:.02em}\n  .coach .who span{display:block;margin-top:3px;font:400 9px 'Silkscreen',monospace;letter-spacing:.08em;color:#F2A541}\n  .coach .k button{background:none;border:0;color:#B9B0A0;font:600 12px Geist,system-ui,sans-serif;cursor:pointer;padding:2px 4px}\n  .coach .why{display:block;margin-top:6px;font-weight:500;font-size:12.5px;color:#D7D0C0}\n  .coach .nx{margin-top:10px;display:flex;justify-content:flex-end}\n  .coach .nx button{border:3px solid #FBFAF4;border-radius:12px;background:#F2A541;color:#1A1206;font:400 15px 'Game Paused','Silkscreen',monospace;padding:5px 14px 7px;cursor:pointer;box-shadow:0 3px 0 #FBFAF4}\n  .coach .bar{height:5px;border-radius:3px;background:rgba(251,250,244,.18);margin-top:10px;overflow:hidden}.coach .bar i{display:block;height:100%;background:#F2A541;transition:width .4s}\n  .coach-arrow{position:fixed;z-index:59;width:44px;height:52px;pointer-events:none;display:none;transform:translate(-50%,-100%);filter:drop-shadow(0 3px 0 #1A1206)}\n  .coach-arrow.s{display:block;animation:cbob .8s ease-in-out infinite alternate}\n  @keyframes cbob{to{margin-top:-10px}} @keyframes cpop{0%{transform:scale(.88) translateY(10px);opacity:0}}\n  @media (max-width:760px){.coach{top:auto;bottom:calc(96px + env(safe-area-inset-bottom,0px));font-size:13px}}\n  @media (prefers-reduced-motion:reduce){.coach,.coach-arrow.s{animation:none}}`;\n  // Lead engineers, drawn in the game's flat, thick-outlined style.\n  const FACE=(skin,hairC,top,extra,jacket)=>`<svg viewBox=\"10 8 44 44\" aria-hidden=\"true\"><defs><clipPath id=\"cl\"><circle cx=\"32\" cy=\"32\" r=\"32\"/><\/clipPath><\/defs><g clip-path=\"url(#cl)\" stroke=\"#1A1206\" stroke-width=\"2\" stroke-linejoin=\"round\">\n    <path d=\"M6 66C8 50 19 45 32 45s24 5 26 21z\" fill=\"${jacket}\"/><path d=\"M25 45l7 9 7-9\" fill=\"#FBFAF4\"/><circle cx=\"45\" cy=\"55\" r=\"3\" fill=\"#F2A541\"/>\n    <rect x=\"27\" y=\"37\" width=\"10\" height=\"9\" rx=\"2\" fill=\"${skin}\"/><circle cx=\"20.5\" cy=\"29\" r=\"3\" fill=\"${skin}\"/><circle cx=\"43.5\" cy=\"29\" r=\"3\" fill=\"${skin}\"/>\n    <ellipse cx=\"32\" cy=\"28\" rx=\"11.5\" ry=\"13\" fill=\"${skin}\"/>${top.replace(/HAIR/g,hairC)}\n    <circle cx=\"27.5\" cy=\"29\" r=\"1.5\" fill=\"#1A1206\" stroke=\"none\"/><circle cx=\"36.5\" cy=\"29\" r=\"1.5\" fill=\"#1A1206\" stroke=\"none\"/><path d=\"M28 35q4 3.2 8 0\" fill=\"none\" stroke-width=\"1.8\" stroke-linecap=\"round\"/>${extra}<\/g><\/svg>`;\n  const LEADS={\n    mevin:{name:'Mevin',role:'Lead mission engineer',pitch:1.05,\n      svg:FACE('#B47A4E','#22160F','<path d=\"M20 27c-1-11 6-15 13-15 8 0 12 5 11 15-2-6-7-9-13-8-5 1-9 4-11 8z\" fill=\"HAIR\"/><path d=\"M30 13c-4 3-6 7-6 11\" fill=\"none\" stroke-width=\"1.5\"/>',\n        '<path d=\"M18.5 29c0-17 27-17 27 0\" fill=\"none\" stroke-width=\"3\"/><rect x=\"16\" y=\"25\" width=\"5\" height=\"9\" rx=\"2\" fill=\"#2C5B65\"/><rect x=\"43\" y=\"25\" width=\"5\" height=\"9\" rx=\"2\" fill=\"#2C5B65\"/><path d=\"M18.5 33q1 6 7 6\" fill=\"none\" stroke-width=\"2\"/><circle cx=\"26\" cy=\"39\" r=\"1.6\" fill=\"#1A1206\"/>','#F2A541')},\n    pawan:{name:'Pawan',role:'Lead flight engineer',pitch:.88,\n      svg:FACE('#9C6440','#15100C','<path d=\"M20.5 26c-1-10 5-14 11.5-14S45 16 43.5 26c-1.5-5-6-8-11.5-8s-10 3-11.5 8z\" fill=\"HAIR\"/><path d=\"M21.5 31c1 10 6 12 10.5 12s9.5-2 10.5-12c-2 5-6 7-10.5 7s-8.5-2-10.5-7z\" fill=\"HAIR\"/>',\n        '<circle cx=\"27.5\" cy=\"29\" r=\"4\" fill=\"none\" stroke-width=\"1.8\"/><circle cx=\"36.5\" cy=\"29\" r=\"4\" fill=\"none\" stroke-width=\"1.8\"/><path d=\"M31.5 29h1\" stroke-width=\"1.8\"/>','#2C5B65')}};\n  const SPEAKER={'Mission':'mevin','Base':'mevin','Launch':'pawan','Mission control':'pawan'};\n  const INTRO={'Mission':'Hi, I\\'m Mevin, one of your two lead engineers. ','Launch':'Pawan here, lead flight engineer. I\\'ll be with you from the pad to orbit. '};\n  window.HZ_LEADS=LEADS;\n  let el=null, ar=null, cur=null, idx=0, list=[], name='', timer=0, on=false;\n  function mount(){ if(el) return; const st=document.createElement('style'); st.textContent=css; document.head.appendChild(st);\n    el=document.createElement('div'); el.className='coach'; el.setAttribute('role','status'); el.setAttribute('aria-live','polite'); document.body.appendChild(el);\n    ar=document.createElement('div'); ar.className='coach-arrow'; ar.innerHTML='<svg viewBox=\"0 0 44 52\"><path d=\"M14 2h16v24h12L22 50 2 26h12z\" fill=\"#F2A541\" stroke=\"#1A1206\" stroke-width=\"3\" stroke-linejoin=\"round\"/><\/svg>'; document.body.appendChild(ar); }\n  function speak(t){ try{ const S=(window.HZ&&HZ.settings)||{}; if(S.sfx===false||!window.speechSynthesis) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=1.05; u.pitch=(LEADS[who()]||{}).pitch||1; speechSynthesis.speak(u); }catch(e){} }\n  let lastDyn='';\n  const who=()=>(cur&&cur.who)||SPEAKER[name]||'mevin';\n  function show(){ cur=list[idx]; if(!cur){ stop(false); return; } if(cur.enter) try{ cur.enter(); }catch(e){} lastDyn='';\n    if(typeof cur.dyn==='function'){ const d=cur.dyn()||['','']; cur.say=d[0]; cur.why=d[1]; lastDyn=d[0]; }\n    if(idx===0&&INTRO[name]&&!cur._intro){ cur._intro=1; cur.say=INTRO[name]+cur.say; } const L=LEADS[who()];\n    el.innerHTML=`<div class=\"k\"><span>Tutorial \u00b7 ${name} ${idx+1}/${list.length}<\/span><button ty },\n      select: {bpm:80, ch:[[48,55,64,71],[45,52,60,67],[41,48,57,64],[43,50,59,62]], pad:.045, arp:[0,null,7,null,4,null,12,null,0,null,7,null,9,null,4,null], arpV:.03, bass:[0,null,null,null,null,null,null,null,0,null,null,null,null,null,null,null], bassV:.05},\n      build:  {bpm:100,ch:[[41,48,57,64],[43,50,59,62],[45,52,60,67],[43,50,55,62]], pad:.035, arp:[0,7,12,7,4,7,12,16,0,7,12,7,9,7,12,16], arpV:.026, bass:[0,null,null,0,null,null,7,null,0,null,null,0,null,null,5,null], bassV:.06, hat:[0,0,1,0,0,0,1,0,0,0,1,0,0,0,1,1]},\n      pad:    {bpm:76, ch:[[38,45,50,57],[38,45,50,58],[36,43,50,57],[38,45,50,55]], pad:.05, drone:38, arp:[0,null,null,null,null,null,null,null,7,null,null,null,null,null,null,null], arpV:.025},\n      count:  {bpm:120,ch:[[38,45,50,57],[38,45,51,57]], pad:.035, drone:38, tick:[1,0,0,0,1,0,0,0,1,0,0,0,1,0,0,0], bass:[0,null,null,null,0,null,null,null,0,null,null,null,0,null,null,null], bassV:.06, rise:true},\n      ascent: {bpm:132,ch:[[38,45,50,57],[34,41,46,53],[36,43,48,55],[41,48,53,60]], pad:.04, saw:true, bass:[0,0,12,0,0,0,12,0,0,0,12,0,0,7,12,0], bassV:.065, kick:[1,0,0,0,1,0,0,0,1,0,0,0,1,0,1,0], hat:[0,0,1,0,0,0,1,0,0,0,1,0,0,0,1,0], arp:[0,7,12,7,0,7,12,7,0,7,12,7,0,7,12,14], arpV:.02},\n      orbit:  {bpm:70, ch:[[40,47,56,63],[45,52,59,64],[42,49,56,61],[44,51,56,63]], pad:.055, arp:[12,null,null,7,null,null,4,null,null,null,11,null,null,7,null,null], arpV:.026, bell:true},\n      cruise: {bpm:60, ch:[[36,43,52,59],[34,41,50,57]], pad:.05, drone:24, bell:true, arp:[12,null,null,null,null,null,null,null,null,null,null,null,7,null,null,null], arpV:.022},\n      arrive: {bpm:92, ch:[[46,53,62,69],[43,50,58,65],[39,46,55,62],[41,48,57,65]], pad:.05, arp:[0,4,7,12,7,4,0,4,7,12,16,12,7,4,7,12], arpV:.024, bass:[0,null,null,null,0,null,null,null,0,null,null,null,0,null,7,null], bassV:.055},\n      control:{bpm:96, ch:[[45,52,57,64],[41,48,57,60],[43,50,55,62],[40,47,55,59]], pad:.035, arp:[0,null,12,null,7,null,12,null,0,null,12,null,7,null,14,null], arpV:.02, bass:[0,null,null,null,null,null,null,null,0,null,null,null,null,null,7,null], bassV:.05, hat:[0,0,1,0,0,0,1,0,0,0,1,0,0,0,1,0]},\n      win:    {bpm:84, ch:[[48,55,64,72],[53,60,69,72],[45,52,60,67],[43,50,59,67]], pad:.05, arp:[0,4,7,12,null,null,7,null,0,4,7,12,null,null,16,null], arpV:.026, bell:true},\n      lose:   {bpm:58, ch:[[45,52,57,60],[41,48,53,57],[38,45,50,53],[40,47,52,56]], pad:.045, drone:33},\n    };\n    function enabled(){ try{ const s=JSON.parse(localStorage.getItem('hz-settings')||'{}')||{}; return s.music!==false; }catch(e){ return true; } }\n    function init(){ if(ac) return; try{ ac=new (W.AudioContext||W.webkitAudioContext)(); }catch(e){ return; }\n      const comp=ac.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=3; out=ac.createGain(); out.gain.value=0; out.connect(comp); comp.connect(ac.destination);\n      const n=ac.createBuffer(1,ac.sampleRate,ac.sampleRate), d=n.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; W.__hzNoise=n;\n      next=ac.currentTime+.1; timer=setInterval(sched,60); }\n    function busFor(ph){ if(!bus[ph]){ const g=ac.createGain(); g.gain.value=0; const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=ph==='count'?600:2600; g.connect(f); f.connect(out); bus[ph]={g,f}; } return bus[ph]; }\n    function voice(dest,type,fq,t,dur,vol,a,r,cut){ const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.value=fq; o.detune.value=(Math.random()-.5)*8;\n      let node=o; if(cut){ const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut; o.connect(f); node=f; } node.connect(g); g.connect(dest);\n      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+a); g.gain.setValueAtTime(vol,t+Math.max(a,dur-r)); g.gain.linearRampToValueAtTime(0,t+dur); o.start(t); o.stop(t+dur+.05); }\n    function noise(dest,t,dur,vol,hp){ const s=ac.createBufferSource(); s.buffer=W.__hzNoise; const f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; const g=ac.createGain();\n      g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(f); f.connect(g); g.connect(dest); s.start(t); s.stop(t+dur+.02); }\n    function kick(dest,t){ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(42,t+.18); g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.0001,t+.3); o.connect(g); g.connect(dest); o.start(t); o.stop(t+.32); }\n    function sched(){ if(!ac||!cur) return; const p=P[cur], spb=60/p.bpm/4, B=busFor(cur).g;\n      while(next<ac.currentTime+.25){ const t=next, s=step%16, bar=Math.floor(step/16), ch=p.ch[bar%p.ch.length];\n        if(s===0){ const len=spb*16; for(const m of ch) voice(B,p.saw?'sawtooth':'triangle',mtof(m),t,len+.4,p.pad/(p.saw?1.6:1),len*.3,len*.35,p.saw?900:1600);\n          if(p.drone) voice(B,'sine',mtof(p.drone),t,len+.4,.06,len*.4,len*.4);\n          if(p.bell&&bar%2===0) voice(B,'sine',mtof(ch[3]+24),t+spb*8,2.6,.022,.01,2.4); }\n        if(p.arp&&p.arp[s]!=null) voice(B,'triangle',mtof(ch[0]+24+p.arp[s]),t,spb*2.2,p.arpV,.01,spb*1.8,3200);\n        if(p.bass&&p.bass[s]!=null) voice(B,'sine',mtof(ch[0]-12+p.bass[s]),t,spb*1.8,p.bassV,.01,spb,600);\n        if(p.hat&&p.hat[s]) noise(B,t,.05,.035,7000);\n        if(p.kick&&p.kick[s]) kick(B,t);\n        if(p.tick&&p.tick[s]){ voice(B,'sine',s===0?1320:880,t,.08,.05,.003,.06); }\n        next+=spb; step++; } }\n    function fadeTo(ph){ if(!ac||ph===cur) return; const t=ac.currentTime;\n      if(cur&&bus[cur]){ const g=bus[cur].g.gain; g.cancelScheduledValues(t); g.setValueAtTime(g.value,t); g.linearRampToValueAtTime(0,t+1.8); }\n      cur=ph; const b=busFor(ph); b.g.gain.cancelScheduledValues(t); b.g.gain.setValueAtTime(b.g.gain.value,t); b.g.gain.linearRampToValueAtTime(1,t+2.2);\n      if(P[ph].rise){ b.f.frequency.cancelScheduledValues(t); b.f.frequency.setValueAtTime(500,t); b.f.frequency.linearRampToValueAtTime(3200,t+6); }\n      step=Math.ceil(step/16)*16; }\n    function apply(){ if(!ac) return; const t=ac.currentTime, v=on&&!document.hidden?.9:0; out.gain.cancelScheduledValues(t); out.gain.setValueAtTime(out.gain.value,t); out.gain.linearRampToValueAtTime(v,t+.8); }\n    function sting(kind){ if(!ac||!on) return; const t=ac.currentTime+.05, d=ac.createGain(); d.gain.value=1; d.connect(out);\n      const notes=kind==='win'?[60,64,67,72,76,79,84]:[57,56,53,50,45];\n      notes.forEach((m,i)=>voice(d,'triangle',mtof(m),t+i*(kind==='win'?.09:.22),kind==='win'?1.4:1.1,.06,.01,.9,3000));\n      fadeTo(kind==='win'?'win':'lose'); }\n    setInterval(()=>{ const e=enabled(); if(e!==on){ on=e; apply(); } },800);\n    document.addEventListener('visibilitychange',apply);\n    W.HZ_MUSIC={\n      unlock(){ on=enabled(); if(!on&&!ac) return; init(); if(!ac) return; if(ac.state!=='running') ac.resume(); if(want) fadeTo(want); apply(); },\n      phase(ph){ if(!P[ph]) return; want=ph; if(ac&&ac.state==='running') fadeTo(ph); },\n      sting, get current(){ return cur; }, get running(){ return !!ac&&ac.state==='running'; } };\n  }\n})();\n<\/script>\n<script>\nif(window.HZ&&HZ.craftImg){ window.CRAFT_IMG=new Image(); CRAFT_IMG.src=HZ.craftImg; }\ndocument.querySelector('.tl .t-round').addEventListener('click',()=>hzGo('base',{mission:HZ.mission,pick:HZ.pick}));\ndocument.addEventListener('click',e=>{ const b=e.target.closest('.report .t-btn.primary'); if(b) hzGo('base',{mission:HZ.mission,pick:HZ.pick}); });\n<\/script><script>\n/* Hand-off from the launch screen: the player already flew the launch and reached orbit, so mission control starts at check-out. */\nif(window.HZ&&HZ.flight){ const F=HZ.flight;\n  PH[0].t=`You flew ${F.rocket} off the pad in ${F.time} s.`; PH[1].t=`Orbit reached: ${F.peri} x ${F.ap==null?'escape':F.ap} km. Flight score ${F.score}.`;\n  S.t=PH[2].s; S.fuel=Math.round(45+55*F.f2); S.dec+=Math.min(8,F.hits*2)-F.late*2; if(F.dmg) S.res-=6;\n  addLog(`Launch flown by you: orbit ${F.peri} x ${F.ap==null?'escape':F.ap} km, score ${F.score}`); renderUI(); }\n<\/script>\n<script>\n/* ===== Mission control runs the spacecraft you built =====\n   Power: solar output falls with distance from the Sun (1/d^2); an RTG does not. Batteries carry the craft through\n   eclipses; an empty battery means safe mode (instruments off). Data: instruments fill storage; the dish empties it\n   during ground-station passes (slower far from Earth); anything over capacity is lost. Science = goals your\n   instruments can meet x the share of data that made it home. */\nconst CR=window.HZ&&HZ.design&&HZ.design.craft;\nif(CR){\n  const AU=MKEY==='moon'||MKEY==='earth'?1:(HZ_PL[MI.planet]?HZ_PL[MI.planet].a:1), FLYBY=MI.kind==='flyby';\n  const sunK=hzSunK(MKEY), comK=1/Math.max(1,AU*AU*.6);\n  const instData=CR.insts.reduce((a,id)=>a+(HZ_INST.find(i=>i.id===id)||{data:0}).data,0);\n  const goals=hzGoalsMet(MKEY,CR.insts), gMet=goals.filter(g=>g.ok).length;\n  const M={E:CR.wh,lowN:0,lowT:0,safe:false,fullN:0,full:false,lost:0,prod:0,home:0,stored:0,deficit:0,pass:false,sunGen:CR.rtg?CR.gen:CR.gen*sunK};\n  S.gen=Math.round(Math.min(100,M.sunGen/Math.max(1,CR.draw)*100));\n  const H=.4;                                    // hours of spacecraft time per second of mission control time\n  step=function(dt){ if(S.paused||S.done) return; S.t=Math.min(TOTAL,S.t+dt*S.speed); const ph=phaseAt(S.t), k=dt*S.speed, ops=ph>=3;\n    const ORB=CR.orbit||{ecl:.35,sci:1}, nightTh=Math.sin(Math.PI*(ORB.ecl-.5)); const night=!FLYBY&&ops&&ORB.ecl>.01&&Math.sin(S.t*.8)<nightTh;\n    if(ph===1) S.fuel=Math.max(0,S.fuel-k*13); else if(ops&&pick_engine!=='e3') S.fuel=Math.max(0,S.fuel-k*.25);\n    if(ph>=2){ const gen=CR.rtg?CR.gen:(night?0:M.sunGen);\n      const load=(ops&&!M.safe?CR.draw:CR.draw*.35); const net=gen-load; M.E=Math.max(0,Math.min(CR.wh,M.E+net*k*H)); if(net<0&&!night) M.deficit+=k;\n      if(M.E<=0&&!M.safe){ M.safe=true; M.lowN++; addLog('Battery empty: safe mode, instruments off'); toast(`<svg style=\"width:20px;height:20px\"><use href=\"#i-flare\"/><\/svg>Battery empty! Safe mode: the instruments switch off until there is power again.`); }\n      if(M.safe){ M.lowT+=k; if(M.E>CR.wh*.35) { M.safe=false; addLog('Power back: instruments on'); } }\n      S.power=CR.wh?M.E/CR.wh*100:0; }\n    if(ops){ const on=!M.safe&&!(night&&!CR.rtg&&M.E<CR.wh*.1), g=on?instData*.08*k:0; M.prod+=instData*.08*k;\n      const room=CR.store-M.stored, keep=Math.min(g,room); M.stored+=keep; M.lost+=g-keep; if(g-keep>0&&!M.full){ M.full=true; M.fullN++; addLog('Storage full: new data is lost until the next ground pass'); toast(`<svg style=\"width:20px;height:20px\"><use href=\"#i-data\"/><\/svg>Storage full! New data is lost until the next ground pass.`); }\n      const pass=Math.sin(S.t*.55+1)>.55; if(pass&&!M.pass) addLog('Ground station pass: sending data home'); M.pass=pass;\n      if(pass){ const d=Math.min(M.stored,CR.down*comK*.35*k); M.stored-=d; M.home+=d; if(M.stored<CR.store*.9) M.full=false; }\n      S.data=CR.store?M.stored/CR.store*100:100; S.sci=M.home*(gMet/3)*(ORB.sci||1)/4+M.bonus; }\n    for(const e of EVENTS){ if(!e.f&&S.t>=e.t){ e.f=true; if(e.auto){ apply(e.fx); addLog(e.title+' '+e.text); toast(`<svg style=\"width:20px;height:20px\"><use href=\"#i-${e.kind}\"/><\/svg>${e.title} ${e.text}`); } else decide(e); } }\n    if(S.t>=TOTAL){ S.done=true; setTimeout(report,600); } };\n  M.bonus=0; const _apply=apply; apply=function(f){ const before=S.sci; _apply(Object.assign({},f,{power:0})); M.bonus+=(S.sci-before); if(f.power) M.E=Math.max(0,Math.min(CR.wh,M.E+CR.wh*f.power/100)); if(f.gen) M.sunGen*=1+f.gen/100; };\n  var pick_engine=(HZ.pick&&HZ.pick.engine)||'e1';\n  report=function(){ const ORB=CR.orbit||{sci:1,name:'orbit'}, eff=M.prod?M.home/M.prod:0, gFrac=gMet/3*Math.min(1.15,ORB.sci||1);\n    const perf=Math.round(Math.max(0,Math.min(40,40*gFrac*Math.min(1,eff*1.2)+(gMet?Math.max(-4,Math.min(4,M.bonus*.15)):0))));\n    const TR=(HZ.flight&&HZ.flight.transfer)||null, bud=CR.budget?Math.max(0,Math.min(1,(CR.budget-CR.cost)/(CR.budget*.35))):.5, dvm=TR?Math.max(0,Math.min(1,TR.dvLeft/1.5)):Math.max(0,Math.min(1,S.fuel/60));\n    const pMargin=M.lowN?0:M.deficit>2?3:6, effS=Math.round(Math.max(0,Math.min(20,8*bud+6*dvm+pMargin)));\n    const dec=Math.max(0,Math.min(20,Math.round(S.dec+4))), res=Math.max(0,Math.min(20,Math.round(Math.min(20,S.res+4)-M.lowN*5-M.fullN*2)));\n    const raw=perf+effS+dec+res, DF=hzDiff(), total=Math.min(100,Math.round(raw*DF.score)), st=total>=80?3:total>=60?2:1, pct=Math.round(eff*100);\n    const flight={mission:MKEY,score:total,sandbox:hzSandbox(),diff:DF.name,date:Date.now(),rocket:HZ.design.rocket,orbit:(CR.orbit&&CR.orbit.name)||'',power:CR.power,batt:CR.batt,comms:CR.comms,store:CR.storeName,insts:CR.insts.slice(),mass:CR.mass,cost:CR.cost};\n    const prev=HZ_FLIGHTS.of(MKEY).slice(-1)[0]; HZ_FLIGHTS.save(flight); const board=HZ_FLIGHTS.best(MKEY).slice(0,5), rank=flight.sandbox?0:board.indexOf(board.find(f=>f.date===flight.date))+1;\n    const why=[]; if(gMet<3) why.push(goals.filter(g=>!g.ok).map(g=>`\"${g.t}\" needed ${g.need.map(n=>HZ_INST.find(i=>i.id===n).name).join(' or ')}`).join('; ')+'.');\n    if(M.fullN) why.push(`Storage filled up and ${Math.round(M.lost)} Gb of data was lost. More storage or a faster dish would save it.`);\n    else if(pct<70) why.push(`Only ${pct}% of the data reached Earth: the ${CR.comms} could not send it fast enough${AU>1.6?' from this far away':''}.`);\n    if(M.lowN) why.push(`The battery ran flat ${M.lowN} time${M.lowN>1?'s':''} and the instruments sat in safe mode. ${CR.rtg?'':AU>3?`At ${PNAME} sunlight is ${Math.round(sunK*100)}% of Earth's: an RTG or bigger wings would help.`:'A bigger battery or bigger wings would help.'}`);\n    if(!CR.insts.length) why.push('No instruments were mounted, so there was no science.');\n    const rows=[['Performance',perf,40,`Goals your instruments could meet: ${gMet} of 3. Data that made it home: ${pct}%. Orbit: ${ORB.name} (science x${ORB.sci||1}). ${why[0]||'Every goal was covered and the data got home. Great design.'}`],\n      ['Efficiency',effS,20,`${CR.budget?`Spent $${CR.cost}M of $${CR.budget}M. `:''}${TR?`Delta-v left on arrival: ${TR.dvLeft} km/s. `:''}${M.lowN?'Power ran out during the mission.':M.deficit>2?'The parts used more power than the wings made in sunlight.':'Power stayed positive the whole mission.'}`],\n      ['Decisions',dec,20,'How well your choices during events paid off.'],\n      ['Resilience',res,20,why.slice(1).join(' ')||'The spacecraft handled the surprises.']];\n    const goalList=goals.map(g=>`<div class=\"r\"><b>${g.ok?'Met':'Missed'}<\/b><em>${g.ok?'\u2713':'\u2717'}<\/em><p>${g.t}<\/p><\/div>`).join('');\n    modal.className='t-win report'; scrim.classList.add('open');\n    modal.innerHTML=`<span class=\"t-ribbon\">Mission report<\/span><h3>${total>=80?'Outstanding mission':total>=60?'Mission success':'Mission complete'}<\/h3>\n     <div class=\"ringwrap\"><svg viewBox=\"0 0 120 120\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"none\" stroke=\"rgba(26,18,6,.12)\" stroke-width=\"14\"/><circle id=\"ring\" cx=\"60\" cy=\"60\" r=\"50\" fill=\"none\" stroke=\"#2C5B65\" stroke-width=\"14\" stroke-linecap=\"round\" stroke-dasharray=\"314\" stroke-dashoffset=\"314\" style=\"transition:stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1)\"/><\/svg><b>${total}<\/b><small>out of 100<\/small><\/div>\n     <div class=\"stars\">${[1,2,3].map(i=>`<svg style=\"--sf:${i<=st?'#F2A541':'#E4DED2'}\"><use href=\"#i-star\"/><\/svg>`).join('')}<\/div>\n     <div class=\"why\">${DF.score!==1||flight.sandbox?`<div class=\"r\"><b>${flight.sandbox?'Sandbox':DF.name}<\/b><em>${flight.sandbox?'not ranked':'x'+DF.score}<\/em><p>${flight.sandbox?'No limits, so this flight is not on the leaderboard.':'Difficulty bonus applied to '+raw+' points.'}<\/p><\/div>`:''}${rows.map(r=>`<div class=\"r\"><b>${r[0]}<\/b><em>${r[1]}/${r[2]}<\/em><div class=\"tr\"><i data-w=\"${r[1]/r[2]*100}\"><\/i><\/div><p>${r[3]}<\/p><\/div>`).join('')}${goalList}${extras(flight,prev,board,rank)}<\/div>\n     <div class=\"row\"><button class=\"t-btn ghost\" type=\"button\" onclick=\"location.reload()\">Fly again<\/button><button class=\"t-btn primary\" type=\"button\">Redesign spacecraft<\/button><\/div>`;\n    requestAnimationFrame(()=>{ document.getElementById('ring').style.strokeDashoffset=314-314*total/100; modal.querySelectorAll('.tr i').forEach(i=>i.style.width=i.dataset.w+'%'); });\n    try{ if(window.HZ_MUSIC) HZ_MUSIC.sting(total>=60?'win':'lose'); }catch(e){}\n    window.LAST_REPORT={raw,rank,total,perf,effS,dec,res,gMet,pct,lowN:M.lowN,fullN:M.fullN,lost:Math.round(M.lost)}; };\n  function extras(f,prev,board,rank){ const R=HZ_REAL[MKEY]; let h='';\n    if(R){ const shared=f.insts.filter(i=>R.inst.includes(i)).map(i=>HZ_INST.find(x=>x.id===i).name), pw=(f.power||'').includes('RTG')?'rtg':'solar';\n      h+=`<div class=\"r\"><b>The real mission: ${R.n}<\/b><em>${R.y}<\/em><p>${R.txt} It weighed ${R.mass.toLocaleString()} kg and flew on ${R.rocket}. Yours: ${f.mass} kg on ${f.rocket}, ${pw===R.power?'same kind of power':'different power ('+(R.power==='rtg'?'they used an RTG':'they used solar')+')'}${shared.length?`, and you share the ${shared.join(', ')}`:''}.<\/p><\/div>`; }\n    if(prev){ const ch=[]; for(const [k,l] of [['rocket','rocket'],['orbit','orbit'],['power','power'],['batt','battery'],['comms','comms'],['store','storage']]) if(prev[k]!==f[k]) ch.push(`${l}: ${prev[k]} \u2192 ${f[k]}`);\n      const ia=prev.insts.join(','), ib=f.insts.join(','); if(ia!==ib) ch.push('instruments changed'); const d=f.score-prev.score;\n      h+=`<div class=\"r\"><b>Compared with your last flight<\/b><em>${d>0?'+':''}${d}<\/em><p>${ch.length?ch.join('; ')+'.':'Same design as last time.'}<\/p><\/div>`; }\n    if(board.length) h+=`<div class=\"r\"><b>Your best ${MI.name} flights<\/b><em>${rank?'#'+rank:''}<\/em><p>${board.map((b,i)=>`${i+1}. ${b.score} (${b.rocket}, ${b.diff})`).join(' \u00b7 ')}<\/p><\/div>`;\n    return h; }\n  PH[2].t=`Systems switch on: ${CR.power}, ${CR.batt}, ${CR.comms}. ${CR.rtg?'The RTG gives steady power.':AU>1.6?`Sunlight here is ${Math.round(sunK*100)}% of Earth's.`:'Solar wings unfold and charge the battery.'}`;\n  addLog(`Design: ${HZ.design.inst||'no instrument'}; goals covered ${gMet} of 3`); renderUI();\n}\n<\/script>\n<script>\n/* Tutorial, part 4: operating the mission */\nif(window.COACH&&COACH.active()){ const _rep=report; let reported=false; report=function(){ reported=true; return _rep(); };\n  COACH.run('Mission control',[\n    {say:'Mission control runs the spacecraft you built, phase by phase.',target:()=>document.getElementById('stepper'),next:'Next'},\n    {say:'Watch <b>Battery<\/b>, <b>Storage<\/b> and <b>Fuel<\/b>.',why:'They come from your design: wings and battery for power, storage and dish for data.',target:()=>document.getElementById('gauges'),next:'Next'},\n    {say:'Speed up time with this button if you like.',target:()=>document.getElementById('speed'),next:'Next'},\n    {say:'Something will happen soon. When it does, choose what to do.',until:()=>!!document.querySelector('.choice')},\n    {say:'Pick an option. Each one trades science against safety.',target:()=>document.querySelector('.choice'),until:()=>!document.querySelector('.choice')},\n    {say:'Keep watching. The mission report comes at the end.',until:()=>reported},\n    {say:'Your report explains <b>why<\/b> you got this score. Read it, then press <b>Redesign spacecraft<\/b> to try a better design.',why:'That is the whole game: design, fly, learn, redesign. Tutorial complete!',target:()=>document.querySelector('.report .t-btn.primary'),next:'Finish',leave:()=>COACH.finish()}]); }\n<\/script>\n"}</script>
<script>
// Horizons: Home → Mission select → Base & workshops → Launch → Mission control → Report → Redesign (back to base).
const SCREENS=JSON.parse(document.getElementById('screens').textContent);
const stage=document.getElementById('stage'), wipe=document.getElementById('wipe');
let state={mission:'earth'}, busy=false;
function boot(name,data){
  state=Object.assign({},state,data||{});
  const head=`<script>window.HZ=${JSON.stringify(state).replace(/</g,'\\u003c')};window.hzGo=(s,d)=>parent.postMessage({hz:s,data:d||{}},'*');<\/script>`;
  const html=SCREENS[name].replace(/<head[^>]*>/i,m=>m+head);
  stage.srcdoc = /<head/i.test(html) ? html : html.replace(/<!doctype html>/i,'<!doctype html>'+head);
  try{ history.replaceState(null,'','#'+name); }catch(e){}
}
function go(name,data){ if(busy||!SCREENS[name]) return; busy=true; wipe.classList.add('on');
  setTimeout(()=>{ boot(name,data); stage.onload=()=>{ wipe.classList.remove('on'); setTimeout(()=>busy=false,450); stage.focus(); }; },460); }
addEventListener('message',e=>{ if(e.source!==stage.contentWindow||!e.data) return; if(e.data.hzState) Object.assign(state,e.data.hzState); if(e.data.hz) go(e.data.hz,e.data.data); });
const start=(location.hash||'').slice(1); boot(SCREENS[start]?start:'home'); stage.onload=()=>stage.focus();
</script>
