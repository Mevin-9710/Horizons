area-inset-bottom,0px))}#tel{width:210px}}\n@media (prefers-reduced-motion:reduce){*{animation:none!important}}\n<\/style>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n<symbol id=\"i-back\" viewBox=\"0 0 24 24\"><path d=\"M15 5 8 12l7 7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/symbol>\n<symbol id=\"i-cam\" viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"7\" width=\"13\" height=\"11\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"/><path d=\"M16 11l5-3v9l-5-3z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linejoin=\"round\"/><\/symbol>\n<symbol id=\"i-tel\" viewBox=\"0 0 24 24\"><path d=\"M4 19V9M10 19V5M16 19v-7M21 19H3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\"/><\/symbol>\n<\/svg>\n\n<div id=\"app\">\n  <div class=\"sky\" id=\"day\"><\/div><div class=\"sky\" id=\"night\"><\/div><div class=\"sky\" id=\"dusk\"><\/div>\n  <canvas id=\"fx\" aria-hidden=\"true\"><\/canvas><canvas id=\"gl\"><\/canvas>\n  <div class=\"ui top\">\n    <button class=\"t-round\" type=\"button\" id=\"back\" aria-label=\"Back to base\"><svg><use href=\"#i-back\"/><\/svg><\/button>\n    <div class=\"phase\"><span class=\"t-ribbon\" id=\"phase\">Launch pad<\/span><div class=\"cap\" id=\"cap\"><\/div><\/div>\n    <span class=\"t-pill\" id=\"clock\">T-00:05<\/span>\n  <\/div>\n  <div class=\"ui read\" id=\"read\" style=\"display:none\"><div class=\"tile\"><span id=\"alt-l\">ALTITUDE<\/span><b id=\"alt\">0 km<\/b><\/div><div class=\"tile\"><span id=\"vel-l\">SPEED<\/span><b id=\"vel\">0 m/s<\/b><\/div><\/div>\n  <div class=\"ui actbar\"><button class=\"t-btn\" type=\"button\" id=\"thr\">Hold: throttle down<kbd>S<\/kbd><\/button><button class=\"t-btn primary\" type=\"button\" id=\"act\" disabled>Stand by<\/button><button class=\"t-btn\" type=\"button\" id=\"skip\">Skip<kbd>Esc<\/kbd><\/button><\/div>\n  <div class=\"ui side\"><button class=\"t-round\" type=\"button\" id=\"bcam\" aria-label=\"Change camera (C)\"><svg><use href=\"#i-cam\"/><\/svg><\/button><button class=\"t-btn\" type=\"button\" id=\"btel\" aria-pressed=\"false\">Telemetry<kbd>T<\/kbd><\/button><\/div>\n  <div class=\"ui\" id=\"adi-w\"><canvas id=\"adi\" width=\"168\" height=\"168\" aria-label=\"Attitude indicator\"><\/canvas><span class=\"t-pill\">Attitude<\/span><\/div>\n  <div class=\"ui t-win\" id=\"tel\"><span class=\"t-ribbon\">Telemetry<\/span>\n    <div class=\"row\"><span>ACCEL<\/span><b id=\"t-acc\">0.0 g<\/b><\/div><div class=\"row\"><span>DYN PRESSURE<\/span><b id=\"t-q\">0 kPa<\/b><\/div>\n    <div class=\"row\"><span>PITCH / AOA<\/span><b id=\"t-pit\">0 / 0<\/b><\/div><div class=\"row\"><span>PERIGEE<\/span><b id=\"t-pe\">-<\/b><\/div><div class=\"row\"><span>APOGEE<\/span><b id=\"t-ap\">-<\/b><\/div>\n    <div class=\"row\"><span>THROTTLE<\/span><b id=\"t-thr\">100%<\/b><\/div><div class=\"bar\"><i id=\"b-thr\"><\/i><\/div>\n    <div class=\"row\"><span>STAGE 1 FUEL<\/span><b id=\"t-f1\">100%<\/b><\/div><div class=\"bar\"><i id=\"b-f1\"><\/i><\/div>\n    <div class=\"row\"><span>STAGE 2 FUEL<\/span><b id=\"t-f2\">100%<\/b><\/div><div class=\"bar\"><i id=\"b-f2\"><\/i><\/div>\n    <div class=\"row\"><span>STRUCT LOAD<\/span><b id=\"t-st\">0%<\/b><\/div><div class=\"bar\"><i id=\"b-st\" style=\"background:var(--warn);width:0\"><\/i><\/div>\n    <div class=\"row\"><span>AUTOPILOT<\/span><b id=\"t-ap2\">ON<\/b><\/div>\n    <div class=\"row\" style=\"color:var(--muted)\"><span>Arrows fly by hand. G autopilot.<\/span><\/div>\n  <\/div>\n  <span class=\"ui t-pill lbl\" id=\"lbA\"><\/span><span class=\"ui t-pill lbl\" id=\"lbB\"><\/span>\n  <div class=\"ui toast\" id=\"toast\"><\/div>\n  <div class=\"ui t-win\" id=\"card\"><span class=\"t-ribbon\" id=\"card-t\">Orbit<\/span><div id=\"card-b\"><\/div><\/div>\n  <span class=\"ui t-pill\" id=\"load\"><i><\/i>Loading rocket\u2026<\/span>\n  <div class=\"ui credit\">3D models courtesy of NASA.<\/div>\n<\/div>\n\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js\"><\/script>\n<script>\n/* ===== Ascent physics (tools/sim/ascent.cjs, inlined by tools/build-game.py) ===== */\n// Ascent physics, ported from The Horizon Explorers v4 (HTML4): 2D polar point mass, gravity turn autopilot,\n// exponential atmosphere, dynamic pressure, angle-of-attack structural load, two stages, osculating orbit.\n// No DOM, no three.js: the launch screen inlines this file, and tools/sim/test-ascent.mjs runs it headless.\nconst RE=6371e3, MU=3.986e14, RAD=Math.PI/180;\nconst clamp=(x,a,b)=>Math.max(a,Math.min(b,x));\n// a1/a2: initial thrust acceleration (m/s2), b1/b2: burn time at full throttle (s). h: display height factor.\nconst VEHICLES={\n  'rocket-jupiter-c':{name:'Jupiter-C',     a1:15.5,b1:150,a2:12.5,b2:420, s1:.52, fair:.74},\n  'rocket-ares-1':   {name:'Ares I',        a1:16,  b1:150,a2:12,  b2:380, s1:.50, fair:.79},\n  'rocket-saturn-v': {name:'Saturn V',      a1:19,  b1:170,a2:13.5,b2:430, s1:.42, fair:.71},\n  'rocket-shuttle':  {name:'Space Shuttle', a1:17,  b1:160,a2:13,  b2:420, s1:.45, fair:.82},\n  'rocket-sls':      {name:'SLS',           a1:19.5,b1:175,a2:13.5,b2:440, s1:.55, fair:.76}};\nfunction newAscent(){ return {met:0,alt:0,vr:0,vt:0,th:0,thr:1,pitch:0,theta:0,f1:1,f2:1,stage:'S1',engine:false,fair:true,auto:true,\n  q:0,qmax:0,acc:0,maxq:false,thrQ:false,dmg:false,lifted:false,aoa:0,stress:0,dep:false,s1gone:false,fail:null,ev:[]}; }\nfunction orbitOf(S){ const r=RE+S.alt,v2=S.vr*S.vr+S.vt*S.vt,e=v2/2-MU/r,h=r*S.vt; if(e>=0) return {peri:S.alt,ap:Infinity};\n  const a=-MU/(2*e),ec=Math.sqrt(Math.max(0,1+2*e*h*h/(MU*MU))); return {peri:a*(1-ec)-RE,ap:a*(1+ec)-RE}; }\n// sd = simulated seconds to advance; inp = {left,right,up,down} manual keys (optional)\nfunction stepAscent(S,V,sd,inp){\n  S.met+=sd;\n  if(S.auto){ let tg=S.pitch; const gam=Math.atan2(S.vt,S.vr)/RAD;\n    if(S.alt<1200) tg=0; else if(S.stage==='S1'||S.stage==='C1') tg=gam+2.5+18*clamp(S.alt/90e3,0,1);\n    else { const vt=(190e3-S.alt)*.012; tg=90+clamp((S.vr-vt)*.03,-50,25); if(S.alt>150e3&&S.alt<230e3) tg=90+clamp(S.vr*.02,-30,30); }\n    S.pitch+=clamp(tg-S.pitch,-2*sd,2*sd); }\n  if(inp){ if(inp.left){S.pitch-=2.8*sd;S.auto=false} if(inp.right){S.pitch+=2.8*sd;S.auto=false}\n    if(inp.up) S.thr=Math.min(1,S.thr+.1*sd); if(inp.down) S.thr=Math.max(.4,S.thr-.1*sd); }\n  S.pitch=clamp(S.pitch,0,130);\n  const tgt=S.engine?S.thr:0; S.th+=clamp(tgt-S.th,-.6*sd,.4*sd); if(!S.engine&&S.th<.01) S.th=0;\n  const n=Math.max(4,Math.ceil(sd/.25)), h=sd/n;\n  for(let i=0;i<n;i++){ const r=RE+S.alt,g=MU/(r*r); let a=0;\n    if(S.th>0){ if(S.stage==='S1'){ a=V.a1*S.th/(1-.7*(1-S.f1)); S.f1-=S.th/V.b1*h; } else if(S.stage==='S2'){ a=V.a2*S.th/(1-.5*(1-S.f2))*(S.fair?1:1.04); S.f2-=S.th/V.b2*h; } }\n    const p=S.pitch*RAD; let ar=a*Math.cos(p),at=a*Math.sin(p);\n    const rho=1.225*Math.exp(-S.alt/8500),v=Math.hypot(S.vr,S.vt); S.q=.5*rho*v*v;\n    if(v>1){ const dr=S.q*4e-5/(S.stage==='S1'?1:2); ar-=dr*S.vr/v; at-=dr*S.vt/v; }\n    ar+=-g+S.vt*S.vt/r; at-=S.vr*S.vt/r;\n    if(S.alt<=0&&ar<=0&&S.vr<=0){ S.alt=0;S.vr=0;at=0;S.vt=0;ar=0; }\n    S.vr+=ar*h; S.vt+=at*h; S.alt+=S.vr*h; S.theta+=S.vt/r*h; S.acc=a/9.81;\n    if(S.f1<=0&&S.stage==='S1'){ S.f1=0; S.engine=false; S.stage='C1'; S.ev.push('meco'); }\n    if(S.f2<=0&&S.stage==='S2'){ S.f2=0; S.engine=false; S.stage='C3'; S.ev.push('seco'); } }\n  if(S.alt>50&&!S.lifted){ S.lifted=true; S.ev.push('liftoff'); }\n  if(S.alt<=0&&S.lifted&&S.vr<=0){ S.fail='The vehicle fell back to the surface.'; return; }\n  const v=Math.hypot(S.vr,S.vt),gm=Math.atan2(S.vt,S.vr)/RAD; S.aoa=v>80?Math.abs(S.pitch-gm):0; S.stress=S.q/1000*S.aoa;\n  if(S.q>S.qmax) S.qmax=S.q; if(S.q>12e3&&S.thr<=.8) S.thrQ=true;\n  if(!S.maxq&&S.qmax>8e3&&S.q<S.qmax*.9){ S.maxq=true; S.ev.push('maxq'); }\n  if(S.stress>220) S.fail='Structural failure: angle of attack too high at '+(S.q/1e3).toFixed(0)+' kPa.';\n}\n// player actions\nconst act={\n  meco(S){ if(S.stage==='S1'&&S.engine){ S.engine=false; S.stage='C1'; S.ev.push('meco'); return true; } },\n  sep(S){ if(S.stage==='C1'){ S.stage='C2'; S.s1gone=true; S.ev.push('sep'); return true; } },\n  ses(S){ if(S.stage==='C2'){ S.stage='S2'; S.engine=true; S.th=0; S.ev.push('ses'); return true; } },\n  fairing(S){ if(S.fair&&S.lifted){ S.fair=false; if(S.alt<100e3) S.dmg=true; S.ev.push('fair'); return true; } },\n  seco(S){ if(S.stage==='S2'&&S.engine){ S.engine=false; S.stage='C3'; S.ev.push('seco'); return true; } },\n  deploy(S){ if(S.stage==='C3'&&!S.dep&&orbitOf(S).peri>=140e3){ S.dep=true; S.ev.push('dep'); return true; } }};\nif(typeof module!=='undefined') module.exports={VEHICLES,newAscent,stepAscent,orbitOf,act,RE,MU};\n\n<\/script>\n<script>\n/* Shared mission data and transfer maths (inlined into the launch screen and the hand-off glue by tools/build-game.py).\n   Planet constants and plan() come from The Horizon Explorers v4: Hohmann transfer with patched conics.\n   Each destination uses a real NASA mission whose spacecraft model is in NASA 3D Resources. */\nconst HZ_PL={\n  mercury:{n:'Mercury',a:.387,P:.241,R:2440,mu:22032,cols:['#B5B0A8','#8E8982','#D2CDC4','#4A4640']},\n  venus:  {n:'Venus',  a:.723,P:.615,R:6052,mu:324859,cols:['#E6C27A','#C9A55C','#F3DDA8','#7A5E2E']},\n  earth:  {n:'Earth',  a:1,   P:1,   R:6371,mu:398600,cols:['#2C5B65','#1C3E46','#95B3B6','#0B1F24']},\n  mars:   {n:'Mars',   a:1.524,P:1.881,R:3390,mu:42828,cols:['#C2643A','#A73B42','#E07A44','#4A1A14']},\n  jupiter:{n:'Jupiter',a:5.203,P:11.86,R:69911,mu:1.267e8,cols:['#C9A55C','#8A7A4A','#F2C27A','#4A3F22'],big:1},\n  saturn: {n:'Saturn', a:9.537,P:29.46,R:58232,mu:3.793e7,cols:['#E8D9B8','#C9B58A','#F3EEE4','#7A6A48'],big:1,ring:1},\n  uranus: {n:'Uranus', a:19.19,P:84,   R:25362,mu:5.794e6,cols:['#95C9CF','#6FA9B2','#C4E4E6','#33606A'],big:1},\n  neptune:{n:'Neptune',a:30.07,P:164.8,R:24622,mu:6.837e6,cols:['#2C4F8A','#1C3566','#6F8FCF','#0B1838'],big:1},\n  pluto:  {n:'Pluto',  a:39.48,P:248,  R:1188,mu:869.6,cols:['#CBB59A','#A8937A','#E6D6C0','#5E4E3C']}};\n// kind: 'orbit' (Earth orbit only), 'moon', 'orbiter' (transfer + insertion), 'flyby' (transfer, no insertion)\nconst HZ_MISSIONS={\n  earth:  {planet:'earth',  name:'Wildfire watch',  nasa:'Landsat',        kind:'orbit',  diff:1,unit:'fires',        verb:'spotted',  model:'landsat-8', obj:'Spot new wildfires within hours, from orbit, so crews on the ground can act before they spread.'},\n  moon:   {planet:'moon',   name:'Lunar polar ice', nasa:'LRO',            kind:'moon',   diff:2,unit:'ice maps',     verb:'made',     model:'lro',       obj:'Map water ice hiding in craters at the lunar poles that never see sunlight.'},\n  mars:   {planet:'mars',   name:'Mars atmosphere', nasa:'MAVEN',          kind:'orbiter',diff:3,unit:'air samples',  verb:'taken',    model:'maven',     obj:'Measure how Mars is losing its air to space, and how fast.'},\n  mercury:{planet:'mercury',name:'Mercury mapper',  nasa:'MESSENGER',      kind:'orbiter',diff:3,unit:'surface maps', verb:'made',     model:'messenger', obj:'Map all of Mercury and look for ice in polar craters that never see the Sun.'},\n  venus:  {planet:'venus',  name:'Venus radar',     nasa:'Magellan',       kind:'orbiter',diff:2,unit:'radar swaths', verb:'mapped',   model:'magellan',  obj:'Map the surface of Venus with radar, straight through its thick clouds.'},\n  jupiter:{planet:'jupiter',name:'Inside Jupiter',  nasa:'Juno',           kind:'orbiter',diff:3,unit:'gravity passes',verb:'flown',   model:'juno',      obj:'Measure the gravity and magnetic field of Jupiter to see what lies under the clouds.'},\n  saturn: {planet:'saturn', name:'Rings and Titan', nasa:'Cassini-Huygens',kind:'orbiter',diff:3,unit:'ring scans',   verb:'made',     model:'cassini',   obj:'Study Saturn, its rings and its moon Titan from orbit.'},\n  uranus: {planet:'uranus', name:'Ice giant flyby', nasa:'Voyager 2',      kind:'flyby',  diff:2,unit:'flyby images', verb:'taken',    model:'voyager',   obj:'Fly past Uranus, the ice giant that rolls on its side, and photograph its moons.'},\n  neptune:{planet:'neptune',name:'Edge of the planets',nasa:'Voyager 2',   kind:'flyby',  diff:3,unit:'flyby images', verb:'taken',    model:'voyager',   obj:'Fly past Neptune and its moon Triton at the edge of the planets.'},\n  pluto:  {planet:'pluto',  name:'Pluto flyby',     nasa:'New Horizons',   kind:'flyby',  diff:3,unit:'flyby images', verb:'taken',    model:'new-horizons',obj:'Cross the whole solar system for one fast pass over the icy heart of Pluto.'}};\n// Hohmann transfer from Earth to a planet (km/s, days). HTML4 plan().\nfunction hzPlan(key){ const M=HZ_MISSIONS[key]||HZ_MISSIONS.earth;\n  if(M.kind==='orbit') return {tpi:0,oi:0,T:0,total:0};\n  if(M.kind==='moon') return {tpi:3.13,oi:.82,T:3.5,total:3.95,a:58,e:(58-1)/(58+1),at:(1+58)/2,outer:true};\n  const p=HZ_PL[M.planet],a=p.a,at=(1+a)/2,T=.5*Math.pow(at,1.5)*365.25,vE=29.78,vd=vE*Math.sqrt(2-1/at),vi1=Math.abs(vd-vE),r=6571,mu=398600;\n  const tpi=Math.sqrt(vi1*vi1+2*mu/r)-Math.sqrt(mu/r),va=vE*Math.sqrt(2/a-1/at),vi2=Math.abs(va-vE/Math.sqrt(a)),rp=p.R*1.5,x=2*p.mu/rp;\n  const oi=M.kind==='flyby'?0:Math.sqrt(vi2*vi2+x)-Math.sqrt(x*50/51);\n  return {tpi,oi,T,total:tpi+oi,a,at,e:Math.abs(a-1)/(a+1),outer:a>1,vi2}; }\n// Delta-v the stack can give after reaching orbit: what is left in the upper stage plus the spacecraft engine.\nconst HZ_STAGE_DV={r1:3.2,r2:4.6,r3:9.5,r4:7.2,r5:12.5}, HZ_ENGINE_DV={e1:.4,e2:1.6,e3:3.6};\nfunction hzDvCap(pick){ return (HZ_STAGE_DV[pick&&pick.rocket]||3.2)+(HZ_ENGINE_DV[pick&&pick.engine]||.4); }\n\n/* ===== Spacecraft design: instruments and mission goals (phase 2) =====\n   Each mission has 3 goals; each goal is met by any one of its listed instruments. */\nconst HZ_INST=[\n  {id:'cam',    name:'Visible camera',       proc:'scope',  mass:18, cost:10, time:3, pw:30,  data:12, note:'Sharp pictures in daylight'},\n  {id:'ir',     name:'Thermal IR imager',    src:'NASA', model:'infrared-camera', mass:38, cost:32, time:5, pw:110, data:35, note:'Sees heat, day and night'},\n  {id:'hyper',  name:'Hyperspectral imager', proc:'scope2', mass:70, cost:58, time:8, pw:190, data:95, note:'Hundreds of colours: what things are made of'},\n  {id:'radar',  name:'Imaging radar',        proc:'radar',  mass:90, cost:45, time:7, pw:220, data:120, note:'Sees through clouds and haze'},\n  {id:'mag',    name:'Magnetometer',         proc:'boom',   mass:6,  cost:8,  time:2, pw:8,   data:2,  note:'Measures magnetic fields on a long boom'},\n  {id:'spec',   name:'Mass spectrometer',    proc:'spec',   mass:25, cost:30, time:5, pw:45,  data:10, note:'Sniffs gases and charged particles'},\n  {id:'neutron',name:'Neutron spectrometer', proc:'neutron',mass:15, cost:18, time:4, pw:20,  data:4,  note:'Finds hidden water ice'},\n  {id:'grav',   name:'Gravity science radio',proc:'gravr',  mass:8,  cost:12, time:3, pw:25,  data:3,  note:'Tracks tiny speed changes to map gravity'}];\nconst HZ_GOALS={\n  earth:  [['Spot fires day and night',['ir','hyper']],['Map burned land',['cam','hyper']],['See through the smoke',['ir','radar']]],\n  moon:   [['Find ice in dark craters',['neutron','radar']],['Map the polar terrain',['cam','radar']],['Measure surface temperature',['ir']]],\n  mars:   [['Sample the upper air',['spec']],['Measure the magnetic field',['mag']],['Image the glowing atmosphere',['hyper','cam']]],\n  mercury:[['Map the whole surface',['cam','hyper']],['Find ice at the poles',['neutron','radar']],['Measure the magnetic field',['mag']]],\n  venus:  [['Map the surface through the clouds',['radar']],['Map the gravity field',['grav']],['Study the cloud tops',['ir','hyper']]],\n  jupiter:[['Map the gravity field',['grav']],['Map the magnetic field',['mag']],['Look under the clouds',['ir']]],\n  saturn: [['Image the rings',['cam','hyper']],['See through the haze on Titan',['radar','ir']],['Sample the plasma',['spec','mag']]],\n  uranus: [['Photograph the planet and moons',['cam','hyper']],['Measure the magnetic field',['mag']],['Measure the heat inside',['ir']]],\n  neptune:[['Photograph Neptune and Triton',['cam','hyper']],['Measure the magnetic field',['mag']],['Measure the heat inside',['ir']]],\n  pluto:  [['Map the icy heart',['cam','hyper']],['Measure the thin air',['spec']],['Measure surface temperatures',['ir']]]};\nfunction hzGoalsMet(key,ids){ return (HZ_GOALS[key]||HZ_GOALS.earth).map(([t,need])=>({t,need,ok:need.some(n=>ids.includes(n))})); }\n// propulsion: engine efficiency x tank size gives the spacecraft's own delta-v\nconst HZ_ENGINE_K={e1:.35,e2:1,e3:1.9}, HZ_TANK_DV={t1:1,t2:2,t3:3.4};\nfunction hzDvCap(pick){ return (HZ_STAGE_DV[pick&&pick.rocket]||3.2)+(HZ_ENGINE_K[pick&&pick.engine]||.35)*(HZ_TANK_DV[pick&&pick.tank]||1); }\n\n/* ===== Orbits: each choice has real effects in mission control =====\n   ecl: share of each orbit spent in shadow (batteries), link: ground passes (downlink), sci: science per pass,\n   oiK: insertion delta-v factor at the destination. */\nconst HZ_ORBITS={\n  orbit:[ // Earth missions\n    {id:'o1',name:'Sun-sync 550 km', ecl:.35,link:1,  sci:1,   oiK:1,  note:'Passes over every place at the same local time: fair, repeatable pictures'},\n    {id:'o2',name:'Low 400 km',      ecl:.4, link:.8, sci:1.15,oiK:1,  cost:-3,note:'Closer means sharper pictures, but fewer ground passes and more shadow'},\n    {id:'o3',name:'Polar 800 km',    ecl:.32,link:1.3,sci:.9, oiK:1,  note:'Flies over the polar ground stations every orbit: lots of downlink'},\n    {id:'o4',name:'Dawn-dusk 700 km',ecl:.04,link:1,  sci:.85,oiK:1,  cost:4,note:'Rides the line between day and night: almost never in shadow'}],\n  around:[ // orbiters and the Moon\n    {id:'o1',name:'Low circular',    ecl:.4, link:.9, sci:1.2, oiK:1.15,note:'Close to the surface: best science, more shadow, costs more fuel to reach'},\n    {id:'o2',name:'High elliptical', ecl:.15,link:1.1,sci:.85, oiK:.85, note:'Swoops low then far out: little shadow, cheap to enter, less science'},\n    {id:'o3',name:'Polar',           ecl:.3, link:1,  sci:1.05,oiK:1,   note:'Passes over the poles: sees the whole surface over time'}],\n  flyby:[\n    {id:'o1',name:'Close pass',      ecl:0,  link:1,  sci:1.25,oiK:0,   note:'Skims close: sharper data, a riskier aim'},\n    {id:'o2',name:'Safe distance',   ecl:0,  link:1,  sci:.9,  oiK:0,   note:'Passes wider: safe, but less detail'}]};\nfunction hzOrbitsFor(key){ const M=HZ_MISSIONS[key]||HZ_MISSIONS.earth; return M.kind==='orbit'?HZ_ORBITS.orbit:M.kind==='flyby'?HZ_ORBITS.flyby:HZ_ORBITS.around; }\n\n/* ===== Balance (v2): the rocket's push depends on how heavy your spacecraft is, and every mission has its own limits =====\n   A light spacecraft can ride a small rocket a long way; a heavy one needs a big rocket. */\nconst HZ_ROCKET={r1:{cap:300,dv:6.4},r2:{cap:800,dv:7.2},r3:{cap:2000,dv:10.5},r4:{cap:2600,dv:8.4},r5:{cap:4000,dv:12.5}};\nfunction hzRocketDv(rk,mass){ const R=HZ_ROCKET[rk]||HZ_ROCKET.r1; return Math.max(0,R.dv*(1-.55*Math.min(1,(mass||0)/R.cap))); }\nhzDvCap=function(pick,mass){ return hzRocketDv(pick&&pick.rocket,mass)+(HZ_ENGINE_K[pick&&pick.engine]||.35)*(HZ_TANK_DV[pick&&pick.tank]||1); };\nconst HZ_LIMITS={earth:{budget:180,time:12},moon:{budget:320,time:18},mars:{budget:450,time:24},mercury:{budget:480,time:30},venus:{budget:360,time:24},\n  jupiter:{budget:560,time:36},saturn:{budget:620,time:40},uranus:{budget:520,time:36},neptune:{budget:540,time:36},pluto:{budget:500,time:36}};\n\n// sunlight at the destination, as a share of Earth's (solar wings make this much less; an RTG does not care)\nfunction hzSunK(key){ const M=HZ_MISSIONS[key]; if(!M||M.planet==='earth'||M.planet==='moon') return 1; const a=HZ_PL[M.planet]?HZ_PL[M.planet].a:1; return Math.min(2,Math.pow(a,-1.25)); }\n\n/* ===== Difficulty and sandbox (Settings) ===== */\nconst HZ_DIFF={cadet:{name:'Cadet',dv:1.2,budget:1.25,grace:1.6,score:.9},pilot:{name:'Pilot',dv:1,budget:1,grace:1,score:1},commander:{name:'Commander',dv:.88,budget:.85,grace:.6,score:1.15}};\nfunction hzDiff(){ const S=(window.HZ&&HZ.settings)||{}; return HZ_DIFF[S.diff]||HZ_DIFF.pilot; }\nfunction hzSandbox(){ return !!(window.HZ&&HZ.settings&&HZ.settings.sandbox); }\n{ const _cap=hzDvCap; hzDvCap=function(p,m){ return _cap(p,m)*hzDiff().dv; }; }\n\n/* ===== The real NASA mission behind each game mission (for \"a real mission like yours\" in the report) ===== */\nconst HZ_REAL={\n  earth:  {n:'Landsat 8',y:2013,rocket:'Atlas V',mass:2623,power:'solar',inst:['cam','ir'],txt:'An imaging camera (OLI) and a thermal infrared sensor (TIRS), in a sun-synchronous orbit at 705 km.'},\n  moon:   {n:'Lunar Reconnaissance Orbiter',y:2009,rocket:'Atlas V',mass:1916,power:'solar',inst:['cam','ir','neutron','radar'],txt:'Cameras, a thermal radiometer, a neutron detector and a small radar, in a low polar orbit.'},\n  mars:   {n:'MAVEN',y:2013,rocket:'Atlas V',mass:2454,power:'solar',inst:['spec','mag','hyper'],txt:'A mass spectrometer, a magnetometer and an ultraviolet imaging spectrograph, in an elliptical orbit.'},\n  mercury:{n:'MESSENGER',y:2004,rocket:'Delta II',mass:1107,power:'solar',inst:['cam','mag','neutron'],txt:'Cameras, a magnetometer and a neutron spectrometer. It used six planet flybys to slow down instead of a huge rocket.'},\n  venus:  {n:'Magellan',y:1989,rocket:'Space Shuttle Atlantis',mass:3449,power:'solar',inst:['radar','grav'],txt:'A radar that mapped 98% of Venus through the clouds, and radio tracking for gravity.'},\n  jupiter:{n:'Juno',y:2011,rocket:'Atlas V',mass:3625,power:'solar',inst:['grav','mag','ir'],txt:'Huge solar wings (the farthest solar-powered craft), a magnetometer, gravity science and a microwave radiometer.'},\n  saturn: {n:'Cassini-Huygens',y:1997,rocket:'Titan IV-B',mass:5712,power:'rtg',inst:['cam','radar','spec','mag'],txt:'Three RTGs, cameras, a radar that saw through Titan\\'s haze, and particle instruments.'},\n  uranus: {n:'Voyager 2',y:1977,rocket:'Titan IIIE',mass:722,power:'rtg',inst:['cam','mag','ir'],txt:'RTG power, cameras, a magnetometer and an infrared spectrometer: still the only visitor to Uranus.'},\n  neptune:{n:'Voyager 2',y:1977,rocket:'Titan IIIE',mass:722,power:'rtg',inst:['cam','mag','ir'],txt:'The same Voyager 2, twelve years after launch: still the only visitor to Neptune.'},\n  pluto:  {n:'New Horizons',y:2006,rocket:'Atlas V',mass:478,power:'rtg',inst:['cam','spec','ir'],txt:'A light, fast craft with an RTG, cameras and an ultraviolet spectrometer for Pluto\\'s thin air.'}};\n\n/* ===== Saved flights (this browser): compare with your last design, local leaderboard ===== */\nconst HZ_FLIGHTS={ all(){ try{ return JSON.parse(localStorage.getItem('hz-flights')||'[]'); }catch(e){ return []; } },\n  save(f){ try{ const a=this.all(); a.push(f); localStorage.setItem('hz-flights',JSON.stringify(a.slice(-200))); }catch(e){} },\n  of(m){ return this.all().filter(f=>f.mission===m); },\n  best(m){ return this.of(m).filter(f=>!f.sandbox).sort((a,b)=>b.score-a.score); } };\n\n<\/script>\n<script>\n/* ================= Horizons launch screen =================\n   Mechanics from The Horizon Explorers v4 (ascent physics, staging, hangar steps), rebuilt in the Horizons look.\n   Flow: hangar cinematic (skippable) -> 5 s count -> ascent (autopilot flies, the player fires each event on cue) -> orbit -> hand-off. */\nconst $=id=>document.getElementById(id);\nconst HZ=window.HZ||{}, SET=Object.assign({sfx:true,music:true,motion:false,gfx:'high'},HZ.settings||{});\nconst reduce=matchMedia('(prefers-reduced-motion: reduce)').matches||!!SET.motion;\nconst go=(s,d)=>{ if(window.hzGo) hzGo(s,d); };\nconst pick=HZ.pick||{};\nconst RK={r1:'rocket-jupiter-c',r2:'rocket-ares-1',r3:'rocket-saturn-v',r4:'rocket-shuttle',r5:'rocket-sls'}[pick.rocket]||'rocket-saturn-v';\nconst V=VEHICLES[RK], HT={'rocket-jupiter-c':10,'rocket-ares-1':13,'rocket-saturn-v':15,'rocket-shuttle':11.5,'rocket-sls':15}[RK];\nconst BUS={b1:'kit-body-2',b2:'kit-body-3',b3:'kit-body-1'}[pick.bus]||'kit-body-2', WING={p1:'kit-wings-1',p2:'kit-wings-2',p3:'kit-wings-3'}[pick.power]||'kit-wings-1';\nconst H1=HT*V.s1, H2=HT*V.fair;                       // stage 1 / stage 2 / fairing split heights on the model\nconst R=600, vis=h=>h<2000?h*.03:60+(h-2000)/1000*1.2;   // small display planet; altitude is compressed for the camera\nconst rnd=(a=1)=>(Math.random()-.5)*2*a, sstep=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };\n\n/* ---------- renderer ---------- */\nconst canvas=$('gl');\nconst renderer=new THREE.WebGLRenderer({canvas,antialias:SET.gfx!=='low',alpha:true,powerPreference:'high-performance'});\nrenderer.setPixelRatio(Math.min(devicePixelRatio||1,SET.gfx==='low'?1:1.5)); renderer.setClearColor(0,0); renderer.localClippingEnabled=true;\nconst scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(52,1,.1,7000);\nscene.add(new THREE.HemisphereLight(0xFBFAF4,0x6E6457,.85)); const sun=new THREE.DirectionalLight(0xffffff,.95); sun.position.set(-300,260,320); scene.add(sun,sun.target);\nconst C=new THREE.Vector3(0,-R,0);\n\n/* ---------- Comet surface shader (same banding and grain as the base) ---------- */\nconst CV=`varying vec3 vN; varying vec3 vW; void main(){ vN=normalize(mat3(modelMatrix)*normal); vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`;\nconst CF=`uniform vec3 c0; uniform vec3 c1; uniform vec3 c2; uniform vec3 c3; uniform vec3 ax; uniform float fq; varying vec3 vN; varying vec3 vW;\nfloat h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}\nvoid main(){ float t=dot(vW,normalize(ax))*fq+.35*sin(vW.x*fq*2.+sin(vW.z*fq*2.6))*cos(vW.z*fq*1.7); float b=fract(t);\n  vec3 col=b<.35?c0:b<.55?mix(c0,c1,s ); } else ar.classList.remove('s');\n    let done=false; try{ done=cur.until&&cur.until(); }catch(e){} if(done) advance(); }\n  function stop(skipped){ on=false; clearInterval(timer); if(el) el.classList.remove('s'); if(ar) ar.classList.remove('s'); try{ speechSynthesis.cancel(); }catch(e){}\n    if(skipped){ if(window.HZ) HZ.tutorial=false; try{ parent.postMessage({hzState:{tutorial:false}},'*'); }catch(e){} if(window.COACH.onSkip) window.COACH.onSkip(); } }\n  window.COACH={ active:()=>!!(window.HZ&&HZ.tutorial),\n    run(n,steps){ if(!this.active()) return; mount(); name=n; list=steps; idx=0; on=true; show(); clearInterval(timer); timer=setInterval(tick,150); },\n    stop, finish(){ stop(false); if(window.HZ) HZ.tutorial=false; try{ parent.postMessage({hzState:{tutorial:false}},'*'); }catch(e){} },\n    get step(){ return idx; }, onSkip:null };\n})();\n<\/script>\n<script>\n/* ===== Music by phase (shared by every screen) =====\n   One generative score for the whole game, played by the shell page so it carries on across screens and crossfades between phases.\n   Each screen sets its phase; the launch and mission control also follow their own moments (countdown, ascent, orbit, cruise, arrival, win, lose).\n   Follows the Music setting (localStorage 'hz-settings'). Starts on the first tap or key press (browsers block sound before that).\n   API: HZ_MUSIC.phase(name), HZ_MUSIC.sting('win'|'lose'), HZ_MUSIC.unlock() */\n(function(){\n  const host=(()=>{ try{ return parent&&parent.document?parent:window; }catch(e){ return window; } })();\n  if(!host.HZ_MUSIC){ const s=host.document.createElement('script'); s.textContent='('+engine.toString()+')()'; host.document.head.appendChild(s); }\n  const M=host.HZ_MUSIC; window.HZ_MUSIC=M; if(!M) return;\n  const unlock=()=>M.unlock(); addEventListener('pointerdown',unlock,true); addEventListener('keydown',unlock,true); addEventListener('touchstart',unlock,true);\n  const SCREEN={home:'home',select:'select',base:'build',launch:' ,11,null,null,7,null,null], arpV:.026, bell:true},\n      cruise: {bpm:60, ch:[[36,43,52,59],[34,41,50,57]], pad:.05, drone:24, bell:true, arp:[12,null,null,null,null,null,null,null,null,null,null,null,7,null,null,null], arpV:.022},\n      arrive: {bpm:92, ch:[[46,53,62,69],[43,50,58,65],[39,46,55,62],[41,48,57,65]], pad:.05, arp:[0,4,7,12,7,4,0,4,7,12,16,12,7,4,7,12], arpV:.024, bass:[0,null,null,null,0,null,null,null,0,null,null,null,0,null,7,null], bassV:.055},\n      control:{bpm:96, ch:[[45,52,57,64],[41,48,57,60],[43,50,55,62],[40,47,55,59]], pad:.035, arp:[0,null,12,null,7,null,12,null,0,null,12,null,7,null,14,null], arpV:.02, bass:[0,null,null,null,null,null,null,null,0,null,null,null,null,null,7,null], bassV:.05, hat:[0,0,1,0,0,0,1,0,0,0,1,0,0,0,1,0]},\n      win:    {bpm:84, ch:[[48,55,64,72],[53,60,69,72],[45,52,60,67],[43,50,59,67]], pad:.05, arp:[0,4,7,12,null,null,7,null,0,4,7,12,null,null,16,null], arpV:.026, bell:true},\n      lose:   {bpm:58, ch:[[45,52,57,60],[41,48,53,57],[38,45,50,53],[40,47,52,56]], pad:.045, drone:33},\n    };\n    function enabled(){ try{ const s=JSON.parse(localStorage.getItem('hz-settings')||'{}')||{}; return s.music!==false; }catch(e){ return true; } }\n    function init(){ if(ac) return; try{ ac=new (W.AudioContext||W.webkitAudioContext)(); }catch(e){ return; }\n      const comp=ac.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=3; out=ac.createGain(); out.gain.value=0; out.connect(comp); comp.connect(ac.destination);\n      const n=ac.createBuffer(1,ac.sampleRate,ac.sampleRate), d=n.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; W.__hzNoise=n;\n      next=ac.currentTime+.1; timer=setInterval(sched,60); }\n    function busFor(ph){ if(!bus[ph]){ const g=ac.createGain(); g.gain.value=0; const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=ph==='count'?600:2600; g.connect(f); f.connect(out); bus[ph]={g,f}; } return bus[ph]; }\n    function voice(dest,type,fq,t,dur,vol,a,r,cut){ const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.value=fq; o.detune.value=(Math.random()-.5)*8;\n      let node=o; if(cut){ const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut; o.connect(f); node=f; } node.connect(g); g.connect(dest);\n      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+a); g.gain.setValueAtTime(vol,t+Math.max(a,dur-r)); g.gain.linearRampToValueAtTime(0,t+dur); o.start(t); o.stop(t+dur+.05); }\n    function noise(dest,t,dur,vol,hp){ const s=ac.createBufferSource(); s.buffer=W.__hzNoise; const f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; const g=ac.createGain();\n      g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(f); f.connect(g); g.connect(dest); s.start(t); s.stop(t+dur+.02); }\n    function kick(dest,t){ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(42,t+.18); g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.0001,t+.3); o.connect(g); g.connect(dest); o.start(t); o.stop(t+.32); }\n    function sched(){ if(!ac||!cur) return; const p=P[cur], spb=60/p.bpm/4, B=busFor(cur).g;\n      while(next<ac.currentTime+.25){ const t=next, s=step%16, bar=Math.floor(step/16), ch=p.ch[bar%p.ch.length];\n        if(s===0){ const len=spb*16; for(const m of ch) voice(B,p.saw?'sawtooth':'triangle',mtof(m),t,len+.4,p.pad/(p.saw?1.6:1),len*.3,len*.35,p.saw?900:1600);\n          if(p.drone) voice(B,'sine',mtof(p.drone),t,len+.4,.06,len*.4,len*.4);\n          if(p.bell&&bar%2===0) voice(B,'sine',mtof(ch[3]+24),t+spb*8,2.6,.022,.01,2.4); }\n        if(p.arp&&p.arp[s]!=null) voice(B,'triangle',mtof(ch[0]+24+p.arp[s]),t,spb*2.2,p.arpV,.01,spb*1.8,3200);\n        if(p.bass&&p.bass[s]!=null) voice(B,'sine',mtof(ch[0]-12+p.bass[s]),t,spb*1.8,p.bassV,.01,spb,600);\n        if(p.hat&&p.hat[s]) noise(B,t,.05,.035,7000);\n        if(p.kick&&p.kick[s]) kick(B,t);\n        if(p.tick&&p.tick[s]){ voice(B,'sine',s===0?1320:880,t,.08,.05,.003,.06); }\n        next+=spb; step++; } }\n    function fadeTo(ph){ if(!ac||ph===cur) return; const t=ac.currentTime;\n      if(cur&&bus[cur]){ const g=bus[cur].g.gain; g.cancelScheduledValues(t); g.setValueAtTime(g.value,t); g.linearRampToValueAtTime(0,t+1.8); }\n      cur=ph; const b=busFor(ph); b.g.gain.cancelScheduledValues(t); b.g.gain.setValueAtTime(b.g.gain.value,t); b.g.gain.linearRampToValueAtTime(1,t+2.2);\n      if(P[ph].rise){ b.f.frequency.cancelScheduledValues(t); b.f.frequency.setValueAtTime(500,t); b.f.frequency.linearRampToValueAtTime(3200,t+6); }\n      step=Math.ceil(step/16)*16; }\n    function apply(){ if(!ac) return; const t=ac.currentTime, v=on&&!document.hidden?.9:0; out.gain.cancelScheduledValues(t); out.gain.setValueAtTime(out.gain.value,t); out.gain.linearRampToValueAtTime(v,t+.8); }\n    function sting(kind){ if(!ac||!on) return; const t=ac.currentTime+.05, d=ac.createGain(); d.gain.value=1; d.connect(out);\n      const notes=kind==='win'?[60,64,67,72,76,79,84]:[57,56,53,50,45];\n      notes.forEach((m,i)=>voice(d,'triangle',mtof(m),t+i*(kind==='win'?.09:.22),kind==='win'?1.4:1.1,.06,.01,.9,3000));\n      fadeTo(kind==='win'?'win':'lose'); }\n    setInterval(()=>{ const e=enabled(); if(e!==on){ on=e; apply(); } },800);\n    document.addEventListener('visibilitychange',apply);\n    W.HZ_MUSIC={\n      unlock(){ on=enabled(); if(!on&&!ac) return; init(); if(!ac) return; if(ac.state!=='running') ac.resume(); if(want) fadeTo(want); apply(); },\n      phase(ph){ if(!P[ph]) return; want=ph; if(ac&&ac.state==='running') fadeTo(ph); },\n      sting, get current(){ return cur; }, get running(){ return !!ac&&ac.state==='running'; } };\n  }\n})();\n<\/script>\n<script>\n/* Music follows the launch: pad, count, ascent, orbit, cruise, arrival, or a loss. */\n(function(){ if(!window.HZ_MUSIC||typeof setPhase!=='function') return; const M=HZ_MUSIC, _sp=setPhase;\n  const pick=t=>/^Terminal count/.test(t)?'count':/^(Ignition|Liftoff|Ascent|Max-Q|Stage|MECO|Gravity)/.test(t)?'ascent':/^(Orbit|Spacecraft deployed|Parking orbit)/.test(t)?'orbit'\n    :/^Cruise/.test(t)?'cruise':/^(Arrival|In orbit around|Flyby)/.test(t)?'arrive':/^(Vehicle lost|Suborbital|Not in orbit|Missed)/.test(t)?'lose':null;\n  setPhase=function(t,c){ _sp(t,c); const ph=pick(String(t||'')); if(ph==='lose') M.sting('lose'); else if(ph) M.phase(ph); }; })();\n<\/script>\n<script>\n/* Tutorial, part 3: the launch. Time slows for Max-Q and stops at every cue until the player presses it. */\n(function tut(){ if(!(window.COACH&&COACH.active())) return; if(!window.LX){ setTimeout(tut,200); return; }\n  LX.tutCue=true; const btn=()=>document.getElementById('act'); let seen={};\n  setInterval(()=>{ LX.hold=LX.mode==='fly'&&!!LX.cue; },60);\n  COACH.run('Launch',[\n    {say:'The rocket is being prepared in the hangar. Watch, or press <b>Skip<\/b>.',until:()=>LX.mode!=='cine'&&LX.mode!=='load'},\n    {say:'Countdown. Ignition is automatic.',until:()=>LX.mode==='fly'},\n    {say:'Liftoff! The autopilot flies the rocket. Your job: fire each event when its button lights up.',until:()=>LX.S.q>9e3,enter:()=>{ LX.timeK=.7; }},\n    {say:'<b>Max-Q<\/b>: the air pushes hardest now. Hold <b>S<\/b> or the throttle button to ease off.',why:'Less push means less stress on the rocket.',target:()=>document.getElementById('thr'),enter:()=>{ LX.timeK=.3; },until:()=>LX.S.maxq,leave:()=>{ LX.timeK=1; }},\n    {dyn:()=>{ const T={sep:['Stage 1 is empty. Press <b>Space<\/b> or the glowing button to drop it.','Dead weight costs speed.'],\n        ses:['Light the second stage: press <b>Space<\/b>.','Stage 2 carries the spacecraft the rest of the way.'],\n        fairing:['Above 100 km the air is too thin to matter. Drop the nose fairing: press <b>Space<\/b>.','Too early, and air heating would damage the spacecraft.'],\n        seco:['Orbit reached. Cut the engine: press <b>Space<\/b>.','The button only lights once the orbit is safe.'],\n        deploy:['Release your spacecraft into orbit: press <b>Space<\/b>.','Its solar wings unfold once it is free.']};\n        return LX.cue?T[LX.cue]:['The autopilot keeps flying. The next event button will light up soon.','Time stops at each event so you can read.']; },\n      target:()=>LX.cue?document.getElementById('act'):null,until:()=>LX.S.dep},\n    {say:'In orbit! Extra: <b>T<\/b> shows full telemetry, <b>C<\/b> changes the camera.',until:()=>!!LX.flight},\n    {say:'Press <b>Continue<\/b> to hand over to mission control.',target:()=>document.getElementById('c-next')}]); })();\n<\/script>\n", "control": "<!doctype html>\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<script>\n/* Shared mission data and transfer maths (inlined into the launch screen and the hand-off glue by tools/build-game.py).\n   Planet constants and plan() come from The Horizon Explorers v4: Hohmann transfer with patched conics.\n   Each destination uses a real NASA mission whose spacecraft model is in NASA 3D Resources. */\nconst HZ_PL={\n  mercury:{n:'Mercury',a:.387,P:.241,R:2440,mu:22032,cols:['#B5B0A8','#8E8982','#D2CDC4','#4A4640']},\n  venus:  {n:'Venus',  a:.723,P:.615,R:6052,mu:324859,cols:['#E6C27A','#C9A55C','#F3DDA8','#7A5E2E']},\n  earth:  {n:'Earth',  a:1,   P:1,   R:6371,mu:398600,cols:['#2C5B65','#1C3E46','#95B3B6','#0B1F24']},\n  mars:   {n:'Mars',   a:1.524,P:1.881,R:3390,mu:42828,cols:['#C2643A','#A73B42','#E07A44','#4A1A14']},\n  jupiter:{n:'Jupiter',a:5.203,P:11.86,R:69911,mu:1.267e8,cols:['#C9A55C','#8A7A4A','#F2C27A','#4A3F22'],big:1},\n  saturn: {n:'Saturn', a:9.537,P:29.46,R:58232,mu:3.793e7,cols:['#E8D9B8','#C9B58A','#F3EEE4','#7A6A48'],big:1,ring:1},\n  uranus: {n:'Uranus', a:19.19,P:84,   R:25362,mu:5.794e6,cols:['#95C9CF','#6FA9B2','#C4E4E6','#33606A'],big:1},\n  neptune:{n:'Neptune',a:30.07,P:164.8,R:24622,mu:6.837e6,cols:['#2C4F8A','#1C3566','#6F8FCF','#0B1838'],big:1},\n  pluto:  {n:'Pluto',  a:39.48,P:248,  R:1188,mu:869.6,cols:['#CBB59A','#A8937A','#E6D6C0','#5E4E3C']}};\n// kind: 'orbit' (Earth orbit only), 'moon', 'orbiter' (transfer + insertion), 'flyby' (transfer, no insertion)\nconst HZ_MISSIONS={\n  earth:  {planet:'earth',  name:'Wildfire watch',  nasa:'Landsat',        kind:'orbit',  diff:1,unit:'fires',        verb:'spotted',  model:'landsat-8', obj:'Spot new wildfires within hours, from orbit, so crews on the ground can act before they spread.'},\n  moon:   {planet:'moon',   name:'Lunar polar ice', nasa:'LRO',            kind:'moon',   diff:2,unit:'ice maps',     verb:'made',     model:'lro',       obj:'Map water ice hiding in craters at the lunar poles that never see sunlight.'},\n  mars:   {planet:'mars',   name:'Mars atmosphere', nasa:'MAVEN',          kind:'orbiter',diff:3,unit:'air samples',  verb:'taken',    model:'maven',     obj:'Measure how Mars is losing its air to space, and how fast.'},\n  mercury:{planet:'mercury',name:'Mercury mapper',  nasa:'MESSENGER',      kind:'orbiter',diff:3,unit:'surface maps', verb:'made',     model:'messenger', obj:'Map all of Mercury and look for ice in polar craters that never see the Sun.'},\n  venus:  {planet:'venus',  name:'Venus radar',     nasa:'Magellan',       kind:'orbiter',diff:2,unit:'radar swaths', verb:'mapped',   model:'magellan',  obj:'Map the surface of Venus with radar, straight through its thick clouds.'},\n  jupiter:{planet:'jupiter',name:'Inside Jupiter',  nasa:'Juno',           kind:'orbiter',diff:3,unit:'gravity passes',verb:'flown',   model:'juno',      obj:'Measure the gravity and magnetic field of Jupiter to see what lies under the clouds.'},\n  saturn: {planet:'saturn', name:'Rings and Titan', nasa:'Cassini-Huygens',kind:'orbiter',diff:3,unit:'ring scans',   verb:'made',     model:'cassini',   obj:'Study Saturn, its rings and its moon Titan from orbit.'},\n  uranus: {planet:'uranus', name:'Ice giant flyby', nasa:'Voyager 2',      kind:'flyby',  diff:2,unit:'flyby images', verb:'taken',    model:'voyager',   obj:'Fly past Uranus, the ice giant that rolls on its side, and photograph its moons.'},\n  neptune:{planet:'neptune',name:'Edge of the planets',nasa:'Voyager 2',   kind:'flyby',  diff:3,unit:'flyby images', verb:'taken',    model:'voyager',   obj:'Fly past Neptune and its moon Triton at the edge of the planets.'},\n  pluto:  {planet:'pluto',  name:'Pluto flyby',     nasa:'New Horizons',   kind:'flyby',  diff:3,unit:'flyby images', verb:'taken',    model:'new-horizons',obj:'Cross the whole solar system for one fast pass over the icy heart of Pluto.'}};\n// Hohmann transfer from Earth to a planet (km/s, days). HTML4 plan().\nfunction hzPlan(key){ const M=HZ_MISSIONS[key]||HZ_MISSIONS.earth;\n  if(M.kind==='orbit') return {tpi:0,oi:0,T:0,total:0};\n  if(M.kind==='moon') return {tpi:3.13,oi:.82,T:3.5,total:3.95,a:58,e:(58-1)/(58+1),at:(1+58)/2,outer:true};\n  const p=HZ_PL[M.planet],a=p.a,at=(1+a)/2,T=.5*Math.pow(at,1.5)*365.25,vE=29.78,vd=vE*Math.sqrt(2-1/at),vi1=Math.abs(vd-vE),r=6571,mu=398600;\n  const tpi=Math.sqrt(vi1*vi1+2*mu/r)-Math.sqrt(mu/r),va=vE*Math.sqrt(2/a-1/at),vi2=Math.abs(va-vE/Math.sqrt(a)),rp=p.R*1.5,x=2*p.mu/rp;\n  const oi=M.kind==='flyby'?0:Math.sqrt(vi2*vi2+x)-Math.sqrt(x*50/51);\n  return {tpi,oi,T,total:tpi+oi,a,at,e:Math.abs(a-1)/(a+1),outer:a>1,vi2}; }\n// Delta-v the stack can give after reaching orbit: what is left in the upper stage plus the spacecraft engine.\nconst HZ_STAGE_DV={r1:3.2,r2:4.6,r3:9.5,r4:7.2,r5:12.5}, HZ_ENGINE_DV={e1:.4,e2:1.6,e3:3.6};\nfunction hzDvCap(pick){ return (HZ_STAGE_DV[pick&&pick.rocket]||3.2)+(HZ_ENGINE_DV[pick&&pick.engine]||.4); }\n\n/* ===== Spacecraft design: instruments and mission goals (phase 2) =====\n   Each mission has 3 goals; each goal is met by any one of its listed instruments. */\nconst HZ_INST=[\n  {id:'cam',    name:'Visible camera',       proc:'scope',  mass:18, cost:10, time:3, pw:30,  data:12, note:'Sharp pictures in daylight'},\n  {id:'ir',     name:'Thermal IR imager',    src:'NASA', model:'infrared-camera', mass:38, cost:32, time:5, pw:110, data:35, note:'Sees heat, day and night'},\n  {id:'hyper',  name:'Hyperspectral imager', proc:'scope2', mass:70, cost:58, time:8, pw:190, data:95, note:'Hundreds of colours: what things are made of'},\n  {id:'radar',  name:'Imaging radar',        proc:'radar',  mass:90, cost:45, time:7, pw:220, data:120, note:'Sees through clouds and haze'},\n  {id:'mag',    name:'Magnetometer',         proc:'boom',   mass:6,  cost:8,  time:2, pw:8,   data:2,  note:'Measures magnetic fields on a long boom'},\n  {id:'spec',   name:'Mass spectrometer',    proc:'spec',   mass:25, cost:30, time:5, pw:45,  data:10, note:'Sniffs gases and charged particles'},\n  {id:'neutron',name:'Neutron spectrometer', proc:'neutron',mass:15, cost:18, time:4, pw:20,  data:4,  note:'Finds hidden water ice'},\n  {id:'grav',   name:'Gravity science radio',proc:'gravr',  mass:8,  cost:12, time:3, pw:25,  data:3,  note:'Tracks tiny speed changes to map gravity'}];\nconst HZ_GOALS={\n  earth:  [['Spot fires day and night',['ir','hyper']],['Map burned land',['cam','hyper']],['See through the smoke',['ir','radar']]],\n  moon:   [['Find ice in dark craters',['neutron','radar']],['Map the polar terrain',['cam','radar']],['Measure surface temperature',['ir']]],\n  mars:   [['Sample the upper air',['spec']],['Measure the magnetic field',['mag']],['Image the glowing atmosphere',['hyper','cam']]],\n  mercury:[['Map the whole surface',['cam','hyper']],['Find ice at the poles',['neutron','radar']],['Measure the magnetic field',['mag']]],\n  venus:  [['Map the surface through the clouds',['radar']],['Map the gravity field',['grav']],['Study the cloud tops',['ir','hyper']]],\n  jupiter:[['Map the gravity field',['grav']],['Map the magnetic field',['mag']],['Look under the clouds',['ir']]],\n  saturn: [['Image the rings',['cam','hyper']],['See through the haze on Titan',['radar','ir']],['Sample the plasma',['spec','mag']]],\n  uranus: [['Photograph the planet and moons',['cam','hyper']],['Measure the magnetic field',['mag']],['Measure the heat inside',['ir']]],\n  neptune:[['Photograph Neptune and Triton',['cam','hyper']],['Measure the magnetic field',['mag']],['Measure the heat inside',['ir']]],\n  pluto:  [['Map the icy heart',['cam','hyper']],['Measure the thin air',['spec']],['Measure surface temperatures',['ir']]]};\nfunction hzGoalsMet(key,ids){ return (HZ_GOALS[key]||HZ_GOALS.earth).map(([t,need])=>({t,need,ok:need.some(n=>ids.includes(n))})); }\n// propulsion: engine efficiency x tank size gives the spacecraft's own delta-v\nconst HZ_ENGINE_K={e1:.35,e2:1,e3:1.9}, HZ_TANK_DV={t1:1,t2:2,t3:3.4};\nfunction hzDvCap(pick){ return (HZ_STAGE_DV[pick&&pick.rocket]||3.2)+(HZ_ENGINE_K[pick&&pick.engine]||.35)*(HZ_TANK_DV[pick&&pick.tank]||1); }\n\n/* ===== Orbits: each choice has real effects in mission control =====\n   ecl: share of each orbit spent in shadow (batteries), link: ground passes (downlink), sci: science per pass,\n   oiK: insertion delta-v factor at the destination. */\nconst HZ_ORBITS={\n  orbit:[ // Earth missions\n    {id:'o1',name:'Sun-sync 550 km', ecl:.35,link:1,  sci:1,   oiK:1,  note:'Passes over every place at the same local time: fair, repeatable pictures'},\n    {id:'o2',name:'Low 400 km',      ecl:.4, link:.8, sci:1.15,oiK:1,  cost:-3,note:'Closer means sharper pictures, but fewer ground passes and more shadow'},\n    {id:'o3',name:'Polar 800 km',    ecl:.32,link:1.3,sci:.9, oiK:1,  note:'Flies over the polar ground stations every orbit: lots of downlink'},\n    {id:'o4',name:'Dawn-dusk 700 km',ecl:.04,link:1,  sci:.85,oiK:1,  cost:4,note:'Rides the line between day and night: almost never in shadow'}],\n  around:[ // orbiters and the Moon\n    {id:'o1',name:'Low circular',    ecl:.4, link:.9, sci:1.2, oiK:1.15,note:'Close to the surface: best science, more shadow, costs more fuel to reach'},\n    {id:'o2',name:'High elliptical', ecl:.15,link:1.1,sci:.85, oiK:.85, note:'Swoops low then far out: little shadow, cheap to enter, less science'},\n    {id:'o3',name:'Polar',           ecl:.3, link:1,  sci:1.05,oiK:1,   note:'Passes over the poles: sees the whole surface over time'}],\n  flyby:[\n    {id:'o1',name:'Close pass',      ecl:0,  link:1,  sci:1.25,oiK:0,   note:'Skims close: sharper data, a riskier aim'},\n    {id:'o2',name:'Safe distance',   ecl:0,  link:1,  sci:.9,  oiK:0,   note:'Passes wider: safe, but less detail'}]};\nfunction hzOrbitsFor(key){ const M=HZ_MISSIONS[key]||HZ_MISSIONS.earth; return M.kind==='orbit'?HZ_ORBITS.orbit:M.kind==='flyby'?HZ_ORBITS.flyby:HZ_ORBITS.around; }\n\n/* ===== Balance (v2): the rocket's push depends on how heavy your spacecraft is, and every mission has its own limits =====\n   A light spacecraft can ride a small rocket a long way; a heavy one needs a big rocket. */\nconst HZ_ROCKET={r1:{cap:300,dv:6.4},r2:{cap:800,dv:7.2},r3:{cap:2000,dv:10.5},r4:{cap:2600,dv:8.4},r5:{cap:4000,dv:12.5}};\nfunction hzRocketDv(rk,mass){ const R=HZ_ROCKET[rk]||HZ_ROCKET.r1; return Math.max(0,R.dv*(1-.55*Math.min(1,(mass||0)/R.cap))); }\nhzDvCap=function(pick,mass){ return hzRocketDv(pick&&pick.rocket,mass)+(HZ_ENGINE_K[pick&&pick.engine]||.35)*(HZ_TANK_DV[pick&&pick.tank]||1); };\nconst HZ_LIMITS={earth:{budget:180,time:12},moon:{budget:320,time:18},mars:{budget:450,time:24},mercury:{budget:480,time:30},venus:{budget:360,time:24},\n  jupiter:{budget:560,time:36},saturn:{budget:620,time:40},uranus:{budget:520,time:36},neptune:{budget:540,time:36},pluto:{budget:500,time:36}};\n\n// sunlight at the destination, as a share of Earth's (solar wings make this much less; an RTG does not care)\nfunction hzSunK(key){ const M=HZ_MISSIONS[key]; if(!M||M.planet==='earth'||M.planet==='moon') return 1; const a=HZ_PL[M.planet]?HZ_PL[M.planet].a:1; return Math.min(2,Math.pow(a,-1.25)); }\n\n/* ===== Difficulty and sandbox (Settings) ===== */\nconst HZ_DIFF={cadet:{name:'Cadet',dv:1.2,budget:1.25,grace:1.6,score:.9},pilot:{name:'Pilot',dv:1,budget:1,grace:1,score:1},commander:{name:'Commander',dv:.88,budget:.85,grace:.6,score:1.15}};\nfunction hzDiff(){ const S=(window.HZ&&HZ.settings)||{}; return HZ_DIFF[S.diff]||HZ_DIFF.pilot; }\nfunction hzSandbox(){ return !!(window.HZ&&HZ.settings&&HZ.settings.sandbox); }\n{ const _cap=hzDvCap; hzDvCap=function(p,m){ return _cap(p,m)*hzDiff().dv; }; }\n\n/* ===== The real NASA mission behind each game mission (for \"a real mission like yours\" in the report) ===== */\nconst HZ_REAL={\n  earth:  {n:'Landsat 8',y:2013,rocket:'Atlas V',mass:2623,power:'solar',inst:['cam','ir'],txt:'An imaging camera (OLI) and a thermal infrared sensor (TIRS), in a sun-synchronous orbit at 705 km.'},\n  moon:   {n:'Lunar Reconnaissance Orbiter',y:2009,rocket:'Atlas V',mass:1916,power:'solar',inst:['cam','ir','neutron','radar'],txt:'Cameras, a thermal radiometer, a neutron detector and a small radar, in a low polar orbit.'},\n  mars:   {n:'MAVEN',y:2013,rocket:'Atlas V',mass:2454,power:'solar',inst:['spec','mag','hyper'],txt:'A mass spectrometer, a magnetometer and an ultraviolet imaging spectrograph, in an elliptical orbit.'},\n  mercury:{n:'MESSENGER',y:2004,rocket:'Delta II',mass:1107,power:'solar',inst:['cam','mag','neutron'],txt:'Cameras, a magnetometer and a neutron spectrometer. It used six planet flybys to slow down instead of a huge rocket.'},\n  venus:  {n:'Magellan',y:1989,rocket:'Space Shuttle Atlantis',mass:3449,power:'solar',inst:['radar','grav'],txt:'A radar that mapped 98% of Venus through the clouds, and radio tracking for gravity.'},\n  jupiter:{n:'Juno',y:2011,rocket:'Atlas V',mass:3625,power:'solar',inst:['grav','mag','ir'],txt:'Huge solar wings (the farthest solar-powered craft), a magnetometer, gravity science and a microwave radiometer.'},\n  saturn: {n:'Cassini-Huygens',y:1997,rocket:'Titan IV-B',mass:5712,power:'rtg',inst:['cam','radar','spec','mag'],txt:'Three RTGs, cameras, a radar that saw through Titan\\'s haze, and particle instruments.'},\n  uranus: {n:'Voyager 2',y:1977,rocket:'Titan IIIE',mass:722,power:'rtg',inst:['cam','mag','ir'],txt:'RTG power, cameras, a magnetometer and an infrared spectrometer: still the only visitor to Uranus.'},\n  neptune:{n:'Voyager 2',y:1977,rocket:'Titan IIIE',mass:722,power:'rtg',inst:['cam','mag','ir'],txt:'The same Voyager 2, twelve years after launch: still the only visitor to Neptune.'},\n  pluto:  {n:'New Horizons',y:2006,rocket:'Atlas V',mass:478,power:'rtg',inst:['cam','spec','ir'],txt:'A light, fast craft with an RTG, cameras and an ultraviolet spectrometer for Pluto\\'s thin air.'}};\n\n/* ===== Saved flights (this browser): compare with your last design, local leaderboard ===== */\nconst HZ_FLIGHTS={ all(){ try{ return JSON.parse(localStorage.getItem('hz-flights')||'[]'); }catch(e){ return []; } },\n  save(f){ try{ const a=this.all(); a.push(f); localStorage.setItem('hz-flights',JSON.stringify(a.slice(-200))); }catch(e){} },\n  of(m){ return this.all().filter(f=>f.mission===m); },\n  best(m){ return this.of(m).filter(f=>!f.sandbox).sort((a,b)=>b.score-a.score); } };\n<\/script>\n<meta charset=\"utf-8\">\n<title>Horizons Mission Control<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;600&display=swap\">\n<style>\n@font-face{font-family:'Game Paused';src:url(data:font/otf;base64,T1RUTwALAIAAAwAwQ0ZGIG2IYoMAAAO8AAAcdURTSUcAAAABAAAlcAAAAAhHREVGABIAOAAAJVgAAAAWT1MvMmLPXRIAAAEgAAAAYGNtYXAEFAdZAAACYAAAAVxoZWFkJH1R8AAAALwAAAA2aGhlYQavArUAAAD0AAAAJGhtdHhw9wWUAAABgAAAAN5tYXhwADhQAAAAARgAAAAGbmFtZSUCvvEAACA0AAAFA3Bvc3T/nwAyAAAlOAAAACAAAQAAAAEAADBLP3hfDzz1AAMD6AAAAADg+emFAAAAAOEMJbEAHP8rA0QCrwAAAAMAAgAAAAAAAAABAAADBf8dAGQDYAAAAAADRAABAAAAAAAAAAAAAAAAAAAANwAAUAAAOAAAAAQCFwGQAAUAAAKKAlgAAABLAooCWAAAAV4AMgEsAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAFBZUlMAwAAAAHo
