<script>
(function(){ const M=(window.HZ&&HZ.mission)||'earth'; const names={}; for(const k in HZ_MISSIONS) names[k]=HZ_MISSIONS[k].name;
  const rb=document.querySelector('.mission .t-ribbon'); if(rb) rb.textContent=names[M]||names.earth;
  if(HZ&&HZ.pick){ Object.assign(pick,HZ.pick); renderHUD(); }
  STEPS[3]=['Liftoff!','Walk to the mission control tower to fly your mission.'];
  document.querySelector('.hud .t-round').addEventListener('click',()=>hzGo('select'));
  dockEl.addEventListener('click',e=>{ const t=e.target.closest('.tile'); if(t&&t.dataset.z==='') hzGo('select'); },true);
  // Delta-v: can this rocket and engine reach the destination? (HTML4 mission design maths)
  // Delta-v appears only in the launch pad's pre-launch check (the HUD keeps its original six gauges).
  const PLAN=hzPlan(M); if(PLAN.total>0){ const _tot=totals, _rw=renderWin; let inPad=false;
    totals=function(){ const r=_tot(); if(!inPad) return r; const cap=hzDvCap(pick), ok=(opt('orbit')&&opt('orbit').oiK!=null)?opt('orbit').oiK:1; PLAN.total=PLAN.tpi+PLAN.oi*ok;
      r.M.push({k:'dv',icon:'rocket',label:'Delta-v',val:`${cap.toFixed(1)}/${PLAN.total.toFixed(1)} km/s`,r:PLAN.total/cap,hint:`Not enough delta-v to reach ${names[M]}. It needs ${PLAN.total.toFixed(1)} km/s. Pick a bigger rocket or a stronger engine.`}); return r; };
    renderWin=function(){ inPad=openZone==='pad'; try{ _rw(); } finally{ inPad=false; } }; }
  // Launch: dive the camera into the pad, then hand over to the launch screen (hangar cinematic, count, ascent).
  // the design travels to the launch and mission control as real numbers, so the simulation runs YOUR spacecraft
  const design=()=>{ let gen=0,draw=0,down=0,store=0,wh=0,mass=0,link=1; for(const c in PARTS){ const o=opt(c); if(!o) continue; if(c==='rocket'||c==='orbit'){ if(o.link) link=o.link; continue; }
      gen+=o.gen||0; draw+=o.pw||0; down+=o.down||0; store+=o.store||0; wh+=o.wh||0; mass+=o.mass||0; }
    const insts=mountedInst(), names=insts.map(id=>HZ_INST.find(i=>i.id===id).name);
    return {rocket:opt('rocket').name,inst:names.length?names.join(', '):'no instrument',orbit:opt('orbit').name,
      craft:{gen,draw,down:down*link,store,wh,mass,insts,rtg:pick.power==='p4',orbit:(({ecl,link,sci,oiK,name})=>({ecl,link,sci,oiK,name}))(opt('orbit')),power:opt('power').name,batt:opt('batt').name,comms:opt('comms').name,storeName:opt('store').name}}; };
  doLaunch=function(){ closeWin(); transition(new THREE.Vector3(0,0,-16),()=>hzGo('launch',{mission:M,pick:Object.assign({},pick),design:design(),skipCine:false})); };
  const _open=openWin; openWin=function(z){ if(z==='control'&&launched){ return hzGo('control',{mission:M,pick:Object.assign({},pick),design:{rocket:opt('rocket').name,inst:opt('inst')?opt('inst').name:'camera',orbit:opt('orbit').name}}); } return _open(z); };
})();
</script><script>
/* Tap to enter: the door button follows the camera every frame, so on touch screens the browser drops the click.
   Act on the tap release instead (keyboard and mouse clicks still work as before). */
(function(){ const el=document.getElementById('enter'); let down=false;
  el.addEventListener('pointerdown',e=>{ down=true; },true);
  el.addEventListener('pointerup',e=>{ if(!down) return; down=false; e.preventDefault(); el._tapT=performance.now(); interact(); },true);
  el.addEventListener('pointercancel',()=>{ down=false; },true);
  el.onclick=e=>{ if(el._tapT&&performance.now()-el._tapT<600) return; interact(); };
})();
</script>
<script>
/* Floating name boards over each building: the Tactile ribbon (ember fill, ink outline, drop lip) as a camera-facing sign that gently bobs. */
(function start(){ if(typeof AREAS==='undefined'||!AREAS.base){ setTimeout(start,200); return; } const B=AREAS.base.group, boards=[];
  function board(text,x,y,z,w){ const c=document.createElement('canvas'), H=128; c.width=640; c.height=H+24; const g=c.getContext('2d');
    g.font="400 56px 'Game Paused','Silkscreen',monospace"; const tw=Math.min(600,g.measureText(text).width+72), x0=(640-tw)/2, r=26;
    const rr=(x,y,w,h)=>{ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); };
    g.fillStyle='#1A1206'; rr(x0,14,tw,H-10); g.fill();                                  // ink drop under the ribbon
    g.fillStyle='#C2643A'; rr(x0,4,tw,H-14); g.fill(); g.fillStyle='#8E4322'; g.fillRect(x0+8,H-24,tw-16,10);   // ember fill and darker lip
    g.lineWidth=7; g.strokeStyle='#1A1206'; rr(x0,4,tw,H-14); g.stroke();
    g.textAlign='center'; g.textBaseline='middle'; g.fillStyle='rgba(26,18,6,.3)'; g.fillText(text,320,H/2+3); g.fillStyle='#fff'; g.fillText(text,320,H/2-2);
    const tex=new THREE.CanvasTexture(c); tex.minFilter=THREE.LinearFilter; const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
    s.scale.set(w,w*c.height/640,1); s.position.set(x,y,z); s.renderOrder=5; s.userData.y=y; s.userData.p=Math.random()*6; B.add(s); boards.push(s); }
  const make=()=>{ board('Rocket workshop',-15,6.2,0,7.5); board('Spacecraft workshop',15,7.4,0,8.5); board('Launch pad',-4.6,9.6,-16,6); board('Mission control',0,9.4,15,7.5); };
  (document.fonts&&document.fonts.load?document.fonts.load("56px 'Game Paused'").then(make,make):make());
  (function bob(t){ if(!reduce) for(const s of boards) s.position.y=s.userData.y+Math.sin(t/900+s.userData.p)*.18; requestAnimationFrame(bob); })(0);
  if(typeof lockSprite!=='undefined'&&lockSprite) lockSprite.position.y=7.6;
})();
</script>
<script>
/* Tutorial, part 2: design and build the spacecraft, pick a rocket and an orbit, launch */
(function tut(){ if(!(window.COACH&&COACH.active())) return; if(typeof AREAS==='undefined'||!AREAS.craft||!AREAS.base){ setTimeout(tut,250); return; }
  calloutEl.style.display='none';

    {say:'Welcome to your launch base. You are the engineer who builds this mission.',next:'Next'},

    {say:'These six gauges are your limits: mass, money, power, data, comms and time.',why:'Green is fine, amber is close, red blocks the launch.',target:()=>document.getElementById('res'),next:'Got it'},
    {say:'Walk into the <b>Spacecraft workshop</b>.',target:()=>where==='base'?W(10.6,2.5,0):null,until:()=>where==='craft'},
    {say:'Each floor mat is a subsystem station: power, batteries, comms, storage, engines, tanks and instruments.',why:'You build the spacecraft on the stand in the middle.',next:'Next'},
    {say:'The board on the wall shows the 3 goals of this mission.',why:'Each goal needs a certain instrument. Watch it tick as you build.',target:()=>W(0,6.5,-19.7),next:'Next'},
    {say:'Go to the <b>Instruments</b> station and pick up the <b>Thermal IR imager</b>.',why:'It sees heat, so it spots fires day and night and through smoke.',target:()=>W(13.5,2.6,6.5),until:()=>carry&&carry.o.id==='ir'},
    {say:'Carry it to the <b>build stand</b> and mount it.',target:()=>W(0,1.5,4.6),until:()=>mountedInst().includes('ir')},
    {say:'Two goals ticked! But check <b>Power</b>: the imager draws 110 W.',why:'Parts that draw more than the wings make will drain the battery.',target:()=>document.getElementById('res'),next:'Next'},
    {say:'Fit bigger wings: pick up <b>Solar wings M</b> at Power and mount them.',target:()=>W(-17.5,2.6,-10),until:()=>['p2','p3','p4'].includes(pick.power)},
    {say:'The imager also fills storage fast. Mount <b>Storage 120 Gb</b>.',why:'When storage is full, new pictures are lost until the next ground pass.',target:()=>W(13.5,2.2,-5),until:()=>pick.store!=='s1'},
    {say:'Nice design. Head out through the <b>Exit</b>.',target:()=>W(21.5,1.5,17.4),until:()=>where==='base'},
    {say:'Now walk into the <b>Rocket workshop</b>.',target:()=>where==='base'?W(-10.4,2.5,0):null,until:()=>where==='rocket'},
    {say:'Pick a rocket. Bigger rockets lift more but cost more.',why:'Watch the Mass gauge: your spacecraft must fit the rocket.',target:()=>W(-6.5,4,-5),until:()=>rocketPicked},
    {say:'Pick an orbit. Read each card: shadow, ground passes and science.',why:'More shadow needs a bigger battery; more passes send more data home.',target:()=>W(-6,2.5,3.5),until:()=>orbitPicked},
    {say:'Exit and walk to the <b>Launch pad</b>.',target:()=>where==='rocket'?W(14,1.5,8.6):W(0,2.5,-9.4),until:()=>openZone==='pad'},
    {say:'The pre-launch check: if every bar is green, press <b>Launch</b>.',why:'Red rows tell you what to fix.',target:()=>document.getElementById('launch')}]); })();
</script>
