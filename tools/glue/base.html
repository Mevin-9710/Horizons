<script>
(function(){ const M=(window.HZ&&HZ.mission)||'earth'; const names={}; for(const k in HZ_MISSIONS) names[k]=HZ_MISSIONS[k].name;
  const rb=document.querySelector('.mission .t-ribbon'); if(rb) rb.textContent=names[M]||names.earth;
  if(HZ&&HZ.pick){ Object.assign(pick,HZ.pick); renderHUD(); }
  STEPS[3]=['Liftoff!','Walk to the mission control tower to fly your mission.'];
  document.querySelector('.hud .t-round').addEventListener('click',()=>hzGo('select'));
  dockEl.addEventListener('click',e=>{ const t=e.target.closest('.tile'); if(t&&t.dataset.z==='') hzGo('select'); },true);
  // Delta-v: can this rocket and engine reach the destination? (HTML4 mission design maths)
  const totalMass=()=>{ let m=0; for(const c in PARTS){ if(c==='rocket'||c==='orbit') continue; const o=opt(c); if(o) m+=o.mass||0; } return m; }; window.totalMass=totalMass;
  // Delta-v appears only in the launch pad's pre-launch check (the HUD keeps its original six gauges).
  const PLAN=hzPlan(M); if(PLAN.total>0){ const _tot=totals, _rw=renderWin; let inPad=false;
    totals=function(){ const r=_tot(); if(!inPad) return r; const cap=hzDvCap(pick,totalMass()), ok=(opt('orbit')&&opt('orbit').oiK!=null)?opt('orbit').oiK:1; PLAN.total=PLAN.tpi+PLAN.oi*ok;
      r.M.push({k:'dv',icon:'rocket',label:'Delta-v',val:`${cap.toFixed(1)}/${PLAN.total.toFixed(1)} km/s`,r:PLAN.total/cap,hint:`Not enough delta-v to reach ${names[M]}. It needs ${PLAN.total.toFixed(1)} km/s. Pick a bigger rocket or a stronger engine.`}); return r; };
    renderWin=function(){ inPad=openZone==='pad'; try{ _rw(); } finally{ inPad=false; } }; }
  // Launch: dive the camera into the pad, then hand over to the launch screen (hangar cinematic, count, ascent).
  // the design travels to the launch and mission control as real numbers, so the simulation runs YOUR spacecraft
  const design=()=>{ let gen=0,draw=0,down=0,store=0,wh=0,mass=0,link=1; for(const c in PARTS){ const o=opt(c); if(!o) continue; if(c==='rocket'||c==='orbit'){ if(o.link) link=o.link; continue; }
      gen+=o.gen||0; draw+=o.pw||0; down+=o.down||0; store+=o.store||0; wh+=o.wh||0; mass+=o.mass||0; }
    const insts=mountedInst(), names=insts.map(id=>HZ_INST.find(i=>i.id===id).name);
    return {rocket:opt('rocket').name,inst:names.length?names.join(', '):'no instrument',orbit:opt('orbit').name,
      craft:{cost:totals().M[1].val.match(/\$(\d+)/)[1]*1,budget:LIMIT.budget,gen,draw,down:down*link,store,wh,mass,insts,rtg:pick.power==='p4',orbit:(({ecl,link,sci,oiK,name})=>({ecl,link,sci,oiK,name}))(opt('orbit')),power:opt('power').name,batt:opt('batt').name,comms:opt('comms').name,storeName:opt('store').name}}; };
  // The spacecraft on the build stand is THE spacecraft: launch (hangar, crane, fairing, deploy), the cruise and mission control all show it.
  function exportCraft(){ if(typeof buildBay==='undefined'||!buildBay) return null; refreshBuildBay(); const root=buildBay.children[0]; if(!root) return null;
    root.updateMatrixWorld(true); const inv=new THREE.Matrix4().copy(root.matrixWorld).invert(), out=[];
    root.traverse(o=>{ if(!o.isMesh||!o.visible||!o.geometry||!o.geometry.attributes.position) return; let cat=null; for(let q=o;q&&q!==root;q=q.parent) if(q.userData.cat){ cat=q.userData.cat; break; }
      const m=Array.isArray(o.material)?o.material[0]:o.material, u=m&&m.uniforms, g=o.geometry;
      const cols=u&&u.c0?['c0','c1','c2','c3'].map(k=>'#'+u[k].value.getHexString()):(()=>{ const c=m&&m.color?'#'+m.color.getHexString():'#D7D0C0'; return [c,c,c,'#1A1206']; })();
      out.push({cat,p:g.attributes.position.array,n:g.attributes.normal?g.attributes.normal.array:null,i:g.index?g.index.array:null,mx:new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld).toArray(),cols,ax:u&&u.ax?u.ax.value.toArray():[1,0,.3],fq:u&&u.fq?u.fq.value:.35,std:!u&&m&&m.isMeshStandardMaterial?{c:'#'+m.color.getHexString(),r:m.roughness,mt:m.metalness}:null}); });
    return out.length?out:null; }
  function craftImage(){ try{ const root=buildBay.children[0]; const sc=new THREE.Scene(), c=root.clone(); c.position.set(0,0,0); c.rotation.set(0,0,0); c.scale.setScalar(1); sc.add(c); sc.add(new THREE.HemisphereLight(0xFFF6E8,0x6E6457,1.05)); const dl=new THREE.DirectionalLight(0xFFFFFF,.9); dl.position.set(3,5,4); sc.add(dl);
      const bb=new THREE.Box3().setFromObject(c), ctr=bb.getCenter(new THREE.Vector3()), r=bb.getSize(new THREE.Vector3()).length()/2;
      const cam=new THREE.PerspectiveCamera(30,1,.01,200); cam.position.copy(ctr).add(new THREE.Vector3(r*2.3,r*1.5,r*2.7)); cam.lookAt(ctr);
      const R=new THREE.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true}); R.setSize(192,192); R.setClearColor(0,0); R.render(sc,cam);
      const url=R.domElement.toDataURL('image/png'); R.dispose(); if(R.forceContextLoss) R.forceContextLoss(); return url; }catch(e){ return null; } }
  window.exportCraft=exportCraft; window.craftImage=craftImage;
  doLaunch=function(){ closeWin(); const C3=exportCraft(), img=C3?craftImage():null; try{ parent.HZ_CRAFT3D=C3; }catch(e){}
    transition(new THREE.Vector3(0,0,-16),()=>hzGo('launch',{mission:M,pick:Object.assign({},pick),design:design(),craftImg:img,skipCine:false})); };
  const _open=openWin; openWin=function(z){ if(z==='control'&&launched){ return hzGo('control',{mission:M,pick:Object.assign({},pick),design:{rocket:opt('rocket').name,inst:opt('inst')?opt('inst').name:'camera',orbit:opt('orbit').name}}); } return _open(z); };
})();
</script><script>
/* Tap to enter: the door button follows the camera every frame, so on touch screens the browser drops the click.
   Act on the tap release instead (keyboard and mouse clicks still work as before). */
(function(){ const el=document.getElementById('enter'); let down=false;
  el.addEventListener('pointerdown',e=>{ down=true; },true);
  el.addEventListener('pointerup',e=>{ if(!down) return; down=false; e.preventDefault(); el._tapT=performance.now(); interact(); },true);
  el.addEventListener('pointercancel',()=>{ down=false; },true);
  el.onclick=e=>{ if(el._tapT&&performance.now()-el._tapT<600) return; interact(); };
})();
</script>
<script>
/* Floating name boards over each building: the Tactile ribbon (ember fill, ink outline, drop lip) as a camera-facing sign that gently bobs. */
(function start(){ if(typeof AREAS==='undefined'||!AREAS.base){ setTimeout(start,200); return; } const B=AREAS.base.group, boards=[];
  function board(text,x,y,z,w){ const c=document.createElement('canvas'), H=128; c.width=640; c.height=H+24; const g=c.getContext('2d');
    g.font="400 56px 'Game Paused','Silkscreen',monospace"; const tw=Math.min(600,g.measureText(text).width+72), x0=(640-tw)/2, r=26;
    const rr=(x,y,w,h)=>{ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); };
    g.fillStyle='#1A1206'; rr(x0,14,tw,H-10); g.fill();                                  // ink drop under the ribbon
    g.fillStyle='#C2643A'; rr(x0,4,tw,H-14); g.fill(); g.fillStyle='#8E4322'; g.fillRect(x0+8,H-24,tw-16,10);   // ember fill and darker lip
    g.lineWidth=7; g.strokeStyle='#1A1206'; rr(x0,4,tw,H-14); g.stroke();
    g.textAlign='center'; g.textBaseline='middle'; g.fillStyle='rgba(26,18,6,.3)'; g.fillText(text,320,H/2+3); g.fillStyle='#fff'; g.fillText(text,320,H/2-2);
    const tex=new THREE.CanvasTexture(c); tex.minFilter=THREE.LinearFilter; const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
    s.scale.set(w,w*c.height/640,1); s.position.set(x,y,z); s.renderOrder=5; s.userData.y=y; s.userData.p=Math.random()*6; B.add(s); boards.push(s); }
  const make=()=>{ board('Rocket workshop',-15,6.2,0,7.5); board('Spacecraft workshop',15,7.4,0,8.5); board('Launch pad',-4.6,9.6,-16,6); board('Mission control',0,9.4,15,7.5); };
  (document.fonts&&document.fonts.load?document.fonts.load("56px 'Game Paused'").then(make,make):make());
  (function bob(t){ if(!reduce) for(const s of boards) s.position.y=s.userData.y+Math.sin(t/900+s.userData.p)*.18; requestAnimationFrame(bob); })(0);
  if(typeof lockSprite!=='undefined'&&lockSprite) lockSprite.position.y=7.6;
})();
</script>
<script>
/* Tutorial, part 2: design and build the spacecraft, pick a rocket and an orbit, launch */
(function tut(){ if(!(window.COACH&&COACH.active())) return; if(typeof AREAS==='undefined'||!AREAS.craft||!AREAS.base){ setTimeout(tut,250); return; }
  calloutEl.style.display='none';
  const W=(x,y,z)=>{ const v=new THREE.Vector3(x,y,z).project(cam); return {x:(v.x+1)/2*innerWidth,y:(1-v.y)/2*innerHeight}; };
  const start=hero.position.clone(); let rocketPicked=false, orbitPicked=false; const _choose=choose;
  choose=function(s){ if(s.cat==='rocket') rocketPicked=true; if(s.cat==='orbit') orbitPicked=true; return _choose(s); };
  COACH.run('Base',[
    {say:'Welcome to your launch base. You are the engineer who builds this mission.',next:'Next'},
    {say:'Walk around: <b>WASD</b> or arrow keys, or drag the joystick. You can also tap the floor.',until:()=>hero.position.distanceTo(start)>1.5},
    {say:'These six gauges are your limits: mass, money, power, data, comms and time.',why:'Green is fine, amber is close, red blocks the launch.',target:()=>document.getElementById('res'),next:'Got it'},
    {say:'Walk into the <b>Spacecraft workshop</b>.',target:()=>where==='base'?W(10.6,2.5,0):null,until:()=>where==='craft'},
    {say:'Each floor mat is a subsystem station: power, batteries, comms, storage, engines, tanks and instruments.',why:'You build the spacecraft on the stand in the middle.',next:'Next'},
    {say:'The board on the wall shows the 3 goals of this mission.',why:'Each goal needs a certain instrument. Watch it tick as you build.',target:()=>W(0,6.5,-19.7),next:'Next'},
    {say:'Go to the <b>Instruments</b> station and pick up the <b>Thermal IR imager</b>.',why:'It sees heat, so it spots fires day and night and through smoke.',target:()=>W(13.5,2.6,6.5),until:()=>carry&&carry.o.id==='ir'},
    {say:'Carry it to the <b>build stand</b> and mount it.',target:()=>W(0,1.5,4.6),until:()=>mountedInst().includes('ir')},
    {say:'Two goals ticked! But check <b>Power</b>: the imager draws 110 W.',why:'Parts that draw more than the wings make will drain the battery.',target:()=>document.getElementById('res'),next:'Next'},
    {say:'Fit bigger wings: pick up <b>Solar wings M</b> at Power and mount them.',target:()=>W(-17.5,2.6,-10),until:()=>['p2','p3','p4'].includes(pick.power)},
    {say:'The imager also fills storage fast. Mount <b>Storage 120 Gb</b>.',why:'When storage is full, new pictures are lost until the next ground pass.',target:()=>W(13.5,2.2,-5),until:()=>pick.store!=='s1'},
    {say:'Nice design. Head out through the <b>Exit</b>.',target:()=>W(21.5,1.5,17.4),until:()=>where==='base'},
    {say:'Now walk into the <b>Rocket workshop</b>.',target:()=>where==='base'?W(-10.4,2.5,0):null,until:()=>where==='rocket'},
    {say:'Pick a rocket. Bigger rockets lift more but cost more.',why:'Watch the Mass gauge: your spacecraft must fit the rocket.',target:()=>W(-6.5,4,-5),until:()=>rocketPicked},
    {say:'Pick an orbit. Read each card: shadow, ground passes and science.',why:'More shadow needs a bigger battery; more passes send more data home.',target:()=>W(-6,2.5,3.5),until:()=>orbitPicked},
    {say:'Exit and walk to the <b>Launch pad</b>.',target:()=>where==='rocket'?W(14,1.5,8.6):W(0,2.5,-9.4),until:()=>openZone==='pad'},
    {say:'The pre-launch check: if every bar is green, press <b>Launch</b>.',why:'Red rows tell you what to fix.',target:()=>document.getElementById('launch')}]); })();
</script>
<script>
/* Mission checklist: what to do, and what is available, always on screen (outside the tutorial). Ticks live; tap an item to go there. */
(function plan(){ if(typeof AREAS==='undefined'||!AREAS.base||typeof totals!=='function'){ setTimeout(plan,250); return; }
  if(window.HZ&&HZ.tutorial) return; calloutEl.style.display='none';
  const M=(window.HZ&&HZ_MISSIONS[HZ.mission])?HZ.mission:'earth';
  const st=document.createElement('style'); st.textContent=`.plan{top:calc(78px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));width:min(300px,calc(100% - 24px));padding:24px 12px 10px;overflow:visible;animation:tpop .45s cubic-bezier(.34,1.56,.64,1) both}
  .plan .t-ribbon{position:absolute;top:-17px;left:14px;font-size:14px;padding:4px 12px 6px}
  .plan .pl-tg{position:absolute;top:-14px;right:10px;width:30px;height:30px;font:700 15px var(--f-ui)}
  .plan .pl-lim{font:400 10px var(--f-num);color:var(--muted);line-height:1.6;margin:0 2px 6px}
  .plan ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
  .plan li{display:flex;gap:8px;align-items:flex-start;font:600 12.5px/1.3 var(--f-ui);padding:5px 7px;border:2px solid var(--ink);border-radius:10px;background:#F6F1E6;cursor:pointer}
  .plan li i{flex:none;width:17px;height:17px;border-radius:50%;border:2px solid var(--ink);background:#fff;font:700 10px/13px var(--f-ui);text-align:center;font-style:normal;margin-top:1px}
  .plan li.ok{background:rgba(76,195,138,.22)} .plan li.ok i{background:var(--ok);color:#fff}
  .plan li.bad{background:#F8D6D3} .plan li small{display:block;font:500 11px var(--f-ui);color:var(--muted)}
  .plan.min ol,.plan.min .pl-lim{display:none} .plan.min{padding-bottom:4px;padding-top:16px}
  @media (max-width:760px){.plan{top:calc(156px + env(safe-area-inset-top,0px));bottom:auto;width:min(270px,64vw);max-height:46vh;overflow:auto}.plan li small{display:none}.plan li{font-size:12px;padding:4px 6px}}
  .plan.hidden{display:none}`; document.head.appendChild(st);
  const el=document.createElement('div'); el.className='ui t-win plan'+(innerWidth<760?' min':''); document.getElementById('app').appendChild(el);
  const P=hzPlan(M), names=Object.fromEntries(HZ_INST.map(i=>[i.id,i.name]));
  function render(){ const T=totals().M, by=Object.fromEntries(T.map(m=>[m.k,m])), gl=hzGoalsMet(M,mountedInst()), g=gl.filter(x=>x.ok).length;
    const mass=totalMass(), cap=hzDvCap(pick,mass), need=P.total?P.tpi+P.oi*((opt('orbit')&&opt('orbit').oiK!=null)?opt('orbit').oiK:1):0;
    const items=[
      [g===3,g?false:null,`Instruments for the goals (${g}/3)`,g<3?gl.filter(x=>!x.ok).map(x=>x.t+': '+x.need.map(n=>names[n]).join(' or ')).join('. '):'All goals covered.','craft'],
      [by.power.r<=1,by.power.r>1,`Power at ${DESTN}: use ${by.power.val}`,by.power.r>1?by.power.hint:SUNK<.9?`Sunlight there is ${Math.round(SUNK*100)}% of Earth's; you still have enough.`:'Wings make enough.','craft'],
      [by.data.r<=1&&by.comms.r<=1,by.data.r>1||by.comms.r>1,'Data: storage and dish keep up',by.data.r>1?'Fit bigger storage.':by.comms.r>1?'Fit a bigger dish or the laser.':`${by.data.val} stored, ${by.comms.val} sent.`,'craft'],
      [by.mass.r<=1,by.mass.r>1,`Rocket lifts it: ${by.mass.val}`,by.mass.r>1?'Too heavy: a bigger rocket or lighter parts.':opt('rocket').name+' can lift it.','rocket'],
      ...(need?[[cap>=need,cap<need,`Delta-v: ${cap.toFixed(1)} of ${need.toFixed(1)} km/s`,cap<need?'Lighter spacecraft, a bigger rocket, a stronger engine or a bigger tank.':'Enough push to get there.','rocket']]:[]),
      [by.budget.r<=1&&by.time.r<=1,by.budget.r>1||by.time.r>1,`Budget ${by.budget.val}, time ${by.time.val}`,by.budget.r>1?'Over budget: swap a part for a cheaper one.':by.time.r>1?'Too slow to build: simpler parts.':'Within the limits.','craft'],
      [false,null,'Launch from the pad','When everything above is green.','pad']];
    el.innerHTML=`<span class="t-ribbon">Mission plan</span><button class="t-round pl-tg" type="button" aria-label="Show or hide the plan">${el.classList.contains('min')?'+':'−'}</button>
      <div class="pl-lim">${hzSandbox()?'Sandbox: no limits':`Budget $${LIMIT.budget}M · ${LIMIT.time} months`}${need?` · needs ${need.toFixed(1)} km/s`:''} · ${hzDiff().name}</div>
      <ol>${items.map((it,i)=>`<li class="${it[0]?'ok':it[1]?'bad':''}" data-go="${it[4]}"><i>${it[0]?'✓':i+1}</i><span>${it[2]}<small>${it[3]}</small></span></li>`).join('')}</ol>`; }
  el.addEventListener('click',e=>{ if(e.target.closest('.pl-tg')){ el.classList.toggle('min'); render(); return; } const li=e.target.closest('[data-go]'); if(!li) return; const z=li.dataset.go;
    if(z==='craft'){ if(where==='craft') openWin('stand'); else if(where==='base') enterRoom('craft'); else exitRoom(()=>enterRoom('craft')); }
    else if(z==='rocket'){ if(where==='base') enterRoom('rocket'); else if(where!=='rocket') exitRoom(()=>enterRoom('rocket')); }
    else { if(where==='base') openWin('pad'); else exitRoom(()=>openWin('pad')); } });
  const _hud=renderHUD; renderHUD=function(){ _hud(); render(); }; render(); window.renderPlan=render;
  const joy=document.getElementById('joy'); setInterval(()=>{ if(joy) joy.style.visibility=winEl.classList.contains('open')?'hidden':''; const rn=document.getElementById('roomname'); if(rn&&innerWidth<760) rn.style.visibility=winEl.classList.contains('open')?'hidden':''; },250);
  setInterval(()=>el.classList.toggle('hidden',winEl.classList.contains('open')&&(innerWidth<760||(winEl.classList.contains('wide')&&innerWidth<1150))),250); })();
</script>
